name: Stable 1.0 Dependency OSV Inventory Activation
run-name: Stable dependency authority finalizer ${{ inputs.activation_request || 'reusable' }}

on:
  workflow_call:
    inputs:
      producer_run_id: {required: true, type: string}
      producer_run_attempt: {required: true, type: string}
      activation_request: {required: false, type: string, default: ''}
      drainer_run_id: {required: false, type: string, default: ''}
      drainer_run_attempt: {required: false, type: string, default: ''}
  workflow_dispatch:
    inputs:
      producer_run_id: {required: true, type: string}
      producer_run_attempt: {required: true, type: string}
      activation_request: {required: true, type: string}
      drainer_run_id: {required: true, type: string}
      drainer_run_attempt: {required: true, type: string}

permissions: {}

jobs:
  activate-completed-inventory-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: stable-1.0-dependency-osv-inventory-activation
    permissions:
      actions: read
      contents: read
    steps:
      - name: Authenticate serialized activation-drainer dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_REQUEST: ${{ inputs.activation_request }}
          DRAINER_RUN_ID: ${{ inputs.drainer_run_id }}
          DRAINER_RUN_ATTEMPT: ${{ inputs.drainer_run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_ACTOR" = github-actions[bot]
            [[ "$ACTIVATION_REQUEST" =~ ^[1-9][0-9]*-[1-9][0-9]*-[1-9][0-9]*-[1-9][0-9]*-[1-9][0-9]*$ ]]
            [[ "$DRAINER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$DRAINER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            test "${{ github.workflow_ref }}" = "$GITHUB_REPOSITORY/.github/workflows/stable-1.0-dependency-osv-inventory-activation.yml@$GITHUB_REF"
            drainer="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$DRAINER_RUN_ID/attempts/$DRAINER_RUN_ATTEMPT")"
            jq -e \
              --argjson run "$DRAINER_RUN_ID" \
              --argjson attempt "$DRAINER_RUN_ATTEMPT" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg commit "$GITHUB_SHA" '
                .id == $run
                and .run_attempt == $attempt
                and .status == "in_progress"
                and .conclusion == null
                and .path == ".github/workflows/stable-1.0-dependency-authority-activation.yml"
                and .head_repository.full_name == $repository
                and .head_branch == "develop"
                and .head_sha == $commit
                and (.event == "schedule" or .event == "workflow_run")
              ' <<<"$drainer" >/dev/null
          else
            test -z "$ACTIVATION_REQUEST$DRAINER_RUN_ID$DRAINER_RUN_ATTEMPT"
            test "${{ github.workflow_ref }}" = "$GITHUB_REPOSITORY/.github/workflows/stable-1.0-dependency-authority-activation.yml@$GITHUB_REF"
          fi

      - name: Check out exact protected activation authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.sha }}', fetch-depth: 1, persist-credentials: false}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.14.7'}

      - name: Authenticate completed-success retention run and exact proposal artifact
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = crypta-network/cryptad
          test "$GITHUB_REF" = refs/heads/develop
          test "${{ github.ref_protected }}" = true
          test "${{ github.workflow_sha }}" = "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD^{commit}')" = "$GITHUB_SHA"
          [[ "$PRODUCER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRODUCER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          run="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/attempts/$PRODUCER_RUN_ATTEMPT")"
          producer_commit="$(jq -er '.head_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<<"$run")"
          jq -e \
            --argjson run_id "$PRODUCER_RUN_ID" \
            --argjson attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg repository "$GITHUB_REPOSITORY" '
              .id == $run_id
              and .run_attempt == $attempt
              and .status == "completed"
              and .conclusion == "success"
              and .head_repository.full_name == $repository
              and .path == ".github/workflows/stable-1.0-dependency-osv-inventory-retention.yml"
              and (.event == "schedule" or .event == "workflow_dispatch")
            ' <<<"$run" >/dev/null
          producer_branch="$(jq -er '.head_branch | select(. == "develop")' <<<"$run")"
          protected_branch="$(gh api "/repos/$GITHUB_REPOSITORY/branches/$producer_branch")"
          producer_tip="$(jq -er \
            --arg branch "$producer_branch" '
              select(.name == $branch and .protected == true)
              | .commit.sha
              | select(type == "string" and test("^[0-9a-f]{40}$"))
            ' <<<"$protected_branch")"
          if [[ "$producer_commit" != "$producer_tip" ]]; then
            comparison="$(gh api "/repos/$GITHUB_REPOSITORY/compare/$producer_commit...$producer_tip")"
            jq -e \
              --arg producer "$producer_commit" '
                .status == "ahead"
                and .base_commit.sha == $producer
                and .merge_base_commit.sha == $producer
              ' <<<"$comparison" >/dev/null
          fi
          artifact_name="stable-1-0-dependency-osv-inventory-retention-$PRODUCER_RUN_ID-$PRODUCER_RUN_ATTEMPT"
          artifacts="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/artifacts?per_page=100" --jq '.artifacts[]')"
          matches="$(jq -sc --arg name "$artifact_name" '[.[] | select(.name == $name)]' <<<"$artifacts")"
          artifact_digest="$(jq -er \
            --argjson run_id "$PRODUCER_RUN_ID" '
              select(length == 1)
              | .[0]
              | select(.expired == false and .workflow_run.id == $run_id)
              | .digest
              | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))
            ' <<<"$matches")"
          {
            printf 'commit=%s\n' "$producer_commit"
            printf 'run-id=%s\n' "$PRODUCER_RUN_ID"
            printf 'run-attempt=%s\n' "$PRODUCER_RUN_ATTEMPT"
            printf 'artifact-name=%s\n' "$artifact_name"
            printf 'artifact-digest=%s\n' "$artifact_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact completed retention proposal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.producer.outputs.run-id }}
          name: ${{ steps.producer.outputs.artifact-name }}
          path: ${{ runner.temp }}/completed-osv-inventory-proposal

      - name: Finalize exact completed-success inventory anchor
        env:
          PRODUCER_COMMIT: ${{ steps.producer.outputs.commit }}
          PRODUCER_RUN_ID: ${{ steps.producer.outputs.run-id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer.outputs.run-attempt }}
          PRODUCER_ARTIFACT_NAME: ${{ steps.producer.outputs.artifact-name }}
          PRODUCER_ARTIFACT_DIGEST: ${{ steps.producer.outputs.artifact-digest }}
          CRYPTAD_STABLE_DEPENDENCY_OSV_INVENTORY_ANCHOR_WRITE_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_OSV_INVENTORY_ANCHOR_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/completed-osv-inventory-proposal"
          test -z "$(find "$root" \( -type l -o \( -type f -links +1 \) \) -print -quit)"
          test -z "$(find "$root" -type f \( -iname '*.zip' -o -iname '*.tar' -o -iname '*.tgz' -o -iname '*.gz' \) -print -quit)"
          proposal="$root/stable-1.0-dependency-osv-inventory-activation-proposal.json"
          test -f "$proposal" && test ! -L "$proposal"
          test "$(stat -c '%h' "$proposal")" = 1
          activated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 tools/release-certification/protected/stable_dependency_osv_inventory_anchor.py finalize \
            --repository "$GITHUB_REPOSITORY" \
            --proposal "$proposal" \
            --root "$root" \
            --workflow-commit "$PRODUCER_COMMIT" \
            --run-id "$PRODUCER_RUN_ID" \
            --run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --artifact-name "$PRODUCER_ARTIFACT_NAME" \
            --artifact-digest "$PRODUCER_ARTIFACT_DIGEST" \
            --activated-at "$activated_at"
