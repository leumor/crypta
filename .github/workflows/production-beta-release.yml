name: Production Beta Release Pipeline

on:
  pull_request:
    branches: [ main, develop, 'release/**', 'hotfix/**' ]
  push:
    branches: [ 'release/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline mode.
        required: true
        default: developer-dry-run
        type: choice
        options:
          - developer-dry-run
          - release-candidate
          - production-beta
      candidate_release_id:
        description: Stable path-safe release ID used to bind this run and attached v2 evidence; required for production-beta and whenever candidate-bound summaries are supplied.
        required: false
        default: ''
        type: string
      catalog_channel:
        description: Catalog channel for first-party app entries.
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - nightly
          - deprecated
      require_live_network:
        description: Require live-network beta evidence.
        required: true
        default: false
        type: boolean
      multi_node_mode:
        description: Optional multi-node soak mode override. Leave blank to use the topology config mode.
        required: false
        default: ''
        type: string
      multi_node_soak_config:
        description: Multi-node soak topology config path. Leave blank for PR-safe default; production-beta requires a production config or summary.
        required: false
        default: ''
        type: string
      multi_node_soak_summary:
        description: Existing multi-node soak summary path, HTTPS JSON URL, or actions-artifact://run/artifact/path reference for protected production promotion.
        required: false
        default: ''
        type: string
      security_drills_summary:
        description: Existing security response drills summary path or actions-artifact://run/artifact/path reference with sibling scenario drill JSON files. HTTPS summary-only URLs are unsupported.
        required: false
        default: ''
        type: string
      third_party_intake_summary:
        description: Required production third-party intake summary path, HTTPS JSON URL, or actions-artifact://run/artifact/path reference for protected production-beta promotion.
        required: false
        default: ''
        type: string
      previous_summary:
        description: Candidate-bound migrate-v1 previous-candidate v2 summary path, HTTPS JSON URL, or actions-artifact://run/artifact/path reference.
        required: false
        default: ''
        type: string
      previous_release_certification_summary:
        description: Candidate-bound migrate-v1 release-history v2 summary path, HTTPS JSON URL, or actions-artifact://run/artifact/path reference.
        required: false
        default: ''
        type: string
      waiver_file:
        description: Optional structured go/no-go waiver file path, HTTPS JSON URL, or actions-artifact://run/artifact/path reference. Production-beta cannot waive mandatory launch evidence.
        required: false
        default: ''
        type: string
      stable_readiness_waivers:
        description: Optional Stable 1.0 waiver file path, HTTPS JSON URL, or actions-artifact://run/artifact/path reference for requires-waiver-before-stable limitations.
        required: false
        default: ''
        type: string
      require_multi_node_soak:
        description: Require multi-node beta soak evidence.
        required: true
        default: false
        type: boolean
      generate_stable_readiness:
        description: Generate advisory Stable 1.0 readiness artifacts.
        required: true
        default: false
        type: boolean
      require_stable_readiness:
        description: Require Stable 1.0 readiness for stable-promotion review.
        required: true
        default: false
        type: boolean
      artifact_base_uri:
        description: Public base URI where staged app bundles will be published.
        required: false
        default: ''
        type: string

jobs:
  dry-run-or-release-candidate:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'production-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Gradle properties
        uses: ./.github/actions/setup-gradle-properties

      - name: Run production beta pipeline self-test
        run: python3 tools/release-certification/certify.py production-beta --self-test

      - name: Build candidate distribution for release inputs
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release-candidate')
        run: ./gradlew assembleCryptadDist

      - name: Run Hyphanet interop smoke for release inputs
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release-candidate')
        env:
          INTEROP_SKIP_BUILD: '1'
        run: tools/interop/run-hyphanet-interop-smoke.sh

      - name: Run performance smoke for release inputs
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release-candidate')
        env:
          PERF_SKIP_BUILD: '1'
        run: tools/perf/run-performance-smoke.sh

      - name: Run CI-safe production beta pipeline
        env:
          INPUT_MODE: ${{ inputs.mode || '' }}
          INPUT_CANDIDATE_RELEASE_ID: ${{ inputs.candidate_release_id || '' }}
          INPUT_CATALOG_CHANNEL: ${{ inputs.catalog_channel || 'stable' }}
          INPUT_REQUIRE_LIVE_NETWORK: ${{ inputs.require_live_network || 'false' }}
          INPUT_MULTI_NODE_MODE: ${{ inputs.multi_node_mode || '' }}
          INPUT_MULTI_NODE_SOAK_CONFIG: ${{ inputs.multi_node_soak_config || 'tools/release-certification/fixtures/self-test-multi-node-beta-soak.json' }}
          INPUT_MULTI_NODE_SOAK_SUMMARY: ${{ inputs.multi_node_soak_summary || '' }}
          INPUT_SECURITY_DRILLS_SUMMARY: ${{ inputs.security_drills_summary || '' }}
          INPUT_PREVIOUS_SUMMARY: ${{ inputs.previous_summary || '' }}
          INPUT_PREVIOUS_RELEASE_CERTIFICATION_SUMMARY: ${{ inputs.previous_release_certification_summary || '' }}
          INPUT_WAIVER_FILE: ${{ inputs.waiver_file || '' }}
          INPUT_STABLE_READINESS_WAIVERS: ${{ inputs.stable_readiness_waivers || '' }}
          INPUT_REQUIRE_MULTI_NODE_SOAK: ${{ inputs.require_multi_node_soak || 'false' }}
          INPUT_GENERATE_STABLE_READINESS: ${{ inputs.generate_stable_readiness || 'false' }}
          INPUT_REQUIRE_STABLE_READINESS: ${{ inputs.require_stable_readiness || 'false' }}
          INPUT_ARTIFACT_BASE_URI: ${{ inputs.artifact_base_uri || vars.CRYPTAD_PRODUCTION_BETA_ARTIFACT_BASE_URI || (github.event_name != 'pull_request' && secrets.CRYPTAD_PRODUCTION_BETA_ARTIFACT_BASE_URI) || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && github.token || '' }}
          CRYPTAD_CERT_NODE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_NODE_BASE_URL || '' }}
          CRYPTAD_CERT_FORM_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_FORM_PASSWORD || '' }}
          CRYPTAD_CERT_LIVE_CATALOG_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_CATALOG_SOURCE || '' }}
          CRYPTAD_CERT_LIVE_CATALOG_EXPECTED_KEY_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_CATALOG_EXPECTED_KEY_ID || '' }}
          CRYPTAD_CERT_LIVE_CATALOG_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_CATALOG_ID || '' }}
          CRYPTAD_CERT_LIVE_CONTENT_FETCH_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_CONTENT_FETCH_URI || '' }}
          CRYPTAD_CERT_LIVE_FEED_USK_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_FEED_USK_URI || '' }}
          CRYPTAD_CERT_LIVE_PROFILE_PUBLIC_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_PROFILE_PUBLIC_URI || '' }}
          CRYPTAD_CERT_LIVE_TRUST_PUBLIC_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_TRUST_PUBLIC_URI || '' }}
          CRYPTAD_CERT_LIVE_TEST_INSERT_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_TEST_INSERT_URI || '' }}
        run: |
          mode="$INPUT_MODE"
          if [[ -z "$mode" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              mode="developer-dry-run"
            else
              mode="release-candidate"
            fi
          fi

          require_file() {
            local path="$1"
            local description="$2"
            if [[ -z "$path" || ! -f "$path" ]]; then
              echo "::error::$description must point to a readable file: $path"
              exit 1
            fi
          }

          materialize_input_file() {
            local value="$1"
            local env_name="$2"
            local file_name="$3"
            local description="$4"
            if [[ -z "$value" ]]; then
              return 0
            fi
            case "$value" in
              https://*)
                local path="$RUNNER_TEMP/cryptad-production-beta-inputs/$file_name"
                mkdir -p "$(dirname "$path")"
                curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 --output "$path" "$value"
                chmod 600 "$path"
                export "$env_name=$path"
                ;;
              http://*)
                echo "::error::$description URL must use HTTPS: $value"
                exit 1
                ;;
              actions-artifact://*)
                materialize_actions_artifact_file "$value" "$env_name" "$file_name" "$description"
                ;;
              *)
                export "$env_name=$value"
                ;;
            esac
          }

          materialize_security_drills_summary() {
            local value="$1"
            if [[ -z "$value" ]]; then
              return 0
            fi
            case "$value" in
              http://*|https://*)
                echo "::error::Security response drills summary must be a checked-out path or actions-artifact:// reference with security-drills-summary.json beside all seven scenario drill JSON files. HTTPS summary-only URLs are not supported."
                exit 1
                ;;
              *)
                materialize_input_file "$value" INPUT_SECURITY_DRILLS_SUMMARY security-drills-summary.json "Security response drills summary"
                ;;
            esac
          }

          materialize_actions_artifact_file() {
            local value="$1"
            local env_name="$2"
            local file_name="$3"
            local description="$4"
            if [[ -z "${GH_TOKEN:-}" ]]; then
              echo "::error::$description actions artifact reference requires a workflow dispatch GitHub token."
              exit 1
            fi
            local rest="${value#actions-artifact://}"
            local run_id="${rest%%/*}"
            if [[ -z "$run_id" || "$run_id" == "$rest" ]]; then
              echo "::error::$description actions artifact reference must be actions-artifact://<run-id>/<artifact-name>/<path>."
              exit 1
            fi
            rest="${rest#*/}"
            local artifact_name="${rest%%/*}"
            if [[ -z "$artifact_name" || "$artifact_name" == "$rest" ]]; then
              echo "::error::$description actions artifact reference must include an artifact name and path."
              exit 1
            fi
            local artifact_path="${rest#*/}"
            if [[ -z "$artifact_path" || "$artifact_path" == /* || "$artifact_path" == *".."* ]]; then
              echo "::error::$description actions artifact path must be relative and cannot contain '..'."
              exit 1
            fi
            local download_dir="$RUNNER_TEMP/cryptad-production-beta-inputs/$file_name-artifact"
            rm -rf "$download_dir"
            mkdir -p "$download_dir"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$download_dir"
            local path="$download_dir/$artifact_path"
            if [[ ! -f "$path" && -f "$download_dir/$artifact_name/$artifact_path" ]]; then
              path="$download_dir/$artifact_name/$artifact_path"
            fi
            require_file "$path" "$description from $value"
            chmod 600 "$path"
            export "$env_name=$path"
          }

          materialize_input_file "$INPUT_PREVIOUS_SUMMARY" INPUT_PREVIOUS_SUMMARY previous-beta-candidate-summary.json "Previous beta candidate summary"
          materialize_input_file "$INPUT_PREVIOUS_RELEASE_CERTIFICATION_SUMMARY" INPUT_PREVIOUS_RELEASE_CERTIFICATION_SUMMARY previous-release-certification-summary.json "Previous release-certification summary"
          materialize_input_file "$INPUT_MULTI_NODE_SOAK_SUMMARY" INPUT_MULTI_NODE_SOAK_SUMMARY multi-node-beta-soak-summary.json "Multi-node soak summary"
          materialize_security_drills_summary "$INPUT_SECURITY_DRILLS_SUMMARY"
          materialize_input_file "$INPUT_WAIVER_FILE" INPUT_WAIVER_FILE go-no-go-waivers.json "Go/no-go waiver file"
          materialize_input_file "$INPUT_STABLE_READINESS_WAIVERS" INPUT_STABLE_READINESS_WAIVERS stable-readiness-waivers.json "Stable readiness waiver file"

          args=()
          if [[ -n "$INPUT_MULTI_NODE_MODE" ]]; then
            args+=(--multi-node-mode "$INPUT_MULTI_NODE_MODE")
          fi
          if [[ "$INPUT_REQUIRE_LIVE_NETWORK" == "true" ]]; then
            if [[ -n "${CRYPTAD_CERT_LIVE_TEST_INSERT_URI:-}" ]]; then
              export CRYPTAD_CERT_LIVE_TEST_INSERT_URI_ENV=CRYPTAD_CERT_LIVE_TEST_INSERT_URI
            fi
          fi

          if [[ -z "$INPUT_ARTIFACT_BASE_URI" && "$mode" != "developer-dry-run" ]]; then
            echo "::error::CRYPTAD_PRODUCTION_BETA_ARTIFACT_BASE_URI or workflow artifact_base_uri input is required for $mode."
            exit 1
          fi

          run_multi_node="$([[ -z "$INPUT_MULTI_NODE_SOAK_SUMMARY" ]] && echo true || echo false)"
          allow_dirty="$([[ "$mode" == "developer-dry-run" ]] && echo true || echo false)"
          require_history="$([[ -n "$INPUT_PREVIOUS_RELEASE_CERTIFICATION_SUMMARY" ]] && echo true || echo false)"
          interop_smoke=""
          performance_smoke=""
          if [[ -f "build/interop-smoke/summary.json" ]]; then
            interop_smoke="build/interop-smoke/summary.json"
          fi
          if [[ -f "build/perf-smoke/summary.json" ]]; then
            performance_smoke="build/perf-smoke/summary.json"
          fi
          if [[ -z "$INPUT_CANDIDATE_RELEASE_ID" && ( -n "$INPUT_PREVIOUS_SUMMARY" || -n "$INPUT_PREVIOUS_RELEASE_CERTIFICATION_SUMMARY" || -n "$INPUT_MULTI_NODE_SOAK_SUMMARY" || -n "$INPUT_SECURITY_DRILLS_SUMMARY" ) ]]; then
            echo "::error::candidate_release_id is required when previous_summary, previous_release_certification_summary, multi_node_soak_summary, or security_drills_summary is supplied. Use the release ID that bound the attached v2 evidence."
            exit 1
          fi
          release_id="${INPUT_CANDIDATE_RELEASE_ID:-ci-beta-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          release_version="$(./gradlew -q printVersion)"
          if [[ ! "$release_version" =~ ^[0-9]+$ ]]; then
            echo "::error::Expected a numeric project version from ./gradlew -q printVersion, got '$release_version'."
            exit 2
          fi
          manifest="$RUNNER_TEMP/production-beta-manifest.json"
          jq -n \
            --arg release_id "$release_id" \
            --arg release_version "$release_version" \
            --arg profile "$mode" \
            --arg catalog_channel "$INPUT_CATALOG_CHANNEL" \
            --arg artifact_base_uri "$INPUT_ARTIFACT_BASE_URI" \
            --arg interop_smoke "$interop_smoke" \
            --arg performance_smoke "$performance_smoke" \
            --arg previous_candidate "$INPUT_PREVIOUS_SUMMARY" \
            --arg release_history "$INPUT_PREVIOUS_RELEASE_CERTIFICATION_SUMMARY" \
            --arg multi_node_summary "$INPUT_MULTI_NODE_SOAK_SUMMARY" \
            --arg multi_node_config "$INPUT_MULTI_NODE_SOAK_CONFIG" \
            --arg security_drills "$INPUT_SECURITY_DRILLS_SUMMARY" \
            --arg waiver_file "$INPUT_WAIVER_FILE" \
            --arg stable_waivers "$INPUT_STABLE_READINESS_WAIVERS" \
            --argjson require_history "$require_history" \
            --argjson require_live "$INPUT_REQUIRE_LIVE_NETWORK" \
            --argjson require_multi "$INPUT_REQUIRE_MULTI_NODE_SOAK" \
            --argjson generate_stable "$INPUT_GENERATE_STABLE_READINESS" \
            --argjson require_stable "$INPUT_REQUIRE_STABLE_READINESS" \
            --argjson run_multi_node "$run_multi_node" \
            --argjson allow_dirty "$allow_dirty" \
            --args \
            '{
              schemaVersion: 1,
              release: {id: $release_id, version: $release_version, profile: $profile},
              output: {root: "build/release-certification", reset: true},
              requirements: {
                history: $require_history,
                liveNetwork: $require_live,
                multiNodeSoak: $require_multi,
                sandboxProviderTests: false,
                stableReadiness: $require_stable,
                thirdPartyIntake: false
              },
              inputs: ({}
                + (if $interop_smoke == "" then {} else {interopSmoke: $interop_smoke} end)
                + (if $performance_smoke == "" then {} else {performanceSmoke: $performance_smoke} end)
                + (if $previous_candidate == "" then {} else {previousCandidate: $previous_candidate} end)
                + (if $release_history == "" then {} else {releaseHistory: $release_history} end)
                + (if $multi_node_summary == "" then {} else {multiNodeSoak: $multi_node_summary} end)
                + (if $multi_node_config == "" then {} else {multiNodeSoakConfig: $multi_node_config} end)
                + (if $security_drills == "" then {} else {securityDrills: $security_drills} end)
                + (if $waiver_file == "" then {} else {waiverFile: $waiver_file} end)
                + (if $stable_waivers == "" then {} else {stableReadinessWaivers: $stable_waivers} end)),
              policies: ({catalogChannel: $catalog_channel}
                + (if $artifact_base_uri == "" then {} else {artifactBaseUri: $artifact_base_uri} end)),
              execution: {
                allowDirtyWorkspace: $allow_dirty,
                collectEvidence: true,
                generateStableReadiness: $generate_stable,
                runMultiNodeSoak: $run_multi_node
              },
              commands: {"production-beta": {args: $ARGS.positional}}
            }' \
            -- "${args[@]}" > "$manifest"
          python3 tools/release-certification/certify.py production-beta --manifest "$manifest"

      - name: Read production beta redaction status
        id: redaction
        if: always()
        run: |
          status="$(python3 - <<'PY'
          import json
          from pathlib import Path

          summaries = sorted(Path("build/release-certification").glob("*/production-beta/summary.json"))
          try:
              data = json.loads(summaries[-1].read_text(encoding="utf-8"))
              print(data.get("redaction", {}).get("status") or "missing")
          except Exception:
              print("missing")
          PY
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Production beta redaction status: $status"

      - name: Read go/no-go dashboard redaction status
        id: go_no_go_redaction
        if: always()
        run: |
          status="$(python3 - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path("build/release-certification").glob("*/production-beta/artifacts/legacy/reports/go-no-go-redaction-report.json"))
          try:
              data = json.loads(reports[-1].read_text(encoding="utf-8"))
              print(data.get("status") or "missing")
          except Exception:
              print("missing")
          PY
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Go/no-go dashboard redaction status: $status"

      - name: Publish go/no-go dashboard summary
        if: always() && steps.redaction.outputs.status == 'pass' && steps.go_no_go_redaction.outputs.status == 'pass'
        run: |
          report="$(find build/release-certification -path '*/production-beta/artifacts/legacy/reports/go-no-go-dashboard.md' -print -quit)"
          if [[ -n "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload production beta dry-run artifacts
        if: always() && steps.redaction.outputs.status == 'pass' && steps.go_no_go_redaction.outputs.status == 'pass'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-beta-pipeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release-certification/
            !**/private-insert-uris.json
            !**/raw-support-bundle/**
            !**/raw-support-bundle*
            !**/raw-diagnostics/**
            !**/raw-diagnostics*
            !**/.DS_Store
            !**/._*
            !**/__MACOSX/**
          if-no-files-found: warn
          retention-days: 30

  production-beta:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'production-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: production-beta
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Gradle properties
        uses: ./.github/actions/setup-gradle-properties

      - name: Run production beta pipeline self-test
        run: python3 tools/release-certification/certify.py production-beta --self-test

      - name: Build candidate distribution for release inputs
        run: ./gradlew assembleCryptadDist

      - name: Run Hyphanet interop smoke for release inputs
        env:
          INTEROP_SKIP_BUILD: '1'
        run: tools/interop/run-hyphanet-interop-smoke.sh

      - name: Run performance smoke for release inputs
        env:
          PERF_SKIP_BUILD: '1'
        run: tools/perf/run-performance-smoke.sh

      - name: Build production beta candidate
        env:
          CRYPTAD_APP_SIGNING_KEY_ID: ${{ secrets.CRYPTAD_APP_SIGNING_KEY_ID }}
          CRYPTAD_APP_SIGNING_PRIVATE_KEY_FILE: ${{ secrets.CRYPTAD_APP_SIGNING_PRIVATE_KEY_FILE }}
          CRYPTAD_APP_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.CRYPTAD_APP_SIGNING_PRIVATE_KEY_BASE64 }}
          CRYPTAD_APP_SIGNING_PUBLIC_KEY_FILE: ${{ secrets.CRYPTAD_APP_SIGNING_PUBLIC_KEY_FILE }}
          CRYPTAD_APP_SIGNING_PUBLIC_KEY_BASE64: ${{ secrets.CRYPTAD_APP_SIGNING_PUBLIC_KEY_BASE64 }}
          CRYPTAD_APP_REVIEWER_KEY_ID: ${{ secrets.CRYPTAD_APP_REVIEWER_KEY_ID }}
          CRYPTAD_APP_REVIEWER_PRIVATE_KEY_FILE: ${{ secrets.CRYPTAD_APP_REVIEWER_PRIVATE_KEY_FILE }}
          CRYPTAD_APP_REVIEWER_PRIVATE_KEY_BASE64: ${{ secrets.CRYPTAD_APP_REVIEWER_PRIVATE_KEY_BASE64 }}
          CRYPTAD_APP_REVIEWER_PUBLIC_KEY_FILE: ${{ secrets.CRYPTAD_APP_REVIEWER_PUBLIC_KEY_FILE }}
          CRYPTAD_APP_REVIEWER_PUBLIC_KEY_BASE64: ${{ secrets.CRYPTAD_APP_REVIEWER_PUBLIC_KEY_BASE64 }}
          CRYPTAD_APP_REVIEW_POLICY_ID: ${{ secrets.CRYPTAD_APP_REVIEW_POLICY_ID }}
          CRYPTAD_APP_REVIEW_POLICY_VERSION: ${{ secrets.CRYPTAD_APP_REVIEW_POLICY_VERSION }}
          CRYPTAD_CERT_NODE_BASE_URL: ${{ secrets.CRYPTAD_CERT_NODE_BASE_URL }}
          CRYPTAD_CERT_FORM_PASSWORD: ${{ secrets.CRYPTAD_CERT_FORM_PASSWORD }}
          CRYPTAD_CERT_LIVE_CATALOG_SOURCE: ${{ secrets.CRYPTAD_CERT_LIVE_CATALOG_SOURCE }}
          CRYPTAD_CERT_LIVE_CATALOG_EXPECTED_KEY_ID: ${{ secrets.CRYPTAD_CERT_LIVE_CATALOG_EXPECTED_KEY_ID }}
          CRYPTAD_CERT_LIVE_CATALOG_ID: ${{ secrets.CRYPTAD_CERT_LIVE_CATALOG_ID }}
          CRYPTAD_CERT_LIVE_CONTENT_FETCH_URI: ${{ secrets.CRYPTAD_CERT_LIVE_CONTENT_FETCH_URI }}
          CRYPTAD_CERT_LIVE_FEED_USK_URI: ${{ secrets.CRYPTAD_CERT_LIVE_FEED_USK_URI }}
          CRYPTAD_CERT_LIVE_PROFILE_PUBLIC_URI: ${{ secrets.CRYPTAD_CERT_LIVE_PROFILE_PUBLIC_URI }}
          CRYPTAD_CERT_LIVE_TRUST_PUBLIC_URI: ${{ secrets.CRYPTAD_CERT_LIVE_TRUST_PUBLIC_URI }}
          CRYPTAD_CERT_LIVE_TEST_INSERT_URI: ${{ secrets.CRYPTAD_CERT_LIVE_TEST_INSERT_URI }}
          INPUT_CANDIDATE_RELEASE_ID: ${{ inputs.candidate_release_id || '' }}
          INPUT_ARTIFACT_BASE_URI: ${{ inputs.artifact_base_uri || vars.CRYPTAD_PRODUCTION_BETA_ARTIFACT_BASE_URI || secrets.CRYPTAD_PRODUCTION_BETA_ARTIFACT_BASE_URI || '' }}
          INPUT_MULTI_NODE_MODE: ${{ inputs.multi_node_mode || '' }}
          INPUT_MULTI_NODE_SOAK_CONFIG: ${{ inputs.multi_node_soak_config || '' }}
          INPUT_MULTI_NODE_SOAK_SUMMARY: ${{ inputs.multi_node_soak_summary || '' }}
          INPUT_SECURITY_DRILLS_SUMMARY: ${{ inputs.security_drills_summary || '' }}
          INPUT_THIRD_PARTY_INTAKE_SUMMARY: ${{ inputs.third_party_intake_summary || '' }}
          INPUT_PREVIOUS_SUMMARY: ${{ inputs.previous_summary || '' }}
          INPUT_PREVIOUS_RELEASE_CERTIFICATION_SUMMARY: ${{ inputs.previous_release_certification_summary || '' }}
          INPUT_WAIVER_FILE: ${{ inputs.waiver_file || '' }}
          INPUT_STABLE_READINESS_WAIVERS: ${{ inputs.stable_readiness_waivers || '' }}
          INPUT_GENERATE_STABLE_READINESS: ${{ inputs.generate_stable_readiness || 'false' }}
          INPUT_REQUIRE_STABLE_READINESS: ${{ inputs.require_stable_readiness || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$INPUT_CANDIDATE_RELEASE_ID" ]]; then
            echo "::error::production-beta requires candidate_release_id. Use the same release ID that bound the previous-candidate and release-history migrate-v1 artifacts."
            exit 1
          fi

          materialize_secret_file() {
            local encoded="$1"
            local env_name="$2"
            local file_name="$3"
            if [[ -z "$encoded" ]]; then
              return 0
            fi
            local path="$RUNNER_TEMP/cryptad-production-beta-secrets/$file_name"
            mkdir -p "$(dirname "$path")"
            printf '%s' "$encoded" | base64 --decode > "$path"
            chmod 600 "$path"
            export "$env_name=$path"
          }

          require_env() {
            local name="$1"
            local description="$2"
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$description ($name) is required for production-beta."
              exit 1
            fi
          }

          require_file() {
            local path="$1"
            local description="$2"
            if [[ -z "$path" || ! -f "$path" ]]; then
              echo "::error::$description must point to a readable file: $path"
              exit 1
            fi
          }

          materialize_input_file() {
            local value="$1"
            local env_name="$2"
            local file_name="$3"
            local description="$4"
            if [[ -z "$value" ]]; then
              return 0
            fi
            case "$value" in
              https://*)
                local path="$RUNNER_TEMP/cryptad-production-beta-inputs/$file_name"
                mkdir -p "$(dirname "$path")"
                curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 --output "$path" "$value"
                chmod 600 "$path"
                export "$env_name=$path"
                ;;
              http://*)
                echo "::error::$description URL must use HTTPS: $value"
                exit 1
                ;;
              actions-artifact://*)
                materialize_actions_artifact_file "$value" "$env_name" "$file_name" "$description"
                ;;
              *)
                export "$env_name=$value"
                ;;
            esac
          }

          materialize_security_drills_summary() {
            local value="$1"
            if [[ -z "$value" ]]; then
              return 0
            fi
            case "$value" in
              http://*|https://*)
                echo "::error::Security response drills summary must be a checked-out path or actions-artifact:// reference with security-drills-summary.json beside all seven scenario drill JSON files. HTTPS summary-only URLs are not supported."
                exit 1
                ;;
              *)
                materialize_input_file "$value" INPUT_SECURITY_DRILLS_SUMMARY security-drills-summary.json "Security response drills summary"
                ;;
            esac
          }

          materialize_actions_artifact_file() {
            local value="$1"
            local env_name="$2"
            local file_name="$3"
            local description="$4"
            if [[ -z "${GH_TOKEN:-}" ]]; then
              echo "::error::$description actions artifact reference requires a workflow dispatch GitHub token."
              exit 1
            fi
            local rest="${value#actions-artifact://}"
            local run_id="${rest%%/*}"
            if [[ -z "$run_id" || "$run_id" == "$rest" ]]; then
              echo "::error::$description actions artifact reference must be actions-artifact://<run-id>/<artifact-name>/<path>."
              exit 1
            fi
            rest="${rest#*/}"
            local artifact_name="${rest%%/*}"
            if [[ -z "$artifact_name" || "$artifact_name" == "$rest" ]]; then
              echo "::error::$description actions artifact reference must include an artifact name and path."
              exit 1
            fi
            local artifact_path="${rest#*/}"
            if [[ -z "$artifact_path" || "$artifact_path" == /* || "$artifact_path" == *".."* ]]; then
              echo "::error::$description actions artifact path must be relative and cannot contain '..'."
              exit 1
            fi
            local download_dir="$RUNNER_TEMP/cryptad-production-beta-inputs/$file_name-artifact"
            rm -rf "$download_dir"
            mkdir -p "$download_dir"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$download_dir"
            local path="$download_dir/$artifact_path"
            if [[ ! -f "$path" && -f "$download_dir/$artifact_name/$artifact_path" ]]; then
              path="$download_dir/$artifact_name/$artifact_path"
            fi
            require_file "$path" "$description from $value"
            chmod 600 "$path"
            export "$env_name=$path"
          }

          materialize_secret_file "${CRYPTAD_APP_SIGNING_PRIVATE_KEY_BASE64:-}" CRYPTAD_APP_SIGNING_PRIVATE_KEY_FILE app-signing-private.der
          materialize_secret_file "${CRYPTAD_APP_SIGNING_PUBLIC_KEY_BASE64:-}" CRYPTAD_APP_SIGNING_PUBLIC_KEY_FILE app-signing-public.der
          materialize_secret_file "${CRYPTAD_APP_REVIEWER_PRIVATE_KEY_BASE64:-}" CRYPTAD_APP_REVIEWER_PRIVATE_KEY_FILE reviewer-private.der
          materialize_secret_file "${CRYPTAD_APP_REVIEWER_PUBLIC_KEY_BASE64:-}" CRYPTAD_APP_REVIEWER_PUBLIC_KEY_FILE reviewer-public.der
          materialize_input_file "$INPUT_PREVIOUS_SUMMARY" INPUT_PREVIOUS_SUMMARY previous-beta-candidate-summary.json "Previous beta candidate summary"
          materialize_input_file "$INPUT_PREVIOUS_RELEASE_CERTIFICATION_SUMMARY" INPUT_PREVIOUS_RELEASE_CERTIFICATION_SUMMARY previous-release-certification-summary.json "Previous release-certification summary"
          materialize_input_file "$INPUT_MULTI_NODE_SOAK_SUMMARY" INPUT_MULTI_NODE_SOAK_SUMMARY multi-node-beta-soak-summary.json "Multi-node soak summary"
          materialize_security_drills_summary "$INPUT_SECURITY_DRILLS_SUMMARY"
          materialize_input_file "$INPUT_THIRD_PARTY_INTAKE_SUMMARY" INPUT_THIRD_PARTY_INTAKE_SUMMARY third-party-intake-summary.json "Third-party intake summary"
          materialize_input_file "$INPUT_WAIVER_FILE" INPUT_WAIVER_FILE go-no-go-waivers.json "Go/no-go waiver file"
          materialize_input_file "$INPUT_STABLE_READINESS_WAIVERS" INPUT_STABLE_READINESS_WAIVERS stable-readiness-waivers.json "Stable readiness waiver file"

          if [[ -z "$INPUT_ARTIFACT_BASE_URI" ]]; then
            echo "::error::CRYPTAD_PRODUCTION_BETA_ARTIFACT_BASE_URI or workflow artifact_base_uri input is required for production-beta."
            exit 1
          fi
          require_env CRYPTAD_APP_SIGNING_KEY_ID "App signing key ID"
          require_file "${CRYPTAD_APP_SIGNING_PRIVATE_KEY_FILE:-}" "App signing private key"
          require_file "${CRYPTAD_APP_SIGNING_PUBLIC_KEY_FILE:-}" "App signing public key"
          require_env CRYPTAD_APP_REVIEWER_KEY_ID "App reviewer key ID"
          require_file "${CRYPTAD_APP_REVIEWER_PRIVATE_KEY_FILE:-}" "Reviewer private key"
          require_file "${CRYPTAD_APP_REVIEWER_PUBLIC_KEY_FILE:-}" "Reviewer public key"
          : "${CRYPTAD_APP_REVIEW_POLICY_ID:=crypta-app-review-v1}"
          : "${CRYPTAD_APP_REVIEW_POLICY_VERSION:=1}"
          export CRYPTAD_APP_REVIEW_POLICY_ID CRYPTAD_APP_REVIEW_POLICY_VERSION
          require_env CRYPTAD_APP_REVIEW_POLICY_ID "App review policy ID"
          require_env CRYPTAD_APP_REVIEW_POLICY_VERSION "App review policy version"
          require_env CRYPTAD_CERT_NODE_BASE_URL "Live-node base URL"
          require_env CRYPTAD_CERT_FORM_PASSWORD "Live-node form password"
          require_env CRYPTAD_CERT_LIVE_CATALOG_SOURCE "Live catalog source URI"
          require_env CRYPTAD_CERT_LIVE_CATALOG_EXPECTED_KEY_ID "Live catalog expected signing key ID"
          require_env CRYPTAD_CERT_LIVE_CATALOG_ID "Live catalog ID"
          require_env CRYPTAD_CERT_LIVE_CONTENT_FETCH_URI "Live content fetch URI"
          require_env CRYPTAD_CERT_LIVE_FEED_USK_URI "Live feed USK URI"
          require_env CRYPTAD_CERT_LIVE_PROFILE_PUBLIC_URI "Live profile public URI"
          require_env CRYPTAD_CERT_LIVE_TRUST_PUBLIC_URI "Live trust statement public URI"
          if [[ -z "${CRYPTAD_CERT_LIVE_TEST_INSERT_URI:-}" ]]; then
            echo "::error::CRYPTAD_CERT_LIVE_TEST_INSERT_URI secret is required for production-beta live profile/trust evidence."
            exit 1
          fi
          export CRYPTAD_CERT_LIVE_TEST_INSERT_URI_ENV=CRYPTAD_CERT_LIVE_TEST_INSERT_URI

          self_test_multi_node_config="tools/release-certification/fixtures/self-test-multi-node-beta-soak.json"
          if [[ -z "$INPUT_PREVIOUS_SUMMARY" ]]; then
            echo "::error::production-beta requires previous_summary pointing to the previous beta candidate summary."
            exit 1
          fi
          require_file "$INPUT_PREVIOUS_SUMMARY" "Previous beta candidate summary"
          if [[ -z "$INPUT_PREVIOUS_RELEASE_CERTIFICATION_SUMMARY" ]]; then
            echo "::error::production-beta requires previous_release_certification_summary for release history comparison."
            exit 1
          fi
          require_file "$INPUT_PREVIOUS_RELEASE_CERTIFICATION_SUMMARY" "Previous release-certification summary"
          if [[ -z "$INPUT_MULTI_NODE_SOAK_SUMMARY" && -z "$INPUT_MULTI_NODE_SOAK_CONFIG" ]]; then
            echo "::error::production-beta requires multi_node_soak_summary or a production multi_node_soak_config."
            exit 1
          fi
          if [[ -n "$INPUT_MULTI_NODE_SOAK_SUMMARY" ]]; then
            require_file "$INPUT_MULTI_NODE_SOAK_SUMMARY" "Multi-node soak summary"
          fi
          if [[ -n "$INPUT_SECURITY_DRILLS_SUMMARY" ]]; then
            require_file "$INPUT_SECURITY_DRILLS_SUMMARY" "Security response drills summary"
          fi
          if [[ -z "$INPUT_THIRD_PARTY_INTAKE_SUMMARY" ]]; then
            echo "::error::production-beta requires third_party_intake_summary with release-capable intake evidence."
            exit 1
          fi
          require_file "$INPUT_THIRD_PARTY_INTAKE_SUMMARY" "Third-party intake summary"
          if [[ -n "$INPUT_MULTI_NODE_SOAK_CONFIG" ]]; then
            require_file "$INPUT_MULTI_NODE_SOAK_CONFIG" "Multi-node soak topology config"
          fi
          if [[ -z "$INPUT_MULTI_NODE_SOAK_SUMMARY" && "$INPUT_MULTI_NODE_SOAK_CONFIG" == "$self_test_multi_node_config" ]]; then
            echo "::error::production-beta cannot use the self-test multi-node soak topology as required promotion evidence."
            exit 1
          fi
          if [[ "$INPUT_MULTI_NODE_MODE" == "simulated" ]]; then
            echo "::error::production-beta cannot use simulated multi-node mode as required promotion evidence."
            exit 1
          fi
          if [[ -n "$INPUT_WAIVER_FILE" ]]; then
            require_file "$INPUT_WAIVER_FILE" "Go/no-go waiver file"
          fi
          if [[ -n "$INPUT_STABLE_READINESS_WAIVERS" ]]; then
            require_file "$INPUT_STABLE_READINESS_WAIVERS" "Stable readiness waiver file"
          fi

          args=()
          if [[ -n "$INPUT_MULTI_NODE_MODE" ]]; then
            args+=(--multi-node-mode "$INPUT_MULTI_NODE_MODE")
          fi
          run_multi_node="$([[ -z "$INPUT_MULTI_NODE_SOAK_SUMMARY" ]] && echo true || echo false)"
          release_id="$INPUT_CANDIDATE_RELEASE_ID"
          release_version="$(./gradlew -q printVersion)"
          if [[ ! "$release_version" =~ ^[0-9]+$ ]]; then
            echo "::error::Expected a numeric project version from ./gradlew -q printVersion, got '$release_version'."
            exit 2
          fi
          manifest="$RUNNER_TEMP/production-beta-manifest.json"
          jq -n \
            --arg release_id "$release_id" \
            --arg release_version "$release_version" \
            --arg catalog_channel "${{ inputs.catalog_channel }}" \
            --arg artifact_base_uri "$INPUT_ARTIFACT_BASE_URI" \
            --arg previous_candidate "$INPUT_PREVIOUS_SUMMARY" \
            --arg release_history "$INPUT_PREVIOUS_RELEASE_CERTIFICATION_SUMMARY" \
            --arg multi_node_summary "$INPUT_MULTI_NODE_SOAK_SUMMARY" \
            --arg multi_node_config "$INPUT_MULTI_NODE_SOAK_CONFIG" \
            --arg security_drills "$INPUT_SECURITY_DRILLS_SUMMARY" \
            --arg third_party_intake "$INPUT_THIRD_PARTY_INTAKE_SUMMARY" \
            --arg waiver_file "$INPUT_WAIVER_FILE" \
            --arg stable_waivers "$INPUT_STABLE_READINESS_WAIVERS" \
            --argjson generate_stable "$INPUT_GENERATE_STABLE_READINESS" \
            --argjson require_stable "$INPUT_REQUIRE_STABLE_READINESS" \
            --argjson run_multi_node "$run_multi_node" \
            --args \
            '{
              schemaVersion: 1,
              release: {id: $release_id, version: $release_version, profile: "production-beta"},
              output: {root: "build/release-certification", reset: true},
              requirements: {
                history: true,
                liveNetwork: true,
                multiNodeSoak: true,
                sandboxProviderTests: true,
                stableReadiness: $require_stable,
                thirdPartyIntake: true
              },
              inputs: ({
                interopSmoke: "build/interop-smoke/summary.json",
                performanceSmoke: "build/perf-smoke/summary.json",
                previousCandidate: $previous_candidate,
                releaseHistory: $release_history,
                thirdPartyIntake: $third_party_intake
              }
                + (if $multi_node_summary == "" then {} else {multiNodeSoak: $multi_node_summary} end)
                + (if $multi_node_config == "" then {} else {multiNodeSoakConfig: $multi_node_config} end)
                + (if $security_drills == "" then {} else {securityDrills: $security_drills} end)
                + (if $waiver_file == "" then {} else {waiverFile: $waiver_file} end)
                + (if $stable_waivers == "" then {} else {stableReadinessWaivers: $stable_waivers} end)),
              policies: {artifactBaseUri: $artifact_base_uri, catalogChannel: $catalog_channel},
              execution: {
                collectEvidence: true,
                generateStableReadiness: $generate_stable,
                runMultiNodeSoak: $run_multi_node
              },
              commands: {"production-beta": {args: $ARGS.positional}}
            }' \
            -- "${args[@]}" > "$manifest"
          python3 tools/release-certification/certify.py production-beta --manifest "$manifest"

      - name: Read production beta redaction status
        id: redaction
        if: always()
        run: |
          status="$(python3 - <<'PY'
          import json
          from pathlib import Path

          summaries = sorted(Path("build/release-certification").glob("*/production-beta/summary.json"))
          try:
              data = json.loads(summaries[-1].read_text(encoding="utf-8"))
              print(data.get("redaction", {}).get("status") or "missing")
          except Exception:
              print("missing")
          PY
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Production beta redaction status: $status"

      - name: Read go/no-go dashboard redaction status
        id: go_no_go_redaction
        if: always()
        run: |
          status="$(python3 - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path("build/release-certification").glob("*/production-beta/artifacts/legacy/reports/go-no-go-redaction-report.json"))
          try:
              data = json.loads(reports[-1].read_text(encoding="utf-8"))
              print(data.get("status") or "missing")
          except Exception:
              print("missing")
          PY
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Go/no-go dashboard redaction status: $status"

      - name: Publish go/no-go dashboard summary
        if: always() && steps.redaction.outputs.status == 'pass' && steps.go_no_go_redaction.outputs.status == 'pass'
        run: |
          report="$(find build/release-certification -path '*/production-beta/artifacts/legacy/reports/go-no-go-dashboard.md' -print -quit)"
          if [[ -n "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload production beta artifacts
        if: always() && steps.redaction.outputs.status == 'pass' && steps.go_no_go_redaction.outputs.status == 'pass'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-beta-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release-certification/
            !**/private-insert-uris.json
            !**/raw-support-bundle/**
            !**/raw-support-bundle*
            !**/raw-diagnostics/**
            !**/raw-diagnostics*
            !**/.DS_Store
            !**/._*
            !**/__MACOSX/**
          if-no-files-found: warn
          retention-days: 30
