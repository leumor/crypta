name: Stable 1.0 Supply Chain and Reproducible Build
run-name: >-
  Stable 1.0 supply chain ${{ inputs.release_id }} build ${{ inputs.build_version }}
  (${{ inputs.operation }})

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Closed supply-chain operation; only publish mutates public state.
        required: true
        type: choice
        options:
          - inventory
          - producer-build
          - verifier-build
          - compare-evaluate
          - publish
          - verify-publication
      release_id:
        description: Exact path-safe Stable release identity.
        required: true
        type: string
      build_version:
        description: Exact positive-integer Stable build.
        required: true
        type: string
      release_class:
        description: Closed Stable release class and protected source branch family.
        required: true
        type: choice
        options:
          - maintenance
          - security-hotfix
      source_commit:
        description: Exact lowercase 40-character protected source commit.
        required: true
        type: string
      phase_bundle_signer:
        description: Closed producer class for the exact phase bundle.
        required: true
        type: choice
        options:
          - supply-chain
          - maintenance-input
      phase_bundle_run_id:
        description: Exact successful workflow run that produced the phase bundle.
        required: true
        type: string
      phase_bundle_run_attempt:
        description: Exact successful workflow run attempt.
        required: true
        type: string
      phase_bundle_artifact_name:
        description: Exact path-safe Actions artifact containing manifest.json and allowlisted inputs.
        required: true
        type: string
      phase_bundle_artifact_digest:
        description: Exact sha256 Actions artifact digest.
        required: true
        type: string
      phase_manifest_digest:
        description: Exact sha256 digest of manifest.json inside the phase bundle.
        required: true
        type: string
      producer_run_id:
        description: Exact original candidate-producer workflow run; compare-evaluate only.
        required: false
        default: ''
        type: string
      producer_run_attempt:
        description: Exact original candidate-producer workflow attempt; compare-evaluate only.
        required: false
        default: ''
        type: string
      producer_artifact_name:
        description: Exact original attested candidate-producer handoff artifact; compare-evaluate only.
        required: false
        default: ''
        type: string
      producer_artifact_digest:
        description: Exact sha256 digest of the original producer Actions artifact; compare-evaluate only.
        required: false
        default: ''
        type: string
      verifier_run_id:
        description: Exact original independent-verifier workflow run; compare-evaluate only.
        required: false
        default: ''
        type: string
      verifier_run_attempt:
        description: Exact original independent-verifier workflow attempt; compare-evaluate only.
        required: false
        default: ''
        type: string
      verifier_artifact_name:
        description: Exact original attested independent-verifier handoff artifact; compare-evaluate only.
        required: false
        default: ''
        type: string
      verifier_artifact_digest:
        description: Exact sha256 digest of the original verifier Actions artifact; compare-evaluate only.
        required: false
        default: ''
        type: string
      frozen_candidate_run:
        description: Exact maintenance freeze-candidate run and attempt as run-id:attempt; producer-build only.
        required: false
        default: ''
        type: string
      frozen_candidate_artifact_name:
        description: Exact run-bound stable-1-0-maintenance-frozen artifact; producer-build only.
        required: false
        default: ''
        type: string
      frozen_candidate_artifact_digest:
        description: Exact sha256 Actions digest of the frozen candidate artifact.
        required: false
        default: ''
        type: string
      publication_backend_run_id:
        description: Exact reviewed backend-producer run; required only for publish.
        required: false
        default: ''
        type: string
      publication_backend_artifact_name:
        description: Exact reviewed backend-wheel artifact name; required only for publish.
        required: false
        default: ''
        type: string
      publication_backend_artifact_digest:
        description: Exact reviewed backend-wheel artifact sha256; required only for publish.
        required: false
        default: ''
        type: string

# One candidate must not race a producer/verifier comparison or public-observation verification.
concurrency:
  group: stable-1-0-supply-chain-${{ inputs.release_id }}-${{ inputs.build_version }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate-dispatch:
    name: Authenticate protected source and phase coordinates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      expected_branch: ${{ steps.identity.outputs.expected_branch }}
      phase_signer_workflow: ${{ steps.identity.outputs.phase_signer_workflow }}
      frozen_run_id: ${{ steps.identity.outputs.frozen_run_id }}
      frozen_run_attempt: ${{ steps.identity.outputs.frozen_run_attempt }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate dispatch, protected branch, and input artifact
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          INPUT_SIGNER_CLASS: ${{ inputs.phase_bundle_signer }}
          INPUT_RUN_ID: ${{ inputs.phase_bundle_run_id }}
          INPUT_RUN_ATTEMPT: ${{ inputs.phase_bundle_run_attempt }}
          INPUT_ARTIFACT_NAME: ${{ inputs.phase_bundle_artifact_name }}
          INPUT_ARTIFACT_DIGEST: ${{ inputs.phase_bundle_artifact_digest }}
          INPUT_MANIFEST_DIGEST: ${{ inputs.phase_manifest_digest }}
          INPUT_PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          INPUT_PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          INPUT_PRODUCER_ARTIFACT_NAME: ${{ inputs.producer_artifact_name }}
          INPUT_PRODUCER_ARTIFACT_DIGEST: ${{ inputs.producer_artifact_digest }}
          INPUT_VERIFIER_RUN_ID: ${{ inputs.verifier_run_id }}
          INPUT_VERIFIER_RUN_ATTEMPT: ${{ inputs.verifier_run_attempt }}
          INPUT_VERIFIER_ARTIFACT_NAME: ${{ inputs.verifier_artifact_name }}
          INPUT_VERIFIER_ARTIFACT_DIGEST: ${{ inputs.verifier_artifact_digest }}
          INPUT_FROZEN_RUN: ${{ inputs.frozen_candidate_run }}
          INPUT_FROZEN_ARTIFACT_NAME: ${{ inputs.frozen_candidate_artifact_name }}
          INPUT_FROZEN_ARTIFACT_DIGEST: ${{ inputs.frozen_candidate_artifact_digest }}
          INPUT_BACKEND_RUN_ID: ${{ inputs.publication_backend_run_id }}
          INPUT_BACKEND_ARTIFACT_NAME: ${{ inputs.publication_backend_artifact_name }}
          INPUT_BACKEND_ARTIFACT_DIGEST: ${{ inputs.publication_backend_artifact_digest }}
          REF_PROTECTED: ${{ github.ref_protected }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ${#INPUT_RELEASE_ID} -gt 128 \
                || ! "$INPUT_RELEASE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ \
                || ! "$INPUT_BUILD_VERSION" =~ ^[1-9][0-9]*$ \
                || ! "$INPUT_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ \
                || ! "$INPUT_RUN_ID" =~ ^[1-9][0-9]*$ \
                || ! "$INPUT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ \
                || ! "$INPUT_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ \
                || ! "$INPUT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ \
                || ! "$INPUT_MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Supply-chain identity or phase coordinates are malformed."
            exit 1
          fi
          if [[ "$INPUT_OPERATION" == publish ]]; then
            if [[ ! "$INPUT_BACKEND_RUN_ID" =~ ^[1-9][0-9]*$ \
                  || "$INPUT_BACKEND_ARTIFACT_NAME" \
                    != "stable-1.0-maintenance-publication-backend" \
                  || ! "$INPUT_BACKEND_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::publish requires the exact reviewed publication-backend artifact."
              exit 1
            fi
          elif [[ -n "$INPUT_BACKEND_RUN_ID$INPUT_BACKEND_ARTIFACT_NAME$INPUT_BACKEND_ARTIFACT_DIGEST" ]]; then
            echo "::error::Only publish accepts publication-backend coordinates."
            exit 1
          fi
          builder_coordinates="${INPUT_PRODUCER_RUN_ID}${INPUT_PRODUCER_RUN_ATTEMPT}${INPUT_PRODUCER_ARTIFACT_NAME}${INPUT_PRODUCER_ARTIFACT_DIGEST}${INPUT_VERIFIER_RUN_ID}${INPUT_VERIFIER_RUN_ATTEMPT}${INPUT_VERIFIER_ARTIFACT_NAME}${INPUT_VERIFIER_ARTIFACT_DIGEST}"
          if [[ "$INPUT_OPERATION" == compare-evaluate ]]; then
            if [[ ! "$INPUT_PRODUCER_RUN_ID" =~ ^[1-9][0-9]*$ \
                  || ! "$INPUT_PRODUCER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ \
                  || "$INPUT_PRODUCER_ARTIFACT_NAME" \
                    != "stable-1.0-supply-chain-$INPUT_RELEASE_ID-producer-attempt-$INPUT_PRODUCER_RUN_ATTEMPT" \
                  || ! "$INPUT_PRODUCER_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ \
                  || ! "$INPUT_VERIFIER_RUN_ID" =~ ^[1-9][0-9]*$ \
                  || ! "$INPUT_VERIFIER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ \
                  || "$INPUT_VERIFIER_ARTIFACT_NAME" \
                    != "stable-1.0-supply-chain-$INPUT_RELEASE_ID-verifier-attempt-$INPUT_VERIFIER_RUN_ATTEMPT" \
                  || ! "$INPUT_VERIFIER_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ \
                  || "$INPUT_PRODUCER_RUN_ID" == "$INPUT_VERIFIER_RUN_ID" ]]; then
              echo "::error::compare-evaluate requires distinct exact original builder coordinates."
              exit 1
            fi
          elif [[ -n "$builder_coordinates" ]]; then
            echo "::error::Only compare-evaluate accepts original builder coordinates."
            exit 1
          fi
          frozen_coordinates="${INPUT_FROZEN_RUN}${INPUT_FROZEN_ARTIFACT_NAME}${INPUT_FROZEN_ARTIFACT_DIGEST}"
          if [[ "$INPUT_OPERATION" == producer-build ]]; then
            if [[ ! "$INPUT_FROZEN_RUN" =~ ^[1-9][0-9]*:[1-9][0-9]*$ \
                  || ! "$INPUT_FROZEN_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ \
                  || ! "$INPUT_FROZEN_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::producer-build requires exact maintenance freeze-candidate coordinates."
              exit 1
            fi
            INPUT_FROZEN_RUN_ID="${INPUT_FROZEN_RUN%%:*}"
            INPUT_FROZEN_RUN_ATTEMPT="${INPUT_FROZEN_RUN#*:}"
            if [[ "$INPUT_FROZEN_ARTIFACT_NAME" \
                  != "stable-1-0-maintenance-frozen-$INPUT_RELEASE_ID-$INPUT_BUILD_VERSION-$INPUT_FROZEN_RUN_ID-$INPUT_FROZEN_RUN_ATTEMPT" ]]; then
              echo "::error::The maintenance frozen artifact name is not bound to its run and attempt."
              exit 1
            fi
          elif [[ -n "$frozen_coordinates" ]]; then
            echo "::error::Only producer-build accepts frozen candidate coordinates."
            exit 1
          fi

          case "$INPUT_RELEASE_CLASS" in
            maintenance) expected_branch="release/$INPUT_BUILD_VERSION" ;;
            security-hotfix) expected_branch="hotfix/$INPUT_BUILD_VERSION" ;;
            *) exit 1 ;;
          esac
          expected_ref="refs/heads/$expected_branch"
          expected_workflow="$GITHUB_REPOSITORY/.github/workflows/stable-1.0-supply-chain.yml@$expected_ref"
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch \
                || "$REF_PROTECTED" != true \
                || "$GITHUB_REF" != "$expected_ref" \
                || "$GITHUB_SHA" != "$INPUT_SOURCE_COMMIT" \
                || "$WORKFLOW_SHA" != "$INPUT_SOURCE_COMMIT" \
                || "$WORKFLOW_REF" != "$expected_workflow" \
                || "$(git rev-parse 'HEAD^{commit}')" != "$INPUT_SOURCE_COMMIT" ]]; then
            echo "::error::Supply-chain dispatch must bind the exact protected release/hotfix source."
            exit 1
          fi

          case "$INPUT_SIGNER_CLASS" in
            supply-chain)
              signer_workflow=".github/workflows/stable-1.0-supply-chain.yml"
              ;;
            maintenance-input)
              signer_workflow=".github/workflows/stable-1.0-maintenance-input-producer.yml"
              ;;
            *) exit 1 ;;
          esac
          case "$INPUT_OPERATION:$INPUT_SIGNER_CLASS" in
            inventory:supply-chain|inventory:maintenance-input|producer-build:maintenance-input|verifier-build:supply-chain|verifier-build:maintenance-input|compare-evaluate:supply-chain|compare-evaluate:maintenance-input|publish:supply-chain|verify-publication:supply-chain) ;;
            *)
              echo "::error::The operation cannot consume the selected phase producer class."
              exit 1
              ;;
          esac

          encoded_branch="${expected_branch//\//%2F}"
          branch_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/branches/$encoded_branch")"
          protected_tip="$(jq -er 'select(.protected == true) | .commit.sha' <<< "$branch_json")"
          if [[ "$protected_tip" != "$INPUT_SOURCE_COMMIT" ]]; then
            echo "::error::The protected source branch moved or does not identify source_commit."
            exit 1
          fi

          run_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID/attempts/$INPUT_RUN_ATTEMPT")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$signer_workflow" \
            --arg commit "$INPUT_SOURCE_COMMIT" \
            --argjson attempt "$INPUT_RUN_ATTEMPT" '
              .repository.full_name == $repository
              and .head_repository.full_name == $repository
              and .path == $workflow
              and .head_sha == $commit
              and .event == "workflow_dispatch"
              and .run_attempt == $attempt
              and .status == "completed"
              and .conclusion == "success"' <<< "$run_json" >/dev/null
          artifacts="$(gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID/artifacts" \
            -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
          jq -e --arg name "$INPUT_ARTIFACT_NAME" --arg digest "$INPUT_ARTIFACT_DIGEST" '
            [.artifacts[] | select(
              .name == $name and .expired == false and .digest == $digest
            )] | length == 1' <<< "$artifacts" >/dev/null

          if [[ "$INPUT_OPERATION" == producer-build ]]; then
            frozen_run="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_FROZEN_RUN_ID/attempts/$INPUT_FROZEN_RUN_ATTEMPT")"
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg commit "$INPUT_SOURCE_COMMIT" \
              --arg display_title "Stable 1.0 $INPUT_RELEASE_CLASS $INPUT_RELEASE_ID build $INPUT_BUILD_VERSION (freeze-candidate)" \
              --argjson attempt "$INPUT_FROZEN_RUN_ATTEMPT" '
                .repository.full_name == $repository
                and .head_repository.full_name == $repository
                and .path == ".github/workflows/stable-1.0-maintenance-release.yml"
                and .head_sha == $commit
                and .event == "workflow_dispatch"
                and .display_title == $display_title
                and .run_attempt == $attempt
                and .status == "completed"
                and .conclusion == "success"' <<< "$frozen_run" >/dev/null
            frozen_artifacts="$(gh api --paginate --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_FROZEN_RUN_ID/artifacts" \
              -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
            jq -e \
              --arg name "$INPUT_FROZEN_ARTIFACT_NAME" \
              --arg digest "$INPUT_FROZEN_ARTIFACT_DIGEST" '
                [.artifacts[] | select(
                  .name == $name and .expired == false and .digest == $digest
                )] | length == 1' <<< "$frozen_artifacts" >/dev/null
          fi

          echo "expected_branch=$expected_branch" >> "$GITHUB_OUTPUT"
          echo "phase_signer_workflow=$GITHUB_REPOSITORY/$signer_workflow" >> "$GITHUB_OUTPUT"
          if [[ "$INPUT_OPERATION" == producer-build ]]; then
            echo "frozen_run_id=$INPUT_FROZEN_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "frozen_run_attempt=$INPUT_FROZEN_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi

  inventory:
    name: Assemble or verify canonical inventory
    if: inputs.operation == 'inventory' && github.ref_protected
    needs: validate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stable-1.0-supply-chain-evidence
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25.0.4.1+1'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Gradle properties
        uses: ./.github/actions/setup-gradle-properties

      - name: Download exact phase bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.phase_bundle_run_id }}
          name: ${{ inputs.phase_bundle_artifact_name }}
          path: build/stable-supply-chain-phase

      - name: Verify phase manifest, allowlisted inputs, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SIGNER: ${{ needs.validate-dispatch.outputs.phase_signer_workflow }}
          EXPECTED_MANIFEST_DIGEST: ${{ inputs.phase_manifest_digest }}
          EXPECTED_OPERATION: inventory
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_BUILD_VERSION: ${{ inputs.build_version }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("build/stable-supply-chain-phase").resolve(strict=True)
          manifest_path = root / "manifest.json"
          if manifest_path.is_symlink() or not manifest_path.is_file():
              raise SystemExit("phase bundle must contain one regular manifest.json")
          digest = "sha256:" + hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          if digest != os.environ["EXPECTED_MANIFEST_DIGEST"]:
              raise SystemExit("phase manifest digest mismatch")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          mode = manifest.get("commands", {}).get("stable-supply-chain", {}).get("mode")
          if mode not in {"assemble-inventory", "verify-inventory"}:
              raise SystemExit("inventory operation received the wrong engine mode")
          release = manifest.get("release", {})
          policies = manifest.get("policies", {})
          if (release.get("id"), release.get("version"), release.get("profile")) != (
              os.environ["EXPECTED_RELEASE_ID"], os.environ["EXPECTED_BUILD_VERSION"], "stable-review"
          ):
              raise SystemExit("phase manifest release identity mismatch")
          commit = os.environ["EXPECTED_SOURCE_COMMIT"]
          if policies.get("candidateSourceCommit") != commit or policies.get("candidateSourceRef") != f"commit:{commit}":
              raise SystemExit("phase manifest source identity mismatch")
          inputs = manifest.get("inputs")
          if not isinstance(inputs, dict) or not inputs:
              raise SystemExit("phase manifest inputs are missing")
          reviewed_export = root / "resolved-dependency-export.json"
          reviewed_snapshot = root / "resolved-dependency-snapshot.json"
          if any(path.is_symlink() or not path.is_file() for path in (reviewed_export, reviewed_snapshot)):
              raise SystemExit("reviewed resolution export and snapshot are required regular files")
          allowed = {manifest_path.resolve(), reviewed_export.resolve(), reviewed_snapshot.resolve()}
          workspace = Path.cwd().resolve()
          fixed_files = {
              "supplyChainPolicy": workspace / "tools/release-certification/stable-1.0-supply-chain-policy.json",
              "licenseOverrides": workspace / "tools/release-certification/stable-1.0-supply-chain-license-overrides.json",
              "resolvedDependencySnapshot": reviewed_snapshot,
          }
          fixed_directories = {"licenseTextRoot": workspace}
          for key, value in inputs.items():
              if not isinstance(value, str):
                  raise SystemExit("phase input path is malformed")
              configured = Path(value)
              if configured.is_absolute() or ".." in configured.parts:
                  raise SystemExit("phase input path is unsafe")
              target = (workspace / configured).resolve(strict=True)
              if target.is_symlink():
                  raise SystemExit("phase input is a symlink")
              if key in fixed_files:
                  if target != fixed_files[key].resolve(strict=True):
                      raise SystemExit(f"{key} does not use its canonical checked-in/generated path")
                  continue
              if key in fixed_directories:
                  if target != fixed_directories[key].resolve(strict=True):
                      raise SystemExit(f"{key} does not use its canonical checked-in path")
                  continue
              target.relative_to(root)
              cursor = target
              while cursor != root:
                  allowed.add(cursor)
                  cursor = cursor.parent
              if target.is_dir():
                  allowed.update(child.resolve() for child in target.rglob("*"))
          for input_key, rows_key in (("licenseInventory", "components"), ("licenseOverrides", "overrides")):
              configured = inputs.get(input_key)
              if configured is None:
                  continue
              registry = json.loads((workspace / configured).read_text(encoding="utf-8"))
              for row in registry.get(rows_key, []):
                  notice = row.get("licenseTextPath")
                  if notice is None:
                      continue
                  if notice != "LICENSE" and not notice.startswith("docs/licenses/"):
                      raise SystemExit("license evidence must be LICENSE or a file below docs/licenses")
                  evidence = (workspace / notice).resolve(strict=True)
                  if evidence.is_symlink() or not evidence.is_file():
                      raise SystemExit("license evidence is missing or unsafe")
          subject = (workspace / inputs.get("releaseSubjectInventory", "")).resolve(strict=True)
          subject.relative_to(root)
          actual = {child.resolve() for child in root.rglob("*")}
          if actual != allowed:
              raise SystemExit("phase bundle contains an unreferenced entry")
          PY
          if find build/stable-supply-chain-phase \( -type l -o -type f -links +1 \) -print -quit | grep -q .; then
            echo "::error::Phase bundle contains a symlink or hard-linked file."
            exit 1
          fi
          while IFS= read -r -d '' subject; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$EXPECTED_SIGNER" \
              --signer-digest "$EXPECTED_SOURCE_COMMIT" \
              --source-digest "$EXPECTED_SOURCE_COMMIT" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners >/dev/null
          done < <(find build/stable-supply-chain-phase -type f -print0 | LC_ALL=C sort -z)

      - name: Export and strictly verify against reviewed resolution evidence
        run: |
          set -euo pipefail
          materials="$(jq -r '.inputs.buildMaterials' build/stable-supply-chain-phase/manifest.json)"
          direct_field() {
            jq -er --arg name "$1" --arg field "$2" \
              '.directInputs[] | select(.name == $name) | .[$field]' "$materials"
          }
          ./gradlew downloadSeedrefs downloadWrapper downloadWindowsWrapper \
            -PseedrefsSha256="$(direct_field seedrefs-source-archive digest | sed 's/^sha256://')" \
            -PseedrefsUrl="$(direct_field seedrefs-source-archive origin)" \
            -PwrapperDeltaPackSha256="$(direct_field tanuki-wrapper-delta-pack digest | sed 's/^sha256://')" \
            -PwrapperWinAmd64Sha256="$(direct_field windows-wrapper-amd64 digest | sed 's/^sha256://')" \
            -PwrapperWinArm64Sha256="$(direct_field windows-wrapper-arm64 digest | sed 's/^sha256://')" \
            -PwrapperWinAmd64Url="$(direct_field windows-wrapper-amd64 origin)" \
            -PwrapperWinArm64Url="$(direct_field windows-wrapper-arm64 origin)"
          ./gradlew exportStableSupplyChainResolution verifyStableSupplyChainResolution \
            -PstableSupplyChainExpectedResolutionExport=build/stable-supply-chain-phase/resolved-dependency-export.json \
            -PstableSupplyChainExpectedResolutionSnapshot=build/stable-supply-chain-phase/resolved-dependency-snapshot.json \
            -PseedrefsSha256="$(direct_field seedrefs-source-archive digest | sed 's/^sha256://')" \
            -PseedrefsUrl="$(direct_field seedrefs-source-archive origin)" \
            -PwrapperDeltaPackSha256="$(direct_field tanuki-wrapper-delta-pack digest | sed 's/^sha256://')" \
            -PwrapperWinAmd64Sha256="$(direct_field windows-wrapper-amd64 digest | sed 's/^sha256://')" \
            -PwrapperWinArm64Sha256="$(direct_field windows-wrapper-arm64 digest | sed 's/^sha256://')" \
            -PwrapperWinAmd64Url="$(direct_field windows-wrapper-amd64 origin)" \
            -PwrapperWinArm64Url="$(direct_field windows-wrapper-arm64 origin)"

      - name: Require phase snapshot to match this exact checkout
        run: |
          set -euo pipefail
          phase_snapshot="$(jq -er '.inputs.resolvedDependencySnapshot' \
            build/stable-supply-chain-phase/manifest.json)"
          cmp -- build/stable-supply-chain/resolved-dependency-snapshot.json "$phase_snapshot"

      - name: Cross-check live raw build evidence with reviewed final materials
        env:
          EXPECTED_BUILD_VERSION: ${{ inputs.build_version }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          workspace = Path.cwd().resolve()
          phase = (workspace / "build/stable-supply-chain-phase").resolve(strict=True)
          manifest = json.loads((phase / "manifest.json").read_text(encoding="utf-8"))
          final_path = (workspace / manifest["inputs"]["buildMaterials"]).resolve(strict=True)
          final_path.relative_to(phase)
          if final_path.is_symlink() or not final_path.is_file():
              raise SystemExit("final build materials are not a confined regular phase input")
          reviewed_export_path = phase / "resolved-dependency-export.json"
          reviewed_snapshot_path = phase / "resolved-dependency-snapshot.json"
          raw_path = workspace / "build/stable-supply-chain/build-material-inputs.json"
          raw = json.loads(raw_path.read_text(encoding="utf-8"))
          snapshot = json.loads(reviewed_snapshot_path.read_text(encoding="utf-8"))
          final = json.loads(final_path.read_text(encoding="utf-8"))

          def prefixed(value: object) -> str:
              if not isinstance(value, str) or len(value) != 64:
                  raise SystemExit("raw build-material digest is malformed")
              return "sha256:" + value

          reviewed_export_digest = "sha256:" + hashlib.sha256(
              reviewed_export_path.read_bytes()
          ).hexdigest()
          raw_export = raw.get("rawResolutionExport", {})
          material_digests = snapshot.get("materialDigests", {})
          final_gradle = final.get("gradle", {})
          canonical_environment_names = ["LANG", "LC_ALL", "SOURCE_DATE_EPOCH", "TZ"]
          raw_environment = raw.get("environment", {})
          final_environment = final.get("environment", {})
          raw_jdk = raw.get("jdk", {})
          raw_jdk_modules = raw_jdk.get("modules")
          final_jdk = final.get("jdk", {})
          final_jdk_modules = final_jdk.get("modules")
          final_jdk_installations = [
              row for row in final_jdk.get("installations", [])
              if row.get("runnerOs") == "linux" and row.get("architecture") == "amd64"
          ]
          if (
              raw.get("schema") != "cryptad-stable-build-material-inputs-v1"
              or raw.get("releaseBuild") != os.environ["EXPECTED_BUILD_VERSION"]
              or raw.get("source", {}).get("commit") != os.environ["EXPECTED_SOURCE_COMMIT"]
              or raw_export.get("path")
              != "build/stable-supply-chain/resolved-dependency-export.json"
              or prefixed(raw_export.get("sha256")) != reviewed_export_digest
              or material_digests.get("rawResolutionExport") != reviewed_export_digest
              or final_gradle.get("rawResolutionExportDigest") != reviewed_export_digest
              or final.get("resolutionSnapshotDigest") != snapshot.get("snapshotDigest")
              or raw.get("gradle", {}).get("version") != final_gradle.get("version")
              or raw.get("gradle", {}).get("wrapperDistributionUrl")
              != final_gradle.get("distributionUri")
              or raw.get("gradle", {}).get("dependencyVerificationMode") != "strict"
              or final_gradle.get("distributionDigest")
              != material_digests.get("gradleDistribution")
              or prefixed(raw.get("materialSetDigests", {}).get("buildLogic"))
              != material_digests.get("buildLogic")
              or raw_environment.get("allowedVariableNames")
              != canonical_environment_names
              or final_environment.get("allowedVariableNames")
              != canonical_environment_names
              or raw_environment.get("allowedVariableNames")
              != final_environment.get("allowedVariableNames")
              or not isinstance(raw_jdk_modules, list)
              or not raw_jdk_modules
              or raw_jdk_modules != sorted(set(raw_jdk_modules))
              or raw_jdk_modules != final_jdk_modules
              or len(final_jdk_installations) != 1
              or raw_jdk.get("languageVersion") != final_jdk.get("version")
              or raw_jdk.get("javaRuntimeVersion") != final_jdk.get("build")
              or raw_jdk.get("installationManifestDigest")
              != final_jdk_installations[0].get("installationManifestDigest")
              or raw_jdk.get("releaseFileDigest")
              != final_jdk_installations[0].get("releaseFileDigest")
          ):
              raise SystemExit("raw resolution or final build-material identity drifted")

          materials = {
              row.get("path"): row.get("sha256")
              for row in raw.get("materials", [])
              if isinstance(row, dict)
          }
          raw_sets = raw.get("materialSetDigests", {})
          mappings = (
              (
                  "gradleWrapperJar",
                  "wrapperJarDigest",
                  materials.get("gradle/wrapper/gradle-wrapper.jar"),
              ),
              (
                  "gradleWrapperProperties",
                  "wrapperPropertiesDigest",
                  materials.get("gradle/wrapper/gradle-wrapper.properties"),
              ),
              ("versionCatalog", "versionCatalogDigest", materials.get("gradle/libs.versions.toml")),
              (
                  "repositoryConfiguration",
                  "repositoryConfigurationDigest",
                  raw_sets.get("repositoryConfiguration"),
              ),
              (
                  "verificationMetadata",
                  "verificationMetadataDigest",
                  materials.get("gradle/verification-metadata.xml"),
              ),
              (
                  "verificationKeyring",
                  "verificationKeyringDigest",
                  materials.get("gradle/verification-keyring.gpg"),
              ),
          )
          for snapshot_key, final_key, raw_digest in mappings:
              digest = prefixed(raw_digest)
              if material_digests.get(snapshot_key) != digest or final_gradle.get(final_key) != digest:
                  raise SystemExit(f"raw, snapshot, and final material differ for {snapshot_key}")
          observed_direct = []
          for row in raw.get("directInputs", []):
              digest = (
                  row.get("expectedSha256")
                  if row.get("name") == "gradle-wrapper-distribution"
                  else row.get("actualSha256")
              )
              if row.get("promotionBlocking") is not False:
                  raise SystemExit("raw direct input is unverified or mutable")
              observed_direct.append({
                  "name": row.get("name"),
                  "digest": prefixed(digest),
                  "origin": row.get("url"),
                  "immutabilityClass": row.get("immutabilityClass"),
              })
          if sorted(observed_direct, key=lambda row: row["name"]) != final.get("directInputs"):
              raise SystemExit("raw and final direct-input origins differ")
          PY

      - name: Run side-effect-free inventory phase
        run: >-
          python3 tools/release-certification/certify.py stable-supply-chain
          --manifest build/stable-supply-chain-phase/manifest.json

      - name: Retain authenticated live raw build-material evidence
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          evidence="build/release-certification/$RELEASE_ID/stable-supply-chain/workflow-evidence"
          mkdir -p "$evidence"
          cp build/stable-supply-chain/build-material-inputs.json \
            "$evidence/cryptad-stable-build-material-inputs.json"

      - name: Attest canonical inventory evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: >-
            build/release-certification/${{ inputs.release_id }}/stable-supply-chain/**/*

      - name: Upload immutable inventory handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1.0-supply-chain-${{ inputs.release_id }}-inventory
          path: build/release-certification/${{ inputs.release_id }}/stable-supply-chain
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 30

  producer-build:
    name: candidate-producer-portable-apps
    if: inputs.operation == 'producer-build' && github.ref_protected
    needs: validate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: stable-1.0-supply-chain-producer
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25.0.4.1+1'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Gradle properties
        uses: ./.github/actions/setup-gradle-properties

      - name: Clean producer workspace before receiving reviewed phase inputs
        run: ./gradlew clean

      - name: Download and authenticate producer recipe bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.phase_bundle_run_id }}
          name: ${{ inputs.phase_bundle_artifact_name }}
          path: build/stable-supply-chain-phase

      - name: Verify producer recipe attestations
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SIGNER: ${{ needs.validate-dispatch.outputs.phase_signer_workflow }}
          EXPECTED_MANIFEST_DIGEST: ${{ inputs.phase_manifest_digest }}
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_BUILD_VERSION: ${{ inputs.build_version }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test -f build/stable-supply-chain-phase/manifest.json
          test ! -L build/stable-supply-chain-phase/manifest.json
          actual="sha256:$(sha256sum build/stable-supply-chain-phase/manifest.json | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_MANIFEST_DIGEST"
          jq -e --arg id "$EXPECTED_RELEASE_ID" --arg version "$EXPECTED_BUILD_VERSION" \
            --arg commit "$EXPECTED_SOURCE_COMMIT" '
              .release.id == $id and .release.version == $version
              and .release.profile == "stable-review"
              and .policies.candidateSourceCommit == $commit
              and .policies.candidateSourceRef == ("commit:" + $commit)
              and .requirements.stableSupplyChain == true
              and .commands["stable-supply-chain"].mode == "prepare-rebuild-comparison"' \
            build/stable-supply-chain-phase/manifest.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          workspace = Path.cwd().resolve()
          root = (workspace / "build/stable-supply-chain-phase").resolve(strict=True)
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          exact = {
              "supplyChainPolicy", "resolvedDependencySnapshot", "componentInventory",
              "releaseSubjectInventory", "buildMaterials",
          }
          if set(manifest.get("inputs", {})) != exact:
              raise SystemExit("producer recipe inputs are not the exact product-byte-free set")
          reviewed_export = root / "resolved-dependency-export.json"
          reviewed_snapshot = root / "resolved-dependency-snapshot.json"
          if any(path.is_symlink() or not path.is_file() for path in (reviewed_export, reviewed_snapshot)):
              raise SystemExit("reviewed resolution export and snapshot are required regular files")
          if (workspace / manifest["inputs"].get("resolvedDependencySnapshot", "")).resolve(strict=True) != reviewed_snapshot.resolve():
              raise SystemExit("producer manifest does not select the exact reviewed snapshot")
          allowed = {manifest_path.resolve(), reviewed_export.resolve(), reviewed_snapshot.resolve()}
          external = {
              (workspace / "tools/release-certification/stable-1.0-supply-chain-policy.json").resolve(strict=True),
              (workspace / "tools/release-certification/stable-1.0-supply-chain-license-overrides.json").resolve(strict=True),
              workspace,
          }
          for key, value in manifest["inputs"].items():
              configured = Path(value)
              if configured.is_absolute() or ".." in configured.parts:
                  raise SystemExit("phase input path is unsafe")
              target = (workspace / configured).resolve(strict=True)
              if target == workspace:
                  raise SystemExit("producer recipe may not select the repository root")
              if target in external:
                  continue
              target.relative_to(root)
              cursor = target
              while cursor != root:
                  allowed.add(cursor)
                  cursor = cursor.parent
          if {child.resolve() for child in root.rglob("*")} != allowed:
              raise SystemExit("phase bundle contains an unreferenced entry")
          prohibited = (".jar", ".zip", ".tar", ".tar.gz", ".deb", ".rpm", ".dmg", ".exe")
          if any(path.is_file() and path.name.endswith(prohibited) for path in root.rglob("*")):
              raise SystemExit("producer recipe contains candidate product bytes")
          PY
          if find build/stable-supply-chain-phase \( -type l -o -type f -links +1 \) -print -quit | grep -q .; then
            exit 1
          fi
          while IFS= read -r -d '' subject; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$EXPECTED_SIGNER" --source-ref "$GITHUB_REF" >/dev/null
          done < <(find build/stable-supply-chain-phase -type f -print0 | LC_ALL=C sort -z)

      - name: Install canonical build environment and observe exact Java runtime
        env:
          PYTHONPATH: tools/release-certification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          from cryptad_certification.engines.stable_1_0_supply_chain_core import (
              CANONICAL_BUILD_ENVIRONMENT_VARIABLES,
              builder_observation_errors,
              canonical_json_bytes,
              observed_java_identity,
          )
          from cryptad_certification.engines.stable_1_0_supply_chain_jdk import (
              jdk_installation_identity,
          )

          workspace = Path.cwd().resolve()
          phase = (workspace / "build/stable-supply-chain-phase").resolve(strict=True)
          manifest = json.loads((phase / "manifest.json").read_text(encoding="utf-8"))
          materials_path = (workspace / manifest["inputs"]["buildMaterials"]).resolve(strict=True)
          materials_path.relative_to(phase)
          if materials_path.is_symlink() or not materials_path.is_file():
              raise SystemExit("authenticated build-material input is unsafe")
          materials = json.loads(materials_path.read_text(encoding="utf-8"))
          allowed = materials["environment"]["allowedVariableNames"]
          if allowed != list(CANONICAL_BUILD_ENVIRONMENT_VARIABLES):
              raise SystemExit("build environment variable allowlist is not canonical")
          environment_variables = {
              "LANG": materials["environment"]["locale"],
              "LC_ALL": materials["environment"]["locale"],
              "SOURCE_DATE_EPOCH": str(materials["canonicalBuildEpoch"]),
              "TZ": materials["environment"]["timezone"],
          }
          java_environment = dict(os.environ)
          java_environment.update(environment_variables)
          result = subprocess.run(
              ["java", "-XshowSettings:properties", "-version"],
              check=True,
              capture_output=True,
              env=java_environment,
              text=True,
          )
          properties = {}
          for line in (result.stdout + "\n" + result.stderr).splitlines():
              match = re.match(r"^\s*([^=]+?)\s*=\s*(.*?)\s*$", line)
              if match:
                  properties[match.group(1)] = match.group(2)
          java = observed_java_identity(
              properties, jdk_installation_identity(Path(properties["java.home"]))
          )
          errors = builder_observation_errors(
              java, environment_variables, materials, os.environ["RUNNER_OS"].casefold()
          )
          if errors:
              raise SystemExit(errors[0])
          observation = {
              "java": java,
              "environmentVariables": environment_variables,
              "canonicalEnvironment": {
                  "locale": environment_variables["LC_ALL"],
                  "timezone": environment_variables["TZ"],
                  "encoding": java["javaEncoding"],
                  "sourceDateEpoch": int(environment_variables["SOURCE_DATE_EPOCH"]),
              },
          }
          destination = workspace / "build/stable-supply-chain-builder-observation.json"
          destination.write_bytes(canonical_json_bytes(observation) + b"\n")
          with Path(os.environ["GITHUB_ENV"]).open(
              "a", encoding="utf-8", newline="\n"
          ) as handle:
              for name in CANONICAL_BUILD_ENVIRONMENT_VARIABLES:
                  handle.write(f"{name}={environment_variables[name]}\n")
          PY

      - name: Export resolution and build closed producer subjects
        env:
          CRYPTAD_APP_SIGNING_KEY_ID: ${{ secrets.CRYPTAD_APP_SIGNING_KEY_ID }}
          CRYPTAD_APP_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.CRYPTAD_APP_SIGNING_PRIVATE_KEY_BASE64 }}
          CRYPTAD_APP_SIGNING_PUBLIC_KEY_BASE64: ${{ secrets.CRYPTAD_APP_SIGNING_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          materials="$(jq -r '.inputs.buildMaterials' build/stable-supply-chain-phase/manifest.json)"
          direct_digest() {
            jq -er --arg path "external/$1" \
              '.packagingInputs[] | select(.path == $path) | .digest | sub("^sha256:"; "")' \
              "$materials"
          }
          direct_origin() {
            jq -er --arg name "$1" \
              '.directInputs[] | select(.name == $name) | .origin' "$materials"
          }
          seedrefs_sha="$(direct_digest seedrefs-source-archive)"
          wrapper_delta_sha="$(direct_digest tanuki-wrapper-delta-pack)"
          wrapper_amd64_sha="$(direct_digest windows-wrapper-amd64)"
          wrapper_arm64_sha="$(direct_digest windows-wrapper-arm64)"
          seedrefs_url="$(direct_origin seedrefs-source-archive)"
          wrapper_amd64_url="$(direct_origin windows-wrapper-amd64)"
          wrapper_arm64_url="$(direct_origin windows-wrapper-arm64)"
          ./gradlew exportStableSupplyChainResolution verifyStableSupplyChainResolution \
            dist packageFirstPartyApps --rerun-tasks \
            -PstableSupplyChainExpectedResolutionExport=build/stable-supply-chain-phase/resolved-dependency-export.json \
            -PstableSupplyChainExpectedResolutionSnapshot=build/stable-supply-chain-phase/resolved-dependency-snapshot.json \
            -PseedrefsSha256="$seedrefs_sha" \
            -PseedrefsUrl="$seedrefs_url" \
            -PwrapperDeltaPackSha256="$wrapper_delta_sha" \
            -PwrapperWinAmd64Sha256="$wrapper_amd64_sha" \
            -PwrapperWinArm64Sha256="$wrapper_arm64_sha" \
            -PwrapperWinAmd64Url="$wrapper_amd64_url" \
            -PwrapperWinArm64Url="$wrapper_arm64_url"
          ./gradlew exportStableSupplyChainResolution verifyStableSupplyChainResolution \
            -PstableSupplyChainExpectedResolutionExport=build/stable-supply-chain-phase/resolved-dependency-export.json \
            -PstableSupplyChainExpectedResolutionSnapshot=build/stable-supply-chain-phase/resolved-dependency-snapshot.json \
            -PseedrefsSha256="$seedrefs_sha" \
            -PseedrefsUrl="$seedrefs_url" \
            -PwrapperDeltaPackSha256="$wrapper_delta_sha" \
            -PwrapperWinAmd64Sha256="$wrapper_amd64_sha" \
            -PwrapperWinArm64Sha256="$wrapper_arm64_sha" \
            -PwrapperWinAmd64Url="$wrapper_amd64_url" \
            -PwrapperWinArm64Url="$wrapper_arm64_url"

      - name: Download exact frozen candidate after producer staged build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate-dispatch.outputs.frozen_run_id }}
          name: ${{ inputs.frozen_candidate_artifact_name }}
          path: build/stable-supply-chain-frozen-candidate

      - name: Authenticate frozen candidate after portable producer staged build
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_BUILD_VERSION: ${{ inputs.build_version }}
          EXPECTED_RELEASE_CLASS: ${{ inputs.release_class }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_FROZEN_DIGEST: ${{ inputs.frozen_candidate_artifact_digest }}
          EXPECTED_FROZEN_NAME: ${{ inputs.frozen_candidate_artifact_name }}
          EXPECTED_FROZEN_RUN_ID: ${{ needs.validate-dispatch.outputs.frozen_run_id }}
          EXPECTED_FROZEN_RUN_ATTEMPT: ${{ needs.validate-dispatch.outputs.frozen_run_attempt }}
          PYTHONPATH: tools/release-certification
        run: |
          set -euo pipefail
          root="build/stable-supply-chain-frozen-candidate"
          if [[ -n "$(find "$root" -type l -print -quit)" \
                || -n "$(find "$root" -mindepth 1 ! -type f ! -type d -print -quit)" \
                || -n "$(find "$root" -type f -links +1 -print -quit)" ]]; then
            exit 1
          fi
          artifacts="$(gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_FROZEN_RUN_ID/artifacts" \
            -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
          jq -e --arg name "$EXPECTED_FROZEN_NAME" --arg digest "$EXPECTED_FROZEN_DIGEST" '
            [.artifacts[] | select(
              .name == $name and .expired == false and .digest == $digest
            )] | length == 1' <<< "$artifacts" >/dev/null
          freeze="$root/freeze"
          test -f "$freeze/stable-1.0-maintenance-candidate-freeze.json"
          test -f "$freeze/checksums.txt"
          test -d "$freeze/assets"
          signer="crypta-network/cryptad/.github/workflows/stable-1.0-maintenance-release.yml"
          while IFS= read -r -d '' subject; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --signer-digest "$EXPECTED_SOURCE_COMMIT" \
              --source-digest "$EXPECTED_SOURCE_COMMIT" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners >/dev/null
          done < <(
            printf '%s\0' \
              "$freeze/stable-1.0-maintenance-candidate-freeze.json" \
              "$freeze/checksums.txt"
            find "$freeze/assets" -mindepth 1 -maxdepth 1 -type f -print0 | LC_ALL=C sort -z
          )
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from cryptad_certification.schema_validation import validate_schema

          root = Path("build/stable-supply-chain-frozen-candidate/freeze").resolve(strict=True)
          freeze_path = root / "stable-1.0-maintenance-candidate-freeze.json"
          value = json.loads(freeze_path.read_text(encoding="utf-8"))
          errors = validate_schema(value, "stable-1.0-maintenance-candidate-freeze-v1.schema.json")
          if errors:
              raise SystemExit("maintenance freeze schema failed: " + "; ".join(errors))
          expected = {
              "releaseId": os.environ["EXPECTED_RELEASE_ID"],
              "buildVersion": os.environ["EXPECTED_BUILD_VERSION"],
              "releaseClass": os.environ["EXPECTED_RELEASE_CLASS"],
          }
          if any(value.get(key) != wanted for key, wanted in expected.items()):
              raise SystemExit("maintenance freeze release identity differs")
          commit = os.environ["EXPECTED_SOURCE_COMMIT"]
          producer = value["producer"]
          if (
              value["source"].get("commit") != commit
              or value["source"].get("ref") != "commit:" + commit
              or producer.get("workflowPath") != ".github/workflows/stable-1.0-maintenance-release.yml"
              or producer.get("workflowCommit") != commit
              or producer.get("runId") != os.environ["EXPECTED_FROZEN_RUN_ID"]
              or producer.get("runAttempt") != int(os.environ["EXPECTED_FROZEN_RUN_ATTEMPT"])
          ):
              raise SystemExit("maintenance freeze source or producer identity differs")
          semantic = lambda item: "sha256:" + hashlib.sha256(
              json.dumps(item, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          assets = value["assets"]
          if value.get("assetSetDigest") != semantic(assets):
              raise SystemExit("maintenance freeze asset-set digest is invalid")
          asset_root = root / "assets"
          actual = {path.name: path for path in asset_root.iterdir()}
          expected_names = {row["fileName"] for row in assets}
          if set(actual) != expected_names or len(expected_names) != len(assets):
              raise SystemExit("maintenance freeze asset membership differs")
          for row in assets:
              path = actual[row["fileName"]]
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("maintenance freeze asset is unsafe")
              digest = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != row["digest"] or path.stat().st_size != row["sizeBytes"]:
                  raise SystemExit("maintenance freeze asset bytes differ from the freeze record")
          phase = Path("build/stable-supply-chain-phase/manifest.json")
          phase_value = json.loads(phase.read_text(encoding="utf-8"))
          inventory_path = Path(phase_value["inputs"]["releaseSubjectInventory"])
          inventory = json.loads(inventory_path.read_text(encoding="utf-8"))
          subjects = {Path(row["fileName"]).name: row for row in inventory["subjects"]}
          if len(subjects) != len(inventory["subjects"]):
              raise SystemExit("release subject inventory has duplicate filenames")
          for row in assets:
              subject = subjects.get(row["fileName"])
              if subject is None:
                  raise SystemExit("maintenance freeze asset is absent from the subject inventory")
              if (
                  subject["digest"] != row["digest"]
                  or subject["size"] != row["sizeBytes"]
                  or subject["signatureReceiptDigest"] != row["signingReceiptDigest"]
                  or subject["notarizationReceiptDigest"] != row["notarizationReceiptDigest"]
              ):
                  raise SystemExit("maintenance freeze asset and subject inventory differ")
          checksums = root / "checksums.txt"
          if "sha256:" + hashlib.sha256(checksums.read_bytes()).hexdigest() != value["checksumsDigest"]:
              raise SystemExit("maintenance freeze checksum bytes differ")
          PY

      - name: Stage and digest producer subjects
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          BUILD_VERSION: ${{ inputs.build_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
          root="build/stable-supply-chain/producer-handoff"
          local_root="$root/local-subjects"
          mkdir -p "$local_root/core" "$local_root/distributions" "$local_root/apps"
          test -f build/libs/cryptad.jar
          cp build/libs/cryptad.jar "$local_root/core/cryptad.jar"
          cp -a build/distributions/. "$local_root/distributions/"
          for app in queue-manager publisher site-publisher profile-publisher social-inbox feed-reader trust-graph; do
            bundle="apps/$app/build/cryptad-app-bundle/$app-$BUILD_VERSION.zip"
            test -f "$bundle"
            cp "$bundle" "$local_root/apps/$app.zip"
          done
          ROOT="$root" python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          workspace = Path.cwd().resolve()
          phase = workspace / "build/stable-supply-chain-phase"
          manifest = json.loads((phase / "manifest.json").read_text(encoding="utf-8"))
          inventory = json.loads(
              (workspace / manifest["inputs"]["releaseSubjectInventory"]).read_text(encoding="utf-8")
          )
          policy = json.loads(
              Path("tools/release-certification/stable-1.0-supply-chain-policy.json").read_text(
                  encoding="utf-8"
              )
          )
          policy_rules = {row["subjectKey"]: row for row in policy["releaseSubjects"]}
          freeze_root = (
              workspace / "build/stable-supply-chain-frozen-candidate/freeze"
          ).resolve(strict=True)
          freeze = json.loads(
              (freeze_root / "stable-1.0-maintenance-candidate-freeze.json").read_text(
                  encoding="utf-8"
              )
          )
          freeze_rows = {row["fileName"]: row for row in freeze["assets"]}
          frozen_assets = (freeze_root / "assets").resolve(strict=True)
          local_root = (Path(os.environ["ROOT"]) / "local-subjects").resolve(strict=True)
          destination = Path(os.environ["ROOT"]) / "subjects"
          destination.mkdir(parents=True)
          local_paths = {
              "core-jar": local_root / "core/cryptad.jar",
              "portable-tar": local_root / f"distributions/cryptad-v{os.environ['BUILD_VERSION']}.tar.gz",
              "portable-zip": local_root / f"distributions/cryptad-v{os.environ['BUILD_VERSION']}.zip",
              "runtime-image-tar": local_root / f"distributions/cryptad-jlink-v{os.environ['BUILD_VERSION']}.tar.gz",
              "runtime-image-zip": local_root / f"distributions/cryptad-jlink-v{os.environ['BUILD_VERSION']}.zip",
          }
          for row in inventory["subjects"]:
              key = row["subjectKey"]
              if (
                  policy_rules[key]["evidencePhase"] != "independent-builder"
                  or key in {"amd64.deb", "amd64.dmg", "amd64.exe", "amd64.rpm"}
              ):
                  continue
              if key.startswith("app-"):
                  local_paths[key] = local_root / "apps" / (key.removeprefix("app-") + ".zip")
              local = local_paths.get(key)
              if local is None:
                  raise SystemExit(f"producer routing is not closed for subject {key}")
              local = local.resolve(strict=True)
              local.relative_to(local_root)
              frozen_row = freeze_rows.get(Path(row["fileName"]).name)
              source = local
              if frozen_row is not None:
                  source = (frozen_assets / frozen_row["fileName"]).resolve(strict=True)
                  source.relative_to(frozen_assets)
                  if (
                      frozen_row["digest"] != row["digest"]
                      or frozen_row["sizeBytes"] != row["size"]
                      or frozen_row["signingReceiptDigest"] != row["signatureReceiptDigest"]
                      or frozen_row["notarizationReceiptDigest"] != row["notarizationReceiptDigest"]
                  ):
                      raise SystemExit(f"frozen candidate and inventory differ for {key}")
                  local_digest = "sha256:" + hashlib.sha256(local.read_bytes()).hexdigest()
                  if local_digest != frozen_row["digest"]:
                      raise SystemExit(f"producer staged build does not reproduce frozen {key}")
              if source.is_symlink() or not source.is_file():
                  raise SystemExit(f"producer subject is missing or unsafe for {key}")
              source_digest = "sha256:" + hashlib.sha256(source.read_bytes()).hexdigest()
              if source_digest != row["digest"] or source.stat().st_size != row["size"]:
                  raise SystemExit(f"producer subject and authenticated inventory differ for {key}")
              target = destination / row["fileName"]
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          PY
          rm -rf "$local_root"
          cp build/stable-supply-chain/resolved-dependency-snapshot.json "$root/"
          cp build/stable-supply-chain/build-material-inputs.json "$root/"
          ROOT="$root" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          raw = json.loads((root / "build-material-inputs.json").read_text(encoding="utf-8"))
          manifest = json.loads(
              Path("build/stable-supply-chain-phase/manifest.json").read_text(encoding="utf-8")
          )
          reviewed = json.loads(Path(manifest["inputs"]["buildMaterials"]).read_text(encoding="utf-8"))
          raw_jdk = raw.get("jdk", {})
          raw_jdk_modules = raw_jdk.get("modules")
          reviewed_jdk = reviewed.get("jdk", {})
          reviewed_installations = [
              row for row in reviewed_jdk.get("installations", [])
              if row.get("runnerOs") == "linux" and row.get("architecture") == "amd64"
          ]
          if (
              not isinstance(raw_jdk_modules, list)
              or not raw_jdk_modules
              or raw_jdk_modules != sorted(set(raw_jdk_modules))
              or raw_jdk_modules != reviewed_jdk.get("modules")
              or len(reviewed_installations) != 1
              or raw_jdk.get("languageVersion") != reviewed_jdk.get("version")
              or raw_jdk.get("javaRuntimeVersion") != reviewed_jdk.get("build")
              or raw_jdk.get("installationManifestDigest")
              != reviewed_installations[0].get("installationManifestDigest")
              or raw_jdk.get("releaseFileDigest")
              != reviewed_installations[0].get("releaseFileDigest")
          ):
              raise SystemExit("producer jlink modules differ from authenticated materials")
          required = {
              "gradle-wrapper-distribution",
              "seedrefs-source-archive",
              "tanuki-wrapper-delta-pack",
              "windows-wrapper-amd64",
              "windows-wrapper-arm64",
          }
          rows = []
          for value in raw.get("directInputs", []):
              name = value.get("name")
              if name not in required:
                  raise SystemExit("builder direct-input set is not policy-closed")
              wrapper = name == "gradle-wrapper-distribution"
              digest = value.get("expectedSha256") if wrapper else value.get("actualSha256")
              if (
                  value.get("promotionBlocking") is not False
                  or not isinstance(digest, str)
                  or len(digest) != 64
                  or (wrapper and value.get("verificationStatus") != "verified-by-gradle-wrapper")
                  or (not wrapper and value.get("verificationStatus") != "verified")
                  or (not wrapper and value.get("expectedSha256") != digest)
              ):
                  raise SystemExit("builder used an unverified direct input")
              rows.append({
                  "name": name,
                  "digest": "sha256:" + digest,
                  "origin": value.get("url"),
                  "immutabilityClass": value.get("immutabilityClass"),
                  "verificationStatus": "verified",
                  "verificationMechanism": (
                      "gradle-wrapper-checksum" if wrapper else "sha256-before-use"
                  ),
              })
          if {row["name"] for row in rows} != required:
              raise SystemExit("builder omitted a policy-required direct input")
          observed = [
              {key: row[key] for key in ("name", "digest", "origin", "immutabilityClass")}
              for row in sorted(rows, key=lambda row: row["name"])
          ]
          if observed != reviewed.get("directInputs"):
              raise SystemExit("builder direct inputs differ from authenticated immutable origins")
          (root / "direct-inputs.json").write_text(
              json.dumps(sorted(rows, key=lambda row: row["name"]), sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$root/subjects"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$root/subject-files.sha256"
          file_set="sha256:$(sha256sum "$root/subject-files.sha256" | cut -d' ' -f1)"
          runner_image="$ImageOS@$ImageVersion"
          if [[ -z "$ImageOS" || -z "$ImageVersion" || "$runner_image" == *latest* ]]; then
            echo "::error::Hosted portable producer image identity is absent or mutable."
            exit 1
          fi
          workflow_identity="github.com/$GITHUB_REPOSITORY/.github/workflows/stable-1.0-supply-chain.yml@$SOURCE_COMMIT"
          jq -nS \
            --slurpfile directInputs "$root/direct-inputs.json" \
            --slurpfile observation build/stable-supply-chain-builder-observation.json \
            --arg releaseId "$RELEASE_ID" \
            --argjson buildVersion "$BUILD_VERSION" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceRef "$GITHUB_REF" \
            --arg workflow "$workflow_identity" \
            --arg workflowSha "$GITHUB_WORKFLOW_SHA" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runnerImage "$runner_image" \
            --arg runnerImageDigest "sha256:$(printf '%s' "$runner_image" | sha256sum | cut -d' ' -f1)" \
            --arg fileSetDigest "$file_set" '{
              schemaVersion: 1,
              kind: "cryptad-stable-supply-chain-builder-handoff",
              builderRole: "candidate-producer",
              releaseId: $releaseId,
              buildVersion: $buildVersion,
              sourceCommit: $sourceCommit,
              sourceRef: $sourceRef,
              workflow: $workflow,
              workflowSha: $workflowSha,
              runId: $runId,
              runAttempt: $runAttempt,
              executionId: "portable-apps",
              jobName: "candidate-producer-portable-apps",
              runnerOs: "linux",
              runnerArchitecture: "amd64",
              runnerImageIdentity: $runnerImage,
              runnerImageDigest: $runnerImageDigest,
              observedJava: $observation[0].java,
              canonicalEnvironment: $observation[0].canonicalEnvironment,
              environmentVariables: $observation[0].environmentVariables,
              fileSetDigest: $fileSetDigest,
              directInputs: $directInputs[0]
            }' > "$root/handoff.json"

      - name: Attest exact producer handoff
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/stable-supply-chain/producer-handoff/**/*

      - name: Upload immutable producer handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1.0-supply-chain-${{ inputs.release_id }}-producer-portable-apps-attempt-${{ github.run_attempt }}
          path: build/stable-supply-chain/producer-handoff
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 30

  verifier-build:
    name: independent-verifier-portable-apps
    if: inputs.operation == 'verifier-build' && github.ref_protected
    needs: validate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: stable-1.0-supply-chain-verifier
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out exact source without candidate inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Set up Python without candidate inputs
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25.0.4.1+1'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Gradle properties
        uses: ./.github/actions/setup-gradle-properties

      - name: Clean verifier workspace before receiving reviewed phase inputs
        run: ./gradlew clean

      # This bundle contains only the authenticated recipe and reviewed resolution expectations.
      # The closed allowlist below rejects producer subject roots and candidate product bytes.
      - name: Download exact reviewed verifier recipe without candidate subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.phase_bundle_run_id }}
          name: ${{ inputs.phase_bundle_artifact_name }}
          path: build/stable-supply-chain-phase

      - name: Authenticate reviewed verifier recipe and resolution expectations
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SIGNER: ${{ needs.validate-dispatch.outputs.phase_signer_workflow }}
          EXPECTED_MANIFEST_DIGEST: ${{ inputs.phase_manifest_digest }}
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_BUILD_VERSION: ${{ inputs.build_version }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test -f build/stable-supply-chain-phase/manifest.json
          actual="sha256:$(sha256sum build/stable-supply-chain-phase/manifest.json | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_MANIFEST_DIGEST"
          jq -e --arg id "$EXPECTED_RELEASE_ID" --arg version "$EXPECTED_BUILD_VERSION" \
            --arg commit "$EXPECTED_SOURCE_COMMIT" '
              .release.id == $id and .release.version == $version
              and .release.profile == "stable-review"
              and .policies.candidateSourceCommit == $commit
              and .policies.candidateSourceRef == ("commit:" + $commit)
              and .requirements.stableSupplyChain == true
              and .commands["stable-supply-chain"].mode == "prepare-rebuild-comparison"' \
            build/stable-supply-chain-phase/manifest.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          workspace = Path.cwd().resolve()
          root = (workspace / "build/stable-supply-chain-phase").resolve(strict=True)
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          reviewed_export = root / "resolved-dependency-export.json"
          reviewed_snapshot = root / "resolved-dependency-snapshot.json"
          if any(path.is_symlink() or not path.is_file() for path in (reviewed_export, reviewed_snapshot)):
              raise SystemExit("reviewed resolution export and snapshot are required regular files")
          if (workspace / manifest["inputs"].get("resolvedDependencySnapshot", "")).resolve(strict=True) != reviewed_snapshot.resolve():
              raise SystemExit("verifier manifest does not select the exact reviewed snapshot")
          allowed = {manifest_path.resolve(), reviewed_export.resolve(), reviewed_snapshot.resolve()}
          external = {
              (workspace / "tools/release-certification/stable-1.0-supply-chain-policy.json").resolve(strict=True),
              (workspace / "tools/release-certification/stable-1.0-supply-chain-license-overrides.json").resolve(strict=True),
              workspace,
          }
          for key, value in manifest["inputs"].items():
              configured = Path(value)
              if configured.is_absolute() or ".." in configured.parts:
                  raise SystemExit("phase input path is unsafe")
              target = (workspace / configured).resolve(strict=True)
              if target == workspace and key != "licenseTextRoot":
                  raise SystemExit("only licenseTextRoot may select the repository root")
              if target in external:
                  continue
              target.relative_to(root)
              cursor = target
              while cursor != root:
                  allowed.add(cursor)
                  cursor = cursor.parent
              if target.is_dir():
                  allowed.update(child.resolve() for child in target.rglob("*"))
          for input_key, rows_key in (("licenseInventory", "components"), ("licenseOverrides", "overrides")):
              configured = manifest["inputs"].get(input_key)
              if configured is None:
                  continue
              registry = json.loads((workspace / configured).read_text(encoding="utf-8"))
              for row in registry.get(rows_key, []):
                  notice = row.get("licenseTextPath")
                  if notice is None:
                      continue
                  if notice != "LICENSE" and not notice.startswith("docs/licenses/"):
                      raise SystemExit("license evidence must be LICENSE or a file below docs/licenses")
                  evidence = (workspace / notice).resolve(strict=True)
                  if evidence.is_symlink() or not evidence.is_file():
                      raise SystemExit("license evidence is missing or unsafe")
          if {child.resolve() for child in root.rglob("*")} != allowed:
              raise SystemExit("phase bundle contains an unreferenced entry")
          PY
          if find build/stable-supply-chain-phase \( -type l -o -type f -links +1 \) -print -quit | grep -q .; then
            exit 1
          fi
          while IFS= read -r -d '' subject; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$EXPECTED_SIGNER" \
              --signer-digest "$EXPECTED_SOURCE_COMMIT" \
              --source-digest "$EXPECTED_SOURCE_COMMIT" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners >/dev/null
          done < <(find build/stable-supply-chain-phase -type f -print0 | LC_ALL=C sort -z)

      # prepare-rebuild-comparison intentionally runs only after both builders exist. Before this
      # build, use the same canonical schemas and semantic validators on the exact recipe subset;
      # do not fabricate a verifier receipt merely to make the later phase executable early.
      - name: Validate exact closed verifier recipe before build without candidate subjects
        env:
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_BUILD_VERSION: ${{ inputs.build_version }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          PYTHONPATH: tools/release-certification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from cryptad_certification.schema_validation import validate_schema
          from cryptad_certification.engines.stable_1_0_supply_chain_core import (
              BUILD_MATERIALS_SCHEMA,
              COMPONENT_INVENTORY_SCHEMA,
              POLICY_SCHEMA,
              RESOLUTION_SNAPSHOT_SCHEMA,
              SUBJECT_INVENTORY_SCHEMA,
              build_material_errors,
              component_inventory_errors,
              jdk_component_coverage_errors,
              resolution_snapshot_errors,
              semantic_digest,
              subject_inventory_errors,
          )

          workspace = Path.cwd().resolve()
          root = (workspace / "build/stable-supply-chain-phase").resolve(strict=True)
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          inputs = manifest.get("inputs")
          expected_keys = {
              "supplyChainPolicy",
              "resolvedDependencySnapshot",
              "componentInventory",
              "releaseSubjectInventory",
              "buildMaterials",
          }
          prohibited_keys = {
              "primarySubjectRoot",
              "verifierSubjectRoot",
              "primaryPayloadManifests",
              "verifierPayloadManifests",
              "rebuildComparisonPlan",
              "reproducibilityResult",
              "supplyChainPromotionSummary",
              "supplyChainPublicationPlan",
              "supplyChainPublicationReceipt",
              "supplyChainPublicObservation",
          }
          if not isinstance(inputs, dict) or set(inputs) != expected_keys:
              raise SystemExit("verifier recipe inputs are not the exact closed pre-build set")
          if prohibited_keys.intersection(inputs):
              raise SystemExit("verifier recipe contains a candidate subject or later-phase input")

          fixed_names = {
              "resolvedDependencySnapshot": "resolved-dependency-snapshot.json",
              "componentInventory": "stable-1.0-component-inventory.json",
              "releaseSubjectInventory": "stable-1.0-release-subject-inventory.json",
              "buildMaterials": "stable-1.0-build-materials.json",
          }
          paths = {}
          for key, expected_name in fixed_names.items():
              configured = Path(inputs[key])
              target = (workspace / configured).resolve(strict=True)
              target.relative_to(root)
              if target.name != expected_name or target.is_symlink() or not target.is_file():
                  raise SystemExit(f"{key} is not the exact confined recipe file")
              paths[key] = target
          policy_path = (
              workspace
              / "tools/release-certification/stable-1.0-supply-chain-policy.json"
          ).resolve(strict=True)
          if (workspace / inputs["supplyChainPolicy"]).resolve(strict=True) != policy_path:
              raise SystemExit("verifier recipe does not select the checked-in supply-chain policy")

          def load(key: str, schema: str) -> dict:
              value = json.loads(paths[key].read_text(encoding="utf-8"))
              errors = validate_schema(value, schema)
              if errors:
                  raise SystemExit(f"{key} violates {schema}: {errors[0]}")
              return value

          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          policy_errors = validate_schema(policy, POLICY_SCHEMA)
          if policy_errors or semantic_digest(policy, "policyDigest") != policy.get("policyDigest"):
              raise SystemExit("checked-in supply-chain policy is invalid")
          release = {
              "releaseId": os.environ["EXPECTED_RELEASE_ID"],
              "buildVersion": int(os.environ["EXPECTED_BUILD_VERSION"]),
              "tag": "v" + os.environ["EXPECTED_BUILD_VERSION"],
              "sourceCommit": os.environ["EXPECTED_SOURCE_COMMIT"],
              "sourceRef": "commit:" + os.environ["EXPECTED_SOURCE_COMMIT"],
              "policyDigest": policy["policyDigest"],
          }
          snapshot = load("resolvedDependencySnapshot", RESOLUTION_SNAPSHOT_SCHEMA)
          components = load("componentInventory", COMPONENT_INVENTORY_SCHEMA)
          subjects = load("releaseSubjectInventory", SUBJECT_INVENTORY_SCHEMA)
          materials = load("buildMaterials", BUILD_MATERIALS_SCHEMA)
          errors = resolution_snapshot_errors(snapshot, release, policy)
          errors += component_inventory_errors(components, policy, release)
          errors += jdk_component_coverage_errors(
              components, subjects, materials, policy
          )
          errors += subject_inventory_errors(subjects, components, policy, release)
          errors += build_material_errors(
              materials, release, snapshot["snapshotDigest"], policy
          )
          if errors:
              raise SystemExit("verifier recipe semantic validation failed: " + errors[0])

          forbidden_suffixes = (".jar", ".zip", ".tar", ".tar.gz", ".deb", ".rpm", ".dmg", ".exe")
          for path in root.rglob("*"):
              if path.is_file() and path.name != "manifest.json" and path.name.endswith(forbidden_suffixes):
                  raise SystemExit("verifier recipe contains candidate product bytes")
          PY

      - name: Install canonical build environment and observe exact Java runtime
        env:
          PYTHONPATH: tools/release-certification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          from cryptad_certification.engines.stable_1_0_supply_chain_core import (
              CANONICAL_BUILD_ENVIRONMENT_VARIABLES,
              builder_observation_errors,
              canonical_json_bytes,
              observed_java_identity,
          )
          from cryptad_certification.engines.stable_1_0_supply_chain_jdk import (
              jdk_installation_identity,
          )

          workspace = Path.cwd().resolve()
          phase = (workspace / "build/stable-supply-chain-phase").resolve(strict=True)
          manifest = json.loads((phase / "manifest.json").read_text(encoding="utf-8"))
          materials_path = (workspace / manifest["inputs"]["buildMaterials"]).resolve(strict=True)
          materials_path.relative_to(phase)
          if materials_path.is_symlink() or not materials_path.is_file():
              raise SystemExit("authenticated build-material input is unsafe")
          materials = json.loads(materials_path.read_text(encoding="utf-8"))
          allowed = materials["environment"]["allowedVariableNames"]
          if allowed != list(CANONICAL_BUILD_ENVIRONMENT_VARIABLES):
              raise SystemExit("build environment variable allowlist is not canonical")
          environment_variables = {
              "LANG": materials["environment"]["locale"],
              "LC_ALL": materials["environment"]["locale"],
              "SOURCE_DATE_EPOCH": str(materials["canonicalBuildEpoch"]),
              "TZ": materials["environment"]["timezone"],
          }
          java_environment = dict(os.environ)
          java_environment.update(environment_variables)
          result = subprocess.run(
              ["java", "-XshowSettings:properties", "-version"],
              check=True,
              capture_output=True,
              env=java_environment,
              text=True,
          )
          properties = {}
          for line in (result.stdout + "\n" + result.stderr).splitlines():
              match = re.match(r"^\s*([^=]+?)\s*=\s*(.*?)\s*$", line)
              if match:
                  properties[match.group(1)] = match.group(2)
          java = observed_java_identity(
              properties, jdk_installation_identity(Path(properties["java.home"]))
          )
          errors = builder_observation_errors(
              java, environment_variables, materials, os.environ["RUNNER_OS"].casefold()
          )
          if errors:
              raise SystemExit(errors[0])
          observation = {
              "java": java,
              "environmentVariables": environment_variables,
              "canonicalEnvironment": {
                  "locale": environment_variables["LC_ALL"],
                  "timezone": environment_variables["TZ"],
                  "encoding": java["javaEncoding"],
                  "sourceDateEpoch": int(environment_variables["SOURCE_DATE_EPOCH"]),
              },
          }
          destination = workspace / "build/stable-supply-chain-builder-observation.json"
          destination.write_bytes(canonical_json_bytes(observation) + b"\n")
          with Path(os.environ["GITHUB_ENV"]).open(
              "a", encoding="utf-8", newline="\n"
          ) as handle:
              for name in CANONICAL_BUILD_ENVIRONMENT_VARIABLES:
                  handle.write(f"{name}={environment_variables[name]}\n")
          PY

      # Only the recipe has been downloaded. No producer subject byte is available to this job.
      - name: Build and digest verifier subjects against reviewed resolution evidence
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          BUILD_VERSION: ${{ inputs.build_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CRYPTAD_APP_SIGNING_KEY_ID: ${{ secrets.CRYPTAD_APP_SIGNING_KEY_ID }}
          CRYPTAD_APP_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.CRYPTAD_APP_SIGNING_PRIVATE_KEY_BASE64 }}
          CRYPTAD_APP_SIGNING_PUBLIC_KEY_BASE64: ${{ secrets.CRYPTAD_APP_SIGNING_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          materials="$(jq -r '.inputs.buildMaterials' build/stable-supply-chain-phase/manifest.json)"
          direct_digest() {
            jq -er --arg path "external/$1" \
              '.packagingInputs[] | select(.path == $path) | .digest | sub("^sha256:"; "")' \
              "$materials"
          }
          direct_origin() {
            jq -er --arg name "$1" \
              '.directInputs[] | select(.name == $name) | .origin' "$materials"
          }
          seedrefs_sha="$(direct_digest seedrefs-source-archive)"
          wrapper_delta_sha="$(direct_digest tanuki-wrapper-delta-pack)"
          wrapper_amd64_sha="$(direct_digest windows-wrapper-amd64)"
          wrapper_arm64_sha="$(direct_digest windows-wrapper-arm64)"
          seedrefs_url="$(direct_origin seedrefs-source-archive)"
          wrapper_amd64_url="$(direct_origin windows-wrapper-amd64)"
          wrapper_arm64_url="$(direct_origin windows-wrapper-arm64)"
          ./gradlew exportStableSupplyChainResolution verifyStableSupplyChainResolution \
            dist packageFirstPartyApps --rerun-tasks \
            -PstableSupplyChainExpectedResolutionExport=build/stable-supply-chain-phase/resolved-dependency-export.json \
            -PstableSupplyChainExpectedResolutionSnapshot=build/stable-supply-chain-phase/resolved-dependency-snapshot.json \
            -PseedrefsSha256="$seedrefs_sha" \
            -PseedrefsUrl="$seedrefs_url" \
            -PwrapperDeltaPackSha256="$wrapper_delta_sha" \
            -PwrapperWinAmd64Sha256="$wrapper_amd64_sha" \
            -PwrapperWinArm64Sha256="$wrapper_arm64_sha" \
            -PwrapperWinAmd64Url="$wrapper_amd64_url" \
            -PwrapperWinArm64Url="$wrapper_arm64_url"
          ./gradlew exportStableSupplyChainResolution verifyStableSupplyChainResolution \
            -PstableSupplyChainExpectedResolutionExport=build/stable-supply-chain-phase/resolved-dependency-export.json \
            -PstableSupplyChainExpectedResolutionSnapshot=build/stable-supply-chain-phase/resolved-dependency-snapshot.json \
            -PseedrefsSha256="$seedrefs_sha" \
            -PseedrefsUrl="$seedrefs_url" \
            -PwrapperDeltaPackSha256="$wrapper_delta_sha" \
            -PwrapperWinAmd64Sha256="$wrapper_amd64_sha" \
            -PwrapperWinArm64Sha256="$wrapper_arm64_sha" \
            -PwrapperWinAmd64Url="$wrapper_amd64_url" \
            -PwrapperWinArm64Url="$wrapper_arm64_url"
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
          root="build/stable-supply-chain/verifier-handoff"
          mkdir -p "$root/subjects/core" "$root/subjects/distributions" "$root/subjects/apps"
          test -f build/libs/cryptad.jar
          cp build/libs/cryptad.jar "$root/subjects/core/cryptad.jar"
          cp -a build/distributions/. "$root/subjects/distributions/"
          for app in queue-manager publisher site-publisher profile-publisher social-inbox feed-reader trust-graph; do
            bundle="apps/$app/build/cryptad-app-bundle/$app-$BUILD_VERSION.zip"
            test -f "$bundle"
            cp "$bundle" "$root/subjects/apps/$app.zip"
          done
          cp build/stable-supply-chain/resolved-dependency-snapshot.json "$root/"
          cp build/stable-supply-chain/build-material-inputs.json "$root/"
          ROOT="$root" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          raw = json.loads((root / "build-material-inputs.json").read_text(encoding="utf-8"))
          manifest = json.loads(
              Path("build/stable-supply-chain-phase/manifest.json").read_text(encoding="utf-8")
          )
          reviewed = json.loads(Path(manifest["inputs"]["buildMaterials"]).read_text(encoding="utf-8"))
          raw_jdk = raw.get("jdk", {})
          raw_jdk_modules = raw_jdk.get("modules")
          reviewed_jdk = reviewed.get("jdk", {})
          reviewed_installations = [
              row for row in reviewed_jdk.get("installations", [])
              if row.get("runnerOs") == "linux" and row.get("architecture") == "amd64"
          ]
          if (
              not isinstance(raw_jdk_modules, list)
              or not raw_jdk_modules
              or raw_jdk_modules != sorted(set(raw_jdk_modules))
              or raw_jdk_modules != reviewed_jdk.get("modules")
              or len(reviewed_installations) != 1
              or raw_jdk.get("languageVersion") != reviewed_jdk.get("version")
              or raw_jdk.get("javaRuntimeVersion") != reviewed_jdk.get("build")
              or raw_jdk.get("installationManifestDigest")
              != reviewed_installations[0].get("installationManifestDigest")
              or raw_jdk.get("releaseFileDigest")
              != reviewed_installations[0].get("releaseFileDigest")
          ):
              raise SystemExit("verifier jlink modules differ from authenticated materials")
          required = {
              "gradle-wrapper-distribution",
              "seedrefs-source-archive",
              "tanuki-wrapper-delta-pack",
              "windows-wrapper-amd64",
              "windows-wrapper-arm64",
          }
          rows = []
          for value in raw.get("directInputs", []):
              name = value.get("name")
              if name not in required:
                  raise SystemExit("builder direct-input set is not policy-closed")
              wrapper = name == "gradle-wrapper-distribution"
              digest = value.get("expectedSha256") if wrapper else value.get("actualSha256")
              if (
                  value.get("promotionBlocking") is not False
                  or not isinstance(digest, str)
                  or len(digest) != 64
                  or (wrapper and value.get("verificationStatus") != "verified-by-gradle-wrapper")
                  or (not wrapper and value.get("verificationStatus") != "verified")
                  or (not wrapper and value.get("expectedSha256") != digest)
              ):
                  raise SystemExit("builder used an unverified direct input")
              rows.append({
                  "name": name,
                  "digest": "sha256:" + digest,
                  "origin": value.get("url"),
                  "immutabilityClass": value.get("immutabilityClass"),
                  "verificationStatus": "verified",
                  "verificationMechanism": (
                      "gradle-wrapper-checksum" if wrapper else "sha256-before-use"
                  ),
              })
          if {row["name"] for row in rows} != required:
              raise SystemExit("builder omitted a policy-required direct input")
          observed = [
              {key: row[key] for key in ("name", "digest", "origin", "immutabilityClass")}
              for row in sorted(rows, key=lambda row: row["name"])
          ]
          if observed != reviewed.get("directInputs"):
              raise SystemExit("builder direct inputs differ from authenticated immutable origins")
          (root / "direct-inputs.json").write_text(
              json.dumps(sorted(rows, key=lambda row: row["name"]), sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$root/subjects"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$root/subject-files.sha256"
          file_set="sha256:$(sha256sum "$root/subject-files.sha256" | cut -d' ' -f1)"
          runner_image="$ImageOS@$ImageVersion"
          if [[ -z "$ImageOS" || -z "$ImageVersion" || "$runner_image" == *latest* ]]; then
            echo "::error::Hosted portable verifier image identity is absent or mutable."
            exit 1
          fi
          workflow_identity="github.com/$GITHUB_REPOSITORY/.github/workflows/stable-1.0-supply-chain.yml@$SOURCE_COMMIT"
          jq -nS \
            --slurpfile directInputs "$root/direct-inputs.json" \
            --slurpfile observation build/stable-supply-chain-builder-observation.json \
            --arg releaseId "$RELEASE_ID" \
            --argjson buildVersion "$BUILD_VERSION" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceRef "$GITHUB_REF" \
            --arg workflow "$workflow_identity" \
            --arg workflowSha "$GITHUB_WORKFLOW_SHA" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runnerImage "$runner_image" \
            --arg runnerImageDigest "sha256:$(printf '%s' "$runner_image" | sha256sum | cut -d' ' -f1)" \
            --arg fileSetDigest "$file_set" '{
              schemaVersion: 1,
              kind: "cryptad-stable-supply-chain-builder-handoff",
              builderRole: "independent-verifier",
              releaseId: $releaseId,
              buildVersion: $buildVersion,
              sourceCommit: $sourceCommit,
              sourceRef: $sourceRef,
              workflow: $workflow,
              workflowSha: $workflowSha,
              runId: $runId,
              runAttempt: $runAttempt,
              executionId: "portable-apps",
              jobName: "independent-verifier-portable-apps",
              runnerOs: "linux",
              runnerArchitecture: "amd64",
              runnerImageIdentity: $runnerImage,
              runnerImageDigest: $runnerImageDigest,
              observedJava: $observation[0].java,
              canonicalEnvironment: $observation[0].canonicalEnvironment,
              environmentVariables: $observation[0].environmentVariables,
              fileSetDigest: $fileSetDigest,
              directInputs: $directInputs[0]
            }' > "$root/handoff.json"

      - name: Attest exact verifier handoff
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/stable-supply-chain/verifier-handoff/**/*

      - name: Upload immutable verifier handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1.0-supply-chain-${{ inputs.release_id }}-verifier-portable-apps-attempt-${{ github.run_attempt }}
          path: build/stable-supply-chain/verifier-handoff
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 30

  platform-package-build:
    name: >-
      ${{ inputs.operation == 'producer-build' && 'candidate-producer' ||
      'independent-verifier' }}-${{ matrix.execution_id }}
    if: >-
      (inputs.operation == 'producer-build' || inputs.operation == 'verifier-build') &&
      github.ref_protected
    needs: validate-dispatch
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    environment: >-
      ${{ inputs.operation == 'producer-build' &&
      'stable-1.0-supply-chain-producer' || 'stable-1.0-supply-chain-verifier' }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - execution_id: linux-installers
            runner: ubuntu-24.04
            runner_os: linux
            python_cmd: python3
            subject_keys: amd64.deb,amd64.rpm
            build_task: jpackageInstallerLinuxAll
          - execution_id: macos-installer
            runner: macos-15-intel
            runner_os: macos
            python_cmd: python3
            subject_keys: amd64.dmg
            build_task: jpackageInstallerCryptad
          - execution_id: windows-installer
            runner: windows-2025
            runner_os: windows
            python_cmd: py -3.14
            subject_keys: amd64.exe
            build_task: jpackageInstallerWindowsExeCryptad

    steps:
      - name: Check out exact source without cross-builder subjects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25.0.4.1+1'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Gradle properties
        uses: ./.github/actions/setup-gradle-properties

      - name: Download exact platform recipe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.phase_bundle_run_id }}
          name: ${{ inputs.phase_bundle_artifact_name }}
          path: build/stable-supply-chain-phase

      - name: Authenticate closed platform recipe and enforce verifier isolation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SIGNER: ${{ needs.validate-dispatch.outputs.phase_signer_workflow }}
          EXPECTED_MANIFEST_DIGEST: ${{ inputs.phase_manifest_digest }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          BUILDER_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          root="build/stable-supply-chain-phase"
          manifest="$root/manifest.json"
          test -f "$manifest" && test ! -L "$manifest"
          actual_manifest_digest="$(${{ matrix.python_cmd }} - "$manifest" <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          print("sha256:" + hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )"
          test "$actual_manifest_digest" = "$EXPECTED_MANIFEST_DIGEST"
          ${{ matrix.python_cmd }} - <<'PY'
          import json
          from pathlib import Path

          workspace = Path.cwd().resolve()
          root = (workspace / "build/stable-supply-chain-phase").resolve(strict=True)
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          exact = {
              "supplyChainPolicy", "resolvedDependencySnapshot", "componentInventory",
              "releaseSubjectInventory", "buildMaterials",
          }
          if set(manifest.get("inputs", {})) != exact:
              raise SystemExit("platform rebuild recipe inputs are not closed")
          allowed = {
              (root / "manifest.json").resolve(),
              (root / "resolved-dependency-export.json").resolve(strict=True),
          }
          policy = (
              workspace / "tools/release-certification/stable-1.0-supply-chain-policy.json"
          ).resolve(strict=True)
          for key, value in manifest["inputs"].items():
              configured = Path(value)
              if configured.is_absolute() or ".." in configured.parts:
                  raise SystemExit("platform verifier recipe path is unsafe")
              target = (workspace / configured).resolve(strict=True)
              if key == "supplyChainPolicy":
                  if target != policy:
                      raise SystemExit("platform rebuild recipe policy differs")
                  continue
              target.relative_to(root)
              if target.is_symlink() or not target.is_file():
                  raise SystemExit("platform verifier recipe input is not a regular file")
              cursor = target
              while cursor != root:
                  allowed.add(cursor)
                  cursor = cursor.parent
          if {path.resolve() for path in root.rglob("*")} != allowed:
              raise SystemExit("platform rebuild recipe contains an unreferenced entry")
          prohibited = (".jar", ".zip", ".tar", ".tar.gz", ".deb", ".rpm", ".dmg", ".exe")
          if any(path.is_file() and path.name.endswith(prohibited) for path in root.rglob("*")):
              raise SystemExit("platform rebuild recipe contains candidate product bytes")
          PY
          if find "$root" \( -type l -o -type f -links +1 \) -print -quit | grep -q .; then
            echo "::error::Platform recipe contains a symlink or hard-linked file."
            exit 1
          fi
          while IFS= read -r -d '' subject; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$EXPECTED_SIGNER" \
              --signer-digest "$EXPECTED_SOURCE_COMMIT" \
              --source-digest "$EXPECTED_SOURCE_COMMIT" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners >/dev/null
          done < <(find "$root" -type f -print0)

      - name: Install canonical build environment and observe exact Java runtime
        env:
          PYTHONPATH: tools/release-certification
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python_cmd }} - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          from cryptad_certification.engines.stable_1_0_supply_chain_core import (
              CANONICAL_BUILD_ENVIRONMENT_VARIABLES,
              builder_observation_errors,
              canonical_json_bytes,
              observed_java_identity,
          )
          from cryptad_certification.engines.stable_1_0_supply_chain_jdk import (
              jdk_installation_identity,
          )

          workspace = Path.cwd().resolve()
          phase = (workspace / "build/stable-supply-chain-phase").resolve(strict=True)
          manifest = json.loads((phase / "manifest.json").read_text(encoding="utf-8"))
          materials_path = (workspace / manifest["inputs"]["buildMaterials"]).resolve(strict=True)
          materials_path.relative_to(phase)
          if materials_path.is_symlink() or not materials_path.is_file():
              raise SystemExit("authenticated build-material input is unsafe")
          materials = json.loads(materials_path.read_text(encoding="utf-8"))
          allowed = materials["environment"]["allowedVariableNames"]
          if allowed != list(CANONICAL_BUILD_ENVIRONMENT_VARIABLES):
              raise SystemExit("build environment variable allowlist is not canonical")
          environment_variables = {
              "LANG": materials["environment"]["locale"],
              "LC_ALL": materials["environment"]["locale"],
              "SOURCE_DATE_EPOCH": str(materials["canonicalBuildEpoch"]),
              "TZ": materials["environment"]["timezone"],
          }
          java_environment = dict(os.environ)
          java_environment.update(environment_variables)
          result = subprocess.run(
              ["java", "-XshowSettings:properties", "-version"],
              check=True,
              capture_output=True,
              env=java_environment,
              text=True,
          )
          properties = {}
          for line in (result.stdout + "\n" + result.stderr).splitlines():
              match = re.match(r"^\s*([^=]+?)\s*=\s*(.*?)\s*$", line)
              if match:
                  properties[match.group(1)] = match.group(2)
          java = observed_java_identity(
              properties, jdk_installation_identity(Path(properties["java.home"]))
          )
          errors = builder_observation_errors(
              java, environment_variables, materials, os.environ["RUNNER_OS"].casefold()
          )
          if errors:
              raise SystemExit(errors[0])
          observation = {
              "java": java,
              "environmentVariables": environment_variables,
              "canonicalEnvironment": {
                  "locale": environment_variables["LC_ALL"],
                  "timezone": environment_variables["TZ"],
                  "encoding": java["javaEncoding"],
                  "sourceDateEpoch": int(environment_variables["SOURCE_DATE_EPOCH"]),
              },
          }
          destination = workspace / "build/stable-supply-chain-builder-observation.json"
          destination.write_bytes(canonical_json_bytes(observation) + b"\n")
          with Path(os.environ["GITHUB_ENV"]).open(
              "a", encoding="utf-8", newline="\n"
          ) as handle:
              for name in CANONICAL_BUILD_ENVIRONMENT_VARIABLES:
                  handle.write(f"{name}={environment_variables[name]}\n")
          PY

      - name: Install Linux RPM package tooling
        if: matrix.execution_id == 'linux-installers'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes cpio rpm
          command -v dpkg-deb >/dev/null
          command -v cpio >/dev/null
          command -v rpm2cpio >/dev/null
          command -v rpmbuild >/dev/null

      - name: Require a jpackage-supported Windows WiX toolchain
        if: matrix.execution_id == 'windows-installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hasWix3 = $null -ne (Get-Command candle.exe -ErrorAction SilentlyContinue) -and
            $null -ne (Get-Command light.exe -ErrorAction SilentlyContinue)
          $hasWix4 = $null -ne (Get-Command wix.exe -ErrorAction SilentlyContinue)
          if (-not $hasWix3 -and -not $hasWix4) {
            throw 'No jpackage-supported WiX toolchain is available on the hosted runner.'
          }
          if ($null -eq (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            throw 'The Windows package extraction contract requires 7z.exe.'
          }

      - name: Build exact Linux or macOS installer payload independently
        if: matrix.execution_id != 'windows-installer'
        env:
          BUILD_TASK: ${{ matrix.build_task }}
        shell: bash
        run: |
          set -euo pipefail
          materials="$(jq -r '.inputs.buildMaterials' build/stable-supply-chain-phase/manifest.json)"
          direct_digest() {
            jq -er --arg path "external/$1" \
              '.packagingInputs[] | select(.path == $path) | .digest | sub("^sha256:"; "")' \
              "$materials"
          }
          direct_origin() {
            jq -er --arg name "$1" \
              '.directInputs[] | select(.name == $name) | .origin' "$materials"
          }
          started="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'PLATFORM_BUILD_STARTED=%s\n' "$started" >> "$GITHUB_ENV"
          ./gradlew exportStableSupplyChainResolution verifyStableSupplyChainResolution \
            "$BUILD_TASK" --rerun-tasks \
            -PstableSupplyChainExpectedResolutionExport=build/stable-supply-chain-phase/resolved-dependency-export.json \
            -PstableSupplyChainExpectedResolutionSnapshot=build/stable-supply-chain-phase/resolved-dependency-snapshot.json \
            -PseedrefsSha256="$(direct_digest seedrefs-source-archive)" \
            -PseedrefsUrl="$(direct_origin seedrefs-source-archive)" \
            -PwrapperDeltaPackSha256="$(direct_digest tanuki-wrapper-delta-pack)" \
            -PwrapperWinAmd64Sha256="$(direct_digest windows-wrapper-amd64)" \
            -PwrapperWinArm64Sha256="$(direct_digest windows-wrapper-arm64)" \
            -PwrapperWinAmd64Url="$(direct_origin windows-wrapper-amd64)" \
            -PwrapperWinArm64Url="$(direct_origin windows-wrapper-arm64)"

      - name: Build exact Windows installer payload independently
        if: matrix.execution_id == 'windows-installer'
        env:
          BUILD_TASK: ${{ matrix.build_task }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw 'build/stable-supply-chain-phase/manifest.json' |
            ConvertFrom-Json
          $materials = Get-Content -Raw $manifest.inputs.buildMaterials | ConvertFrom-Json
          function Direct-Digest([string]$Name) {
            $row = @($materials.packagingInputs | Where-Object { $_.path -ceq "external/$Name" })
            if ($row.Count -ne 1) { throw "Missing direct input $Name" }
            return $row[0].digest.Substring(7)
          }
          function Direct-Origin([string]$Name) {
            $row = @($materials.directInputs | Where-Object { $_.name -ceq $Name })
            if ($row.Count -ne 1) { throw "Missing immutable direct input origin $Name" }
            return $row[0].origin
          }
          "PLATFORM_BUILD_STARTED=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ./gradlew.bat exportStableSupplyChainResolution verifyStableSupplyChainResolution `
            $env:BUILD_TASK --rerun-tasks `
            -PstableSupplyChainExpectedResolutionExport=build/stable-supply-chain-phase/resolved-dependency-export.json `
            -PstableSupplyChainExpectedResolutionSnapshot=build/stable-supply-chain-phase/resolved-dependency-snapshot.json `
            "-PseedrefsSha256=$(Direct-Digest 'seedrefs-source-archive')" `
            "-PseedrefsUrl=$(Direct-Origin 'seedrefs-source-archive')" `
            "-PwrapperDeltaPackSha256=$(Direct-Digest 'tanuki-wrapper-delta-pack')" `
            "-PwrapperWinAmd64Sha256=$(Direct-Digest 'windows-wrapper-amd64')" `
            "-PwrapperWinArm64Sha256=$(Direct-Digest 'windows-wrapper-arm64')" `
            "-PwrapperWinAmd64Url=$(Direct-Origin 'windows-wrapper-amd64')" `
            "-PwrapperWinArm64Url=$(Direct-Origin 'windows-wrapper-arm64')"
          if ($LASTEXITCODE -ne 0) { throw 'Windows independent package build failed.' }

      # Candidate bytes cross the boundary only after this job has completed its own staged build.
      # They are the one frozen maintenance candidate, never the locally rebuilt container.
      - name: Download exact frozen signed candidate after producer staged build
        if: inputs.operation == 'producer-build'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate-dispatch.outputs.frozen_run_id }}
          name: ${{ inputs.frozen_candidate_artifact_name }}
          path: build/stable-supply-chain-frozen-candidate

      - name: Authenticate exact frozen signed candidate bytes after producer staged build
        if: inputs.operation == 'producer-build'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_BUILD_VERSION: ${{ inputs.build_version }}
          EXPECTED_RELEASE_CLASS: ${{ inputs.release_class }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_FROZEN_DIGEST: ${{ inputs.frozen_candidate_artifact_digest }}
          EXPECTED_FROZEN_NAME: ${{ inputs.frozen_candidate_artifact_name }}
          EXPECTED_FROZEN_RUN_ID: ${{ needs.validate-dispatch.outputs.frozen_run_id }}
          EXPECTED_FROZEN_RUN_ATTEMPT: ${{ needs.validate-dispatch.outputs.frozen_run_attempt }}
          PYTHONPATH: tools/release-certification
        shell: bash
        run: |
          set -euo pipefail
          root="build/stable-supply-chain-frozen-candidate"
          if [[ -n "$(find "$root" -type l -print -quit)" \
                || -n "$(find "$root" -mindepth 1 ! -type f ! -type d -print -quit)" \
                || -n "$(find "$root" -type f -links +1 -print -quit)" ]]; then
            echo "::error::Frozen candidate artifact contains an unsafe entry."
            exit 1
          fi
          artifacts="$(gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_FROZEN_RUN_ID/artifacts" \
            -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
          jq -e --arg name "$EXPECTED_FROZEN_NAME" --arg digest "$EXPECTED_FROZEN_DIGEST" '
            [.artifacts[] | select(
              .name == $name and .expired == false and .digest == $digest
            )] | length == 1' <<< "$artifacts" >/dev/null
          freeze="$root/freeze"
          test -f "$freeze/stable-1.0-maintenance-candidate-freeze.json"
          test -f "$freeze/checksums.txt"
          test -d "$freeze/assets"
          signer="crypta-network/cryptad/.github/workflows/stable-1.0-maintenance-release.yml"
          while IFS= read -r -d '' subject; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --signer-digest "$EXPECTED_SOURCE_COMMIT" \
              --source-digest "$EXPECTED_SOURCE_COMMIT" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners >/dev/null
          done < <(
            printf '%s\0' \
              "$freeze/stable-1.0-maintenance-candidate-freeze.json" \
              "$freeze/checksums.txt"
            find "$freeze/assets" -mindepth 1 -maxdepth 1 -type f -print0 | LC_ALL=C sort -z
          )
          ${{ matrix.python_cmd }} - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from cryptad_certification.schema_validation import validate_schema

          root = Path("build/stable-supply-chain-frozen-candidate/freeze").resolve(strict=True)
          value = json.loads(
              (root / "stable-1.0-maintenance-candidate-freeze.json").read_text(encoding="utf-8")
          )
          errors = validate_schema(value, "stable-1.0-maintenance-candidate-freeze-v1.schema.json")
          if errors:
              raise SystemExit("maintenance freeze schema failed: " + "; ".join(errors))
          expected = {
              "releaseId": os.environ["EXPECTED_RELEASE_ID"],
              "buildVersion": os.environ["EXPECTED_BUILD_VERSION"],
              "releaseClass": os.environ["EXPECTED_RELEASE_CLASS"],
          }
          if any(value.get(key) != wanted for key, wanted in expected.items()):
              raise SystemExit("maintenance freeze release identity differs")
          commit = os.environ["EXPECTED_SOURCE_COMMIT"]
          producer = value["producer"]
          if (
              value["source"].get("commit") != commit
              or value["source"].get("ref") != "commit:" + commit
              or producer.get("workflowPath") != ".github/workflows/stable-1.0-maintenance-release.yml"
              or producer.get("workflowCommit") != commit
              or producer.get("runId") != os.environ["EXPECTED_FROZEN_RUN_ID"]
              or producer.get("runAttempt") != int(os.environ["EXPECTED_FROZEN_RUN_ATTEMPT"])
          ):
              raise SystemExit("maintenance freeze source or producer identity differs")
          semantic = lambda item: "sha256:" + hashlib.sha256(
              json.dumps(item, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          assets = value["assets"]
          if value.get("assetSetDigest") != semantic(assets):
              raise SystemExit("maintenance freeze asset-set digest is invalid")
          asset_root = root / "assets"
          actual = {path.name: path for path in asset_root.iterdir()}
          expected_names = {row["fileName"] for row in assets}
          if set(actual) != expected_names or len(expected_names) != len(assets):
              raise SystemExit("maintenance freeze asset membership differs")
          for row in assets:
              path = actual[row["fileName"]]
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("maintenance freeze asset is unsafe")
              digest = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != row["digest"] or path.stat().st_size != row["sizeBytes"]:
                  raise SystemExit("maintenance freeze asset bytes differ from the freeze record")
          phase_value = json.loads(
              Path("build/stable-supply-chain-phase/manifest.json").read_text(encoding="utf-8")
          )
          inventory = json.loads(
              Path(phase_value["inputs"]["releaseSubjectInventory"]).read_text(encoding="utf-8")
          )
          subjects = {Path(row["fileName"]).name: row for row in inventory["subjects"]}
          if len(subjects) != len(inventory["subjects"]):
              raise SystemExit("release subject inventory has duplicate filenames")
          for row in assets:
              subject = subjects.get(row["fileName"])
              if subject is None:
                  raise SystemExit("maintenance freeze asset is absent from the subject inventory")
              if (
                  subject["digest"] != row["digest"]
                  or subject["size"] != row["sizeBytes"]
                  or subject["signatureReceiptDigest"] != row["signingReceiptDigest"]
                  or subject["notarizationReceiptDigest"] != row["notarizationReceiptDigest"]
              ):
                  raise SystemExit("maintenance freeze asset and subject inventory differ")
          checksums = root / "checksums.txt"
          if "sha256:" + hashlib.sha256(checksums.read_bytes()).hexdigest() != value["checksumsDigest"]:
              raise SystemExit("maintenance freeze checksum bytes differ")
          PY

      - name: Emit canonical platform payload and execution handoff
        env:
          BUILDER_OPERATION: ${{ inputs.operation }}
          BUILD_VERSION: ${{ inputs.build_version }}
          EXECUTION_ID: ${{ matrix.execution_id }}
          RUNNER_OS_VALUE: ${{ matrix.runner_os }}
          SUBJECT_KEYS: ${{ matrix.subject_keys }}
          BUILD_TASK: ${{ matrix.build_task }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PYTHONPATH: tools/release-certification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
          ${{ matrix.python_cmd }} tools/release-certification/protected/stable_supply_chain_platform_handoff.py

      - name: Attest exact platform execution handoff
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: >-
            build/stable-supply-chain-platform-handoff/${{ matrix.execution_id }}/**/*

      - name: Upload immutable platform execution handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            stable-1.0-supply-chain-${{ inputs.release_id }}-${{
            inputs.operation == 'producer-build' && 'producer' || 'verifier' }}-${{
            matrix.execution_id }}-attempt-${{ github.run_attempt }}
          path: build/stable-supply-chain-platform-handoff/${{ matrix.execution_id }}
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 30

  aggregate-builder-handoff:
    name: Aggregate authenticated cross-platform builder handoff
    if: >-
      always() && github.ref_protected &&
      (inputs.operation == 'producer-build' || inputs.operation == 'verifier-build') &&
      needs.validate-dispatch.result == 'success' &&
      needs.platform-package-build.result == 'success' &&
      ((inputs.operation == 'producer-build' && needs.producer-build.result == 'success') ||
      (inputs.operation == 'verifier-build' && needs.verifier-build.result == 'success'))
    needs:
      - validate-dispatch
      - producer-build
      - verifier-build
      - platform-package-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: stable-1.0-supply-chain-evidence
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Download exact reviewed recipe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.phase_bundle_run_id }}
          name: ${{ inputs.phase_bundle_artifact_name }}
          path: build/stable-supply-chain-phase

      - name: Download all four current-run execution artifacts without merging provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: >-
            stable-1.0-supply-chain-${{ inputs.release_id }}-${{
            inputs.operation == 'producer-build' && 'producer' || 'verifier' }}-*-attempt-${{ github.run_attempt }}
          path: build/stable-supply-chain-executions
          merge-multiple: false

      - name: Authenticate, partition, and aggregate all platform executions
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDER_OPERATION: ${{ inputs.operation }}
          RELEASE_ID: ${{ inputs.release_id }}
          BUILD_VERSION: ${{ inputs.build_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PYTHONPATH: tools/release-certification
        run: |
          set -euo pipefail
          role="$([[ "$BUILDER_OPERATION" == producer-build ]] && echo producer || echo verifier)"
          formal_role="$([[ "$BUILDER_OPERATION" == producer-build ]] && echo candidate-producer || echo independent-verifier)"
          downloaded="build/stable-supply-chain-executions"
          expected_names=(
            "stable-1.0-supply-chain-$RELEASE_ID-$role-linux-installers-attempt-$GITHUB_RUN_ATTEMPT"
            "stable-1.0-supply-chain-$RELEASE_ID-$role-macos-installer-attempt-$GITHUB_RUN_ATTEMPT"
            "stable-1.0-supply-chain-$RELEASE_ID-$role-portable-apps-attempt-$GITHUB_RUN_ATTEMPT"
            "stable-1.0-supply-chain-$RELEASE_ID-$role-windows-installer-attempt-$GITHUB_RUN_ATTEMPT"
          )
          mapfile -t actual_names < <(find "$downloaded" -mindepth 1 -maxdepth 1 -type d \
            -printf '%f\n' | LC_ALL=C sort)
          test "${actual_names[*]}" = "${expected_names[*]}"
          signer="github.com/crypta-network/cryptad/.github/workflows/stable-1.0-supply-chain.yml"
          execution_root="build/stable-supply-chain/aggregate-$role/executions"
          mkdir -p "$execution_root"
          run_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT")"
          export AGGREGATE_RUN_STARTED="$(jq -er .run_started_at <<< "$run_json")"
          export AGGREGATE_RUN_COMPLETED="$(jq -er .updated_at <<< "$run_json")"
          for execution_id in linux-installers macos-installer portable-apps windows-installer; do
            artifact="stable-1.0-supply-chain-$RELEASE_ID-$role-$execution_id-attempt-$GITHUB_RUN_ATTEMPT"
            source="$downloaded/$artifact"
            destination="$execution_root/$execution_id"
            if [[ -n "$(find "$source" -type l -print -quit)" \
                  || -n "$(find "$source" -mindepth 1 ! -type f ! -type d -print -quit)" \
                  || -n "$(find "$source" -type f -links +1 -print -quit)" ]]; then
              echo "::error::Execution $execution_id contains an unsafe entry."
              exit 1
            fi
            mkdir -p "$destination/content"
            cp -a "$source/." "$destination/content/"
            artifacts="$(gh api --paginate --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
            jq -e --arg name "$artifact" '
              [.artifacts[] | select(.name == $name and .expired == false
                and (.digest | test("^sha256:[0-9a-f]{64}$")))] | length == 1' \
              <<< "$artifacts" >/dev/null
            : > "$destination/attestations.ndjson"
            while IFS= read -r -d '' subject; do
              gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$signer" \
                --signer-digest "$SOURCE_COMMIT" \
                --source-digest "$SOURCE_COMMIT" \
                --source-ref "$GITHUB_REF" \
                --deny-self-hosted-runners --format=json \
                | jq -ce '.[]' >> "$destination/attestations.ndjson"
            done < <(find "$source" -type f -print0 | LC_ALL=C sort -z)
            jq -csS 'sort_by(
              .verificationResult.statement.subject[0].name,
              .verificationResult.statement.subject[0].digest.sha256
            )' "$destination/attestations.ndjson" > "$destination/attestations.json"
            rm "$destination/attestations.ndjson"
          done

          ROLE="$role" FORMAL_ROLE="$formal_role" python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          from cryptad_certification.schema_validation import validate_schema
          from cryptad_certification.engines.stable_1_0_supply_chain_core import (
              builder_observation_errors,
              canonical_json_bytes,
              semantic_digest,
              sha256_digest,
          )
          from cryptad_certification.engines.stable_1_0_supply_chain_archive import (
              ARCHIVE_PACKAGE_TYPES,
              build_archive_payload_manifest,
          )

          workspace = Path.cwd().resolve()
          role = os.environ["ROLE"]
          formal_role = os.environ["FORMAL_ROLE"]
          root = workspace / "build/stable-supply-chain" / ("aggregate-" + role)
          executions_root = root / "executions"
          phase = workspace / "build/stable-supply-chain-phase"
          manifest = json.loads((phase / "manifest.json").read_text(encoding="utf-8"))
          inventory = json.loads(
              (workspace / manifest["inputs"]["releaseSubjectInventory"]).read_text(encoding="utf-8")
          )
          materials = json.loads(
              (workspace / manifest["inputs"]["buildMaterials"]).read_text(encoding="utf-8")
          )
          snapshot = json.loads(
              (workspace / manifest["inputs"]["resolvedDependencySnapshot"]).read_text(encoding="utf-8")
          )
          policy = json.loads(
              Path("tools/release-certification/stable-1.0-supply-chain-policy.json").read_text(
                  encoding="utf-8"
              )
          )

          def digest(path: Path) -> str:
              return "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()

          sources = {}
          payloads = {}
          extraction_evidence = {}
          handoffs = {}
          for execution_id in ("linux-installers", "macos-installer", "portable-apps", "windows-installer"):
              content = executions_root / execution_id / "content"
              handoff_path = content / "handoff.json"
              handoff = json.loads(handoff_path.read_text(encoding="utf-8"))
              handoffs[execution_id] = (handoff, handoff_path)
              subject_root = content / "subjects"
              for path in subject_root.rglob("*"):
                  if path.is_file():
                      relative = path.relative_to(subject_root).as_posix()
                      if relative in sources:
                          raise SystemExit("builder executions contain duplicate subject paths")
                      sources[relative] = path
              payload_root = content / "payload-manifests"
              if payload_root.is_dir():
                  for path in payload_root.glob("*.json"):
                      if path.name in payloads:
                          raise SystemExit("builder executions contain duplicate payload manifests")
                      payloads[path.name] = path
              extraction_root = content / "extraction-evidence"
              if extraction_root.is_dir():
                  for path in extraction_root.glob("*.json"):
                      if path.name in extraction_evidence:
                          raise SystemExit("builder executions contain duplicate extraction evidence")
                      extraction_evidence[path.name] = path

          subject_root = root / "subjects"
          payload_root = root / "payload-manifests"
          extraction_root = root / "extraction-evidence"
          subject_root.mkdir(parents=True)
          payload_root.mkdir()
          extraction_root.mkdir()
          subject_rows = []
          routed = {key: [] for key in handoffs}
          used_sources = set()
          policy_rules = {row["subjectKey"]: row for row in policy["releaseSubjects"]}
          rebuild_rows = [
              row for row in inventory["subjects"]
              if policy_rules[row["subjectKey"]]["evidencePhase"] == "independent-builder"
          ]
          portable_paths = {
              "core-jar": "core/cryptad.jar",
              "portable-tar": f"distributions/cryptad-v{os.environ['BUILD_VERSION']}.tar.gz",
              "portable-zip": f"distributions/cryptad-v{os.environ['BUILD_VERSION']}.zip",
              "runtime-image-tar": f"distributions/cryptad-jlink-v{os.environ['BUILD_VERSION']}.tar.gz",
              "runtime-image-zip": f"distributions/cryptad-jlink-v{os.environ['BUILD_VERSION']}.zip",
          }
          for inventory_row in rebuild_rows:
              key = inventory_row["subjectKey"]
              file_name = inventory_row["fileName"]
              path = sources.get(file_name)
              if path is None:
                  portable_name = portable_paths.get(key)
                  if key.startswith("app-"):
                      portable_name = "apps/" + key.removeprefix("app-") + ".zip"
                  path = sources.get(portable_name) if portable_name is not None else None
              if path is None:
                  raise SystemExit(f"cross-platform builder omits exact subject {key}")
              used_sources.add(path)
              destination = subject_root / file_name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, destination)
              payload_digest = inventory_row.get("payloadManifestDigest")
              if payload_digest is not None:
                  payload = payloads.get(key + ".json")
                  if payload is None:
                      rule = policy_rules[key]
                      normalization = next(
                          value for value in policy["normalizationRules"]
                          if value["id"] == rule["normalizationRuleId"]
                      )
                      package_type = normalization["packageTypes"][0]
                      if package_type not in ARCHIVE_PACKAGE_TYPES:
                          raise SystemExit(f"cross-platform builder omits payload manifest {key}")
                      value = build_archive_payload_manifest(
                          destination,
                          key,
                          inventory_row["subjectClass"],
                          inventory_row["componentIds"],
                          normalization,
                          policy,
                      )
                      generated = payload_root / (key + ".json")
                      generated.write_bytes(canonical_json_bytes(value) + b"\n")
                      payload = generated
                  value = json.loads(payload.read_text(encoding="utf-8"))
                  if semantic_digest(value, "manifestDigest") != value.get("manifestDigest"):
                      raise SystemExit(f"cross-platform payload manifest is invalid for {key}")
                  payload_digest = value["manifestDigest"]
                  payload_destination = payload_root / payload.name
                  if payload.resolve() != payload_destination.resolve():
                      shutil.copyfile(payload, payload_destination)
              extraction_path = extraction_evidence.get(key + ".json")
              extraction_digest = None
              if extraction_path is not None:
                  extraction_value = json.loads(extraction_path.read_text(encoding="utf-8"))
                  extraction_digest = extraction_value.get("evidenceDigest")
              subject_rows.append({
                  "subjectKey": key,
                  "fileName": file_name,
                  "digest": digest(destination),
                  "size": destination.stat().st_size,
                  "payloadManifestDigest": payload_digest,
                  "signatureReceiptDigest": (
                      inventory_row["signatureReceiptDigest"]
                      if formal_role == "candidate-producer" else None
                  ),
                  "notarizationReceiptDigest": (
                      inventory_row["notarizationReceiptDigest"]
                      if formal_role == "candidate-producer" else None
                  ),
                  "extractionEvidenceDigest": extraction_digest,
                  "publishedCandidate": formal_role == "candidate-producer",
              })
              if key in {"amd64.deb", "amd64.rpm"}:
                  execution_id = "linux-installers"
              elif key == "amd64.dmg":
                  execution_id = "macos-installer"
              elif key == "amd64.exe":
                  execution_id = "windows-installer"
              else:
                  execution_id = "portable-apps"
              routed[execution_id].append(key)
          if used_sources != set(sources.values()):
              raise SystemExit("builder executions contain unselected or non-rebuildable subjects")
          expected_extraction_names = {
              row["subjectKey"] + ".json"
              for row in rebuild_rows
              if policy_rules[row["subjectKey"]]["reproducibilityClass"]
              == "normalized-payload-identical"
          }
          if set(extraction_evidence) != expected_extraction_names:
              raise SystemExit("builder extraction evidence does not cover the exact normalized subject set")
          subject_rows.sort(key=lambda value: value["subjectKey"])
          (root / "builder-subjects.json").write_bytes(canonical_json_bytes(subject_rows) + b"\n")

          executions = []
          for execution_id in sorted(handoffs):
              handoff, handoff_path = handoffs[execution_id]
              keys = sorted(routed[execution_id])
              selected = [row for row in subject_rows if row["subjectKey"] in keys]
              if (
                  handoff.get("executionId") != execution_id
                  or handoff.get("jobName") != formal_role + "-" + execution_id
                  or handoff.get("runId") != int(os.environ["GITHUB_RUN_ID"])
                  or handoff.get("runAttempt") != int(os.environ["GITHUB_RUN_ATTEMPT"])
              ):
                  raise SystemExit(f"execution handoff identity differs for {execution_id}")
              if handoff.get("subjectKeys") is not None and sorted(handoff["subjectKeys"]) != keys:
                  raise SystemExit(f"execution handoff subject routing differs for {execution_id}")
              observed_java = handoff.get("observedJava", {})
              environment_variables = handoff.get("environmentVariables", {})
              observation_errors = builder_observation_errors(
                  observed_java,
                  environment_variables,
                  materials,
                  handoff.get("runnerOs"),
              )
              if observation_errors:
                  raise SystemExit(
                      f"execution {execution_id} observation differs: {observation_errors[0]}"
                  )
              expected_environment = {
                  "locale": environment_variables["LC_ALL"],
                  "timezone": environment_variables["TZ"],
                  "encoding": observed_java["javaEncoding"],
                  "sourceDateEpoch": int(environment_variables["SOURCE_DATE_EPOCH"]),
              }
              if handoff.get("canonicalEnvironment") != expected_environment:
                  raise SystemExit(f"execution {execution_id} canonical environment differs")
              toolchain = {
                  **observed_java,
                  "gradleWrapperJarDigest": materials["gradle"]["wrapperJarDigest"],
                  "gradleWrapperPropertiesDigest": materials["gradle"]["wrapperPropertiesDigest"],
                  "gradleDistributionDigest": materials["gradle"]["distributionDigest"],
              }
              material_identities = {
                  "dependencyVerificationDigest": snapshot["materialDigests"]["verificationMetadata"],
                  "verificationKeyringDigest": snapshot["materialDigests"]["verificationKeyring"],
                  "pluginResolutionDigest": snapshot["materialDigests"]["pluginResolution"],
                  "buildLogicDigest": snapshot["materialDigests"]["buildLogic"],
                  "resolutionSnapshotDigest": snapshot["snapshotDigest"],
              }
              task_set = policy["builderPolicy"]["executionTasks"][execution_id]
              payload_views = []
              extraction_views = []
              for key in keys:
                  payload_path = payload_root / (key + ".json")
                  if not payload_path.is_file():
                      raise SystemExit(f"execution {execution_id} lacks actual payload evidence for {key}")
                  payload_value = json.loads(payload_path.read_text(encoding="utf-8"))
                  payload_views.append({
                      "subjectKey": key,
                      "normalizationRuleId": payload_value["normalizationRuleId"],
                      "normalizationRuleVersion": payload_value["normalizationRuleVersion"],
                      "preSigningPayloadDigest": payload_value["preSigningPayloadDigest"],
                      "packageMetadataDigest": payload_value["packageMetadataDigest"],
                      "entries": payload_value["entries"],
                      "ignoredPaths": payload_value["ignoredPaths"],
                  })
                  rule = policy_rules[key]
                  if rule["reproducibilityClass"] == "normalized-payload-identical":
                      evidence_path = extraction_evidence.get(key + ".json")
                      if evidence_path is None:
                          raise SystemExit(
                              f"execution {execution_id} lacks actual package extraction evidence for {key}"
                          )
                      evidence_value = json.loads(evidence_path.read_text(encoding="utf-8"))
                      evidence_errors = validate_schema(
                          evidence_value,
                          "stable-1.0-package-extraction-evidence-v1.schema.json",
                      )
                      if evidence_errors:
                          raise SystemExit(
                              f"actual package extraction evidence schema differs for {key}: "
                              + evidence_errors[0]
                          )
                      common_evidence_differs = (
                          semantic_digest(evidence_value, "evidenceDigest")
                          != evidence_value.get("evidenceDigest")
                          or evidence_value.get("builderRole") != formal_role
                          or evidence_value.get("subjectKey") != key
                          or evidence_value.get("publishedSubjectDigest")
                          != next(row for row in selected if row["subjectKey"] == key)["digest"]
                          or evidence_value.get("payloadManifestDigest")
                          != payload_value.get("manifestDigest")
                          or evidence_value.get("signatureReceiptDigest")
                          != (
                              next(
                                  row for row in inventory["subjects"] if row["subjectKey"] == key
                              )["signatureReceiptDigest"]
                              if formal_role == "candidate-producer" else None
                          )
                          or evidence_value.get("notarizationReceiptDigest")
                          != (
                              next(
                                  row for row in inventory["subjects"] if row["subjectKey"] == key
                              )["notarizationReceiptDigest"]
                              if formal_role == "candidate-producer" else None
                          )
                      )
                      binding_method = evidence_value.get("bindingMethod")
                      normalization_evidence = evidence_value.get("normalizationEvidence")
                      if binding_method == "exact-staged-payload":
                          binding_differs = (
                              key == "amd64.dmg"
                              or evidence_value.get("stagedPayloadContainedExactly") is not True
                              or evidence_value.get("stagedPayloadDigest")
                              != evidence_value.get("embeddedStagedPayloadDigest")
                              or normalization_evidence is not None
                          )
                      elif binding_method == "macos-code-signature-normalized":
                          selected_row = next(row for row in selected if row["subjectKey"] == key)
                          inventory_row = next(
                              row for row in inventory["subjects"] if row["subjectKey"] == key
                          )
                          signature_rows = normalization_evidence.get("signatureMaterial", [])
                          code_rows = normalization_evidence.get("codeObjects", [])
                          binding_differs = (
                              key != "amd64.dmg"
                              or normalization_evidence.get("normalizationRuleId")
                              != policy_rules[key]["normalizationRuleId"]
                              or normalization_evidence.get("normalizationRuleVersion") != 2
                              or normalization_evidence.get("normalizedStagedPayloadDigest")
                              != normalization_evidence.get("normalizedEmbeddedPayloadDigest")
                              or normalization_evidence.get("normalizedStagedPayloadDigest")
                              != payload_value.get("preSigningPayloadDigest")
                              or normalization_evidence.get("releaseBytesUnmodified") is not True
                              or normalization_evidence.get("nonCodeEntriesIdentical") is not True
                              or normalization_evidence.get("signatureMaterialAccounted") is not True
                              or [row["path"] for row in signature_rows]
                              != sorted({row["path"] for row in signature_rows})
                              or [row["path"] for row in code_rows]
                              != sorted({row["path"] for row in code_rows})
                          )
                          if formal_role == "candidate-producer":
                              binding_differs = binding_differs or (
                                  evidence_value.get("stagedPayloadContainedExactly") is not False
                                  or normalization_evidence.get("mountedAppSigningVerified") is not True
                                  or normalization_evidence.get("frozenSubjectDigest")
                                  != selected_row["digest"]
                                  or normalization_evidence.get("frozenSigningReceiptDigest")
                                  != inventory_row["signatureReceiptDigest"]
                                  or normalization_evidence.get("frozenNotarizationReceiptDigest")
                                  != inventory_row["notarizationReceiptDigest"]
                              )
                          else:
                              binding_differs = binding_differs or (
                                  normalization_evidence.get("mountedAppSigningVerified") is not False
                                  or normalization_evidence.get("frozenSubjectDigest") is not None
                                  or normalization_evidence.get("frozenSigningReceiptDigest") is not None
                                  or normalization_evidence.get("frozenNotarizationReceiptDigest") is not None
                              )
                      else:
                          binding_differs = True
                      if common_evidence_differs or binding_differs:
                          raise SystemExit(f"actual package extraction evidence differs for {key}")
                      extraction_views.append({
                          "subjectKey": key,
                          "packageType": evidence_value["packageType"],
                          "bindingMethod": binding_method,
                          "extractionTool": evidence_value["extractionTool"],
                          "stagedPayloadDigest": evidence_value["stagedPayloadDigest"],
                          "embeddedStagedPayloadDigest": evidence_value["embeddedStagedPayloadDigest"],
                          "extractedPayloadDigest": evidence_value["extractedPayloadDigest"],
                          "stagedPayloadContainedExactly": evidence_value[
                              "stagedPayloadContainedExactly"
                          ],
                          "normalizationEvidenceDigest": (
                              None if normalization_evidence is None
                              else sha256_digest(canonical_json_bytes(normalization_evidence))
                          ),
                      })
                      shutil.copyfile(evidence_path, extraction_root / evidence_path.name)
              direct_inputs_digest = sha256_digest(
                  canonical_json_bytes(handoffs["portable-apps"][0]["directInputs"])
              )
              executions.append({
                  "executionId": execution_id,
                  "workflowRef": handoff["workflowRef"] if "workflowRef" in handoff else handoff["workflow"],
                  "workflowSha": handoff["workflowSha"],
                  "runId": handoff["runId"],
                  "runAttempt": handoff["runAttempt"],
                  "jobName": handoff["jobName"],
                  "runnerOs": handoff["runnerOs"],
                  "runnerArchitecture": handoff["runnerArchitecture"],
                  "runnerImageIdentity": handoff["runnerImageIdentity"],
                  "runnerImageDigest": handoff["runnerImageDigest"],
                  "toolchain": toolchain,
                  "materialIdentities": material_identities,
                  "taskSet": task_set,
                  "taskSetDigest": sha256_digest(canonical_json_bytes(task_set)),
                  "canonicalEnvironment": handoff["canonicalEnvironment"],
                  "environmentVariables": environment_variables,
                  "directInputsDigest": direct_inputs_digest,
                  "payloadManifestSetDigest": sha256_digest(canonical_json_bytes(payload_views)),
                  "extractionManifestSetDigest": sha256_digest(canonical_json_bytes(extraction_views)),
                  "handoffDigest": digest(handoff_path),
                  "subjectSetDigest": sha256_digest(canonical_json_bytes(selected)),
                  "artifactAttestationDigest": digest(executions_root / execution_id / "attestations.json"),
                  "attestationVerified": True,
                  "subjectKeys": keys,
                  "sourceCommit": os.environ["SOURCE_COMMIT"],
                  "sourceTreeDigest": materials["source"]["treeDigest"],
                  "materialsDigest": materials["materialsDigest"],
                  "resolutionSnapshotDigest": snapshot["snapshotDigest"],
                  "buildStartedAt": handoff.get("buildStartedAt", os.environ["AGGREGATE_RUN_STARTED"]),
                  "buildCompletedAt": handoff.get("buildCompletedAt", os.environ["AGGREGATE_RUN_COMPLETED"]),
                  "candidateProductAvailableBeforeBuild": False,
              })
          (root / "builder-executions.json").write_bytes(canonical_json_bytes(executions) + b"\n")
          portable = handoffs["portable-apps"][0]
          portable["builderRole"] = formal_role
          portable["fileSetDigest"] = ""
          portable["executionsDigest"] = digest(root / "builder-executions.json")
          (root / "handoff.json").write_bytes(canonical_json_bytes(portable) + b"\n")
          with (root / "subject-files.sha256").open("w", encoding="utf-8") as handle:
              for path in sorted(subject_root.rglob("*")):
                  if path.is_file():
                      handle.write(hashlib.sha256(path.read_bytes()).hexdigest() + "  ./" + path.relative_to(subject_root).as_posix() + "\n")
          portable["fileSetDigest"] = digest(root / "subject-files.sha256")
          (root / "handoff.json").write_bytes(canonical_json_bytes(portable) + b"\n")
          PY

      - name: Attest complete cross-platform builder handoff
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: >-
            build/stable-supply-chain/aggregate-${{
            inputs.operation == 'producer-build' && 'producer' || 'verifier' }}/**/*

      - name: Upload complete immutable builder handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            stable-1.0-supply-chain-${{ inputs.release_id }}-${{
            inputs.operation == 'producer-build' && 'producer' || 'verifier' }}-attempt-${{ github.run_attempt }}
          path: >-
            build/stable-supply-chain/aggregate-${{
            inputs.operation == 'producer-build' && 'producer' || 'verifier' }}
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 30

  compare-evaluate:
    name: Prepare, compare, or evaluate exact rebuild evidence
    if: inputs.operation == 'compare-evaluate' && github.ref_protected
    needs: validate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: stable-1.0-supply-chain-evidence
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Download exact comparison phase bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.phase_bundle_run_id }}
          name: ${{ inputs.phase_bundle_artifact_name }}
          path: build/stable-supply-chain-phase

      - name: Download exact original producer handoff directly
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run_id }}
          name: ${{ inputs.producer_artifact_name }}
          path: build/stable-supply-chain-original/producer

      - name: Download exact original verifier handoff directly
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verifier_run_id }}
          name: ${{ inputs.verifier_artifact_name }}
          path: build/stable-supply-chain-original/verifier

      - name: Authenticate comparison phase bundle
        id: comparison-mode
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SIGNER: ${{ needs.validate-dispatch.outputs.phase_signer_workflow }}
          EXPECTED_MANIFEST_DIGEST: ${{ inputs.phase_manifest_digest }}
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_BUILD_VERSION: ${{ inputs.build_version }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test -f build/stable-supply-chain-phase/manifest.json
          actual="sha256:$(sha256sum build/stable-supply-chain-phase/manifest.json | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_MANIFEST_DIGEST"
          jq -e --arg id "$EXPECTED_RELEASE_ID" --arg version "$EXPECTED_BUILD_VERSION" \
            --arg commit "$EXPECTED_SOURCE_COMMIT" '
              .release.id == $id and .release.version == $version
              and .release.profile == "stable-review"
              and .policies.candidateSourceCommit == $commit
              and .policies.candidateSourceRef == ("commit:" + $commit)
              and .requirements.stableSupplyChain == true
              and (.commands["stable-supply-chain"].mode == "prepare-rebuild-comparison"
                or .commands["stable-supply-chain"].mode == "compare-rebuilds"
                or .commands["stable-supply-chain"].mode == "evaluate-promotion")' \
            build/stable-supply-chain-phase/manifest.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          workspace = Path.cwd().resolve()
          root = (workspace / "build/stable-supply-chain-phase").resolve(strict=True)
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          mode = manifest["commands"]["stable-supply-chain"]["mode"]
          allowed = {manifest_path.resolve()}
          external = {
              (workspace / "tools/release-certification/stable-1.0-supply-chain-policy.json").resolve(strict=True),
              (workspace / "tools/release-certification/stable-1.0-supply-chain-license-overrides.json").resolve(strict=True),
              workspace,
          }
          for key, value in manifest["inputs"].items():
              if key == "stableVulnerabilitySummary":
                  if mode != "evaluate-promotion" or value != "stable-1.0-vulnerability-summary.json":
                      raise SystemExit("Stable vulnerability summary uses the wrong protected binding")
                  protected_names = (
                      "stable-1.0-vulnerability-summary.json",
                      "stable-1.0-vulnerability-successor-binding.json",
                      "stable-1.0-vulnerability-summary-provenance.json",
                      "sealed-successor/stable-1.0-protected-handoff.enc",
                      "sealed-successor/stable-1.0-protected-handoff.json",
                  )
                  for name in protected_names:
                      target = (root / name).resolve(strict=True)
                      target.relative_to(root)
                      if target.is_symlink() or not target.is_file():
                          raise SystemExit("protected vulnerability handoff is missing or unsafe")
                      cursor = target
                      while cursor != root:
                          allowed.add(cursor)
                          cursor = cursor.parent
                  continue
              configured = Path(value)
              if configured.is_absolute() or ".." in configured.parts:
                  raise SystemExit("phase input path is unsafe")
              target = (workspace / configured).resolve(strict=True)
              if target == workspace and key != "licenseTextRoot":
                  raise SystemExit("only licenseTextRoot may select the repository root")
              if target in external:
                  continue
              target.relative_to(root)
              cursor = target
              while cursor != root:
                  allowed.add(cursor)
                  cursor = cursor.parent
              if target.is_dir():
                  allowed.update(child.resolve() for child in target.rglob("*"))
          for input_key, rows_key in (("licenseInventory", "components"), ("licenseOverrides", "overrides")):
              configured = manifest["inputs"].get(input_key)
              if configured is None:
                  continue
              registry = json.loads((workspace / configured).read_text(encoding="utf-8"))
              for row in registry.get(rows_key, []):
                  notice = row.get("licenseTextPath")
                  if notice is None:
                      continue
                  if notice != "LICENSE" and not notice.startswith("docs/licenses/"):
                      raise SystemExit("license evidence must be LICENSE or a file below docs/licenses")
                  evidence = (workspace / notice).resolve(strict=True)
                  if evidence.is_symlink() or not evidence.is_file():
                      raise SystemExit("license evidence is missing or unsafe")
          if {child.resolve() for child in root.rglob("*")} != allowed:
              raise SystemExit("phase bundle contains an unreferenced entry")
          PY
          if find build/stable-supply-chain-phase \( -type l -o -type f -links +1 \) -print -quit | grep -q .; then
            exit 1
          fi
          while IFS= read -r -d '' subject; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$EXPECTED_SIGNER" --source-ref "$GITHUB_REF" >/dev/null
          done < <(find build/stable-supply-chain-phase -type f -print0 | LC_ALL=C sort -z)
          printf 'mode-json=%s\n' "$(jq -c '.commands["stable-supply-chain"].mode' \
            build/stable-supply-chain-phase/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Materialize authenticated vulnerability summary outside checkout and public roots
        if: >-
          fromJSON(steps.comparison-mode.outputs.mode-json) == 'evaluate-promotion'
        env:
          GH_TOKEN: ${{ github.token }}
          CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64 }}
        run: |
          set -euo pipefail
          phase="build/stable-supply-chain-phase"
          external_root="$RUNNER_TEMP/stable-supply-chain-vulnerability-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          opened="$RUNNER_TEMP/stable-supply-chain-vulnerability-opened-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$external_root" "$opened"
          python3 tools/release-certification/protected/stable_backport_protected_handoff.py open \
            --bundle "$phase/sealed-successor" \
            --out "$opened" \
            --binding "$phase/stable-1.0-vulnerability-successor-binding.json" \
            --key-env CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64
          summary_name="stable-1.0-vulnerability-summary.json"
          source="$opened/$summary_name"
          if [[ -L "$source" || ! -f "$source" \
                || "$(stat -c '%h' "$source")" -ne 1 \
                || "$(stat -c '%s' "$source")" -le 0 \
                || "$(stat -c '%s' "$source")" -gt 4194304 ]]; then
            echo "::error::Opened Stable vulnerability summary is missing, linked, or oversized."
            exit 1
          fi
          cmp -- "$source" "$phase/$summary_name"
          install -d -m 700 "$external_root" "$external_root/sealed-successor"
          install -m 600 "$source" "$external_root/$summary_name"
          install -m 600 "$phase/stable-1.0-vulnerability-successor-binding.json" \
            "$external_root/stable-1.0-vulnerability-successor-binding.json"
          install -m 600 "$phase/stable-1.0-vulnerability-summary-provenance.json" \
            "$external_root/stable-1.0-vulnerability-summary-provenance.json"
          install -m 600 "$phase/sealed-successor/stable-1.0-protected-handoff.enc" \
            "$external_root/sealed-successor/stable-1.0-protected-handoff.enc"
          install -m 600 "$phase/sealed-successor/stable-1.0-protected-handoff.json" \
            "$external_root/sealed-successor/stable-1.0-protected-handoff.json"
          mapfile -t actual < <(find "$external_root" -mindepth 1 -printf '%P\n' | LC_ALL=C sort)
          expected=(
            sealed-successor
            sealed-successor/stable-1.0-protected-handoff.enc
            sealed-successor/stable-1.0-protected-handoff.json
            stable-1.0-vulnerability-successor-binding.json
            stable-1.0-vulnerability-summary-provenance.json
            stable-1.0-vulnerability-summary.json
          )
          test "${actual[*]}" = "${expected[*]}"
          while IFS= read -r candidate; do
            test ! -L "$candidate"
            test "$(stat -c %h "$candidate")" = 1
          done < <(find "$external_root" -type f -print)
          genesis_digest="$(jq -er .ledgerDigest \
            tools/release-certification/stable-1.0-vulnerability-ledger-genesis.json)"
          current_tip_environment="$RUNNER_TEMP/stable-supply-chain-vulnerability-tip.env"
          : > "$current_tip_environment"
          python3 tools/release-certification/protected/stable_vulnerability_actions_tip.py \
            verify-promotion \
            --repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$(jq -er .runId "$external_root/stable-1.0-vulnerability-successor-binding.json")" \
            --expected-run-attempt "$(jq -er .runAttempt "$external_root/stable-1.0-vulnerability-successor-binding.json")" \
            --expected-artifact-name "$(jq -er .artifactName "$external_root/stable-1.0-vulnerability-successor-binding.json")" \
            --expected-artifact-digest "$(jq -er .producerArtifactDigest "$external_root/stable-1.0-vulnerability-summary-provenance.json")" \
            --genesis-ledger-digest "$genesis_digest" \
            --binding "$external_root/stable-1.0-vulnerability-successor-binding.json" \
            --provenance "$external_root/stable-1.0-vulnerability-summary-provenance.json" \
            --environment-file "$current_tip_environment"
          mapfile -t current_tip_names < <(cut -d= -f1 "$current_tip_environment" | LC_ALL=C sort)
          expected_current_tip_names=(
            CRYPTAD_STABLE_VULNERABILITY_CURRENT_TIP_ARTIFACT_DIGEST
            CRYPTAD_STABLE_VULNERABILITY_CURRENT_TIP_ARTIFACT_NAME
            CRYPTAD_STABLE_VULNERABILITY_CURRENT_TIP_LEDGER_DIGEST
            CRYPTAD_STABLE_VULNERABILITY_CURRENT_TIP_LEDGER_EDITION
            CRYPTAD_STABLE_VULNERABILITY_CURRENT_TIP_RUN_ATTEMPT
            CRYPTAD_STABLE_VULNERABILITY_CURRENT_TIP_RUN_ID
          )
          test "${current_tip_names[*]}" = "${expected_current_tip_names[*]}"
          cat "$current_tip_environment" >> "$GITHUB_ENV"
          printf 'CRYPTAD_STABLE_VULNERABILITY_SUMMARY_ROOT=%s\n' "$external_root" \
            >> "$GITHUB_ENV"
          rm -rf "$opened"

      - name: Authenticate original builder runs, artifacts, files, and formal receipt bindings
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_BUILD_VERSION: ${{ inputs.build_version }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          PRODUCER_ARTIFACT_NAME: ${{ inputs.producer_artifact_name }}
          PRODUCER_ARTIFACT_DIGEST: ${{ inputs.producer_artifact_digest }}
          VERIFIER_RUN_ID: ${{ inputs.verifier_run_id }}
          VERIFIER_RUN_ATTEMPT: ${{ inputs.verifier_run_attempt }}
          VERIFIER_ARTIFACT_NAME: ${{ inputs.verifier_artifact_name }}
          VERIFIER_ARTIFACT_DIGEST: ${{ inputs.verifier_artifact_digest }}
          PYTHONPATH: tools/release-certification
        run: |
          set -euo pipefail
          evidence="build/stable-supply-chain-original/authentication"
          mkdir -p "$evidence"
          signer="github.com/crypta-network/cryptad/.github/workflows/stable-1.0-supply-chain.yml"
          signer_path=".github/workflows/stable-1.0-supply-chain.yml"
          authenticate_builder() {
            role="$1"
            run_id="$2"
            run_attempt="$3"
            artifact_name="$4"
            artifact_digest="$5"
            root="build/stable-supply-chain-original/$role"
            if [[ -n "$(find "$root" -type l -print -quit)" \
                  || -n "$(find "$root" -mindepth 1 ! -type f ! -type d -print -quit)" \
                  || -n "$(find "$root" -type f -links +1 -print -quit)" ]]; then
              echo "::error::Original $role artifact contains a link or special entry."
              exit 1
            fi
            run_json="$evidence/$role-run.json"
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$run_attempt" \
              > "$run_json"
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg workflow "$signer_path" \
              --arg commit "$EXPECTED_SOURCE_COMMIT" \
              --argjson attempt "$run_attempt" '
                .repository.full_name == $repository
                and .head_repository.full_name == $repository
                and .path == $workflow
                and .head_sha == $commit
                and .event == "workflow_dispatch"
                and .run_attempt == $attempt
                and .status == "completed"
                and .conclusion == "success"' "$run_json" >/dev/null
            artifacts="$evidence/$role-artifacts.json"
            gh api --paginate --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}' > "$artifacts"
            jq -e --arg name "$artifact_name" --arg digest "$artifact_digest" '
              [.artifacts[] | select(
                .name == $name and .expired == false and .digest == $digest
              )] | length == 1' "$artifacts" >/dev/null
            : > "$evidence/$role-attestations.ndjson"
            while IFS= read -r -d '' subject; do
              result="$evidence/$role-attestation-result.json"
              gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$signer" \
                --signer-digest "$EXPECTED_SOURCE_COMMIT" \
                --source-digest "$EXPECTED_SOURCE_COMMIT" \
                --source-ref "$GITHUB_REF" \
                --deny-self-hosted-runners --format=json > "$result"
              jq -ce '.[]' "$result" >> "$evidence/$role-attestations.ndjson"
            done < <(find "$root" -type f -print0 | LC_ALL=C sort -z)
            jq -csS 'sort_by(
              .verificationResult.statement.subject[0].name,
              .verificationResult.statement.subject[0].digest.sha256
            )' "$evidence/$role-attestations.ndjson" \
              > "$evidence/$role-attestations.json"
            rm -f "$evidence/$role-attestation-result.json" \
              "$evidence/$role-attestations.ndjson"
          }
          authenticate_builder producer "$PRODUCER_RUN_ID" "$PRODUCER_RUN_ATTEMPT" \
            "$PRODUCER_ARTIFACT_NAME" "$PRODUCER_ARTIFACT_DIGEST"
          authenticate_builder verifier "$VERIFIER_RUN_ID" "$VERIFIER_RUN_ATTEMPT" \
            "$VERIFIER_ARTIFACT_NAME" "$VERIFIER_ARTIFACT_DIGEST"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from cryptad_certification.schema_validation import validate_schema
          from cryptad_certification.engines.stable_1_0_supply_chain_core import (
              BUILDER_RECEIPT_SCHEMA,
              semantic_digest,
          )

          workspace = Path.cwd().resolve()
          phase = (workspace / "build/stable-supply-chain-phase").resolve(strict=True)
          original = (workspace / "build/stable-supply-chain-original").resolve(strict=True)
          authentication = original / "authentication"
          manifest_path = phase / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          inventory = json.loads(
              (workspace / manifest["inputs"]["releaseSubjectInventory"]).read_text(
                  encoding="utf-8"
              )
          )
          materials = json.loads(
              (workspace / manifest["inputs"]["buildMaterials"]).read_text(encoding="utf-8")
          )
          snapshot = json.loads(
              (workspace / manifest["inputs"]["resolvedDependencySnapshot"]).read_text(
                  encoding="utf-8"
              )
          )
          policy = json.loads(
              Path("tools/release-certification/stable-1.0-supply-chain-policy.json").read_text(
                  encoding="utf-8"
              )
          )
          expected_workflow = (
              "github.com/crypta-network/cryptad/.github/workflows/"
              "stable-1.0-supply-chain.yml@" + os.environ["EXPECTED_SOURCE_COMMIT"]
          )

          def sha256(path: Path) -> str:
              return "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()

          def canonical(value: object) -> bytes:
              return json.dumps(
                  value, ensure_ascii=False, separators=(",", ":"), sort_keys=True
              ).encode("utf-8")

          def derive(label: str, role: str) -> tuple[dict, Path]:
              root = (original / label).resolve(strict=True)
              handoff = json.loads((root / "handoff.json").read_text(encoding="utf-8"))
              run = json.loads(
                  (authentication / f"{label}-run.json").read_text(encoding="utf-8")
              )
              run_id = int(os.environ[label.upper() + "_RUN_ID"])
              run_attempt = int(os.environ[label.upper() + "_RUN_ATTEMPT"])
              if (
                  handoff.get("builderRole") != role
                  or handoff.get("releaseId") != os.environ["EXPECTED_RELEASE_ID"]
                  or handoff.get("buildVersion") != int(os.environ["EXPECTED_BUILD_VERSION"])
                  or handoff.get("sourceCommit") != os.environ["EXPECTED_SOURCE_COMMIT"]
                  or handoff.get("sourceRef") != "refs/heads/" + os.environ.get(
                      "GITHUB_REF_NAME", ""
                  )
                  or handoff.get("workflow") != expected_workflow
                  or handoff.get("workflowSha") != os.environ["EXPECTED_SOURCE_COMMIT"]
                  or handoff.get("runId") != run_id
                  or handoff.get("runAttempt") != run_attempt
              ):
                  raise SystemExit(f"original {label} handoff identity differs")
              checksum_path = root / "subject-files.sha256"
              if sha256(checksum_path) != handoff.get("fileSetDigest"):
                  raise SystemExit(f"original {label} file-set digest differs")
              listed = {}
              for line in checksum_path.read_text(encoding="utf-8").splitlines():
                  digest, separator, relative = line.partition("  ")
                  if separator != "  " or not relative.startswith("./"):
                      raise SystemExit(f"original {label} checksum row is malformed")
                  path = (root / "subjects" / relative.removeprefix("./")).resolve(strict=True)
                  path.relative_to((root / "subjects").resolve(strict=True))
                  if path.is_symlink() or not path.is_file() or hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest() != digest:
                      raise SystemExit(f"original {label} subject checksum differs")
                  listed[path.relative_to(root / "subjects").as_posix()] = path
              actual = {
                  path.relative_to(root / "subjects").as_posix(): path
                  for path in (root / "subjects").rglob("*")
                  if path.is_file()
              }
              if listed != actual:
                  raise SystemExit(f"original {label} subject set differs from its checksum list")

              policy_rules = {
                  row["subjectKey"]: row for row in policy["releaseSubjects"]
              }
              subjects = []
              for row in inventory["subjects"]:
                  if policy_rules[row["subjectKey"]]["evidencePhase"] != "independent-builder":
                      continue
                  file_name = row["fileName"]
                  path = actual.get(file_name)
                  if path is None:
                      raise SystemExit(f"original {label} omits subject {row['subjectKey']}")
                  payload_digest = row.get("payloadManifestDigest")
                  if payload_digest is not None:
                      payload = root / "payload-manifests" / (row["subjectKey"] + ".json")
                      if not payload.is_file():
                          raise SystemExit(
                              f"original {label} omits payload manifest {row['subjectKey']}"
                          )
                      value = json.loads(payload.read_text(encoding="utf-8"))
                      if semantic_digest(value, "manifestDigest") != value.get("manifestDigest"):
                          raise SystemExit(
                              f"original {label} payload manifest digest differs for "
                              + row["subjectKey"]
                          )
                      payload_digest = value["manifestDigest"]
                  extraction_digest = None
                  extraction = root / "extraction-evidence" / (row["subjectKey"] + ".json")
                  if extraction.is_file():
                      extraction_value = json.loads(extraction.read_text(encoding="utf-8"))
                      if semantic_digest(extraction_value, "evidenceDigest") != extraction_value.get(
                          "evidenceDigest"
                      ):
                          raise SystemExit(
                              f"original {label} extraction evidence digest differs for "
                              + row["subjectKey"]
                          )
                      extraction_digest = extraction_value["evidenceDigest"]
                  subjects.append(
                      {
                          "subjectKey": row["subjectKey"],
                          "fileName": file_name,
                          "digest": sha256(path),
                          "size": path.stat().st_size,
                          "payloadManifestDigest": payload_digest,
                          "signatureReceiptDigest": (
                              row["signatureReceiptDigest"]
                              if role == "candidate-producer" else None
                          ),
                          "notarizationReceiptDigest": (
                              row["notarizationReceiptDigest"]
                              if role == "candidate-producer" else None
                          ),
                          "extractionEvidenceDigest": extraction_digest,
                          "publishedCandidate": role == "candidate-producer",
                      }
                  )
              executions_path = root / "builder-executions.json"
              if executions_path.is_symlink() or not executions_path.is_file():
                  raise SystemExit(f"original {label} omits platform execution provenance")
              executions = json.loads(executions_path.read_text(encoding="utf-8"))
              expected_execution_ids = [
                  "linux-installers",
                  "macos-installer",
                  "portable-apps",
                  "windows-installer",
              ]
              if (
                  not isinstance(executions, list)
                  or [row.get("executionId") for row in executions]
                  != expected_execution_ids
              ):
                  raise SystemExit(f"original {label} platform execution set is not closed")
              for execution in executions:
                  execution_id = execution["executionId"]
                  execution_root = root / "executions" / execution_id
                  execution_handoff = execution_root / "content" / "handoff.json"
                  execution_attestations = execution_root / "attestations.json"
                  if (
                      sha256(execution_handoff) != execution.get("handoffDigest")
                      or sha256(execution_attestations)
                      != execution.get("artifactAttestationDigest")
                      or execution.get("runId") != run_id
                      or execution.get("runAttempt") != run_attempt
                      or execution.get("workflowRef") != expected_workflow
                      or execution.get("workflowSha")
                      != os.environ["EXPECTED_SOURCE_COMMIT"]
                      or execution.get("jobName") != role + "-" + execution_id
                      or execution.get("sourceCommit")
                      != os.environ["EXPECTED_SOURCE_COMMIT"]
                      or execution.get("sourceTreeDigest")
                      != materials["source"]["treeDigest"]
                      or execution.get("materialsDigest") != materials["materialsDigest"]
                      or execution.get("resolutionSnapshotDigest")
                      != snapshot["snapshotDigest"]
                      or execution.get("candidateProductAvailableBeforeBuild") is not False
                      or execution.get("attestationVerified") is not True
                  ):
                      raise SystemExit(
                          f"original {label} {execution_id} execution provenance differs"
                      )
              attestation_digest = sha256(authentication / f"{label}-attestations.json")
              receipt = {
                  "schemaVersion": 1,
                  "kind": "stable-1.0-builder-receipt",
                  "releaseId": os.environ["EXPECTED_RELEASE_ID"],
                  "buildVersion": int(os.environ["EXPECTED_BUILD_VERSION"]),
                  "tag": "v" + os.environ["EXPECTED_BUILD_VERSION"],
                  "sourceCommit": os.environ["EXPECTED_SOURCE_COMMIT"],
                  "sourceRef": "commit:" + os.environ["EXPECTED_SOURCE_COMMIT"],
                  "policyDigest": policy["policyDigest"],
                  "role": role,
                  "builderIdentity": {
                      "repository": "github.com/crypta-network/cryptad",
                      "workflowRef": expected_workflow,
                      "workflowSha": os.environ["EXPECTED_SOURCE_COMMIT"],
                      "runId": run_id,
                      "runAttempt": run_attempt,
                      "jobName": role,
                      "artifactAttestationDigest": attestation_digest,
                      "attestationVerified": True,
                  },
                  "builderExecutions": executions,
                  "source": {
                      "commit": os.environ["EXPECTED_SOURCE_COMMIT"],
                      "ref": "commit:" + os.environ["EXPECTED_SOURCE_COMMIT"],
                      "treeDigest": materials["source"]["treeDigest"],
                      "clean": True,
                  },
                  "materialsDigest": materials["materialsDigest"],
                  "resolutionSnapshotDigest": snapshot["snapshotDigest"],
                  "directInputs": handoff["directInputs"],
                  "buildTasks": policy["builderPolicy"]["buildTasks"],
                  "buildStartedAt": run["run_started_at"],
                  "buildCompletedAt": run["updated_at"],
                  "candidateProductAvailableBeforeBuild": False,
                  "subjects": sorted(subjects, key=lambda value: value["subjectKey"]),
                  "receiptDigest": "sha256:" + "0" * 64,
              }
              receipt["receiptDigest"] = semantic_digest(receipt, "receiptDigest")
              errors = validate_schema(receipt, BUILDER_RECEIPT_SCHEMA)
              if errors:
                  raise SystemExit(f"derived {label} receipt is invalid: {errors[0]}")
              derived = original / f"derived-{label}-builder-receipt.json"
              derived.write_bytes(canonical(receipt) + b"\n")
              return receipt, root

          derive("producer", "candidate-producer")
          derive("verifier", "independent-verifier")
          manifest["inputs"]["primaryBuilderReceipt"] = (
              "build/stable-supply-chain-original/derived-producer-builder-receipt.json"
          )
          manifest["inputs"]["verifierBuilderReceipt"] = (
              "build/stable-supply-chain-original/derived-verifier-builder-receipt.json"
          )
          if manifest["commands"]["stable-supply-chain"]["mode"] == "compare-rebuilds":
              manifest["inputs"]["primarySubjectRoot"] = (
                  "build/stable-supply-chain-original/producer/subjects"
              )
              manifest["inputs"]["verifierSubjectRoot"] = (
                  "build/stable-supply-chain-original/verifier/subjects"
              )
              manifest["inputs"]["primaryPayloadManifests"] = (
                  "build/stable-supply-chain-original/producer/payload-manifests"
              )
              manifest["inputs"]["verifierPayloadManifests"] = (
                  "build/stable-supply-chain-original/verifier/payload-manifests"
              )
          derived_manifest = original / "authenticated-comparison-manifest.json"
          derived_manifest.write_bytes(canonical(manifest) + b"\n")
          PY

      - name: Run side-effect-free rebuild preparation or comparison
        if: >-
          fromJSON(steps.comparison-mode.outputs.mode-json) != 'evaluate-promotion'
        run: >-
          python3 tools/release-certification/certify.py stable-supply-chain
          --manifest build/stable-supply-chain-original/authenticated-comparison-manifest.json

      - name: Run side-effect-free promotion evaluation with protected vulnerability handoff
        if: >-
          fromJSON(steps.comparison-mode.outputs.mode-json) == 'evaluate-promotion'
        env:
          CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64 }}
        run: >-
          python3 tools/release-certification/certify.py stable-supply-chain
          --manifest build/stable-supply-chain-original/authenticated-comparison-manifest.json

      - name: Stage flat authenticated comparison handoff
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          PYTHONPATH: tools/release-certification
        run: |
          set -euo pipefail
          source="build/release-certification/$RELEASE_ID/stable-supply-chain/artifacts/legacy"
          handoff="build/stable-supply-chain/comparison-handoff"
          subject_bundle="build/stable-supply-chain/independent-primary-subjects/stable-1.0-primary-subject-bundle.zip"
          test -d "$source"
          mkdir -p "$handoff"
          cp -a "$source/." "$handoff/"
          cp build/stable-supply-chain-phase/manifest.json "$handoff/manifest.json"
          python3 -m cryptad_certification.engines.stable_1_0_independent_handoff \
            stage-primary \
            --workspace . \
            --manifest build/stable-supply-chain-phase/manifest.json \
            --original-root build/stable-supply-chain-original \
            --output-root "$handoff/independent-reproducibility" \
            --subject-bundle "$subject_bundle" \
            --source-ref "$GITHUB_REF"

      - name: Attest comparison or promotion evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/stable-supply-chain/comparison-handoff/**/*

      - name: Upload immutable comparison handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1.0-supply-chain-${{ inputs.release_id }}-comparison
          path: build/stable-supply-chain/comparison-handoff
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 30

      # Product bytes are intentionally outside the canonical comparison handoff. Existing Stable
      # RC and certification consumers enforce a 256 MiB bound on that legacy artifact.
      - name: Attest independent primary subject bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/stable-supply-chain/independent-primary-subjects/stable-1.0-primary-subject-bundle.zip

      - name: Upload attempt-scoped independent primary subject bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1.0-supply-chain-${{ inputs.release_id }}-independent-primary-subjects-attempt-${{ github.run_attempt }}
          path: build/stable-supply-chain/independent-primary-subjects/stable-1.0-primary-subject-bundle.zip
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30

  publish:
    name: Publish immutable supply-chain evidence and observe exact public bytes
    if: inputs.operation == 'publish' && github.ref_protected
    needs: validate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: stable-1.0-supply-chain-publication
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Download exact promotion-ready supply-chain bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.phase_bundle_run_id }}
          name: ${{ inputs.phase_bundle_artifact_name }}
          path: build/stable-supply-chain-phase

      - name: Authenticate exact plan, eight local assets, and source attestations
        id: publication-inputs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SIGNER: ${{ needs.validate-dispatch.outputs.phase_signer_workflow }}
          EXPECTED_MANIFEST_DIGEST: ${{ inputs.phase_manifest_digest }}
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_BUILD_VERSION: ${{ inputs.build_version }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          root="build/stable-supply-chain-phase"
          manifest="$root/manifest.json"
          plan="$root/stable-1.0-supply-chain-publication-plan.json"
          summary="$root/stable-1.0-supply-chain-summary.json"
          test -f "$manifest" && test ! -L "$manifest"
          actual_manifest="sha256:$(sha256sum "$manifest" | cut -d' ' -f1)"
          if [[ "$actual_manifest" != "$EXPECTED_MANIFEST_DIGEST" ]]; then
            echo "::error::Publication manifest digest differs from the authenticated dispatch."
            exit 1
          fi
          jq -e \
            --arg release "$EXPECTED_RELEASE_ID" \
            --arg version "$EXPECTED_BUILD_VERSION" \
            --arg commit "$EXPECTED_SOURCE_COMMIT" '
              .release.id == $release
              and .release.version == $version
              and .release.profile == "stable-review"
              and .requirements.stableSupplyChain == true
              and .policies.candidateSourceCommit == $commit
              and .policies.candidateSourceRef == ("commit:" + $commit)
              and .inputs.licenseTextRoot == "."
              and .commands["stable-supply-chain"].mode == "evaluate-promotion"' \
            "$manifest" >/dev/null
          python3 - "$root" "$EXPECTED_RELEASE_ID" "$EXPECTED_BUILD_VERSION" \
            "$EXPECTED_SOURCE_COMMIT" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1]).resolve(strict=True)
          release_id, build_version, source_commit = sys.argv[2:]
          expected_files = {
              "manifest.json",
              "stable-1.0-build-materials.json",
              "stable-1.0-component-inventory.json",
              "stable-1.0-component-reverse-index.json",
              "stable-1.0-license-inventory.json",
              "stable-1.0-release-subject-inventory.json",
              "stable-1.0-reproducibility-report.json",
              "stable-1.0-resolved-dependency-snapshot.json",
              "stable-1.0-sbom-binding.json",
              "stable-1.0-sbom.spdx.json",
              "stable-1.0-supply-chain-publication-plan.json",
              "stable-1.0-supply-chain-report.md",
              "stable-1.0-supply-chain-summary.json",
          }
          if any(path.is_symlink() or not path.is_file() for path in root.iterdir()):
              raise SystemExit("publication bundle contains a directory, link, or special entry")
          if {path.name for path in root.iterdir()} != expected_files:
              raise SystemExit("publication bundle is not the closed promotion-ready file set")

          plan_path = root / "stable-1.0-supply-chain-publication-plan.json"
          summary_path = root / "stable-1.0-supply-chain-summary.json"
          policy_path = Path(
              "tools/release-certification/stable-1.0-supply-chain-policy.json"
          ).resolve(strict=True)
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          role_files = {
              "build-materials": "stable-1.0-build-materials.json",
              "component-inventory": "stable-1.0-component-inventory.json",
              "component-reverse-index": "stable-1.0-component-reverse-index.json",
              "license-inventory": "stable-1.0-license-inventory.json",
              "release-subject-inventory": "stable-1.0-release-subject-inventory.json",
              "reproducibility-report": "stable-1.0-reproducibility-report.json",
              "sbom": "stable-1.0-sbom.spdx.json",
              "supply-chain-summary": "stable-1.0-supply-chain-summary.json",
          }
          if (
              plan.get("releaseId") != release_id
              or plan.get("buildVersion") != int(build_version)
              or plan.get("tag") != f"v{build_version}"
              or plan.get("sourceCommit") != source_commit
              or plan.get("sourceRef") != f"commit:{source_commit}"
              or plan.get("policyDigest") != policy.get("policyDigest")
              or plan.get("summaryDigest") != summary.get("summaryDigest")
              or summary.get("mode") != "evaluate-promotion"
              or summary.get("promotionReady") is not True
              or plan.get("overwriteAllowed") is not False
              or plan.get("allowedOperations") != ["created", "verified-existing"]
              or plan.get("sideEffectsPerformed") is not False
          ):
              raise SystemExit("publication plan or promotion summary has a stale identity")
          assets = plan.get("assets")
          if not isinstance(assets, list) or len(assets) != len(role_files):
              raise SystemExit("publication plan does not contain exactly eight roles")
          by_role = {row.get("role"): row for row in assets if isinstance(row, dict)}
          if set(by_role) != set(role_files) or len(by_role) != len(assets):
              raise SystemExit("publication plan role allowlist differs from policy")
          for role, file_name in role_files.items():
              row = by_role[role]
              path = root / file_name
              data = path.read_bytes()
              expected_uri = (
                  "https://github.com/crypta-network/cryptad/releases/download/"
                  f"v{build_version}/{file_name}"
              )
              if (
                  set(row) != {"role", "fileName", "digest", "size", "uri"}
                  or row.get("fileName") != file_name
                  or row.get("digest") != "sha256:" + hashlib.sha256(data).hexdigest()
                  or row.get("size") != len(data)
                  or row.get("uri") != expected_uri
              ):
                  raise SystemExit(f"publication asset binding changed for {role}")
          PY
          if find "$root" \( -type l -o -type f -links +1 \) -print -quit | grep -q .; then
            echo "::error::Publication input contains a symlink or hard-linked file."
            exit 1
          fi
          verification_root="build/stable-supply-chain-publication-attestations"
          mkdir -p "$verification_root"
          index="$verification_root/index.txt"
          : > "$index"
          counter=0
          while IFS= read -r -d '' subject; do
            counter=$((counter + 1))
            verified="$verification_root/$(printf '%03d' "$counter").json"
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$EXPECTED_SIGNER" \
              --signer-digest "$EXPECTED_SOURCE_COMMIT" \
              --source-digest "$EXPECTED_SOURCE_COMMIT" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --format=json > "$verified"
            jq -ceS 'select(type == "array" and length > 0) | sort_by(
              .verificationResult.statement.subject[0].name,
              .verificationResult.statement.subject[0].digest.sha256
            )' "$verified" > "$verified.canonical"
            verified_digest="$(sha256sum "$verified.canonical" | cut -d' ' -f1)"
            printf '%s %s\n' "${subject#"$root/"}" "$verified_digest" >> "$index"
          done < <(find "$root" -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          if [[ "$counter" -ne 13 ]]; then
            echo "::error::Every closed publication input must have a verified attestation."
            exit 1
          fi
          attestation_digest="sha256:$(sha256sum "$index" | cut -d' ' -f1)"
          echo "attestation-digest=$attestation_digest" >> "$GITHUB_OUTPUT"

      - name: Authenticate exact annotated tag and existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUILD_VERSION: ${{ inputs.build_version }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          tag="v$EXPECTED_BUILD_VERSION"
          tag_ref="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
          tag_object="$(jq -er 'select(.object.type == "tag") | .object.sha' <<< "$tag_ref")"
          tag_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
          jq -e --arg tag "$tag" --arg commit "$EXPECTED_SOURCE_COMMIT" '
            .tag == $tag and .object.type == "commit" and .object.sha == $commit' \
            <<< "$tag_json" >/dev/null
          release_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          jq -e \
            --arg tag "$tag" \
            --arg commit "$EXPECTED_SOURCE_COMMIT" \
            --arg page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" '
              (.id | type == "number" and . > 0)
              and .tag_name == $tag
              and .target_commitish == $commit
              and .html_url == $page
              and .draft == false
              and .prerelease == false
              and (.assets | type == "array")' <<< "$release_json" >/dev/null

      - name: Authenticate and install exact reviewed publication-backend wheel
        id: publication-backend
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.publication_backend_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.publication_backend_artifact_name }}
          INPUT_ARTIFACT_DIGEST: ${{ inputs.publication_backend_artifact_digest }}
          EXPECTED_SOURCE_COMMIT: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_SOURCE_COMMIT }}
          EXPECTED_WHEEL_SHA256: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_WHEEL_SHA256 }}
        run: |
          set -euo pipefail
          signer="crypta-network/cryptad/.github/workflows/stable-1.0-maintenance-publication-backend-producer.yml"
          signer_path=".github/workflows/stable-1.0-maintenance-publication-backend-producer.yml"
          entrypoint="cryptad_stable_maintenance_backend:supply_chain_factory"
          if [[ ! "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ \
                || ! "$EXPECTED_WHEEL_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Protected backend source or wheel identity is not configured."
            exit 1
          fi
          run_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$signer_path" \
            --arg commit "$EXPECTED_SOURCE_COMMIT" '
              .repository.full_name == $repository
              and .head_repository.full_name == $repository
              and .path == $workflow
              and .head_sha == $commit
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"' <<< "$run_json" >/dev/null
          artifacts="$(gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID/artifacts" \
            -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
          jq -e --arg name "$INPUT_ARTIFACT_NAME" --arg digest "$INPUT_ARTIFACT_DIGEST" '
            [.artifacts[] | select(
              .name == $name and .expired == false and .digest == $digest
            )] | length == 1' <<< "$artifacts" >/dev/null
          root="build/stable-supply-chain-publication-backend"
          download="$root/download"
          site="$root/site-packages"
          mkdir -p "$download" "$site"
          gh run download "$INPUT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$INPUT_ARTIFACT_NAME" --dir "$download"
          if [[ -n "$(find "$download" -type l -print -quit)" \
                || -n "$(find "$download" -mindepth 1 ! -type f ! -type d -print -quit)" ]]; then
            echo "::error::Publication-backend artifact contains a link or special entry."
            exit 1
          fi
          wheels=()
          while IFS= read -r path; do wheels+=("$path"); done < <(
            find "$download" -type f -name '*.whl' -print | LC_ALL=C sort
          )
          if [[ "${#wheels[@]}" -ne 1 \
                || "$(find "$download" -type f ! -name '*.whl' | wc -l)" -ne 0 ]]; then
            echo "::error::Publication-backend artifact must contain exactly one wheel."
            exit 1
          fi
          wheel="${wheels[0]}"
          actual_wheel_sha256="sha256:$(sha256sum "$wheel" | cut -d' ' -f1)"
          if [[ "$actual_wheel_sha256" != "$EXPECTED_WHEEL_SHA256" ]]; then
            echo "::error::Publication-backend wheel differs from the protected reviewed digest."
            exit 1
          fi
          wheel_verification="$root/wheel-attestation.json"
          gh attestation verify "$wheel" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" \
            --signer-digest "$EXPECTED_SOURCE_COMMIT" \
            --source-digest "$EXPECTED_SOURCE_COMMIT" \
            --deny-self-hosted-runners \
            --format=json > "$wheel_verification"
          jq -ceS 'select(type == "array" and length > 0) | sort_by(
            .verificationResult.statement.subject[0].name,
            .verificationResult.statement.subject[0].digest.sha256
          )' "$wheel_verification" > "$wheel_verification.canonical"
          backend_attestation_digest="sha256:$(sha256sum \
            "$wheel_verification.canonical" | cut -d' ' -f1)"
          python3 -m pip install --no-index --no-deps --no-compile \
            --target "$site" "$wheel" >/dev/null
          python3 -I -S - "$site" "$entrypoint" <<'PY'
          import importlib
          from pathlib import Path
          import sys

          site = Path(sys.argv[1]).resolve(strict=True)
          sys.path.insert(0, str(site))
          module_name, factory_name = sys.argv[2].split(":", 1)
          module = importlib.import_module(module_name)
          if not Path(module.__file__).resolve().is_relative_to(site):
              raise SystemExit("publication backend did not load from the authenticated wheel")
          if not callable(getattr(module, factory_name, None)):
              raise SystemExit("authenticated supply-chain backend factory is unavailable")
          PY
          echo "python-path=$(cd "$site" && pwd -P)" >> "$GITHUB_OUTPUT"
          echo "entrypoint=$entrypoint" >> "$GITHUB_OUTPUT"
          echo "wheel-digest=$actual_wheel_sha256" >> "$GITHUB_OUTPUT"
          echo "attestation-digest=$backend_attestation_digest" >> "$GITHUB_OUTPUT"

      - name: Verify protected leumor publication identity
        env:
          GH_TOKEN: ${{ secrets.LEUMOR_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::The protected LEUMOR_GITHUB_TOKEN secret is required."
            exit 1
          fi
          if [[ "$(gh api user --jq .login)" != "leumor" ]]; then
            echo "::error::Protected GitHub publication identity must be exactly leumor."
            exit 1
          fi

      - name: Publish missing assets, preserve exact existing bytes, and re-observe
        env:
          GITHUB_TOKEN: ${{ secrets.LEUMOR_GITHUB_TOKEN }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          PHASE_ATTESTATION_DIGEST: ${{ steps.publication-inputs.outputs.attestation-digest }}
          BACKEND_ATTESTATION_DIGEST: ${{ steps.publication-backend.outputs.attestation-digest }}
          BACKEND_WHEEL_DIGEST: ${{ steps.publication-backend.outputs.wheel-digest }}
        run: |
          set -euo pipefail
          python3 - "${{ steps.publication-backend.outputs.python-path }}" <<'PY'
          import datetime as dt
          import hashlib
          import importlib
          import json
          import os
          from pathlib import Path
          import sys

          site = Path(sys.argv[1]).resolve(strict=True)
          sys.path.insert(0, str(site))
          module = importlib.import_module("cryptad_stable_maintenance_backend")
          if not Path(module.__file__).resolve().is_relative_to(site):
              raise SystemExit("publication backend escaped the authenticated wheel site")

          source_commit = os.environ["INPUT_SOURCE_COMMIT"]
          workflow_identity = (
              "github.com/crypta-network/cryptad/.github/workflows/"
              f"stable-1.0-supply-chain.yml@{source_commit}"
          )
          authentication = {
              "backendAttestationDigest": os.environ["BACKEND_ATTESTATION_DIGEST"],
              "phaseAttestationDigest": os.environ["PHASE_ATTESTATION_DIGEST"],
              "workflowIdentity": workflow_identity,
          }
          authentication_digest = "sha256:" + hashlib.sha256(
              json.dumps(
                  authentication,
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode("utf-8")
          ).hexdigest()
          producer = module.AuthenticatedProducer(
              backend_identity=(
                  "cryptad_stable_maintenance_backend:supply_chain_factory@"
                  + os.environ["BACKEND_WHEEL_DIGEST"]
              ),
              workflow_identity=workflow_identity,
              attestation_digest=authentication_digest,
              authenticated=True,
          )
          observer = module.AuthenticatedObserver(
              observer_identity=workflow_identity,
              attestation_digest=authentication_digest,
              authenticated=True,
          )
          source_root = Path("build/stable-supply-chain-phase").resolve(strict=True)
          plan_path = source_root / "stable-1.0-supply-chain-publication-plan.json"
          canonical_plan_bytes = plan_path.read_bytes()
          plan = json.loads(canonical_plan_bytes)
          backend = module.supply_chain_factory()

          def timestamp() -> str:
              return (
                  dt.datetime.now(dt.timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z")
              )

          receipt = backend.publish(
              plan,
              canonical_plan_bytes,
              source_root,
              producer,
              timestamp(),
          )
          observation = backend.observe(
              plan,
              canonical_plan_bytes,
              receipt["receiptDigest"],
              observer,
              timestamp(),
          )
          expected_roles = {
              "build-materials",
              "component-inventory",
              "component-reverse-index",
              "license-inventory",
              "release-subject-inventory",
              "reproducibility-report",
              "sbom",
              "supply-chain-summary",
          }
          if (
              {row.get("role") for row in receipt.get("operations", [])}
              != expected_roles
              or any(
                  row.get("operation") not in {"created", "verified-existing"}
                  for row in receipt.get("operations", [])
              )
              or {row.get("role") for row in observation.get("assets", [])}
              != expected_roles
          ):
              raise SystemExit("publication backend returned an open or incomplete role set")

          handoff = Path("build/stable-supply-chain/publication-handoff")
          handoff.mkdir(parents=True)

          def write_json(path: Path, value: object) -> None:
              path.write_text(
                  json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          summary_name = "stable-1.0-supply-chain-summary.json"
          plan_name = "stable-1.0-supply-chain-publication-plan.json"
          receipt_name = "stable-1.0-supply-chain-publication-receipt.json"
          observation_name = "stable-1.0-supply-chain-public-observation.json"
          (handoff / summary_name).write_bytes((source_root / summary_name).read_bytes())
          (handoff / plan_name).write_bytes(canonical_plan_bytes)
          write_json(handoff / receipt_name, receipt)
          write_json(handoff / observation_name, observation)

          original_manifest = json.loads((source_root / "manifest.json").read_text())
          original_manifest["commands"] = {
              "stable-supply-chain": {"args": [], "mode": "verify-publication"}
          }
          original_manifest["execution"] = {
              "evaluationClock": observation["observedAt"]
          }
          original_manifest["inputs"] = {
              "supplyChainPolicy": (
                  "tools/release-certification/stable-1.0-supply-chain-policy.json"
              ),
              "supplyChainPromotionSummary": (
                  "build/stable-supply-chain-phase/" + summary_name
              ),
              "supplyChainPublicationPlan": (
                  "build/stable-supply-chain-phase/" + plan_name
              ),
              "supplyChainPublicationReceipt": (
                  "build/stable-supply-chain-phase/" + receipt_name
              ),
              "supplyChainPublicObservation": (
                  "build/stable-supply-chain-phase/" + observation_name
              ),
          }
          original_manifest["policies"]["publicationIntent"] = (
              "prepare-explicit-protected-publication"
          )
          policy_path = Path(
              "tools/release-certification/stable-1.0-supply-chain-policy.json"
          ).resolve(strict=True)
          publication_policy = json.loads(policy_path.read_text(encoding="utf-8"))[
              "publicationPolicy"
          ]
          immutable_base_uri = publication_policy["immutableBaseUri"]
          if not isinstance(immutable_base_uri, str):
              raise SystemExit("publication policy immutable base URI is invalid")
          original_manifest["policies"]["artifactBaseUri"] = immutable_base_uri
          write_json(handoff / "manifest.json", original_manifest)
          PY
          handoff="build/stable-supply-chain/publication-handoff"
          if [[ -n "$(find "$handoff" -type l -print -quit)" \
                || -n "$(find "$handoff" -mindepth 1 ! -type f ! -type d -print -quit)" \
                || "$(find "$handoff" -maxdepth 1 -type f | wc -l)" -ne 5 ]]; then
            echo "::error::Publication handoff is incomplete or unsafe."
            exit 1
          fi

      - name: Attest exact publication receipt and fresh observation handoff
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/stable-supply-chain/publication-handoff/**/*

      - name: Upload immutable publication handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1.0-supply-chain-${{ inputs.release_id }}-publication
          path: build/stable-supply-chain/publication-handoff
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 30

  verify-publication:
    name: Independently verify public supply-chain evidence
    if: inputs.operation == 'verify-publication' && github.ref_protected
    needs: validate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stable-1.0-supply-chain-publication-verification
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Download exact publication-observation bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.phase_bundle_run_id }}
          name: ${{ inputs.phase_bundle_artifact_name }}
          path: build/stable-supply-chain-phase

      - name: Authenticate publication inputs without publication credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SIGNER: ${{ needs.validate-dispatch.outputs.phase_signer_workflow }}
          EXPECTED_MANIFEST_DIGEST: ${{ inputs.phase_manifest_digest }}
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_BUILD_VERSION: ${{ inputs.build_version }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test -f build/stable-supply-chain-phase/manifest.json
          actual="sha256:$(sha256sum build/stable-supply-chain-phase/manifest.json | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_MANIFEST_DIGEST"
          jq -e --arg id "$EXPECTED_RELEASE_ID" --arg version "$EXPECTED_BUILD_VERSION" \
            --arg commit "$EXPECTED_SOURCE_COMMIT" '
              .release.id == $id and .release.version == $version
              and .release.profile == "stable-review"
              and .policies.candidateSourceCommit == $commit
              and .policies.candidateSourceRef == ("commit:" + $commit)
              and .policies.publicationIntent == "prepare-explicit-protected-publication"
              and (.policies.artifactBaseUri | type == "string")
              and .requirements.stableSupplyChain == true
              and .commands["stable-supply-chain"].mode == "verify-publication"' \
            build/stable-supply-chain-phase/manifest.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          workspace = Path.cwd().resolve()
          root = (workspace / "build/stable-supply-chain-phase").resolve(strict=True)
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          allowed = {manifest_path.resolve()}
          policy = (workspace / "tools/release-certification/stable-1.0-supply-chain-policy.json").resolve(strict=True)
          for value in manifest["inputs"].values():
              configured = Path(value)
              if configured.is_absolute() or ".." in configured.parts:
                  raise SystemExit("phase input path is unsafe")
              target = (workspace / configured).resolve(strict=True)
              if target == policy:
                  continue
              target.relative_to(root)
              cursor = target
              while cursor != root:
                  allowed.add(cursor)
                  cursor = cursor.parent
              if target.is_dir():
                  allowed.update(child.resolve() for child in target.rglob("*"))
          if {child.resolve() for child in root.rglob("*")} != allowed:
              raise SystemExit("phase bundle contains an unreferenced entry")
          PY
          if find build/stable-supply-chain-phase \( -type l -o -type f -links +1 \) -print -quit | grep -q .; then
            exit 1
          fi
          while IFS= read -r -d '' subject; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$EXPECTED_SIGNER" \
              --signer-digest "$EXPECTED_SOURCE_COMMIT" \
              --source-digest "$EXPECTED_SOURCE_COMMIT" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners >/dev/null
          done < <(find build/stable-supply-chain-phase -type f -print0 | LC_ALL=C sort -z)

      - name: Verify publication receipt and independent public observation
        run: >-
          python3 tools/release-certification/certify.py stable-supply-chain
          --manifest build/stable-supply-chain-phase/manifest.json

      - name: Attest publication-verification result
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: >-
            build/release-certification/${{ inputs.release_id }}/stable-supply-chain/**/*

      - name: Upload immutable publication-verification result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1.0-supply-chain-${{ inputs.release_id }}-publication-verification
          path: build/release-certification/${{ inputs.release_id }}/stable-supply-chain
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 30
