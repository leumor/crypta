name: Stable 1.0 Maintenance Release
run-name: >-
  Stable 1.0 ${{ inputs.release_class }} ${{ inputs.release_id }} build ${{ inputs.build_version }} (${{ inputs.operation }})

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Path-safe Stable 1.0 maintenance release ID.
        required: true
        type: string
      build_version:
        description: Positive integer Cryptad build; the protected tag is v<build>.
        required: true
        type: string
      release_class:
        description: Closed Stable 1.0 release class.
        required: true
        type: choice
        options:
          - maintenance
          - security-hotfix
      candidate_commit:
        description: Exact lowercase 40-character source commit to build and freeze.
        required: true
        type: string
      expected_predecessor_pointer_digest:
        description: SHA-256 of the latest-published pointer observed when authorization was prepared.
        required: true
        type: string
      protected_inputs_run_id:
        description: Protected phase input run, or final PR-290 verification run on a post-publication publish retry.
        required: false
        default: ''
        type: string
      protected_inputs_artifact_name:
        description: Exact protected input or final PR-290 handoff artifact name.
        required: false
        default: ''
        type: string
      protected_inputs_artifact_digest:
        description: Exact protected input or final PR-290 Actions sha256:<hex> artifact digest.
        required: false
        default: ''
        type: string
      operation:
        description: Closed release operation; candidate production, validation/authorization, and publication are separate runs.
        required: true
        type: choice
        options:
          - produce-app-products
          - produce-experimental-app-products
          - freeze-candidate
          - prepare-authorization
          - validate-authorization
          - publish
      frozen_candidate_run_id:
        description: Prior freeze-candidate run containing exact built-once bytes; required only for prepare-authorization.
        required: false
        default: ''
        type: string
      frozen_candidate_artifact_name:
        description: Exact attested frozen-candidate artifact name; required only for prepare-authorization.
        required: false
        default: ''
        type: string
      frozen_candidate_artifact_digest:
        description: Exact frozen-candidate artifact sha256:<hex>; required only for prepare-authorization.
        required: false
        default: ''
        type: string
      validated_candidate_run_id:
        description: Prior validate-authorization run containing the attested authorized candidate; required only for publish.
        required: false
        default: ''
        type: string
      validated_candidate_artifact_name:
        description: Prior attested authorized-candidate artifact name; required only for publish.
        required: false
        default: ''
        type: string
      validated_candidate_artifact_digest:
        description: Prior attested authorized-candidate artifact sha256:<hex>; required only for publish.
        required: false
        default: ''
        type: string
      prepared_candidate_run_id:
        description: Prior prepare-authorization run; required only for validate-authorization.
        required: false
        default: ''
        type: string
      prepared_candidate_artifact_name:
        description: Exact attested prepared-candidate artifact name; required only for validate-authorization.
        required: false
        default: ''
        type: string
      prepared_candidate_artifact_digest:
        description: Exact prepared-candidate artifact sha256:<hex>; required only for validate-authorization.
        required: false
        default: ''
        type: string
      windows_exe_run_id:
        description: Authenticated external Windows EXE producer run; required only for freeze-candidate.
        required: false
        default: ''
        type: string
      windows_exe_artifact_name:
        description: Exact external Windows EXE artifact name; required only for freeze-candidate.
        required: false
        default: ''
        type: string
      windows_exe_artifact_digest:
        description: External Windows EXE Actions artifact sha256:<hex>; required only for freeze-candidate.
        required: false
        default: ''
        type: string
      windows_exe_sha256:
        description: Exact sha256:<hex> digest of the externally produced Windows EXE.
        required: false
        default: ''
        type: string
      publication_backend_run_id:
        description: Protected producer run containing the reviewed publication-provider wheel; required only for publish.
        required: false
        default: ''
        type: string
      publication_backend_artifact_name:
        description: Exact publication-provider artifact name; required only for publish.
        required: false
        default: ''
        type: string
      publication_backend_artifact_digest:
        description: Exact publication-provider artifact sha256:<hex>; required only for publish.
        required: false
        default: ''
        type: string
# A global lock is intentional: different integer builds must not race while both claim the
# latest Stable 1.0 predecessor or wait for protected-environment approval.
concurrency:
  group: stable-1-0-maintenance-publication
  cancel-in-progress: false

permissions: {}

jobs:
  validate-dispatch:
    name: Validate immutable release identity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      expected_branch: ${{ steps.identity.outputs.expected_branch }}

    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Gradle properties
        uses: ./.github/actions/setup-gradle-properties

      - name: Validate integer build, class, branch, commit, and clean source
        id: identity
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INPUT_POINTER_DIGEST: ${{ inputs.expected_predecessor_pointer_digest }}
          INPUT_PROTECTED_RUN_ID: ${{ inputs.protected_inputs_run_id }}
          INPUT_PROTECTED_ARTIFACT_NAME: ${{ inputs.protected_inputs_artifact_name }}
          INPUT_PROTECTED_ARTIFACT_DIGEST: ${{ inputs.protected_inputs_artifact_digest }}
          INPUT_VALIDATED_RUN_ID: ${{ inputs.validated_candidate_run_id }}
          INPUT_VALIDATED_ARTIFACT_NAME: ${{ inputs.validated_candidate_artifact_name }}
          INPUT_VALIDATED_ARTIFACT_DIGEST: ${{ inputs.validated_candidate_artifact_digest }}
          INPUT_FROZEN_RUN_ID: ${{ inputs.frozen_candidate_run_id }}
          INPUT_FROZEN_ARTIFACT_NAME: ${{ inputs.frozen_candidate_artifact_name }}
          INPUT_FROZEN_ARTIFACT_DIGEST: ${{ inputs.frozen_candidate_artifact_digest }}
          INPUT_PREPARED_RUN_ID: ${{ inputs.prepared_candidate_run_id }}
          INPUT_PREPARED_ARTIFACT_NAME: ${{ inputs.prepared_candidate_artifact_name }}
          INPUT_PREPARED_ARTIFACT_DIGEST: ${{ inputs.prepared_candidate_artifact_digest }}
          INPUT_WINDOWS_RUN_ID: ${{ inputs.windows_exe_run_id }}
          INPUT_WINDOWS_ARTIFACT_NAME: ${{ inputs.windows_exe_artifact_name }}
          INPUT_WINDOWS_ARTIFACT_DIGEST: ${{ inputs.windows_exe_artifact_digest }}
          INPUT_WINDOWS_EXE_SHA256: ${{ inputs.windows_exe_sha256 }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_BACKEND_RUN_ID: ${{ inputs.publication_backend_run_id }}
          INPUT_BACKEND_ARTIFACT_NAME: ${{ inputs.publication_backend_artifact_name }}
          INPUT_BACKEND_ARTIFACT_DIGEST: ${{ inputs.publication_backend_artifact_digest }}
          INPUT_LIFECYCLE_BACKEND_RUN_ID: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_RUN_ID }}
          INPUT_LIFECYCLE_BACKEND_ARTIFACT_NAME: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_ARTIFACT_NAME }}
          INPUT_LIFECYCLE_BACKEND_ARTIFACT_DIGEST: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_ARTIFACT_DIGEST }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ${#INPUT_RELEASE_ID} -gt 128 \
                || ! "$INPUT_RELEASE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::release_id must be path-safe and at most 128 characters."
            exit 1
          fi
          if [[ ! "$INPUT_BUILD_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::build_version must be one canonical positive integer."
            exit 1
          fi
          if [[ ! "$INPUT_CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_commit must be an exact lowercase commit."
            exit 1
          fi
          if [[ ! "$INPUT_POINTER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The authorized predecessor pointer digest is malformed."
            exit 1
          fi
          if [[ "$INPUT_OPERATION" != freeze-candidate && "$INPUT_OPERATION" != produce-app-products && "$INPUT_OPERATION" != produce-experimental-app-products \
                && ( ! "$INPUT_LIFECYCLE_BACKEND_RUN_ID" =~ ^[1-9][0-9]*$ \
                  || "$INPUT_LIFECYCLE_BACKEND_ARTIFACT_NAME" \
                    != "stable-1.0-support-lifecycle-publication-backend" \
                  || ! "$INPUT_LIFECYCLE_BACKEND_ARTIFACT_DIGEST" \
                    =~ ^sha256:[0-9a-f]{64}$ ) ]]; then
            echo "::error::Authorization and publication require the exact read-only lifecycle provider."
            exit 1
          fi
          if [[ "$INPUT_RELEASE_CLASS" == maintenance ]]; then
            expected_branch="release/$INPUT_BUILD_VERSION"
          elif [[ "$INPUT_RELEASE_CLASS" == security-hotfix ]]; then
            expected_branch="hotfix/$INPUT_BUILD_VERSION"
          else
            echo "::error::Unsupported release class."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/$expected_branch" ]]; then
            echo "::error::Dispatch must run from the exact $expected_branch branch."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$INPUT_CANDIDATE_COMMIT" ]]; then
            echo "::error::Checked-out source differs from candidate_commit."
            exit 1
          fi
          encoded_branch="${expected_branch//\//%2F}"
          branch_commit="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded_branch" --jq '.object.sha')"
          if [[ "$branch_commit" != "$INPUT_CANDIDATE_COMMIT" ]]; then
            echo "::error::The release/hotfix branch moved or does not identify the candidate."
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Stable maintenance execution requires a clean source tree."
            exit 1
          fi
          project_version="$(./gradlew -q printVersion)"
          if [[ "$project_version" != "$INPUT_BUILD_VERSION" ]]; then
            echo "::error::build.gradle.kts integer version differs from the dispatch."
            exit 1
          fi
          if [[ "$INPUT_OPERATION" == publish ]]; then
            if [[ -n "$INPUT_PROTECTED_RUN_ID$INPUT_PROTECTED_ARTIFACT_NAME$INPUT_PROTECTED_ARTIFACT_DIGEST" ]] && {
                 [[ ! "$INPUT_PROTECTED_RUN_ID" =~ ^[1-9][0-9]*$ ]] \
                   || [[ "$INPUT_PROTECTED_ARTIFACT_NAME" \
                      != "stable-1.0-dependency-vulnerability-$INPUT_RELEASE_ID-publication-verified" ]] \
                   || [[ ! "$INPUT_PROTECTED_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]];
               }; then
              echo "::error::Post-publication protected inputs must be absent or identify the exact final PR-290 handoff."
              exit 1
            fi
          elif [[ "$INPUT_OPERATION" != produce-app-products && "$INPUT_OPERATION" != produce-experimental-app-products && ( ! "$INPUT_PROTECTED_RUN_ID" =~ ^[1-9][0-9]*$ \
                  || ! "$INPUT_PROTECTED_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ \
                  || ! "$INPUT_PROTECTED_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ) ]]; then
            echo "::error::This operation requires an exact protected input producer identity."
            exit 1
          fi
          if [[ "$INPUT_OPERATION" == publish ]]; then
            if [[ ! "$INPUT_VALIDATED_RUN_ID" =~ ^[1-9][0-9]*$ \
                  || ! "$INPUT_VALIDATED_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ \
                  || ! "$INPUT_VALIDATED_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::publish requires an exact prior validated-and-authorized artifact."
              exit 1
            fi
            if [[ ! "$INPUT_BACKEND_RUN_ID" =~ ^[1-9][0-9]*$ \
                  || ! "$INPUT_BACKEND_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ \
                  || ! "$INPUT_BACKEND_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::publish requires the exact reviewed publication-provider artifact."
              exit 1
            fi
            if [[ -n "$INPUT_FROZEN_RUN_ID$INPUT_FROZEN_ARTIFACT_NAME$INPUT_FROZEN_ARTIFACT_DIGEST$INPUT_PREPARED_RUN_ID$INPUT_PREPARED_ARTIFACT_NAME$INPUT_PREPARED_ARTIFACT_DIGEST$INPUT_WINDOWS_RUN_ID$INPUT_WINDOWS_ARTIFACT_NAME$INPUT_WINDOWS_ARTIFACT_DIGEST$INPUT_WINDOWS_EXE_SHA256" ]]; then
              echo "::error::publish reuses validated frozen bytes and forbids new package inputs."
              exit 1
            fi
          elif [[ "$INPUT_OPERATION" == prepare-authorization ]]; then
            if [[ ! "$INPUT_FROZEN_RUN_ID" =~ ^[1-9][0-9]*$ \
                  || ! "$INPUT_FROZEN_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ \
                  || ! "$INPUT_FROZEN_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::prepare-authorization requires an exact prior frozen-candidate artifact."
              exit 1
            fi
            if [[ -n "$INPUT_PREPARED_RUN_ID$INPUT_PREPARED_ARTIFACT_NAME$INPUT_PREPARED_ARTIFACT_DIGEST$INPUT_VALIDATED_RUN_ID$INPUT_VALIDATED_ARTIFACT_NAME$INPUT_VALIDATED_ARTIFACT_DIGEST$INPUT_WINDOWS_RUN_ID$INPUT_WINDOWS_ARTIFACT_NAME$INPUT_WINDOWS_ARTIFACT_DIGEST$INPUT_WINDOWS_EXE_SHA256$INPUT_BACKEND_RUN_ID$INPUT_BACKEND_ARTIFACT_NAME$INPUT_BACKEND_ARTIFACT_DIGEST" ]]; then
              echo "::error::prepare-authorization consumes frozen bytes and forbids other phase inputs."
              exit 1
            fi
          elif [[ "$INPUT_OPERATION" == validate-authorization ]]; then
            if [[ ! "$INPUT_PREPARED_RUN_ID" =~ ^[1-9][0-9]*$ \
                  || ! "$INPUT_PREPARED_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ \
                  || ! "$INPUT_PREPARED_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::validate-authorization requires an exact prepared artifact."
              exit 1
            fi
            if [[ -n "$INPUT_FROZEN_RUN_ID$INPUT_FROZEN_ARTIFACT_NAME$INPUT_FROZEN_ARTIFACT_DIGEST$INPUT_VALIDATED_RUN_ID$INPUT_VALIDATED_ARTIFACT_NAME$INPUT_VALIDATED_ARTIFACT_DIGEST$INPUT_WINDOWS_RUN_ID$INPUT_WINDOWS_ARTIFACT_NAME$INPUT_WINDOWS_ARTIFACT_DIGEST$INPUT_WINDOWS_EXE_SHA256$INPUT_BACKEND_RUN_ID$INPUT_BACKEND_ARTIFACT_NAME$INPUT_BACKEND_ARTIFACT_DIGEST" ]]; then
              echo "::error::validate-authorization accepts only the prepared artifact and exact approval input."
              exit 1
            fi
          elif [[ "$INPUT_OPERATION" == produce-app-products || "$INPUT_OPERATION" == produce-experimental-app-products ]]; then
            if [[ -n "$INPUT_PROTECTED_RUN_ID$INPUT_PROTECTED_ARTIFACT_NAME$INPUT_PROTECTED_ARTIFACT_DIGEST$INPUT_FROZEN_RUN_ID$INPUT_FROZEN_ARTIFACT_NAME$INPUT_FROZEN_ARTIFACT_DIGEST$INPUT_PREPARED_RUN_ID$INPUT_PREPARED_ARTIFACT_NAME$INPUT_PREPARED_ARTIFACT_DIGEST$INPUT_VALIDATED_RUN_ID$INPUT_VALIDATED_ARTIFACT_NAME$INPUT_VALIDATED_ARTIFACT_DIGEST$INPUT_WINDOWS_RUN_ID$INPUT_WINDOWS_ARTIFACT_NAME$INPUT_WINDOWS_ARTIFACT_DIGEST$INPUT_BACKEND_RUN_ID$INPUT_BACKEND_ARTIFACT_NAME$INPUT_BACKEND_ARTIFACT_DIGEST" ]]; then
              echo "::error::App product preparation forbids future daemon freeze, authorization and publication inputs."
              exit 1
            fi
          elif [[ "$INPUT_OPERATION" == freeze-candidate ]]; then
            if [[ ! "$INPUT_WINDOWS_RUN_ID" =~ ^[1-9][0-9]*$ \
                  || ! "$INPUT_WINDOWS_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ \
                  || ! "$INPUT_WINDOWS_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ \
                  || ! "$INPUT_WINDOWS_EXE_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::freeze-candidate requires an authenticated external Windows EXE."
              exit 1
            fi
            if [[ -n "$INPUT_FROZEN_RUN_ID$INPUT_FROZEN_ARTIFACT_NAME$INPUT_FROZEN_ARTIFACT_DIGEST$INPUT_PREPARED_RUN_ID$INPUT_PREPARED_ARTIFACT_NAME$INPUT_PREPARED_ARTIFACT_DIGEST$INPUT_VALIDATED_RUN_ID$INPUT_VALIDATED_ARTIFACT_NAME$INPUT_VALIDATED_ARTIFACT_DIGEST$INPUT_BACKEND_RUN_ID$INPUT_BACKEND_ARTIFACT_NAME$INPUT_BACKEND_ARTIFACT_DIGEST" ]]; then
              echo "::error::freeze-candidate builds once and forbids prior candidate/publication inputs."
              exit 1
            fi
          else
            echo "::error::Unsupported maintenance operation."
            exit 1
          fi
          echo "expected_branch=$expected_branch" >> "$GITHUB_OUTPUT"

      - name: Run deterministic Stable maintenance self-test
        run: python3 tools/release-certification/certify.py stable-maintenance --self-test

  produce-app-products:
    name: Build and authenticate prospective maintenance app products
    if: inputs.operation == 'produce-app-products' || inputs.operation == 'produce-experimental-app-products'
    needs: validate-dispatch
    runs-on: ubuntu-latest
    environment: stable-1.0-maintenance-evidence
    timeout-minutes: 120
    permissions:
      contents: read
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Check out exact app source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install Gradle properties
        uses: ./.github/actions/setup-gradle-properties
      - name: Build signed app bytes once before daemon freeze
        env:
          CRYPTAD_APP_SIGNING_KEY_ID: ${{ secrets.CRYPTAD_APP_SIGNING_KEY_ID }}
          CRYPTAD_APP_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.CRYPTAD_APP_SIGNING_PRIVATE_KEY_BASE64 }}
          CRYPTAD_APP_SIGNING_PUBLIC_KEY_BASE64: ${{ secrets.CRYPTAD_APP_SIGNING_PUBLIC_KEY_BASE64 }}
          INCLUDE_MAIL: ${{ inputs.operation == 'produce-experimental-app-products' }}
        run: |
          set -euo pipefail
          tasks=(packageFirstPartyApps :platform-devtools:installDist)
          if [[ "$INCLUDE_MAIL" == true ]]; then
            tasks+=(:apps:mail-prototype:packageApp)
          fi
          ./gradlew "${tasks[@]}"
          git diff-index --quiet HEAD --
      - name: Seal locally signed Stable and optional experimental catalogs
        env:
          CRYPTAD_APP_SIGNING_KEY_ID: ${{ secrets.CRYPTAD_APP_SIGNING_KEY_ID }}
          CRYPTAD_APP_SIGNING_PUBLIC_KEY_BASE64: ${{ secrets.CRYPTAD_APP_SIGNING_PUBLIC_KEY_BASE64 }}
          STABLE_CATALOG_SIGNING_KEY_ID: ${{ secrets.STABLE_CATALOG_SIGNING_KEY_ID }}
          STABLE_CATALOG_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.STABLE_CATALOG_SIGNING_PRIVATE_KEY_BASE64 }}
          STABLE_CATALOG_SIGNING_PUBLIC_KEY_BASE64: ${{ secrets.STABLE_CATALOG_SIGNING_PUBLIC_KEY_BASE64 }}
          ARTIFACT_BASE: ${{ vars.CRYPTAD_MAINTENANCE_APP_ARTIFACT_BASE }}
          INCLUDE_MAIL: ${{ inputs.operation == 'produce-experimental-app-products' }}
          RELEASE_ID: ${{ inputs.release_id }}
          BUILD_VERSION: ${{ inputs.build_version }}
          SOURCE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$INCLUDE_MAIL" == true ]]; then options+=(--include-mail); fi
          python3 tools/release-certification/protected/maintenance_app_products.py \
            --workspace "$GITHUB_WORKSPACE" --output build/maintenance-app-products \
            --release-id "$RELEASE_ID" --build-version "$BUILD_VERSION" --source-commit "$SOURCE_COMMIT" \
            --artifact-base "$ARTIFACT_BASE" --java-home "$JAVA_HOME" \
            --exporter "$GITHUB_WORKSPACE/platform-devtools/build/install/crypta-app/bin/crypta-app" "${options[@]}"
          git diff-index --quiet HEAD --
      - name: Attest exact app handoff and all catalog and bundle members
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/maintenance-app-products/maintenance-app-subject-handoff.json
            build/maintenance-app-products/apps/*
            build/maintenance-app-products/catalogs/**/*
      - name: Retain signed pre-freeze products without publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance-app-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/maintenance-app-products/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30

  build-packages:
    name: Build exact ${{ matrix.package_class }} candidate bytes
    if: inputs.operation == 'freeze-candidate'
    needs: validate-dispatch
    runs-on: ${{ matrix.runner }}
    environment: stable-1.0-maintenance-evidence
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      attestations: write
      artifact-metadata: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - package_class: linux-and-portable
            runner: ubuntu-latest
            gradle_tasks: >-
              assembleCryptadDist distTarCryptad distZipCryptad distJlinkCryptad
              jpackageInstallerLinuxAll
          - package_class: macos
            runner: macos-15-intel
            gradle_tasks: jpackageInstallerCryptad

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Gradle properties
        uses: ./.github/actions/setup-gradle-properties

      - name: Install Linux RPM packaging tools
        if: matrix.package_class == 'linux-and-portable'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes rpm
          command -v rpm >/dev/null
          command -v rpmbuild >/dev/null

      - name: Build package set once
        if: matrix.package_class == 'linux-and-portable'
        env:
          GRADLE_TASKS: ${{ matrix.gradle_tasks }}
        run: ./gradlew $GRADLE_TASKS

      - name: Build, Developer ID sign, notarize, staple, and verify macOS package once
        if: matrix.package_class == 'macos'
        env:
          GRADLE_TASKS: ${{ matrix.gradle_tasks }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ vars.CRYPTAD_MACOS_DEVELOPER_ID_APPLICATION }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.CRYPTAD_MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.CRYPTAD_MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.CRYPTAD_MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.CRYPTAD_MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.CRYPTAD_MACOS_NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ ! "$MACOS_DEVELOPER_ID_APPLICATION" =~ ^Developer\ ID\ Application:\ .+\ \([A-Z0-9]{10}\)$ \
                || -z "$MACOS_CERTIFICATE_P12_BASE64" \
                || -z "$MACOS_CERTIFICATE_PASSWORD" \
                || -z "$MACOS_NOTARY_APPLE_ID" \
                || ! "$MACOS_NOTARY_TEAM_ID" =~ ^[A-Z0-9]{10}$ \
                || -z "$MACOS_NOTARY_APP_PASSWORD" ]]; then
            echo "::error::Protected Developer ID and notarization inputs are incomplete."
            exit 1
          fi
          keychain="$RUNNER_TEMP/cryptad-maintenance-signing.keychain-db"
          certificate="$RUNNER_TEMP/cryptad-maintenance-signing.p12"
          notary_output="$RUNNER_TEMP/cryptad-maintenance-notary.json"
          notary_error="$RUNNER_TEMP/cryptad-maintenance-notary.err"
          mount_point="$RUNNER_TEMP/cryptad-maintenance-dmg"
          mounted_device=''
          cleanup() {
            if [[ -n "$mounted_device" ]]; then
              hdiutil detach "$mounted_device" -force >/dev/null 2>&1 || true
            fi
            rmdir "$mount_point" >/dev/null 2>&1 || true
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate" "$notary_output" "$notary_error"
          }
          trap cleanup EXIT
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          if [[ "$(security find-identity -v -p codesigning "$keychain" \
              | grep -F -c -- "\"$MACOS_DEVELOPER_ID_APPLICATION\"")" -ne 1 ]]; then
            echo "::error::The protected keychain does not contain exactly the reviewed Developer ID identity."
            exit 1
          fi
          xcrun notarytool store-credentials cryptad-maintenance \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --keychain "$keychain" >/dev/null
          ./gradlew $GRADLE_TASKS \
            -PmacSigningKeyUserName="$MACOS_DEVELOPER_ID_APPLICATION"
          required=()
          while IFS= read -r path; do required+=("$path"); done < <(
            find build/jpackage -maxdepth 1 -type f -name '*.dmg' -print | LC_ALL=C sort
          )
          if [[ "${#required[@]}" -ne 1 ]]; then
            echo "::error::The signed macOS producer must emit exactly one DMG."
            exit 1
          fi
          dmg="${required[0]}"
          app="build/jpackage/Crypta.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --force --timestamp --sign "$MACOS_DEVELOPER_ID_APPLICATION" \
            --keychain "$keychain" "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          if ! xcrun notarytool submit "$dmg" \
              --keychain-profile cryptad-maintenance --keychain "$keychain" \
              --wait --output-format json >"$notary_output" 2>"$notary_error"; then
            echo "::error::Apple notarization submission failed."
            exit 1
          fi
          if [[ "$(jq -er '.status' "$notary_output")" != Accepted ]]; then
            echo "::error::Apple did not accept the DMG notarization submission."
            exit 1
          fi
          submission_id="$(jq -er '.id' "$notary_output")"
          xcrun notarytool info "$submission_id" \
            --keychain-profile cryptad-maintenance --keychain "$keychain" \
            --output-format json >"$RUNNER_TEMP/cryptad-maintenance-notary-info.json" 2>"$notary_error"
          if [[ "$(jq -er '.status' "$RUNNER_TEMP/cryptad-maintenance-notary-info.json")" != Accepted ]]; then
            echo "::error::Apple notarization status could not be independently confirmed."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/cryptad-maintenance-notary-info.json"
          xcrun stapler staple "$dmg" >/dev/null
          xcrun stapler validate "$dmg" >/dev/null
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$dmg"
          spctl --assess --type execute --verbose=2 "$app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mkdir "$mount_point"
          mounted_device="$(hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$dmg" \
            | awk 'END {print $1}')"
          if [[ ! "$mounted_device" =~ ^/dev/ ]]; then
            echo "::error::The final stapled DMG could not be mounted read-only."
            exit 1
          fi
          contained_executables=()
          while IFS= read -r path; do contained_executables+=("$path"); done < <(
            find "$mount_point" -type f -path '*/Crypta.app/Contents/MacOS/Crypta' -print \
              | LC_ALL=C sort
          )
          if [[ "${#contained_executables[@]}" -ne 1 ]]; then
            echo "::error::The final stapled DMG does not contain exactly one Crypta executable."
            exit 1
          fi
          contained_executable="${contained_executables[0]}"
          app_architectures="$(lipo -archs "$contained_executable")"
          if [[ "$app_architectures" != x86_64 ]]; then
            echo "::error::The final amd64 DMG contains '$app_architectures' application bytes."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 \
            "$(dirname "$(dirname "$(dirname "$contained_executable")")")"
          hdiutil detach "$mounted_device" >/dev/null
          mounted_device=''
          rmdir "$mount_point"
          mkdir -p build/stable-maintenance-macos-verification
          jq -n \
            --arg identity "$MACOS_DEVELOPER_ID_APPLICATION" \
            --arg team_id "$MACOS_NOTARY_TEAM_ID" \
            --arg producer_architecture amd64 \
            --arg file_name "$(basename "$dmg")" \
            --arg subject_digest "sha256:$(shasum -a 256 "$dmg" | awk '{print $1}')" \
            --argjson subject_size "$(stat -f '%z' "$dmg")" \
            '{schemaVersion: 1, kind: "stable-1.0-maintenance-macos-package-verification",
              signingIdentity: $identity, teamId: $team_id, signingStatus: "pass",
              producerArchitecture: $producer_architecture,
              fileName: $file_name, subjectDigest: $subject_digest,
              subjectSizeBytes: $subject_size,
              notarizationStatus: "pass", staplingStatus: "pass", gatekeeperStatus: "pass",
              redaction: {status: "pass", findingCount: 0, findings: []}}' \
            > build/stable-maintenance-macos-verification/verification.json

      - name: Reject tracked source or index drift after package build
        env:
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD^{commit})" != "$INPUT_CANDIDATE_COMMIT" ]]; then
            echo "::error::The package producer checkout moved away from the candidate commit."
            exit 1
          fi
          if ! git diff-index --quiet --cached HEAD -- \
              || ! git diff-files --quiet --; then
            echo "::error::The package build changed tracked source or the Git index."
            git status --short --untracked-files=no
            exit 1
          fi

      - name: Stage exact package producer output
        env:
          PACKAGE_CLASS: ${{ matrix.package_class }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EXPECTED_BRANCH: ${{ needs.validate-dispatch.outputs.expected_branch }}
          GRADLE_TASKS: ${{ matrix.gradle_tasks }}
        shell: bash
        run: |
          set -euo pipefail
          output="build/stable-maintenance-package-output/$PACKAGE_CLASS"
          rm -rf "$output"
          mkdir -p "$output/assets"
          required=()
          if [[ "$PACKAGE_CLASS" == linux-and-portable ]]; then
            while IFS= read -r path; do required+=("$path"); done < <(
              find build/jpackage -maxdepth 1 -type f \
                \( -name '*.deb' -o -name '*.rpm' \) -print | LC_ALL=C sort
            )
            if [[ "${#required[@]}" -ne 2 \
                  || "$(find build/jpackage -maxdepth 1 -type f -name '*.deb' | wc -l)" -ne 1 \
                  || "$(find build/jpackage -maxdepth 1 -type f -name '*.rpm' | wc -l)" -ne 1 ]]; then
              echo "::error::The Linux producer must build exactly one DEB and one RPM."
              exit 1
            fi
            portable=()
            while IFS= read -r path; do portable+=("$path"); done < <(
              find build/distributions -maxdepth 1 -type f \
                \( -name "cryptad-v$INPUT_BUILD_VERSION.tar.gz" \
                   -o -name "cryptad-v$INPUT_BUILD_VERSION.zip" \
                   -o -name "cryptad-jlink-v$INPUT_BUILD_VERSION.tar.gz" \
                   -o -name "cryptad-jlink-v$INPUT_BUILD_VERSION.zip" \) -print \
                | LC_ALL=C sort
            )
            if [[ "${#portable[@]}" -ne 4 ]]; then
              echo "::error::The portable producer did not emit the closed four-archive set."
              exit 1
            fi
            required+=("${portable[@]}")
          else
            while IFS= read -r path; do required+=("$path"); done < <(
              find build/jpackage -maxdepth 1 -type f -name '*.dmg' -print | LC_ALL=C sort
            )
            if [[ "${#required[@]}" -ne 1 ]]; then
              echo "::error::The macOS producer must build exactly one DMG."
              exit 1
            fi
            verification="build/stable-maintenance-macos-verification/verification.json"
            dmg="${required[0]}"
            dmg_digest="sha256:$(shasum -a 256 "$dmg" | awk '{print $1}')"
            dmg_size="$(stat -f '%z' "$dmg")"
            if [[ -L "$verification" || ! -f "$verification" \
                  || "$(jq -er '.signingStatus' "$verification")" != pass \
                  || "$(jq -er '.notarizationStatus' "$verification")" != pass \
                  || "$(jq -er '.staplingStatus' "$verification")" != pass \
                  || "$(jq -er '.gatekeeperStatus' "$verification")" != pass \
                  || "$(jq -er '.fileName' "$verification")" != "$(basename "$dmg")" \
                  || "$(jq -er '.subjectDigest' "$verification")" != "$dmg_digest" \
                  || "$(jq -er '.subjectSizeBytes' "$verification")" != "$dmg_size" ]]; then
              echo "::error::The DMG lacks passing protected signing and notarization verification."
              exit 1
            fi
            cp "$verification" "$output/verification.json"
          fi
          asset_architectures='{}'
          for source in "${required[@]}"; do
            if [[ -L "$source" || ! -f "$source" ]]; then
              echo "::error::Package producer output is unsafe."
              exit 1
            fi
            producer_architecture=''
            case "$source" in
              *.deb)
                raw_architecture="$(dpkg-deb --field "$source" Architecture)"
                case "$raw_architecture" in
                  amd64) producer_architecture=amd64 ;;
                  arm64) producer_architecture=arm64 ;;
                  *)
                    echo "::error::Unsupported DEB architecture '$raw_architecture'."
                    exit 1
                    ;;
                esac
                ;;
              *.rpm)
                raw_architecture="$(rpm -qp --qf '%{ARCH}' "$source")"
                case "$raw_architecture" in
                  x86_64|amd64) producer_architecture=amd64 ;;
                  aarch64|arm64) producer_architecture=arm64 ;;
                  *)
                    echo "::error::Unsupported RPM architecture '$raw_architecture'."
                    exit 1
                    ;;
                esac
                ;;
              *.dmg)
                producer_architecture="$(jq -er '.producerArchitecture' \
                  build/stable-maintenance-macos-verification/verification.json)"
                ;;
            esac
            if [[ -n "$producer_architecture" ]]; then
              asset_architectures="$(jq -cn \
                --argjson current "$asset_architectures" \
                --arg name "$(basename "$source")" \
                --arg architecture "$producer_architecture" \
                '$current + {($name): $architecture}')"
            fi
            cp "$source" "$output/assets/$(basename "$source")"
          done
          if [[ -n "$(find "$output" -type l -print -quit)" \
                || -n "$(find "$output" -mindepth 1 ! -type f ! -type d -print -quit)" ]]; then
            echo "::error::Package output contains a link or special entry."
            exit 1
          fi
          python3 - "$output/assets" "$output/checksums.txt" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          rows = []
          for asset in sorted(root.iterdir(), key=lambda path: path.name):
              if asset.is_symlink() or not asset.is_file():
                  raise SystemExit("unsafe package producer output")
              rows.append(f"{hashlib.sha256(asset.read_bytes()).hexdigest()}  {asset.name}")
          destination.write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          source_tree_digest="sha256:$(git ls-tree -r --full-tree HEAD \
            | shasum -a 256 | awk '{print $1}')"
          build_logic_digest="sha256:$(git ls-tree -r --full-tree HEAD -- build-logic \
            | shasum -a 256 | awk '{print $1}')"
          wrapper_digest="sha256:$(shasum -a 256 gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          verification_digest="sha256:$(shasum -a 256 gradle/verification-metadata.xml | awk '{print $1}')"
          java_version="$(java --version 2>&1 | head -n 1 | tr -d '\r')"
          java_major="$(python3 - "$java_version" <<'PY'
          import re
          import sys

          match = re.search(r'(?<![0-9])([0-9]+)(?:\.[0-9]+)*(?:\+[0-9A-Za-z.-]+)?', sys.argv[1])
          if match is None:
              raise SystemExit('Java runtime version token is missing')
          print(match.group(1))
          PY
          )"
          gradle_version="$(./gradlew --version | awk '/^Gradle / {print $2; exit}')"
          build_tasks_json="$(jq -cn --arg tasks "$GRADLE_TASKS" \
            '$tasks | split(" ") | map(select(length > 0))')"
          jq -n \
            --arg release_id "$INPUT_RELEASE_ID" \
            --arg build "$INPUT_BUILD_VERSION" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" \
            --arg package_class "$PACKAGE_CLASS" \
            --arg branch "$EXPECTED_BRANCH" \
            --arg source_ref "commit:$INPUT_CANDIDATE_COMMIT" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_tree_digest "$source_tree_digest" \
            --arg java_version "$java_version" \
            --argjson java_major "$java_major" \
            --arg gradle_version "$gradle_version" \
            --arg wrapper_digest "$wrapper_digest" \
            --arg verification_digest "$verification_digest" \
            --arg build_logic_digest "$build_logic_digest" \
            --argjson build_tasks "$build_tasks_json" \
            --argjson asset_architectures "$asset_architectures" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schemaVersion: 1,
              kind: "stable-1.0-maintenance-package-producer",
              releaseId: $release_id,
              buildVersion: $build,
              sourceCommit: $commit,
              source: {
                branch: $branch, ref: $source_ref, commit: $commit,
                sourceTreeDigest: $source_tree_digest
              },
              toolchain: {
                javaVersion: $java_version, javaMajorVersion: $java_major,
                gradleVersion: $gradle_version, gradleWrapperDigest: $wrapper_digest,
                dependencyVerificationDigest: $verification_digest,
                dependencyVerificationStatus: "pass", buildLogicDigest: $build_logic_digest,
                buildTasks: $build_tasks, productionSigning: true, testSigning: false
              },
              packageClass: $package_class,
              assetArchitectures: $asset_architectures,
              workflow: {
                provider: "github-actions", repository: $repository,
                runId: $run_id, runAttempt: $run_attempt
              },
              buildCount: 1,
              redaction: {status: "pass", findingCount: 0, findings: []}
            }' > "$output/producer.json"

      - name: Cryptographically attest every exact package producer asset
        id: attest-package-assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/stable-maintenance-package-output/${{ matrix.package_class }}/assets/*

      - name: Independently verify and bind every exact package producer attestation
        env:
          PACKAGE_CLASS: ${{ matrix.package_class }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          output="build/stable-maintenance-package-output/$PACKAGE_CLASS"
          receipts="$output/signing-receipts"
          signer_workflow="crypta-network/cryptad/.github/workflows/stable-1.0-maintenance-release.yml"
          rm -rf "$receipts"
          mkdir -p "$receipts"
          receipt_digests='{}'
          asset_count=0
          for asset in "$output"/assets/*; do
            if [[ -L "$asset" || ! -f "$asset" ]]; then
              echo "::error::The attested package producer subject is unsafe."
              exit 1
            fi
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer_workflow" \
              --source-digest "$INPUT_CANDIDATE_COMMIT" \
              --deny-self-hosted-runners >/dev/null
            name="$(basename "$asset")"
            subject_digest="sha256:$(shasum -a 256 "$asset" | awk '{print $1}')"
            subject_size="$(wc -c < "$asset" | tr -d '[:space:]')"
            receipt="$receipts/$name.signing.json"
            jq -n \
              --arg release_id "$INPUT_RELEASE_ID" \
              --arg build "$INPUT_BUILD_VERSION" \
              --arg commit "$INPUT_CANDIDATE_COMMIT" \
              --arg name "$name" \
              --arg digest "$subject_digest" \
              --argjson size "$subject_size" \
              --arg signer_workflow "$signer_workflow" \
              '{
                schemaVersion: 1,
                kind: "stable-1.0-maintenance-asset-signing-verification",
                releaseId: $release_id,
                buildVersion: $build,
                sourceCommit: $commit,
                fileName: $name,
                subjectDigest: $digest,
                subjectSizeBytes: $size,
                signingMethod: "sigstore-github-attestation",
                signerWorkflow: $signer_workflow,
                hostedRunnerRequired: true,
                cryptographicVerificationStatus: "pass",
                redaction: {status: "pass", findingCount: 0, findings: []}
              }' > "$receipt"
            receipt_digest="sha256:$(shasum -a 256 "$receipt" | awk '{print $1}')"
            receipt_digests="$(jq -cn \
              --argjson current "$receipt_digests" \
              --arg name "$name" \
              --arg digest "$receipt_digest" \
              '$current + {($name): $digest}')"
            asset_count=$((asset_count + 1))
          done
          if [[ "$asset_count" -lt 1 ]]; then
            echo "::error::The package producer emitted no attestation subjects."
            exit 1
          fi
          jq \
            --arg method sigstore-github-attestation \
            --arg signer_workflow "$signer_workflow" \
            --arg source_commit "$INPUT_CANDIDATE_COMMIT" \
            --argjson receipt_digests "$receipt_digests" \
            '.assetSigning = {
              method: $method,
              signerWorkflow: $signer_workflow,
              sourceCommit: $source_commit,
              verificationStatus: "pass",
              receiptDigests: $receipt_digests
            }' "$output/producer.json" > "$output/producer.json.tmp"
          mv "$output/producer.json.tmp" "$output/producer.json"

      - name: Upload exact package bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-maintenance-package-${{ inputs.release_id }}-${{ inputs.build_version }}-${{ matrix.package_class }}
          path: build/stable-maintenance-package-output/${{ matrix.package_class }}/
          if-no-files-found: error
          retention-days: 30

  authenticate-windows-exe:
    name: Authenticate external Windows EXE producer
    if: inputs.operation == 'freeze-candidate'
    needs: validate-dispatch
    runs-on: ubuntu-latest
    environment: stable-1.0-maintenance-evidence
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: write
      artifact-metadata: write
      id-token: write

    steps:
      - name: Authenticate and materialize exact Windows EXE
        env:
          INPUT_RUN_ID: ${{ inputs.windows_exe_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.windows_exe_artifact_name }}
          INPUT_ARTIFACT_DIGEST: ${{ inputs.windows_exe_artifact_digest }}
          INPUT_EXE_SHA256: ${{ inputs.windows_exe_sha256 }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EXPECTED_BRANCH: ${{ needs.validate-dispatch.outputs.expected_branch }}
          INPUT_SIGNER_WORKFLOW: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_WINDOWS_SIGNER_WORKFLOW }}
          EXPECTED_WINDOWS_CERTIFICATE_SHA1: ${{ vars.CRYPTAD_WINDOWS_CODE_SIGNING_CERTIFICATE_SHA1 }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_SIGNER_WORKFLOW" =~ ^crypta-network/cryptad/\.github/workflows/[A-Za-z0-9._-]+\.ya?ml$ ]]; then
            echo "::error::Protected Windows producer signer workflow is not configured safely."
            exit 1
          fi
          if [[ ! "$EXPECTED_WINDOWS_CERTIFICATE_SHA1" =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::Reviewed Windows signing-certificate identity is not configured safely."
            exit 1
          fi
          expected_workflow_path="${INPUT_SIGNER_WORKFLOW#crypta-network/cryptad/}"
          run_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" \
            --arg workflow_path "$expected_workflow_path" '
              .repository.full_name == $repository
              and .head_sha == $commit
              and .path == $workflow_path
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"' <<< "$run_json" >/dev/null
          artifacts="$(gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID/artifacts" \
            -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
          jq -e --arg name "$INPUT_ARTIFACT_NAME" --arg digest "$INPUT_ARTIFACT_DIGEST" '
            [.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)]
            | length == 1' <<< "$artifacts" >/dev/null
          download="build/windows-external-producer"
          output="build/stable-maintenance-package-output/windows"
          rm -rf "$download" "$output"
          mkdir -p "$download" "$output/assets"
          gh run download "$INPUT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$INPUT_ARTIFACT_NAME" --dir "$download"
          if [[ -n "$(find "$download" -type l -print -quit)" \
                || -n "$(find "$download" -mindepth 1 ! -type f ! -type d -print -quit)" ]]; then
            echo "::error::Windows producer artifact contains a link or special entry."
            exit 1
          fi
          mapfile -t executables < <(find "$download" -type f -iname '*.exe' -print | sort)
          if [[ "${#executables[@]}" -ne 1 ]]; then
            echo "::error::Windows producer artifact must contain exactly one EXE."
            exit 1
          fi
          exe="${executables[0]}"
          producer="$download/stable-1.0-maintenance-windows-package-producer.json"
          if [[ -L "$producer" || ! -f "$producer" \
                || "$(find "$download" -type f -name 'stable-1.0-maintenance-windows-package-producer.json' | wc -l)" -ne 1 \
                || "$(find "$download" -type f | wc -l)" -ne 2 ]]; then
            echo "::error::Windows producer omitted its exact post-build toolchain/source receipt."
            exit 1
          fi
          exe_digest="sha256:$(sha256sum "$exe" | awk '{print $1}')"
          exe_size="$(stat --format='%s' "$exe")"
          expected_signer_digest="sha256:$(printf '%s' "$EXPECTED_WINDOWS_CERTIFICATE_SHA1" \
            | sha256sum | awk '{print $1}')"
          jq -e --arg release "$INPUT_RELEASE_ID" --arg build "$INPUT_BUILD_VERSION" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" --arg branch "$EXPECTED_BRANCH" \
            --arg exe_name "$(basename "$exe")" --arg exe_digest "$exe_digest" \
            --argjson exe_size "$exe_size" --arg signer_digest "$expected_signer_digest" '
              .kind == "stable-1.0-maintenance-external-package-producer"
              and .releaseId == $release
              and .buildVersion == $build
              and .sourceCommit == $commit
              and .source.branch == $branch
              and .source.ref == ("commit:" + $commit)
              and .source.commit == $commit
              and (.source.sourceTreeDigest | test("^sha256:[0-9a-f]{64}$"))
              and .toolchain.javaMajorVersion >= 25
              and .toolchain.dependencyVerificationStatus == "pass"
              and .toolchain.productionSigning == true
              and .toolchain.testSigning == false
              and .authenticode.status == "pass"
              and .authenticode.verificationPolicy == "windows-authenticode"
              and .authenticode.timestampStatus == "pass"
              and .authenticode.signerCertificateIdentityDigest == $signer_digest
              and .assetDigest == $exe_digest
              and .assetSizeBytes == $exe_size
              and .assetArchitectures[$exe_name] == "amd64"
              and .redaction.status == "pass"' "$producer" >/dev/null
          python3 - "$exe" <<'PY'
          import struct
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          with path.open("rb") as stream:
              if stream.read(2) != b"MZ":
                  raise SystemExit("Windows producer output lacks an MZ header")
              stream.seek(0x3C)
              offset_bytes = stream.read(4)
              if len(offset_bytes) != 4:
                  raise SystemExit("Windows producer output lacks a PE offset")
              pe_offset = struct.unpack("<I", offset_bytes)[0]
              if pe_offset < 0x40 or pe_offset + 6 > path.stat().st_size:
                  raise SystemExit("Windows producer output has an out-of-bounds PE offset")
              stream.seek(pe_offset)
              if stream.read(4) != b"PE\0\0" or stream.read(2) != b"\x64\x86":
                  raise SystemExit("Windows producer output is not an amd64 PE image")
          PY
          if [[ "$exe_digest" != "$INPUT_EXE_SHA256" ]]; then
            echo "::error::Windows EXE digest differs from the reviewed producer identity."
            exit 1
          fi
          gh attestation verify "$exe" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$INPUT_SIGNER_WORKFLOW" \
            --source-digest "$INPUT_CANDIDATE_COMMIT" \
            --deny-self-hosted-runners >/dev/null
          gh attestation verify "$producer" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$INPUT_SIGNER_WORKFLOW" \
            --source-digest "$INPUT_CANDIDATE_COMMIT" \
            --deny-self-hosted-runners >/dev/null
          cp "$exe" "$output/assets/$(basename "$exe")"
          cp "$producer" "$output/producer.json"
          (
            cd "$output/assets"
            sha256sum -- * > ../checksums.txt
          )
          jq -n \
            --arg release_id "$INPUT_RELEASE_ID" \
            --arg build "$INPUT_BUILD_VERSION" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" \
            --arg artifact_name "$INPUT_ARTIFACT_NAME" \
            --arg artifact_digest "$INPUT_ARTIFACT_DIGEST" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$INPUT_RUN_ID" '
            {
              schemaVersion: 1,
              kind: "stable-1.0-maintenance-external-package-producer",
              releaseId: $release_id,
              buildVersion: $build,
              sourceCommit: $commit,
              packageClass: "windows-exe",
              producer: {
                provider: "github-actions", repository: $repository,
                runId: $run_id, artifactName: $artifact_name,
                artifactDigest: $artifact_digest, attestationVerified: true
              },
              buildCount: 1,
              redaction: {status: "pass", findingCount: 0, findings: []}
            }' > "$output/authentication.json"

      - name: Upload authenticated Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-maintenance-package-${{ inputs.release_id }}-${{ inputs.build_version }}-windows
          path: build/stable-maintenance-package-output/windows/
          if-no-files-found: error
          retention-days: 30

  freeze-and-validate:
    name: Freeze exact bytes or validate a prior frozen Stable maintenance candidate
    needs:
      - validate-dispatch
      - build-packages
      - authenticate-windows-exe
    if: >-
      always()
      && inputs.operation != 'produce-app-products'
      && inputs.operation != 'produce-experimental-app-products'
      && needs.validate-dispatch.result == 'success'
      && (
        (inputs.operation == 'freeze-candidate'
          && needs.build-packages.result == 'success'
          && needs.authenticate-windows-exe.result == 'success')
        ||
        (inputs.operation != 'freeze-candidate'
          && needs.build-packages.result == 'skipped'
          && needs.authenticate-windows-exe.result == 'skipped')
      )
    concurrency:
      group: >-
        ${{ (inputs.operation == 'prepare-authorization'
        || inputs.operation == 'validate-authorization')
        && 'stable-1-0-vulnerability-ledger'
        || format('stable-maintenance-nonpromotion-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: stable-1.0-maintenance-evidence
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      deployments: read
      attestations: write
      artifact-metadata: write
      id-token: write
    outputs:
      artifact_name: ${{ steps.stage.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      lifecycle_authority_present: ${{ steps.lifecycle-authority.outputs.present }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Gradle properties
        uses: ./.github/actions/setup-gradle-properties

      - name: Download packages built once in this run
        if: inputs.operation == 'freeze-candidate'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stable-maintenance-package-${{ inputs.release_id }}-${{ inputs.build_version }}-*
          path: build/stable-maintenance-packages
          merge-multiple: false
          digest-mismatch: error

      - name: Authenticate prior exact frozen or validated candidate
        if: inputs.operation != 'freeze-candidate'
        env:
          INPUT_RUN_ID: ${{ inputs.operation == 'publish' && inputs.validated_candidate_run_id || inputs.operation == 'validate-authorization' && inputs.prepared_candidate_run_id || inputs.frozen_candidate_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.operation == 'publish' && inputs.validated_candidate_artifact_name || inputs.operation == 'validate-authorization' && inputs.prepared_candidate_artifact_name || inputs.frozen_candidate_artifact_name }}
          INPUT_ARTIFACT_DIGEST: ${{ inputs.operation == 'publish' && inputs.validated_candidate_artifact_digest || inputs.operation == 'validate-authorization' && inputs.prepared_candidate_artifact_digest || inputs.frozen_candidate_artifact_digest }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
          INPUT_OPERATION: ${{ inputs.operation }}
          CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID")"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg commit "$INPUT_CANDIDATE_COMMIT" '
            .repository.full_name == $repository
            and .head_sha == $commit
            and .path == ".github/workflows/stable-1.0-maintenance-release.yml"
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "success"' <<< "$run_json" >/dev/null
          artifacts="$(gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID/artifacts" \
            -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
          jq -e --arg name "$INPUT_ARTIFACT_NAME" --arg digest "$INPUT_ARTIFACT_DIGEST" '
            [.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)]
            | length == 1' <<< "$artifacts" >/dev/null
          rm -rf build/prior-validated-candidate
          mkdir -p build/prior-validated-candidate
          gh run download "$INPUT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$INPUT_ARTIFACT_NAME" --dir build/prior-validated-candidate
          subject="build/prior-validated-candidate/freeze/stable-1.0-maintenance-candidate-freeze.json"
          if [[ "$INPUT_OPERATION" != prepare-authorization ]]; then
            subject="build/prior-validated-candidate/component/artifacts/legacy/stable-1.0-maintenance-candidate.json"
          fi
          if [[ -L "$subject" || ! -f "$subject" ]]; then
            echo "::error::Prior candidate artifact is missing its canonical frozen identity."
            exit 1
          fi
          gh attestation verify "$subject" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "crypta-network/cryptad/.github/workflows/stable-1.0-maintenance-release.yml" \
            --source-digest "$INPUT_CANDIDATE_COMMIT" \
            --deny-self-hosted-runners >/dev/null
          if [[ -d build/prior-validated-candidate/packages ]]; then
            cp -R build/prior-validated-candidate/packages build/stable-maintenance-packages
          else
            echo "::error::Prior candidate artifact does not contain the exact frozen package set."
            exit 1
          fi
          prior_operation=freeze-candidate
          if [[ "$INPUT_OPERATION" == validate-authorization ]]; then
            prior_operation=prepare-authorization
          elif [[ "$INPUT_OPERATION" == publish ]]; then
            prior_operation=validate-authorization
          fi
          train_binding="$RUNNER_TEMP/stable-maintenance-prior-train-binding.json"
          jq -nS \
            --arg artifactKind stable-maintenance-release-train-phase \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_REPOSITORY/.github/workflows/stable-1.0-maintenance-release.yml@$INPUT_CANDIDATE_COMMIT" \
            --arg workflowCommit "$INPUT_CANDIDATE_COMMIT" \
            --arg runId "$INPUT_RUN_ID" \
            --arg runAttempt "$(jq -er '.run_attempt | tostring' <<< "$run_json")" \
            --arg operation "$prior_operation" \
            --arg releaseId "$INPUT_RELEASE_ID" \
            --arg buildVersion "$INPUT_BUILD_VERSION" \
            --arg releaseClass "$INPUT_RELEASE_CLASS" \
            --arg sourceCommit "$INPUT_CANDIDATE_COMMIT" \
            --arg artifactName "$INPUT_ARTIFACT_NAME" '
              {
                artifactKind: $artifactKind,
                repository: $repository,
                workflow: $workflow,
                workflowCommit: $workflowCommit,
                runId: $runId,
                runAttempt: $runAttempt,
                operation: $operation,
                releaseId: $releaseId,
                buildVersion: $buildVersion,
                releaseClass: $releaseClass,
                sourceCommit: $sourceCommit,
                artifactName: $artifactName
              }' > "$train_binding"
          rm -rf build/prior-stable-backport-release-train
          python3 \
            tools/release-certification/protected/stable_backport_protected_handoff.py \
            open \
            --bundle build/prior-validated-candidate/stable-backport-release-train-handoff \
            --out build/prior-stable-backport-release-train \
            --binding "$train_binding" \
            --key-env CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64
          prior_train_files="$(
            find build/prior-stable-backport-release-train \
              -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
              | LC_ALL=C sort
          )"
          expected_prior_train_files="$(
            printf '%s\n' \
              stable-1.0-release-train-authorization-summary.json \
              stable-1.0-release-train-validation.json \
              | LC_ALL=C sort
          )"
          if [[ "$prior_train_files" != "$expected_prior_train_files" \
                || -n "$(find build/prior-stable-backport-release-train \
                  -mindepth 1 -type d -print -quit)" \
                || -n "$(find build/prior-stable-backport-release-train \
                  -type l -print -quit)" ]]; then
            echo "::error::Prior maintenance phase contains an invalid encrypted release-train authority set."
            exit 1
          fi
          if find build/prior-validated-candidate -type f \
              \( -name stable-1.0-release-train-validation.json \
                 -o -name stable-1.0-release-train-authorization-summary.json \) \
              -print -quit | grep -q .; then
            echo "::error::Prior maintenance artifact exposes plaintext release-train authority."
            exit 1
          fi

      - name: Authenticate and materialize public-safe protected inputs
        if: inputs.operation != 'publish'
        env:
          INPUT_RUN_ID: ${{ inputs.protected_inputs_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.protected_inputs_artifact_name }}
          INPUT_ARTIFACT_DIGEST: ${{ inputs.protected_inputs_artifact_digest }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INPUT_SIGNER_WORKFLOW: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_INPUT_SIGNER_WORKFLOW }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_PRIOR_RUN_ID: ${{ inputs.operation == 'validate-authorization' && inputs.prepared_candidate_run_id || inputs.frozen_candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_SIGNER_WORKFLOW" =~ ^crypta-network/cryptad/\.github/workflows/[A-Za-z0-9._-]+\.ya?ml$ ]]; then
            echo "::error::Protected input signer workflow is not configured safely."
            exit 1
          fi
          expected_workflow_path="${INPUT_SIGNER_WORKFLOW#crypta-network/cryptad/}"
          run_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" \
            --arg workflow_path "$expected_workflow_path" '
            .repository.full_name == $repository
            and .head_sha == $commit
            and .path == $workflow_path
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "success"' <<< "$run_json" >/dev/null
          if [[ "$INPUT_OPERATION" == prepare-authorization \
                || "$INPUT_OPERATION" == validate-authorization ]]; then
            prior_run_json="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_PRIOR_RUN_ID")"
            prior_completed="$(jq -er '.updated_at' <<< "$prior_run_json")"
            protected_created="$(jq -er '.created_at' <<< "$run_json")"
            if [[ "$protected_created" < "$prior_completed" \
                  || "$protected_created" == "$prior_completed" ]]; then
              echo "::error::Protected evidence/approval inputs were not produced after the prior immutable phase."
              exit 1
            fi
          fi
          artifacts="$(gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID/artifacts" \
            -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
          jq -e --arg name "$INPUT_ARTIFACT_NAME" --arg digest "$INPUT_ARTIFACT_DIGEST" '
            [.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)]
            | length == 1' <<< "$artifacts" >/dev/null
          root="build/protected-inputs-artifact"
          rm -rf "$root" build/protected-inputs
          mkdir -p "$root" build/protected-inputs
          gh run download "$INPUT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$INPUT_ARTIFACT_NAME" --dir "$root"
          if [[ -n "$(find "$root" -type l -print -quit)" \
                || -n "$(find "$root" -mindepth 1 ! -type f ! -type d -print -quit)" ]]; then
            echo "::error::Protected input artifact contains a link or special entry."
            exit 1
          fi
          if [[ "$INPUT_OPERATION" == validate-authorization ]]; then
            authorization="$root/stable-1.0-maintenance-authorization.json"
            if [[ -L "$authorization" || ! -f "$authorization" \
                  || "$(find "$root" -mindepth 1 -maxdepth 1 -type f | wc -l)" -ne 1 \
                  || -n "$(find "$root" -mindepth 1 -maxdepth 1 -type d -print -quit)" ]]; then
              echo "::error::The approval producer must contain only the exact authorization JSON."
              exit 1
            fi
            gh attestation verify "$authorization" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$INPUT_SIGNER_WORKFLOW" \
              --source-digest "$INPUT_CANDIDATE_COMMIT" \
              --deny-self-hosted-runners >/dev/null
          else
            manifest="$root/stable-1.0-maintenance.json"
            if [[ ! -f "$manifest" || ! -d "$root/protected-inputs" ]]; then
              echo "::error::Protected producer did not materialize the canonical manifest layout."
              exit 1
            fi
            gh attestation verify "$manifest" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$INPUT_SIGNER_WORKFLOW" \
              --source-digest "$INPUT_CANDIDATE_COMMIT" \
              --deny-self-hosted-runners >/dev/null
            cp "$manifest" build/stable-1.0-maintenance.json
            cp -R "$root/protected-inputs/." build/protected-inputs/
          fi

      - name: Determine prospective PR-289 governance activation
        if: inputs.operation == 'prepare-authorization'
        id: supply_chain_activation
        run: |
          set -euo pipefail
          active="$(python3 \
            tools/release-certification/protected/stable_supply_chain_activation.py \
            tools/release-certification/stable-1.0-supply-chain-policy.json \
            build/prior-validated-candidate/freeze/stable-1.0-maintenance-candidate-freeze.json)"
          if [[ "$active" != true && "$active" != false ]]; then
            echo "::error::Stable supply-chain activation helper returned an invalid decision."
            exit 1
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Determine prospective PR-290 governance activation
        if: inputs.operation == 'prepare-authorization'
        id: dependency_vulnerability_activation
        run: |
          set -euo pipefail
          active="$(python3 \
            tools/release-certification/protected/stable_dependency_vulnerability_activation.py \
            tools/release-certification/stable-1.0-dependency-vulnerability-policy.json \
            build/prior-validated-candidate/freeze/stable-1.0-maintenance-candidate-freeze.json)"
          if [[ "$active" != true && "$active" != false ]]; then
            echo "::error::Stable dependency-vulnerability activation returned an invalid decision."
            exit 1
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Authenticate and materialize exact PR-289 promotion handoff
        if: >-
          inputs.operation == 'prepare-authorization' &&
          steps.supply_chain_activation.outputs.active == 'true'
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          GH_TOKEN: ${{ github.token }}
          CRYPTAD_STABLE_SUPPLY_CHAIN_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_SUPPLY_CHAIN_HANDOFF_KEY_BASE64 }}
        run: |
          set -euo pipefail
          manifest="build/stable-1.0-maintenance.json"
          INPUT_RUN_ID="$(jq -er '.policies.metadata.stableSupplyChainRunId' "$manifest")"
          INPUT_RUN_ATTEMPT="$(jq -er \
            '.policies.metadata.stableSupplyChainRunAttempt' "$manifest")"
          INPUT_ARTIFACT_NAME="$(jq -er \
            '.policies.metadata.stableSupplyChainArtifactName' "$manifest")"
          INPUT_ARTIFACT_DIGEST="$(jq -er \
            '.policies.metadata.stableSupplyChainArtifactDigest' "$manifest")"
          expected_name="stable-1.0-supply-chain-$INPUT_RELEASE_ID-comparison"
          expected_workflow="crypta-network/cryptad/.github/workflows/stable-1.0-supply-chain.yml"
          configured="$(jq -er '.inputs.supplyChainPromotionSummary' "$manifest")"
          configured_provenance="$(dirname "$configured")/stable-1.0-supply-chain-summary-provenance.json"
          if [[ ! "$INPUT_RUN_ID" =~ ^[1-9][0-9]*$ \
                || ! "$INPUT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ \
                || ! "$INPUT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ \
                || "$configured" \
                != "build/protected-inputs/supply-chain/stable-1.0-supply-chain-summary.json" \
                || "$INPUT_ARTIFACT_NAME" != "$expected_name" ]]; then
            echo "::error::Maintenance manifest does not use the fixed authenticated PR-289 summary location."
            exit 1
          fi
          if [[ -e "$configured" || -L "$configured" \
                || -e "$configured_provenance" || -L "$configured_provenance" ]]; then
            echo "::error::Generic maintenance input producer must not supply PR-289 promotion authority."
            exit 1
          fi
          jq -e \
            --arg run "$INPUT_RUN_ID" \
            --arg attempt "$INPUT_RUN_ATTEMPT" \
            --arg name "$INPUT_ARTIFACT_NAME" \
            --arg digest "$INPUT_ARTIFACT_DIGEST" '
              .policies.stableSupplyChainGovernance == "required"
              and .requirements.stableSupplyChain == true
              and .policies.metadata.stableSupplyChainRunId == $run
              and .policies.metadata.stableSupplyChainRunAttempt == $attempt
              and .policies.metadata.stableSupplyChainArtifactName == $name
              and .policies.metadata.stableSupplyChainArtifactDigest == $digest' \
            "$manifest" >/dev/null
          run_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" \
            --arg attempt "$INPUT_RUN_ATTEMPT" '
              .repository.full_name == $repository
              and .head_sha == $commit
              and .path == ".github/workflows/stable-1.0-supply-chain.yml"
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and (.run_attempt | tostring) == $attempt' <<< "$run_json" >/dev/null
          artifacts="$(gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID/artifacts" \
            -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
          jq -e --arg name "$INPUT_ARTIFACT_NAME" --arg digest "$INPUT_ARTIFACT_DIGEST" '
            [.artifacts[] | select(
              .name == $name and .expired == false and .digest == $digest
            )] | length == 1' <<< "$artifacts" >/dev/null
          root="build/stable-supply-chain-promotion-handoff"
          rm -rf "$root"
          mkdir -p "$root"
          gh run download "$INPUT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$INPUT_ARTIFACT_NAME" --dir "$root"
          if [[ -n "$(find "$root" -type l -print -quit)" \
                || -n "$(find "$root" -mindepth 1 ! -type f ! -type d -print -quit)" \
                || "$(find "$root" -type f | wc -l)" -gt 128 \
                || "$(du -sb "$root" | cut -f1)" -gt 268435456 ]]; then
            echo "::error::PR-289 promotion handoff is unsafe or exceeds its closed bounds."
            exit 1
          fi
          summary="$root/stable-1.0-supply-chain-summary.json"
          phase_manifest="$root/manifest.json"
          if [[ -L "$summary" || ! -f "$summary" \
                || -L "$phase_manifest" || ! -f "$phase_manifest" ]]; then
            echo "::error::PR-289 promotion handoff lacks its canonical subjects."
            exit 1
          fi
          gh attestation verify "$summary" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$expected_workflow" \
            --source-digest "$INPUT_CANDIDATE_COMMIT" \
            --deny-self-hosted-runners >/dev/null
          gh attestation verify "$phase_manifest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$expected_workflow" \
            --source-digest "$INPUT_CANDIDATE_COMMIT" \
            --deny-self-hosted-runners >/dev/null
          jq -e \
            --arg release "$INPUT_RELEASE_ID" \
            --arg build "$INPUT_BUILD_VERSION" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" '
              .release.id == $release
              and .release.version == $build
              and .policies.candidateSourceCommit == $commit
              and .commands["stable-supply-chain"].mode == "evaluate-promotion"' \
            "$phase_manifest" >/dev/null
          jq -e \
            --arg release "$INPUT_RELEASE_ID" \
            --argjson build "$INPUT_BUILD_VERSION" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" '
              .kind == "stable-1.0-supply-chain-promotion-summary"
              and .releaseId == $release
              and .buildVersion == $build
              and .sourceCommit == $commit
              and .mode == "evaluate-promotion"
              and .status == "pass"
              and .promotionReady == true
              and .blockers == []
              and .waivers == []
              and .redaction.status == "pass"
              and .redaction.sideEffectsPerformed == false' "$summary" >/dev/null
          summary_digest="sha256:$(sha256sum "$summary" | awk '{print $1}')"
          destination_root="build/protected-inputs/supply-chain"
          provenance="$configured_provenance"
          if [[ -L "$destination_root" || -L "$configured" || -L "$provenance" ]]; then
            echo "::error::Authenticated PR-289 destination contains a symbolic link."
            exit 1
          fi
          mkdir -p "$destination_root"
          rm -f "$configured" "$provenance"
          install -m 600 "$summary" "$configured"
          jq -nS \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_REPOSITORY/.github/workflows/stable-1.0-supply-chain.yml@$INPUT_CANDIDATE_COMMIT" \
            --arg workflowCommit "$INPUT_CANDIDATE_COMMIT" \
            --arg runId "$INPUT_RUN_ID" \
            --arg runAttempt "$INPUT_RUN_ATTEMPT" \
            --arg releaseId "$INPUT_RELEASE_ID" \
            --arg buildVersion "$INPUT_BUILD_VERSION" \
            --arg sourceCommit "$INPUT_CANDIDATE_COMMIT" \
            --arg artifactName "$INPUT_ARTIFACT_NAME" \
            --arg producerArtifactDigest "$INPUT_ARTIFACT_DIGEST" \
            --arg summaryByteDigest "$summary_digest" '
              {
                schemaVersion: 1,
                kind: "stable-1.0-supply-chain-promotion-handoff",
                repository: $repository,
                workflow: $workflow,
                workflowCommit: $workflowCommit,
                runId: $runId,
                runAttempt: $runAttempt,
                operation: "compare-evaluate",
                releaseId: $releaseId,
                buildVersion: $buildVersion,
                sourceCommit: $sourceCommit,
                artifactName: $artifactName,
                producerArtifactDigest: $producerArtifactDigest,
                summaryFileName: "stable-1.0-supply-chain-summary.json",
                summaryByteDigest: $summaryByteDigest,
                attestationSubjectDigest: $summaryByteDigest,
                attestationVerified: true,
                denySelfHostedRunners: true,
                authenticationStatus: "pass",
                authenticationAlgorithm: "hmac-sha256",
                authenticationTag: "pending"
              }' > "$provenance"
          python3 - "$provenance" <<'PY'
          import base64
          import binascii
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "tools/release-certification")
          from cryptad_certification.engines.release_certification_core import (
              STABLE_SUPPLY_CHAIN_HANDOFF_KEY_ENV,
              stable_supply_chain_handoff_authentication_tag,
          )

          path = Path(sys.argv[1])
          encoded = os.environ.pop(STABLE_SUPPLY_CHAIN_HANDOFF_KEY_ENV, "")
          try:
              key = base64.b64decode(encoded, validate=True)
          except (ValueError, binascii.Error) as error:
              raise SystemExit("Stable supply-chain handoff key is invalid") from error
          if len(key) != 32 or base64.b64encode(key).decode("ascii") != encoded:
              raise SystemExit("Stable supply-chain handoff key is invalid")
          handoff = json.loads(path.read_text(encoding="utf-8"))
          handoff["authenticationTag"] = (
              stable_supply_chain_handoff_authentication_tag(handoff, key)
          )
          path.write_text(
              json.dumps(handoff, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          unset CRYPTAD_STABLE_SUPPLY_CHAIN_HANDOFF_KEY_BASE64
          chmod 0600 "$provenance"

      - name: Authenticate and materialize exact PR-290 promotion handoff
        if: >-
          inputs.operation == 'prepare-authorization' &&
          steps.dependency_vulnerability_activation.outputs.active == 'true'
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_HANDOFF_KEY_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="build/stable-1.0-maintenance.json"
          INPUT_RUN_ID="$(jq -er \
            '.policies.metadata.stableDependencyVulnerabilityRunId' "$manifest")"
          INPUT_RUN_ATTEMPT="$(jq -er \
            '.policies.metadata.stableDependencyVulnerabilityRunAttempt' "$manifest")"
          INPUT_ARTIFACT_NAME="$(jq -er \
            '.policies.metadata.stableDependencyVulnerabilityArtifactName' "$manifest")"
          INPUT_ARTIFACT_DIGEST="$(jq -er \
            '.policies.metadata.stableDependencyVulnerabilityArtifactDigest' "$manifest")"
          INPUT_ACTIONS_ARTIFACT_DIGEST="$(jq -er \
            '.policies.metadata.stableDependencyVulnerabilityActionsArtifactDigest' "$manifest")"
          expected_name="stable-1.0-dependency-vulnerability-$INPUT_RELEASE_ID-evaluation"
          configured="build/protected-inputs/dependency-vulnerability/stable-1.0-dependency-vulnerability-promotion-summary.json"
          configured_plan="$(dirname "$configured")/stable-1.0-dependency-vulnerability-publication-plan.json"
          configured_source_status="$(dirname "$configured")/stable-1.0-dependency-vulnerability-source-status.json"
          provenance="$(dirname "$configured")/stable-1.0-dependency-vulnerability-summary-provenance.json"
          if [[ ! "$INPUT_RUN_ID" =~ ^[1-9][0-9]*$ \
                || ! "$INPUT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ \
                || "$INPUT_ARTIFACT_NAME" != "$expected_name" \
                || ! "$INPUT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ \
                || ! "$INPUT_ACTIONS_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Post-activation maintenance requires exact PR-290 evaluation coordinates."
            exit 1
          fi
          if jq -e '(.inputs | has("dependencyVulnerabilityPromotionSummary"))' \
              "$manifest" >/dev/null; then
            echo "::error::Generic maintenance inputs must not provide PR-290 promotion authority."
            exit 1
          fi
          if [[ -e "$configured" || -L "$configured" \
                || -e "$configured_plan" || -L "$configured_plan" \
                || -e "$configured_source_status" || -L "$configured_source_status" \
                || -e "$provenance" || -L "$provenance" ]]; then
            echo "::error::Generic maintenance inputs contain substituted PR-290 authority files."
            exit 1
          fi
          run_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" \
            --arg attempt "$INPUT_RUN_ATTEMPT" '
              .repository.full_name == $repository
              and .head_sha == $commit
              and .path == ".github/workflows/stable-1.0-dependency-vulnerability-evaluation.yml"
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and (.run_attempt | tostring) == $attempt' <<< "$run_json" >/dev/null
          artifacts="$(gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID/artifacts" \
            -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
          jq -e --arg name "$INPUT_ARTIFACT_NAME" --arg digest "$INPUT_ACTIONS_ARTIFACT_DIGEST" '
            [.artifacts[] | select(
              .name == $name and .expired == false and .digest == $digest
            )] | length == 1' <<< "$artifacts" >/dev/null
          root="build/stable-dependency-vulnerability-promotion-handoff"
          rm -rf "$root"
          mkdir -p "$root"
          gh run download "$INPUT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$INPUT_ARTIFACT_NAME" --dir "$root"
          actual_files="$(
            find "$root" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; \
              | LC_ALL=C sort
          )"
          expected_files="$(
            printf '%s\n' \
              stable-1.0-dependency-vulnerability-promotion-summary.json \
              stable-1.0-dependency-vulnerability-publication-plan.json \
              stable-1.0-dependency-vulnerability-source-status.json \
              stable-1.0-dependency-vulnerability-summary-provenance.json \
              | LC_ALL=C sort
          )"
          if [[ -n "$(find "$root" -type l -print -quit)" \
                || -n "$(find "$root" -mindepth 1 ! -type f ! -type d -print -quit)" \
                || -n "$(find "$root" -mindepth 1 -type d -print -quit)" \
                || "$actual_files" != "$expected_files" \
                || "$(du -sb "$root" | cut -f1)" -gt 268435456 ]]; then
            echo "::error::PR-290 evaluation handoff differs from its exact four-file contract."
            exit 1
          fi
          summary="$root/stable-1.0-dependency-vulnerability-promotion-summary.json"
          publication_plan="$root/stable-1.0-dependency-vulnerability-publication-plan.json"
          source_status="$root/stable-1.0-dependency-vulnerability-source-status.json"
          producer_provenance="$root/stable-1.0-dependency-vulnerability-summary-provenance.json"
          if [[ -L "$summary" || ! -f "$summary" \
                || -L "$publication_plan" || ! -f "$publication_plan" \
                || -L "$source_status" || ! -f "$source_status" \
                || -L "$producer_provenance" || ! -f "$producer_provenance" ]]; then
            echo "::error::PR-290 evaluation handoff lacks its canonical subjects."
            exit 1
          fi
          jq -e \
            --arg release "$INPUT_RELEASE_ID" \
            --argjson build "$INPUT_BUILD_VERSION" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" '
              .kind == "stable-1.0-dependency-vulnerability-promotion-summary"
              and .releaseId == $release
              and .buildVersion == $build
              and .candidateSourceCommit == $commit
              and .mode == "evaluate-promotion"
              and .activationStatus == "active-post-activation"
              and .status == "pass"
              and .promotionReady == true
              and .blockers == []
              and .waivers == []
              and .redaction.status == "pass"
              and .redaction.sideEffectsPerformed == false' "$summary" >/dev/null
          summary_digest="sha256:$(sha256sum "$summary" | awk '{print $1}')"
          jq -e \
            --arg workflow "$GITHUB_REPOSITORY/.github/workflows/stable-1.0-dependency-vulnerability-evaluation.yml@$INPUT_CANDIDATE_COMMIT" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" \
            --arg run "$INPUT_RUN_ID" \
            --arg attempt "$INPUT_RUN_ATTEMPT" \
            --arg release "$INPUT_RELEASE_ID" \
            --arg build "$INPUT_BUILD_VERSION" \
            --arg name "$INPUT_ARTIFACT_NAME" \
            --arg producer_digest "$INPUT_ARTIFACT_DIGEST" \
            --arg summary_digest "$summary_digest" '
              .schemaVersion == 1
              and .kind == "stable-1.0-dependency-vulnerability-promotion-handoff"
              and .repository == "crypta-network/cryptad"
              and .workflow == $workflow
              and .workflowCommit == $commit
              and .runId == $run
              and .runAttempt == $attempt
              and .operation == "evaluate-promotion"
              and .releaseId == $release
              and .buildVersion == $build
              and .sourceCommit == $commit
              and .artifactName == $name
              and .producerArtifactDigest == $producer_digest
              and .summaryFileName
                == "stable-1.0-dependency-vulnerability-promotion-summary.json"
              and .summaryByteDigest == $summary_digest
              and .attestationSubjectDigest == $summary_digest
              and .attestationVerified == true
              and .denySelfHostedRunners == true
              and .authenticationStatus == "pass"
              and .authenticationAlgorithm == "hmac-sha256"' \
            "$producer_provenance" >/dev/null
          destination_root="$(dirname "$configured")"
          if [[ -L "$destination_root" || -L "$configured" \
                || -L "$configured_plan" || -L "$configured_source_status" \
                || -L "$provenance" ]]; then
            echo "::error::Authenticated PR-290 destination contains a symbolic link."
            exit 1
          fi
          mkdir -p "$destination_root"
          install -m 600 "$summary" "$configured"
          install -m 600 "$publication_plan" "$configured_plan"
          install -m 600 "$source_status" "$configured_source_status"
          install -m 600 "$producer_provenance" "$provenance"
          if ! cmp --silent "$summary" "$configured" \
              || ! cmp --silent "$publication_plan" "$configured_plan" \
              || ! cmp --silent "$source_status" "$configured_source_status" \
              || ! cmp --silent "$producer_provenance" "$provenance"; then
            echo "::error::PR-290 handoff changed while entering the protected input root."
            exit 1
          fi
          python3 - "$configured" \
            "$INPUT_RELEASE_ID" "$INPUT_BUILD_VERSION" \
            "$INPUT_CANDIDATE_COMMIT" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          sys.path.insert(0, "tools/release-certification")
          from cryptad_certification.engines.release_certification_core import (
              stable_dependency_vulnerability_evaluation_handoff_errors,
          )

          summary = Path(sys.argv[1])
          summary_digest = "sha256:" + hashlib.sha256(
              summary.read_bytes()
          ).hexdigest()
          errors, _handoff = stable_dependency_vulnerability_evaluation_handoff_errors(
              summary,
              summary_digest,
              sys.argv[2],
              sys.argv[3],
              sys.argv[4],
          )
          if errors:
              raise SystemExit(errors[0])
          PY
          chmod 0600 \
            "$configured" \
            "$configured_plan" \
            "$configured_source_status" \
            "$provenance"
          jq -S \
            --arg configured "$configured" '
              .inputs.dependencyVulnerabilityPromotionSummary = $configured
              | .policies.stableDependencyVulnerabilityGovernance = "required"' \
            "$manifest" > "$manifest.next"
          mv "$manifest.next" "$manifest"

      - name: Build the trusted Stable catalog verifier
        if: inputs.operation == 'freeze-candidate'
        run: |
          set -euo pipefail
          ./gradlew :platform-devtools:installDist
          git diff-index --quiet --cached HEAD --
          git diff-files --quiet --

      - name: Install exact protected runtime cohort selection
        if: inputs.operation == 'freeze-candidate'
        run: |
          set -euo pipefail
          runtime_inputs="$(jq -er '.inputs.maintenanceRuntimeInputs' build/stable-1.0-maintenance.json)"
          PYTHONPATH=tools/release-certification/protected python3 - "$runtime_inputs" <<'PY'
          import sys
          from pathlib import Path
          from maintenance_runtime_metadata import _regular, read_json
          root = Path(sys.argv[1]).resolve(strict=True)
          root.relative_to(Path("build/protected-inputs").resolve(strict=True))
          for name in ("cohort.json", "projection-selection.json"):
              read_json(_regular(root / name))
          PY
          prepared_cohort="$RUNNER_TEMP/maintenance-runtime-cohort.json"
          GH_TOKEN="${{ github.token }}" python3 tools/release-certification/protected/maintenance_runtime_metadata.py \
            prepare-environment --inputs "$runtime_inputs" --prepared-cohort "$prepared_cohort" \
            --java-home "$JAVA_HOME" --jdk-root "$RUNNER_TEMP/maintenance-runtime-jdk" \
            --tool-root "$RUNNER_TEMP/maintenance-runtime-tools"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/maintenance-runtime-jdk" >> "$GITHUB_ENV"
          sudo install -d -m 0755 /etc/cryptad-certification
          # The following producer runs as the runner, while only root may change its policy.
          sudo install -o root -g "$(id -g)" -m 0640 "$prepared_cohort" /etc/cryptad-certification/app-subject-cohort.json
          rm "$prepared_cohort"
          test -x /usr/bin/bwrap
          test -x /usr/bin/prlimit

      - name: Generate the canonical exact-byte freeze record
        if: inputs.operation == 'freeze-candidate'
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          STABLE_CATALOG_TRUSTED_KEYS_BASE64: ${{ secrets.STABLE_CATALOG_TRUSTED_KEYS_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$STABLE_CATALOG_TRUSTED_KEYS_BASE64" ]]; then
            echo "::error::Protected Stable catalog trust material is unavailable."
            exit 1
          fi
          trusted_keys_dir="$RUNNER_TEMP/stable-maintenance-catalog-trust-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trusted_keys="$trusted_keys_dir/trusted-catalog-keys.properties"
          rm -rf "$trusted_keys_dir"
          install -d -m 700 "$trusted_keys_dir"
          if ! printf '%s' "$STABLE_CATALOG_TRUSTED_KEYS_BASE64" \
              | base64 --decode > "$trusted_keys"; then
            echo "::error::Protected Stable catalog trust material is malformed."
            exit 1
          fi
          chmod 600 "$trusted_keys"
          unset STABLE_CATALOG_TRUSTED_KEYS_BASE64
          export STABLE_CATALOG_TRUSTED_KEYS_FILE="$trusted_keys"
          trap 'rm -rf "$trusted_keys_dir"' EXIT
          PYTHONPATH=tools/release-certification python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import stat
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          from cryptad_certification.engines.stable_1_0_maintenance_core import (
              select_candidate_dmg_for_freeze,
              stable_catalog_verification_identity,
          )
          from cryptad_certification.schema_validation import validate_schema

          def read_json(path: Path):
              def reject_duplicates(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise SystemExit(f"duplicate JSON key in {path.name}")
                      result[key] = value
                  return result
              return json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=reject_duplicates)

          def canonical_bytes(value):
              return (json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n").encode()

          def file_digest(path: Path):
              return "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()

          def semantic_digest(value):
              encoded = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
              return "sha256:" + hashlib.sha256(encoded).hexdigest()

          protected_root = Path("build/protected-inputs").resolve(strict=True)

          def protected_input(value, *, directory=False):
              raw = Path(value)
              if raw.is_absolute() or raw.is_symlink():
                  raise SystemExit("candidate selection escapes protected inputs")
              try:
                  resolved = raw.resolve(strict=True)
                  resolved.relative_to(protected_root)
              except (OSError, ValueError):
                  raise SystemExit("candidate selection escapes protected inputs") from None
              expected_type = resolved.is_dir() if directory else resolved.is_file()
              if not expected_type:
                  raise SystemExit("candidate selection has the wrong protected input type")
              return resolved

          manifest = read_json(Path("build/stable-1.0-maintenance.json"))
          inputs = manifest["inputs"]
          candidate_path = protected_input(inputs["maintenanceCandidate"])
          source_assets = protected_input(inputs["maintenanceCandidateAssets"], directory=True)
          candidate = read_json(candidate_path)

          forbidden_pre_freeze = (
              "maintenanceCandidateChecksums",
              "maintenanceCandidateProvenance",
              "maintenanceCandidateFreeze",
              "maintenanceEvidence",
              "stableMaintenanceAuthorization",
              "stableMaintenancePublicationReceipt",
              "coreUpdatePublicationReceipt",
          )
          for key in forbidden_pre_freeze:
              configured = inputs.get(key)
              if isinstance(configured, str) and Path(configured).exists():
                  raise SystemExit(f"freeze selection supplied forbidden pre-bound input {key}")

          product = candidate["product"]
          catalog = candidate["stableCatalog"]
          packages = candidate["packages"]
          catalog_names = [catalog["fileName"], catalog["signatureFileName"]]
          names = [product["fileName"], *catalog_names, *[row["fileName"] for row in packages]]
          if len(names) != len(set(names)) or any(Path(name).name != name for name in names):
              raise SystemExit("candidate selection contains unsafe or duplicate filenames")
          selection_entries = list(source_assets.iterdir())
          if (
              {entry.name for entry in selection_entries} != set(catalog_names)
              or any(entry.is_symlink() or not entry.is_file() for entry in selection_entries)
          ):
              raise SystemExit(
                  "freeze selection asset root must contain only the declared stable catalog and detached signature"
              )

          selected = Path("build/stable-maintenance-freeze/assets")
          shutil.rmtree(selected.parent, ignore_errors=True)
          selected.mkdir(parents=True)
          producer_root = Path("build/stable-maintenance-packages")
          for name in names:
              if name in catalog_names:
                  matches = [source_assets / name]
              else:
                  matches = sorted(producer_root.glob(f"*/assets/{name}"))
              if len(matches) != 1 or matches[0].is_symlink() or not matches[0].is_file():
                  raise SystemExit(f"selected asset {name} does not have one safe producer")
              destination = selected / name
              shutil.copyfile(matches[0], destination)
              destination.chmod(0o644)

          catalog_path = selected / catalog["fileName"]
          catalog_signature_path = selected / catalog["signatureFileName"]
          catalog_verifier = Path(
              "platform-devtools/build/install/crypta-app/bin/crypta-app"
          ).resolve(strict=True)
          trusted_catalog_keys = Path(
              os.environ["STABLE_CATALOG_TRUSTED_KEYS_FILE"]
          ).resolve(strict=True)
          verified_catalog = subprocess.run(
              [
                  str(catalog_verifier),
                  "catalog",
                  "verify",
                  "--catalog-file",
                  str(catalog_path),
                  "--catalog-signature-file",
                  str(catalog_signature_path),
                  "--expected-key-id",
                  catalog["signingKeyId"],
                  "--trusted-keys-file",
                  str(trusted_catalog_keys),
              ],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              check=False,
          )
          if verified_catalog.returncode != 0:
              raise SystemExit(
                  "Stable catalog cryptographic verification failed for the exact candidate bytes"
              )
          catalog_verification = stable_catalog_verification_identity(
              catalog, file_digest(trusted_catalog_keys)
          )
          catalog_verification_digest = semantic_digest(catalog_verification)

          checksum_path = selected.parent / "checksums.txt"
          checksum_rows = [
              f"{file_digest(path).removeprefix('sha256:')}  {path.name}"
              for path in sorted(selected.iterdir(), key=lambda item: item.name)
          ]
          checksum_path.write_text("\n".join(checksum_rows) + "\n", encoding="utf-8")
          checksum_path.chmod(0o644)

          producer_receipts = sorted(Path("build/stable-maintenance-packages").glob("*/producer.json"))
          if len(producer_receipts) != 3:
              raise SystemExit("freeze requires Linux, macOS, and Windows producer receipts")
          source_tree_digest = "sha256:" + hashlib.sha256(
              os.popen("git ls-tree -r --full-tree HEAD").read().encode()
          ).hexdigest()
          build_logic_digest = "sha256:" + hashlib.sha256(
              os.popen("git ls-tree -r --full-tree HEAD -- build-logic").read().encode()
          ).hexdigest()
          wrapper_digest = file_digest(Path("gradle/wrapper/gradle-wrapper.jar"))
          dependency_verification_digest = file_digest(Path("gradle/verification-metadata.xml"))
          java_version = os.popen("java --version 2>&1").read().splitlines()[0]
          java_major = int(java_version.split()[1].split(".")[0])
          gradle_version_lines = os.popen("./gradlew --version").read().splitlines()
          gradle_version = next(line.split()[1] for line in gradle_version_lines if line.startswith("Gradle "))
          actual_source = dict(candidate["source"])
          actual_source["sourceTreeDigest"] = source_tree_digest
          expected_branch_prefix = (
              "release" if os.environ["INPUT_RELEASE_CLASS"] == "maintenance" else "hotfix"
          )
          expected_branch = f"{expected_branch_prefix}/{os.environ['INPUT_BUILD_VERSION']}"
          expected_ref = f"commit:{os.environ['INPUT_CANDIDATE_COMMIT']}"
          if (
              actual_source.get("branch") != expected_branch
              or actual_source.get("ref") != expected_ref
              or actual_source.get("commit") != os.environ["INPUT_CANDIDATE_COMMIT"]
          ):
              raise SystemExit("candidate selection source branch/ref/commit is not the reviewed identity")
          build_tasks = set()
          signing_receipt_by_name = {}
          signer_workflow = (
              "crypta-network/cryptad/.github/workflows/"
              "stable-1.0-maintenance-release.yml"
          )
          for receipt_path in producer_receipts:
              receipt = read_json(receipt_path)
              receipt_source = receipt.get("source", {})
              receipt_toolchain = receipt.get("toolchain", {})
              if (
                  receipt_source.get("branch") != expected_branch
                  or receipt_source.get("ref") != expected_ref
                  or receipt_source.get("commit") != os.environ["INPUT_CANDIDATE_COMMIT"]
                  or receipt_source.get("sourceTreeDigest") != source_tree_digest
                  or receipt_toolchain.get("javaMajorVersion", 0) < 25
                  or receipt_toolchain.get("gradleVersion") != gradle_version
                  or receipt_toolchain.get("gradleWrapperDigest") != wrapper_digest
                  or receipt_toolchain.get("dependencyVerificationDigest")
                      != dependency_verification_digest
                  or receipt_toolchain.get("dependencyVerificationStatus") != "pass"
                  or receipt_toolchain.get("buildLogicDigest") != build_logic_digest
                  or receipt_toolchain.get("productionSigning") is not True
                  or receipt_toolchain.get("testSigning") is not False
              ):
                  raise SystemExit(f"producer {receipt_path.parent.name} toolchain/source identity drifted")
              build_tasks.update(receipt_toolchain.get("buildTasks", []))
              package_class = receipt.get("packageClass")
              if package_class not in {"linux-and-portable", "macos"}:
                  continue
              signing = receipt.get("assetSigning", {})
              asset_root = receipt_path.parent / "assets"
              receipt_root = receipt_path.parent / "signing-receipts"
              producer_assets = sorted(asset_root.iterdir(), key=lambda path: path.name)
              receipt_digests = signing.get("receiptDigests", {})
              if (
                  signing.get("method") != "sigstore-github-attestation"
                  or signing.get("signerWorkflow") != signer_workflow
                  or signing.get("sourceCommit") != os.environ["INPUT_CANDIDATE_COMMIT"]
                  or signing.get("verificationStatus") != "pass"
                  or not isinstance(receipt_digests, dict)
                  or set(receipt_digests) != {path.name for path in producer_assets}
                  or not receipt_root.is_dir()
              ):
                  raise SystemExit(
                      f"producer {receipt_path.parent.name} lacks exact cryptographic signing receipts"
                  )
              for asset in producer_assets:
                  verification_path = receipt_root / f"{asset.name}.signing.json"
                  if (
                      asset.is_symlink()
                      or not asset.is_file()
                      or verification_path.is_symlink()
                      or not verification_path.is_file()
                      or receipt_digests.get(asset.name) != file_digest(verification_path)
                  ):
                      raise SystemExit(
                          f"producer signing receipt is missing or mismatched for {asset.name}"
                      )
                  verification = read_json(verification_path)
                  if (
                      verification.get("kind")
                          != "stable-1.0-maintenance-asset-signing-verification"
                      or verification.get("releaseId") != os.environ["INPUT_RELEASE_ID"]
                      or verification.get("buildVersion") != os.environ["INPUT_BUILD_VERSION"]
                      or verification.get("sourceCommit")
                          != os.environ["INPUT_CANDIDATE_COMMIT"]
                      or verification.get("fileName") != asset.name
                      or verification.get("subjectDigest") != file_digest(asset)
                      or verification.get("subjectSizeBytes") != asset.stat().st_size
                      or verification.get("signingMethod")
                          != "sigstore-github-attestation"
                      or verification.get("signerWorkflow") != signer_workflow
                      or verification.get("hostedRunnerRequired") is not True
                      or verification.get("cryptographicVerificationStatus") != "pass"
                      or verification.get("redaction")
                          != {"status": "pass", "findingCount": 0, "findings": []}
                  ):
                      raise SystemExit(
                          f"producer signing receipt identity drifted for {asset.name}"
                      )
                  verified = subprocess.run(
                      [
                          "gh", "attestation", "verify", str(asset),
                          "--repo", os.environ["GITHUB_REPOSITORY"],
                          "--signer-workflow", signer_workflow,
                          "--source-digest", os.environ["INPUT_CANDIDATE_COMMIT"],
                          "--deny-self-hosted-runners",
                      ],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      check=False,
                  )
                  if verified.returncode != 0:
                      raise SystemExit(
                          f"cryptographic signing attestation failed for {asset.name}"
                      )
                  if asset.name in signing_receipt_by_name:
                      raise SystemExit(f"duplicate signing receipt for {asset.name}")
                  signing_receipt_by_name[asset.name] = file_digest(verification_path)
          actual_toolchain = {
              "javaVersion": java_version,
              "javaMajorVersion": java_major,
              "gradleVersion": gradle_version,
              "gradleWrapperDigest": wrapper_digest,
              "dependencyVerificationDigest": dependency_verification_digest,
              "dependencyVerificationStatus": "pass",
              "buildLogicDigest": build_logic_digest,
              "buildTasks": sorted(build_tasks),
              "productionSigning": True,
              "testSigning": False,
          }
          build_receipt = semantic_digest(
              [{"name": path.parent.name, "digest": file_digest(path)} for path in producer_receipts]
          )
          producer_identity = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflowPath": ".github/workflows/stable-1.0-maintenance-release.yml",
              "workflowCommit": os.environ["INPUT_CANDIDATE_COMMIT"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runnerEnvironment": "github-hosted",
          }
          source_ref = {
              "branch": actual_source["branch"],
              "ref": actual_source["ref"],
              "commit": actual_source["commit"],
          }

          import sys
          sys.path.insert(0, "tools/release-certification/protected")
          from maintenance_runtime_metadata import authenticate_predecessor_observation, RuntimeMetadataError
          baseline_path = protected_input(inputs["predecessorBaseline"])
          receipt_path = protected_input(inputs["predecessorPublicationReceipt"])
          if inputs.get("latestPublishedMaintenancePointer"):
              protected_input(inputs["latestPublishedMaintenancePointer"])
          from cryptad_certification.manifest import load_manifest
          from cryptad_certification.models import RunContext
          try:
              workspace = Path.cwd().resolve(strict=True)
              owner_manifest = load_manifest(Path("build/stable-1.0-maintenance.json"), workspace)
              owner_context = RunContext(workspace, workspace / "build/runtime-predecessor-authentication",
                                         "stable-maintenance", owner_manifest)
              predecessor_observation = authenticate_predecessor_observation(
                  owner_context,
                  datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              )
          except (RuntimeMetadataError, ValueError, OSError):
              raise SystemExit("pre-freeze published predecessor authentication failed") from None

          mac_verification = Path("build/stable-maintenance-packages")
          mac_receipts = sorted(mac_verification.glob("*/verification.json"))
          if len(mac_receipts) != 1:
              raise SystemExit("freeze requires one macOS signing/notarization receipt")
          mac_receipt = mac_receipts[0]
          mac_receipt_digest = file_digest(mac_receipt)
          mac_receipt_value = read_json(mac_receipt)
          mac_assets = sorted(
              path for path in (mac_receipt.parent / "assets").iterdir()
              if path.is_file() and not path.is_symlink()
          )
          if len(mac_assets) != 1 or mac_assets[0].suffix.lower() != ".dmg":
              raise SystemExit("macOS notarization receipt is not paired with exactly one DMG")
          if (
              mac_receipt_value.get("fileName") != mac_assets[0].name
              or mac_receipt_value.get("subjectDigest") != file_digest(mac_assets[0])
              or mac_receipt_value.get("subjectSizeBytes") != mac_assets[0].stat().st_size
          ):
              raise SystemExit("macOS notarization receipt does not bind its sibling DMG bytes")
          try:
              dmg_package = select_candidate_dmg_for_freeze(
                  packages,
                  os.environ["INPUT_RELEASE_CLASS"],
                  candidate.get("changeScope", {}),
              )
          except ValueError as error:
              raise SystemExit(str(error)) from None
          if dmg_package is not None:
              dmg_path = selected / dmg_package["fileName"]
              if (
                  mac_assets[0].name != dmg_path.name
                  or file_digest(mac_assets[0]) != file_digest(dmg_path)
                  or mac_assets[0].stat().st_size != dmg_path.stat().st_size
              ):
                  raise SystemExit("macOS notarization receipt is not bound to the selected DMG bytes")
          for package in packages:
              expected_notarization = (
                  "pass" if package.get("packageType") == "dmg" else "not-applicable"
              )
              if package.get("notarizationStatus") != expected_notarization:
                  raise SystemExit(
                      f"package {package.get('fileName')} has invalid notarization scope"
                  )
          producer_receipt_by_name = {}
          producer_architecture_by_name = {}
          for receipt in producer_receipts:
              receipt_value = read_json(receipt)
              receipt_architectures = receipt_value.get("assetArchitectures", {})
              if not isinstance(receipt_architectures, dict):
                  raise SystemExit(f"producer {receipt.parent.name} lacks architecture metadata")
              for asset in (receipt.parent / "assets").iterdir():
                  if asset.name in producer_receipt_by_name:
                      raise SystemExit(f"asset {asset.name} has multiple package producers")
                  producer_receipt_by_name[asset.name] = file_digest(receipt)
                  architecture = receipt_architectures.get(asset.name)
                  if architecture is not None:
                      if architecture not in {"amd64", "arm64"}:
                          raise SystemExit(f"asset {asset.name} has an unsupported producer architecture")
                      producer_architecture_by_name[asset.name] = architecture

          assets = []
          product_path = selected / product["fileName"]
          product_signing_receipt = signing_receipt_by_name.get(product_path.name)
          if product_signing_receipt is None:
              raise SystemExit(
                  "portable product lacks an independently verified cryptographic signing receipt"
              )
          assets.append({
              "role": "product", "fileName": product_path.name,
              "digest": file_digest(product_path), "sizeBytes": product_path.stat().st_size,
              "packageKey": None, "os": None, "arch": None,
              "producerArchitecture": None, "packageType": None,
              "publicAsset": True, "signingStatus": "pass",
              "signingReceiptDigest": product_signing_receipt,
              "notarizationStatus": "not-applicable", "notarizationReceiptDigest": None,
          })
          if (
              file_digest(catalog_path) != catalog["digest"]
              or catalog_path.stat().st_size != catalog["sizeBytes"]
              or file_digest(catalog_signature_path) != catalog["signatureDigest"]
              or catalog_signature_path.stat().st_size != catalog["signatureSizeBytes"]
          ):
              raise SystemExit("stable catalog or detached signature bytes do not match the candidate")
          assets.append({
              "role": "stable-catalog", "fileName": catalog_path.name,
              "digest": file_digest(catalog_path), "sizeBytes": catalog_path.stat().st_size,
              "packageKey": None, "os": None, "arch": None,
              "producerArchitecture": None, "packageType": None,
              "publicAsset": True, "signingStatus": "pass",
              "signingReceiptDigest": catalog_verification_digest,
              "notarizationStatus": "not-applicable", "notarizationReceiptDigest": None,
          })
          assets.append({
              "role": "stable-catalog-signature", "fileName": catalog_signature_path.name,
              "digest": file_digest(catalog_signature_path),
              "sizeBytes": catalog_signature_path.stat().st_size,
              "packageKey": None, "os": None, "arch": None,
              "producerArchitecture": None, "packageType": None,
              "publicAsset": True, "signingStatus": "pass",
              "signingReceiptDigest": catalog_verification_digest,
              "notarizationStatus": "not-applicable", "notarizationReceiptDigest": None,
          })
          for package in packages:
              path = selected / package["fileName"]
              is_dmg = package["packageType"] == "dmg"
              receipt_digest = producer_receipt_by_name.get(path.name)
              if receipt_digest is None:
                  raise SystemExit(f"package {path.name} lacks a producer receipt")
              if package["packageType"] in {"deb", "rpm", "dmg"}:
                  receipt_digest = signing_receipt_by_name.get(path.name)
                  if receipt_digest is None:
                      raise SystemExit(
                          f"package {path.name} lacks independent cryptographic signing verification"
                      )
              producer_architecture = producer_architecture_by_name.get(path.name)
              if producer_architecture != package["arch"]:
                  raise SystemExit(
                      f"package {path.name} producer architecture {producer_architecture!r} "
                      f"does not match selector {package['arch']!r}"
                  )
              assets.append({
                  "role": "package", "fileName": path.name,
                  "digest": file_digest(path), "sizeBytes": path.stat().st_size,
                  "packageKey": package["packageKey"], "os": package["os"],
                  "arch": package["arch"], "packageType": package["packageType"],
                  "producerArchitecture": producer_architecture,
                  "publicAsset": True, "signingStatus": "pass",
                  "signingReceiptDigest": receipt_digest,
                  "notarizationStatus": "pass" if is_dmg else "not-applicable",
                  "notarizationReceiptDigest": mac_receipt_digest if is_dmg else None,
              })
          assets.sort(key=lambda row: row["fileName"])
          frozen_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          freeze = {
              "schemaVersion": 1,
              "kind": "stable-1.0-maintenance-candidate-freeze",
              "generatedAt": frozen_at,
              "frozenAt": frozen_at,
              "stableMilestone": "1.0",
              "releaseId": os.environ["INPUT_RELEASE_ID"],
              "buildVersion": os.environ["INPUT_BUILD_VERSION"],
              "releaseClass": os.environ["INPUT_RELEASE_CLASS"],
              "source": actual_source,
              "toolchain": actual_toolchain,
              "producer": {
                  "system": "github-actions", **producer_identity,
                  "producerIdentityReceiptDigest": semantic_digest(producer_identity),
                  "sourceRefReceiptDigest": semantic_digest(source_ref),
                  "buildReceiptDigest": build_receipt,
                  "authenticationStatus": "pass",
              },
              "predecessorObservation": predecessor_observation,
              "stableCatalogVerification": catalog_verification,
              "buildCount": 1,
              "rebuildPerformed": False,
              "checksumsDigest": file_digest(checksum_path),
              "assets": assets,
              "assetSetDigest": semantic_digest(assets),
              "redaction": {"status": "pass", "findingCount": 0, "findings": []},
          }
          import sys
          sys.path.insert(0, "tools/release-certification/protected")
          from maintenance_runtime_metadata import seal_prospective_freeze, RuntimeMetadataError
          runtime_inputs = protected_input(inputs["maintenanceRuntimeInputs"], directory=True)
          projection_selection = read_json(runtime_inputs / "projection-selection.json")
          if set(projection_selection) != {"coordinates"}:
              raise SystemExit("runtime projection selection must contain only original coordinates")
          private_runtime = Path(os.environ["RUNNER_TEMP"]) / "maintenance-runtime-authentication"
          try:
              private_runtime.mkdir(mode=0o700, exist_ok=False)
              freeze = seal_prospective_freeze(
                  freeze, product_path, selected.parent / "runtime",
                  projection_origin=projection_selection["coordinates"], private_root=private_runtime,
              )
          except (RuntimeMetadataError, OSError, ValueError):
              raise SystemExit("prospective runtime metadata preparation failed") from None
          finally:
              shutil.rmtree(private_runtime, ignore_errors=True)
          errors = validate_schema(freeze, "stable-1.0-maintenance-candidate-freeze.schema.json")
          if errors:
              raise SystemExit("candidate freeze failed its closed schema: " + "; ".join(errors))
          freeze_path = selected.parent / "stable-1.0-maintenance-candidate-freeze.json"
          freeze_path.write_bytes(canonical_bytes(freeze))
          freeze_path.chmod(0o644)
          PY

      - name: Materialize and verify prior frozen bytes for authorization preparation
        if: inputs.operation == 'prepare-authorization'
        run: |
          set -euo pipefail
          manifest="build/stable-1.0-maintenance.json"
          candidate_path="$(jq -er '.inputs.maintenanceCandidate' "$manifest")"
          asset_root="$(jq -er '.inputs.maintenanceCandidateAssets' "$manifest")"
          checksums_path="$(jq -er '.inputs.maintenanceCandidateChecksums' "$manifest")"
          provenance_path="$(jq -er '.inputs.maintenanceCandidateProvenance' "$manifest")"
          freeze_path="$(jq -er '.inputs.maintenanceCandidateFreeze' "$manifest")"
          python3 - "$candidate_path" "$asset_root" "$checksums_path" \
            "$provenance_path" "$freeze_path" <<'PY'
          import sys
          from pathlib import Path

          root = Path("build/protected-inputs").resolve(strict=True)
          for index, value in enumerate(sys.argv[1:]):
              path = Path(value)
              if path.is_absolute() or path.is_symlink():
                  raise SystemExit("candidate input path escapes the authenticated protected-input root")
              try:
                  if index in {1, 4} and not path.exists():
                      resolved = path.parent.resolve(strict=True) / path.name
                  else:
                      resolved = path.resolve(strict=True)
                  resolved.relative_to(root)
              except (OSError, ValueError):
                  raise SystemExit(
                      "candidate input path escapes the authenticated protected-input root"
                  ) from None
              if index == 1 and not path.exists():
                  # Actions artifacts omit empty directories. Recreate only the authenticated,
                  # confined candidate-assets directory; it must remain empty until the exact
                  # prior freeze bytes are restored below.
                  path.mkdir(mode=0o755)
          PY
          if [[ -L "$candidate_path" || ! -f "$candidate_path" \
                || -L "$asset_root" || ! -d "$asset_root" \
                || -L "$checksums_path" || ! -f "$checksums_path" \
                || -L "$provenance_path" || ! -f "$provenance_path" ]]; then
            echo "::error::Post-freeze candidate metadata is missing or unsafe."
            exit 1
          fi
          prior_freeze="build/prior-validated-candidate/freeze"
          if [[ -n "$(find "$asset_root" -mindepth 1 -print -quit)" ]]; then
            echo "::error::Post-freeze evidence producer must not supply or replace candidate asset bytes."
            exit 1
          fi
          rm -rf "$asset_root"
          mkdir -p "$asset_root"
          cp "$prior_freeze/assets/"* "$asset_root/"
          cp "$prior_freeze/stable-1.0-maintenance-candidate-freeze.json" "$freeze_path"
          chmod 0644 "$asset_root/"* "$freeze_path"
          if [[ "$(jq -r '.schemaVersion' "$freeze_path")" == 2 ]]; then
            runtime_inputs="$(jq -er '.inputs.maintenanceRuntimeInputs' "$manifest")"
            PYTHONPATH=tools/release-certification/protected python3 - "$runtime_inputs" "$prior_freeze" <<'PY'
          import shutil
          import sys
          from pathlib import Path
          from maintenance_runtime_metadata import read_json, validate_runtime_metadata
          root = Path(sys.argv[1]).resolve(strict=True)
          root.relative_to(Path("build/protected-inputs").resolve(strict=True))
          destination = root / "runtime"
          if destination.exists() or destination.is_symlink():
              raise SystemExit("post-freeze producer must not supply runtime metadata")
          prior = Path(sys.argv[2])
          freeze = read_json((prior / "stable-1.0-maintenance-candidate-freeze.json").read_bytes())
          validate_runtime_metadata(freeze, prior / "runtime")
          shutil.copytree(prior / "runtime", destination)
          PY
          fi
          if ! cmp --silent "$prior_freeze/checksums.txt" "$checksums_path"; then
            echo "::error::Post-freeze candidate checksums do not equal the attested freeze checksums."
            exit 1
          fi
          PYTHONPATH=tools/release-certification python3 - "$manifest" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          from cryptad_certification.schema_validation import validate_schema

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def digest(path):
              return "sha256:" + hashlib.sha256(Path(path).read_bytes()).hexdigest()

          manifest = load(sys.argv[1])
          inputs = manifest["inputs"]
          candidate = load(inputs["maintenanceCandidate"])
          freeze = load(inputs["maintenanceCandidateFreeze"])
          evidence = load(inputs["maintenanceEvidence"])
          provenance = load(inputs["maintenanceCandidateProvenance"])
          freeze_digest = digest(inputs["maintenanceCandidateFreeze"])
          if validate_schema(freeze, "stable-1.0-maintenance-candidate-freeze.schema.json"):
              raise SystemExit("attested candidate freeze failed its closed schema")
          if candidate.get("candidateFreezeDigest") != freeze_digest:
              raise SystemExit("candidate metadata does not bind the exact freeze record")
          if provenance.get("candidateFreezeDigest") != freeze_digest:
              raise SystemExit("candidate provenance does not bind the exact freeze record")
          if evidence.get("candidateFreezeDigest") != freeze_digest:
              raise SystemExit("maintenance evidence does not bind the exact freeze record")
          if evidence.get("candidateProductDigest") != freeze["assets"][
              next(index for index, row in enumerate(freeze["assets"]) if row["role"] == "product")
          ]["digest"]:
              raise SystemExit("maintenance evidence is bound to the wrong frozen product")
          PY

      - name: Restore prepared inputs and add only the exact approval
        if: inputs.operation == 'validate-authorization'
        run: |
          set -euo pipefail
          authorization="build/protected-inputs-artifact/stable-1.0-maintenance-authorization.json"
          if [[ -L "$authorization" || ! -f "$authorization" \
                || "$(find build/protected-inputs-artifact -mindepth 1 -maxdepth 1 -type f | wc -l)" -ne 1 \
                || -n "$(find build/protected-inputs-artifact -mindepth 1 -maxdepth 1 -type d -print -quit)" ]]; then
            echo "::error::validate-authorization producer must contain only the exact approval JSON."
            exit 1
          fi
          rm -rf build/protected-inputs
          cp -R build/prior-validated-candidate/protected-inputs build/protected-inputs
          cp build/prior-validated-candidate/stable-1.0-maintenance.json \
            build/stable-1.0-maintenance.json
          manifest="build/stable-1.0-maintenance.json"
          authorization_path="build/protected-inputs/authorization/stable-1.0-maintenance-authorization.json"
          jq -e '
            .commands["stable-maintenance"].mode == "prepare-authorization"
            and (.inputs | has("stableMaintenanceAuthorization") | not)' \
            "$manifest" >/dev/null
          jq -S --arg authorization_path "$authorization_path" '
            .commands["stable-maintenance"].mode = "validate-only"
            | .inputs.stableMaintenanceAuthorization = $authorization_path' \
            "$manifest" > "$manifest.next"
          jq -S '
            .commands["stable-maintenance"].mode = "prepare-authorization"
            | del(.inputs.stableMaintenanceAuthorization)' \
            "$manifest.next" > "$manifest.next.projected"
          jq -S . "$manifest" > "$manifest.prepared.canonical"
          if ! cmp --silent "$manifest.prepared.canonical" "$manifest.next.projected"; then
            echo "::error::Authorization validation attempted to mutate prepared manifest fields."
            exit 1
          fi
          mv "$manifest.next" "$manifest"
          mkdir -p "$(dirname "$authorization_path")"
          cp "$authorization" "$authorization_path"

      - name: Authenticate and materialize the exact protected release-train handoff
        if: inputs.operation != 'publish'
        env:
          CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64 }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="build/stable-1.0-maintenance.json"
          INPUT_RUN_ID="$(jq -er '.policies.metadata.stableBackportRunId' "$manifest")"
          INPUT_ARTIFACT_NAME="$(jq -er \
            '.policies.metadata.stableBackportArtifactName' "$manifest")"
          INPUT_ARTIFACT_DIGEST="$(jq -er \
            '.policies.metadata.stableBackportArtifactDigest' "$manifest")"
          if [[ ! "$INPUT_RUN_ID" =~ ^[1-9][0-9]*$ \
                || ! "$INPUT_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ \
                || ! "$INPUT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The manifest lacks an exact protected release-train producer identity."
            exit 1
          fi
          run_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" '
              .repository.full_name == $repository
              and .head_sha == $commit
              and .path == ".github/workflows/stable-1.0-backport-release-train.yml"
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"' <<< "$run_json" >/dev/null
          artifacts="$(gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID/artifacts" \
            -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
          jq -e --arg name "$INPUT_ARTIFACT_NAME" --arg digest "$INPUT_ARTIFACT_DIGEST" '
            [.artifacts[] | select(
              .name == $name and .expired == false and .digest == $digest
            )] | length == 1' <<< "$artifacts" >/dev/null
          root="build/authorized-backport-train"
          sealed_root="build/authorized-backport-train-sealed"
          rm -rf "$root"
          rm -rf "$sealed_root"
          mkdir -p "$sealed_root"
          gh run download "$INPUT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$INPUT_ARTIFACT_NAME" --dir "$sealed_root"
          expected_lane=routine-maintenance
          if [[ "$INPUT_RELEASE_CLASS" == security-hotfix ]]; then
            expected_lane=security-hotfix
          fi
          train_binding="$RUNNER_TEMP/stable-backport-maintenance-binding.json"
          jq -nS \
            --arg artifactKind release-train-phase \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_REPOSITORY/.github/workflows/stable-1.0-backport-release-train.yml@$INPUT_CANDIDATE_COMMIT" \
            --arg workflowCommit "$INPUT_CANDIDATE_COMMIT" \
            --arg runId "$INPUT_RUN_ID" \
            --arg runAttempt "$(jq -er '.run_attempt | tostring' <<< "$run_json")" \
            --arg operation validate-authorization \
            --arg releaseId "$INPUT_RELEASE_ID" \
            --arg buildVersion "$INPUT_BUILD_VERSION" \
            --arg releaseLane "$expected_lane" \
            --arg sourceCommit "$INPUT_CANDIDATE_COMMIT" \
            --arg artifactName "$INPUT_ARTIFACT_NAME" '
              {
                artifactKind: $artifactKind,
                repository: $repository,
                workflow: $workflow,
                workflowCommit: $workflowCommit,
                runId: $runId,
                runAttempt: $runAttempt,
                operation: $operation,
                releaseId: $releaseId,
                buildVersion: $buildVersion,
                releaseLane: $releaseLane,
                sourceCommit: $sourceCommit,
                artifactName: $artifactName
              }' > "$train_binding"
          python3 \
            tools/release-certification/protected/stable_backport_protected_handoff.py \
            open \
            --bundle "$sealed_root" \
            --out "$root" \
            --binding "$train_binding" \
            --key-env CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64
          if [[ -n "$(find "$root" -type l -print -quit)" \
                || -n "$(find "$root" -mindepth 1 ! -type f ! -type d -print -quit)" ]]; then
            echo "::error::Authorized release-train artifact contains a link or special entry."
            exit 1
          fi
          expected_files=(
            redaction-report.json
            stable-1.0-release-train-authorization-summary.json
            stable-1.0-release-train-checksums.txt
            stable-1.0-release-train-provenance.json
            stable-1.0-release-train-queue.json
            stable-1.0-release-train-queue-public.json
            stable-1.0-release-train-report.md
            stable-1.0-release-train-summary.json
            stable-1.0-release-train-validation.json
            stable-1.0-release-train-validation-public.json
            stable-1.0-release-train-workflow-provenance.json
            summary.json
            workflow-handoff-checksums.txt
          )
          predecessor_completion_handoff="$root/stable-1.0-release-train-predecessor-completion-handoff.json"
          if [[ -f "$predecessor_completion_handoff" \
                && ! -L "$predecessor_completion_handoff" ]]; then
            expected_files+=(
              stable-1.0-release-train-predecessor-completion-handoff.json
            )
          elif [[ -e "$predecessor_completion_handoff" ]]; then
            echo "::error::Authorized predecessor completion handoff is unsafe."
            exit 1
          fi
          actual_files="$(
            find "$root" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
              | LC_ALL=C sort
          )"
          expected_listing="$(printf '%s\n' "${expected_files[@]}" | LC_ALL=C sort)"
          if [[ "$actual_files" != "$expected_listing" \
                || -n "$(find "$root" -mindepth 1 -type d -print -quit)" ]]; then
            echo "::error::Authorized release-train artifact has an unexpected file set."
            exit 1
          fi
          (
            cd "$root"
            sha256sum --check --strict workflow-handoff-checksums.txt
          )
          jq -e '
            .result.status == "pass"
            and .result.exitCode == 0
            and .redaction.status == "pass"
            and .redaction.findingCount == 0' "$root/summary.json" >/dev/null
          jq -e '.status == "pass" and .findingCount == 0 and .findings == []' \
            "$root/redaction-report.json" >/dev/null
          jq -e \
            --slurpfile validation \
              "$root/stable-1.0-release-train-validation.json" \
            --arg lane "$expected_lane" '
              .kind == "stable-1.0-release-train-queue-public"
              and .redaction.status == "pass"
              and .redaction.findingCount == 0
              and .queueDigest == $validation[0].queueDigest
              and .policyDigest == $validation[0].policyDigest
              and .candidateCommit == $validation[0].candidateCommit
              and $validation[0].mode == "validate-authorization"
              and $validation[0].decision == "go"
              and $validation[0].blockers == []
              and $validation[0].omittedFixIds == []
              and $validation[0].unaccountedCommitIds == []
              and $validation[0].release.releaseClass
                == (if $lane == "security-hotfix"
                    then "security-hotfix"
                    else "maintenance"
                    end)
              and (
                if $lane == "security-hotfix"
                    and (.carriedObligationIds | length) == 1 then
                  (.carriedObligationIds[0]) as $carried
                  | .status == "blocked"
                    and ([.obligations[]
                      | select(
                          .obligationId == $carried
                          and .obligationType == "hotfix-follow-up"
                          and .status == "open"
                        )] | length) == 1
                    and ([.obligations[]
                      | select(.status == "open")] | length) == 1
                else
                  .status == "ready"
                  and .carriedObligationIds == []
                  and ([.obligations[]
                    | select(.status == "open")] | length) == 0
                end
              )' \
            "$root/stable-1.0-release-train-queue-public.json" >/dev/null
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "crypta-network/cryptad/.github/workflows/stable-1.0-backport-release-train.yml@$INPUT_CANDIDATE_COMMIT" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" \
            --arg run_id "$INPUT_RUN_ID" \
            --arg release "$INPUT_RELEASE_ID" \
            --arg build "$INPUT_BUILD_VERSION" \
            --arg lane "$expected_lane" '
              .repository == $repository
              and .workflow == $workflow
              and .workflowCommit == $commit
              and .runId == $run_id
              and .operation == "validate-authorization"
              and .releaseId == $release
              and .buildVersion == $build
              and .releaseLane == $lane
              and .sourceCommit == $commit
              and .candidateCommit == $commit' \
            "$root/stable-1.0-release-train-workflow-provenance.json" >/dev/null
          materialize_train_input() {
            local key="$1"
            local source_name="$2"
            local configured
            configured="$(jq -er --arg key "$key" '.inputs[$key]' \
              build/stable-1.0-maintenance.json)"
            python3 - "$configured" "$source_name" <<'PY'
          import sys
          from pathlib import Path

          root = Path("build/protected-inputs").resolve(strict=True)
          target = Path(sys.argv[1])
          expected_name = sys.argv[2]
          if (
              target.is_absolute()
              or target.name != expected_name
              or ".." in target.parts
          ):
              raise SystemExit(1)
          try:
              target.parent.resolve(strict=False).relative_to(root)
          except (OSError, ValueError):
              raise SystemExit(1) from None
          target.parent.mkdir(parents=True, exist_ok=True)
          try:
              target.parent.resolve(strict=True).relative_to(root)
          except (OSError, ValueError):
              raise SystemExit(1) from None
          if target.exists() and (target.is_symlink() or not target.is_file()):
              raise SystemExit(1)
          PY
            if [[ -e "$configured" ]] \
                && ! cmp --silent "$root/$source_name" "$configured"; then
              echo "::error::Protected input producer substituted the authorized release train."
              exit 1
            fi
            cp "$root/$source_name" "$configured"
          }
          materialize_train_input \
            stableBackportReleaseTrainValidation \
            stable-1.0-release-train-validation.json
          materialize_train_input \
            stableBackportReleaseTrainAuthorization \
            stable-1.0-release-train-authorization-summary.json

      - name: Authenticate source ancestry and exact change scope
        if: inputs.operation != 'publish'
        env:
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
        run: |
          set -euo pipefail
          manifest="build/stable-1.0-maintenance.json"
          candidate_path="$(jq -er '.inputs.maintenanceCandidate' "$manifest")"
          base_branch="$(jq -er '.source.baseBranch' "$candidate_path")"
          base_commit="$(jq -er '.source.baseCommit' "$candidate_path")"
          expected_base="develop"
          if [[ "$INPUT_RELEASE_CLASS" == security-hotfix ]]; then
            expected_base="main"
          fi
          if [[ "$base_branch" != "$expected_base" \
                || ! "$base_commit" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error::Candidate source base does not match its closed release class."
            exit 1
          fi
          remote_base="refs/remotes/origin/$base_branch"
          if ! git rev-parse --verify "$remote_base^{commit}" >/dev/null; then
            echo "::error::Authenticated checkout does not contain origin/$base_branch."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$base_commit" "$INPUT_CANDIDATE_COMMIT"; then
            echo "::error::Declared source base is not an ancestor of the candidate."
            exit 1
          fi
          predecessor_baseline="$(jq -er '.inputs.predecessorBaseline' "$manifest")"
          if [[ -L "$predecessor_baseline" || ! -f "$predecessor_baseline" ]]; then
            echo "::error::Authenticated predecessor baseline is missing or unsafe."
            exit 1
          fi
          predecessor_commit="$(jq -er '
            .release.sourceCommit
            | select(type == "string" and test("^[0-9a-f]{40,64}$"))' \
            "$predecessor_baseline")"
          if ! git rev-parse --verify "$predecessor_commit^{commit}" >/dev/null 2>&1; then
            echo "::error::Authenticated predecessor source commit is absent from the checkout."
            exit 1
          fi
          if ! git merge-base --is-ancestor \
              "$predecessor_commit" "$INPUT_CANDIDATE_COMMIT"; then
            echo "::error::Candidate does not contain the latest published predecessor commit."
            exit 1
          fi
          merge_base="$(git merge-base "$INPUT_CANDIDATE_COMMIT" "$remote_base")"
          if [[ "$base_commit" != "$merge_base" ]]; then
            echo "::error::Declared source base is not the exact candidate/$base_branch merge base."
            exit 1
          fi
          if [[ "$INPUT_RELEASE_CLASS" == security-hotfix \
                && "$base_commit" != "$(git rev-parse "$remote_base^{commit}")" ]]; then
            echo "::error::Security hotfix was not based on the current published main head."
            exit 1
          fi
          if ! jq -e '.changeScope.unrelatedFeatureChanges == []' "$candidate_path" >/dev/null; then
            echo "::error::Candidate change-scope audit contains unrelated feature work."
            exit 1
          fi

          mapfile -t changed_files < <(git diff --name-only --diff-filter=ACDMRTUXB \
            "$base_commit..$INPUT_CANDIDATE_COMMIT" | LC_ALL=C sort -u)
          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "::error::Maintenance candidate has no source changes from its authenticated base."
            exit 1
          fi
          mapfile -t derived_modules < <(
            for path in "${changed_files[@]}"; do
              if [[ "$path" == */* ]]; then
                printf '%s\n' "${path%%/*}"
              else
                printf '%s\n' repository-root
              fi
            done | LC_ALL=C sort -u
          )
          mapfile -t declared_modules < <(jq -er '.changeScope.changedModules[]' \
            "$candidate_path" | LC_ALL=C sort -u)
          if [[ "${#derived_modules[@]}" -ne "${#declared_modules[@]}" \
                || "$(printf '%s\n' "${derived_modules[@]}")" \
                  != "$(printf '%s\n' "${declared_modules[@]}")" ]]; then
            echo "::error::Declared changedModules does not exactly match the authenticated source diff."
            exit 1
          fi

      - name: Inspect exact lifecycle authority-chain presence
        if: inputs.operation == 'prepare-authorization' || inputs.operation == 'validate-authorization'
        id: lifecycle-authority
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("build/stable-1.0-maintenance.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          inputs = manifest.get("inputs")
          if not isinstance(inputs, dict):
              raise SystemExit("maintenance manifest lacks its closed inputs object")

          authority_files = {
              "previousStableLifecycleLedger":
                  "stable-1.0-support-lifecycle-ledger.json",
              "previousStableLifecycleDescriptor":
                  "stable-1.0-support-lifecycle-descriptor.json",
              "stableLifecycleAuthorization":
                  "stable-1.0-support-lifecycle-authorization-summary.json",
              "stableLifecyclePublicationPlan":
                  "stable-1.0-support-lifecycle-publication-plan.json",
              "stableLifecyclePublicationReceipt":
                  "stable-1.0-support-lifecycle-publication-receipt.json",
          }
          configured = [key for key in authority_files if key in inputs]
          if configured and len(configured) != len(authority_files):
              raise SystemExit(
                  "lifecycle state requires the exact five-artifact authority chain"
              )

          protected_root = Path("build/protected-inputs").resolve(strict=True)

          def protected_file(raw_value: object, label: str) -> Path:
              if not isinstance(raw_value, str) or not raw_value:
                  raise SystemExit(f"{label} is not one configured protected input")
              path = Path(raw_value)
              if path.is_absolute() or path.is_symlink() or not path.is_file():
                  raise SystemExit(f"{label} is missing or unsafe")
              try:
                  resolved = path.resolve(strict=True)
                  resolved.relative_to(protected_root)
              except (OSError, ValueError):
                  raise SystemExit(f"{label} escapes the protected-input root") from None
              return resolved

          predecessor_path = protected_file(
              inputs.get("predecessorBaseline"), "predecessorBaseline"
          )
          chain = protected_root / "lifecycle"
          if not configured:
              predecessor = json.loads(predecessor_path.read_text(encoding="utf-8"))
              if (
                  os.environ["INPUT_OPERATION"] != "prepare-authorization"
                  or predecessor.get("schemaVersion") != 1
                  or predecessor.get("kind") != "stable-1.0-maintenance-baseline"
              ):
                  raise SystemExit(
                      "only GA-genesis authorization preparation may omit lifecycle authority"
                  )
              if chain.exists():
                  if chain.is_symlink() or not chain.is_dir():
                      raise SystemExit("lifecycle authority-chain directory is unsafe")
                  if any(chain.iterdir()):
                      raise SystemExit(
                          "GA-genesis lifecycle omission contains unreferenced authority files"
                      )
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                  output.write("present=false\n")
              raise SystemExit(0)

          if chain.is_symlink() or not chain.is_dir():
              raise SystemExit("lifecycle authority-chain directory is missing or unsafe")
          expected_paths = {
              key: chain / name for key, name in authority_files.items()
          }
          for key, expected in expected_paths.items():
              actual = protected_file(inputs.get(key), key)
              if actual != expected or expected.is_symlink() or not expected.is_file():
                  raise SystemExit(
                      f"{key} is not its exact canonical lifecycle authority file"
                  )
          entries = set(chain.iterdir())
          if entries != set(expected_paths.values()):
              raise SystemExit(
                  "lifecycle authority-chain directory is not the exact five-file set"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("present=true\n")
          PY

      - name: Materialize exact read-only lifecycle provider
        if: >-
          (inputs.operation == 'prepare-authorization' ||
          inputs.operation == 'validate-authorization') &&
          steps.lifecycle-authority.outputs.present == 'true'
        id: lifecycle-backend
        env:
          INPUT_RUN_ID: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_RUN_ID }}
          INPUT_ARTIFACT_NAME: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_ARTIFACT_NAME }}
          INPUT_ARTIFACT_DIGEST: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_ARTIFACT_DIGEST }}
          EXPECTED_SOURCE_COMMIT: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_SOURCE_COMMIT }}
          EXPECTED_WHEEL_DIGEST: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_WHEEL_SHA256 }}
          EXPECTED_SIGNER_WORKFLOW: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_SIGNER_WORKFLOW }}
          EXPECTED_ENTRYPOINT: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          canonical_artifact="stable-1.0-support-lifecycle-publication-backend"
          canonical_signer="crypta-network/cryptad/.github/workflows/stable-1.0-support-lifecycle-publication-backend-producer.yml"
          canonical_entrypoint="cryptad_stable_maintenance_backend:lifecycle_factory"
          if [[ "$INPUT_ARTIFACT_NAME" != "$canonical_artifact" \
                || ! "$INPUT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ \
                || ! "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ \
                || ! "$EXPECTED_WHEEL_DIGEST" =~ ^sha256:[0-9a-f]{64}$ \
                || "$EXPECTED_SIGNER_WORKFLOW" != "$canonical_signer" \
                || "$EXPECTED_ENTRYPOINT" != "$canonical_entrypoint" ]]; then
            echo "::error::Read-only lifecycle-provider identity is incomplete or ambiguous."
            exit 1
          fi
          run_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID")"
          jq -e --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$EXPECTED_SOURCE_COMMIT" \
            --arg path "${canonical_signer#crypta-network/cryptad/}" '
              .repository.full_name == $repository and .head_sha == $commit and .path == $path
              and .event == "workflow_dispatch" and .status == "completed"
              and .conclusion == "success"' <<< "$run_json" >/dev/null
          artifacts="$(gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID/artifacts" \
            -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
          jq -e --arg name "$INPUT_ARTIFACT_NAME" --arg digest "$INPUT_ARTIFACT_DIGEST" '
            [.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)]
            | length == 1' <<< "$artifacts" >/dev/null
          root="$RUNNER_TEMP/stable-maintenance-lifecycle-observation-backend"
          download="$root/download"
          site="$root/site-packages"
          rm -rf "$root"
          mkdir -p "$download" "$site"
          gh run download "$INPUT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$INPUT_ARTIFACT_NAME" --dir "$download"
          wheels=()
          while IFS= read -r path; do wheels+=("$path"); done < <(
            find "$download" -type f -name '*.whl' -print | LC_ALL=C sort
          )
          if [[ "${#wheels[@]}" -ne 1 \
                || -n "$(find "$download" -type l -print -quit)" \
                || "$(find "$download" -type f ! -name '*.whl' | wc -l)" -ne 0 ]]; then
            echo "::error::Read-only lifecycle-provider artifact is not one safe wheel."
            exit 1
          fi
          wheel="${wheels[0]}"
          if [[ "sha256:$(sha256sum "$wheel" | cut -d' ' -f1)" != "$EXPECTED_WHEEL_DIGEST" ]]; then
            echo "::error::Read-only lifecycle-provider wheel differs from its reviewed digest."
            exit 1
          fi
          gh attestation verify "$wheel" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$EXPECTED_SIGNER_WORKFLOW" \
            --source-digest "$EXPECTED_SOURCE_COMMIT" \
            --deny-self-hosted-runners >/dev/null
          python3 -m pip install --no-index --no-deps --no-compile --target "$site" "$wheel" >/dev/null
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "entrypoint=$EXPECTED_ENTRYPOINT" >> "$GITHUB_OUTPUT"

      - name: Re-fetch exact public lifecycle edition under the shared publication lock
        if: >-
          (inputs.operation == 'prepare-authorization' ||
          inputs.operation == 'validate-authorization') &&
          steps.lifecycle-authority.outputs.present == 'true'
        env:
          CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND: ${{ steps.lifecycle-backend.outputs.entrypoint }}
          CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_SITE: ${{ steps.lifecycle-backend.outputs.site }}
          CRYPTAD_STABLE_LIFECYCLE_OBSERVATION_ENVIRONMENT: 'true'
        run: |
          set -euo pipefail
          manifest="build/stable-1.0-maintenance.json"
          chain="build/protected-inputs/lifecycle"
          observation_root="build/protected-inputs/lifecycle-observation"
          observation="$observation_root/stable-1.0-support-lifecycle-public-observation-receipt.json"
          rm -rf "$observation_root"
          mkdir -p "$observation_root"
          python3 tools/release-certification/protected/stable_lifecycle_publication.py \
            --mode observe-authorized-state \
            --authority-chain "$chain" \
            --out "$observation_root/operation-summary.json" \
            --receipt "$observation" \
            --no-side-effects
          jq -e '
            .operation == "verified-existing"
            and .publicationState == "publication-complete"
            and .verificationStatus == "verified"
            and .conflict == false
            and .redaction.status == "pass"' "$observation" >/dev/null
          jq -S --arg path "$observation" \
            '.inputs.stableLifecyclePublicObservationReceipt = $path' \
            "$manifest" > "$manifest.next"
          mv "$manifest.next" "$manifest"

      - name: Attest the fresh exact public lifecycle observation
        if: >-
          (inputs.operation == 'prepare-authorization' ||
          inputs.operation == 'validate-authorization') &&
          steps.lifecycle-authority.outputs.present == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/protected-inputs/lifecycle-observation/stable-1.0-support-lifecycle-public-observation-receipt.json

      - name: Verify fresh lifecycle observation provenance before certification
        if: >-
          (inputs.operation == 'prepare-authorization' ||
          inputs.operation == 'validate-authorization') &&
          steps.lifecycle-authority.outputs.present == 'true'
        env:
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          observation="build/protected-inputs/lifecycle-observation/stable-1.0-support-lifecycle-public-observation-receipt.json"
          gh attestation verify "$observation" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "crypta-network/cryptad/.github/workflows/stable-1.0-maintenance-release.yml" \
            --source-digest "$INPUT_CANDIDATE_COMMIT" \
            --deny-self-hosted-runners >/dev/null

      - name: Materialize authenticated vulnerability summary outside public roots
        if: inputs.operation == 'prepare-authorization' || inputs.operation == 'validate-authorization'
        env:
          GH_TOKEN: ${{ github.token }}
          CRYPTAD_STABLE_VULNERABILITY_ANCHOR_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_VULNERABILITY_ANCHOR_READ_TOKEN }}
          CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64 }}
        run: |
          set -euo pipefail
          manifest=build/stable-1.0-maintenance.json
          configured="$(jq -er '.inputs.stableVulnerabilitySummary' "$manifest")"
          summary_name=stable-1.0-vulnerability-summary.json
          if [[ "$configured" != "$summary_name" ]] \
              || ! jq -e '
                .policies.stableVulnerabilityGovernance == "required"
              ' "$manifest" >/dev/null; then
            echo "::error::Stable vulnerability governance is not the exact required protected input."
            exit 1
          fi
          input_root=build/protected-inputs
          external_root="$RUNNER_TEMP/stable-vulnerability-summary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          opened="$RUNNER_TEMP/stable-vulnerability-opened-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$external_root" "$opened"
          python3 tools/release-certification/protected/stable_backport_protected_handoff.py open \
            --bundle "$input_root/sealed-successor" \
            --out "$opened" \
            --binding "$input_root/stable-1.0-vulnerability-successor-binding.json" \
            --key-env CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64
          source="$opened/$summary_name"
          if [[ -L "$source" || ! -f "$source" \
                || "$(stat -c '%h' "$source")" -ne 1 \
                || "$(stat -c '%s' "$source")" -le 0 \
                || "$(stat -c '%s' "$source")" -gt 4194304 ]]; then
            echo "::error::Authenticated Stable vulnerability summary is missing, linked, or oversized."
            exit 1
          fi
          install -d -m 700 "$external_root" "$external_root/sealed-successor"
          install -m 600 "$source" "$external_root/$summary_name"
          install -m 600 \
            "$input_root/stable-1.0-vulnerability-successor-binding.json" \
            "$external_root/stable-1.0-vulnerability-successor-binding.json"
          install -m 600 \
            "$input_root/stable-1.0-vulnerability-summary-provenance.json" \
            "$external_root/stable-1.0-vulnerability-summary-provenance.json"
          install -m 600 \
            "$input_root/sealed-successor/stable-1.0-protected-handoff.enc" \
            "$external_root/sealed-successor/stable-1.0-protected-handoff.enc"
          install -m 600 \
            "$input_root/sealed-successor/stable-1.0-protected-handoff.json" \
            "$external_root/sealed-successor/stable-1.0-protected-handoff.json"
          mapfile -t actual < <(find "$external_root" -mindepth 1 -printf '%P\n' | LC_ALL=C sort)
          expected=(
            sealed-successor
            sealed-successor/stable-1.0-protected-handoff.enc
            sealed-successor/stable-1.0-protected-handoff.json
            stable-1.0-vulnerability-successor-binding.json
            stable-1.0-vulnerability-summary-provenance.json
            stable-1.0-vulnerability-summary.json
          )
          test "${actual[*]}" = "${expected[*]}"
          while IFS= read -r candidate; do
            test ! -L "$candidate"
            test "$(stat -c %h "$candidate")" = 1
          done < <(find "$external_root" -type f -print)
          genesis_digest="$(jq -er .ledgerDigest \
            tools/release-certification/stable-1.0-vulnerability-ledger-genesis.json)"
          python3 tools/release-certification/protected/stable_vulnerability_actions_tip.py \
            verify-promotion \
            --repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$(jq -er .runId "$external_root/stable-1.0-vulnerability-successor-binding.json")" \
            --expected-run-attempt "$(jq -er .runAttempt "$external_root/stable-1.0-vulnerability-successor-binding.json")" \
            --expected-artifact-name "$(jq -er .artifactName "$external_root/stable-1.0-vulnerability-successor-binding.json")" \
            --expected-artifact-digest "$(jq -er .producerArtifactDigest "$external_root/stable-1.0-vulnerability-summary-provenance.json")" \
            --genesis-ledger-digest "$genesis_digest" \
            --binding "$external_root/stable-1.0-vulnerability-successor-binding.json" \
            --provenance "$external_root/stable-1.0-vulnerability-summary-provenance.json" \
            --environment-file "$GITHUB_ENV"
          rm -rf "$opened"
          printf 'CRYPTAD_STABLE_VULNERABILITY_SUMMARY_ROOT=%s\n' \
            "$external_root" >> "$GITHUB_ENV"

      - name: Recheck dependency intelligence age and durable tip before authorization preparation
        if: >-
          inputs.operation == 'prepare-authorization' &&
          steps.dependency_vulnerability_activation.outputs.active == 'true'
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_ANCHOR_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_ANCHOR_READ_TOKEN }}
          CRYPTAD_STABLE_DEPENDENCY_INTELLIGENCE_LINEAGE_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_INTELLIGENCE_LINEAGE_READ_TOKEN }}
          CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_HANDOFF_KEY_BASE64 }}
        run: |
          set -euo pipefail
          root="build/protected-inputs/dependency-vulnerability"
          summary="$root/stable-1.0-dependency-vulnerability-promotion-summary.json"
          publication_plan="$root/stable-1.0-dependency-vulnerability-publication-plan.json"
          source_status="$root/stable-1.0-dependency-vulnerability-source-status.json"
          provenance="$root/stable-1.0-dependency-vulnerability-summary-provenance.json"
          test -f "$summary" && test ! -L "$summary"
          test -f "$publication_plan" && test ! -L "$publication_plan"
          test -f "$source_status" && test ! -L "$source_status"
          test -f "$provenance" && test ! -L "$provenance"
          PYTHONPATH=tools/release-certification python3 - \
            "$summary" "$INPUT_RELEASE_ID" "$INPUT_BUILD_VERSION" "$INPUT_CANDIDATE_COMMIT" <<'PY'
          import datetime as dt
          import hashlib
          import json
          import sys
          from pathlib import Path
          from cryptad_certification.stable_dependency_vulnerability_handoff import (
              stable_dependency_vulnerability_evaluation_handoff_errors,
          )
          path = Path(sys.argv[1])
          value = json.loads(path.read_text(encoding="utf-8"))
          digest = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          errors, _ = stable_dependency_vulnerability_evaluation_handoff_errors(
              path, digest, sys.argv[2], sys.argv[3], sys.argv[4]
          )
          valid_until = dt.datetime.fromisoformat(
              str(value.get("validUntil", "")).replace("Z", "+00:00")
          )
          if (
              errors
              or valid_until.tzinfo is None
              or dt.datetime.now(dt.timezone.utc) >= valid_until
          ):
              raise SystemExit(
                  "dependency-vulnerability promotion is stale or unauthenticated"
              )
          PY
          python3 tools/release-certification/protected/stable_dependency_vulnerability_actions_tip.py verify-current \
            --repository "$GITHUB_REPOSITORY" \
            --expected-ledger-digest "$(jq -er .ledgerDigest "$summary")" \
            --expected-ledger-edition "$(jq -er .ledgerEdition "$summary")"
          python3 tools/release-certification/protected/stable_dependency_intelligence_actions_lineage.py verify-current-status \
            --repository "$GITHUB_REPOSITORY" \
            --source-status "$source_status" \
            --publication-plan "$publication_plan" \
            --promotion-summary "$summary"

      - name: Validate manifest identity and side-effect-free mode
        if: inputs.operation == 'prepare-authorization' || inputs.operation == 'validate-authorization'
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EXPECTED_BRANCH: ${{ needs.validate-dispatch.outputs.expected_branch }}
          INPUT_OPERATION: ${{ inputs.operation }}
          DEPENDENCY_VULNERABILITY_ACTIVE: ${{ steps.dependency_vulnerability_activation.outputs.active || 'false' }}
        run: |
          set -euo pipefail
          manifest="build/stable-1.0-maintenance.json"
          jq -e \
            --arg release "$INPUT_RELEASE_ID" \
            --arg build "$INPUT_BUILD_VERSION" \
            --arg release_class "$INPUT_RELEASE_CLASS" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" \
            --arg branch "$EXPECTED_BRANCH" \
            --arg operation "$INPUT_OPERATION" \
            --arg dependency_vulnerability_active "$DEPENDENCY_VULNERABILITY_ACTIVE" '
              .release.id == $release
              and .release.version == $build
              and .release.profile == "stable-review"
              and .policies.stableVulnerabilityGovernance == "required"
              and .policies.releaseClass == $release_class
              and .policies.candidateSourceBranch == $branch
              and .policies.candidateSourceCommit == $commit
              and .policies.candidateSourceRef == ("commit:" + $commit)
              and (if $dependency_vulnerability_active == "true" then
                .policies.stableDependencyVulnerabilityGovernance == "required"
                and .inputs.dependencyVulnerabilityPromotionSummary
                  == "build/protected-inputs/dependency-vulnerability/stable-1.0-dependency-vulnerability-promotion-summary.json"
              else true end)
              and .execution.allowDirtyWorkspace == false
              and .execution.fixtureEvidence == false
              and .execution.allowTestSigningInProduction == false
              and .commands["stable-maintenance"].mode
                == (if $operation == "validate-authorization" then "validate-only" else "prepare-authorization" end)' \
            "$manifest" >/dev/null
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            # All generated material is under ignored build/, so any result here is source drift.
            echo "::error::Source state changed before candidate validation."
            exit 1
          fi

      - name: Validate exact frozen candidate without publication
        if: inputs.operation == 'prepare-authorization' || inputs.operation == 'validate-authorization'
        env:
          CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_HANDOFF_KEY_BASE64 }}
          CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64 }}
          CRYPTAD_STABLE_SUPPLY_CHAIN_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_SUPPLY_CHAIN_HANDOFF_KEY_BASE64 }}
        run: >-
          python3 tools/release-certification/certify.py stable-maintenance
          --manifest build/stable-1.0-maintenance.json

      - name: Prepare exact authorization material without publication
        if: inputs.operation == 'prepare-authorization'
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          source="build/release-certification/$INPUT_RELEASE_ID/stable-maintenance"
          destination="build/stable-maintenance-authorization/$INPUT_RELEASE_ID/stable-maintenance"
          mkdir -p "$(dirname "$destination")"
          cp -R "$source" "$destination"

      - name: Verify final frozen candidate and exact prior identity
        if: inputs.operation == 'prepare-authorization' || inputs.operation == 'validate-authorization'
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INPUT_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          component="build/release-certification/$INPUT_RELEASE_ID/stable-maintenance"
          legacy="$component/artifacts/legacy"
          jq -e \
            --arg release "$INPUT_RELEASE_ID" \
            --arg build "$INPUT_BUILD_VERSION" \
            --arg operation "$INPUT_OPERATION" '
              .schemaVersion == 2
              and .kind == "stable-1.0-maintenance-promotion"
              and .subject.releaseId == $release
              and .subject.version == $build
              and .subject.profile == "stable-review"
              and .subject.component == "stable-maintenance"
              and .result.status == "pass"
              and .result.exitCode == 0
              and .result.promotionReady == ($operation == "validate-authorization")
              and .redaction.status == "pass"
              and .redaction.findingCount == 0' "$component/summary.json" >/dev/null
          jq -e '.status == "pass" and .findingCount == 0 and .findings == []' \
            "$component/redaction-report.json" >/dev/null
          required=(
            stable-1.0-maintenance-lineage.json
            stable-1.0-maintenance-candidate.json
            stable-1.0-maintenance-comparison.json
            stable-1.0-maintenance-validation.json
            stable-1.0-maintenance-promotion-summary.json
            stable-1.0-maintenance-publication-plan.json
            stable-1.0-maintenance-checksums.txt
            stable-1.0-maintenance-provenance.json
            core-info.json
            core-update-publication-plan.json
          )
          for name in "${required[@]}"; do
            if [[ -L "$legacy/$name" || ! -f "$legacy/$name" ]]; then
              echo "::error::Required frozen candidate artifact $name is missing or unsafe."
              exit 1
            fi
          done
          jq -e \
            --arg release "$INPUT_RELEASE_ID" \
            --arg build "$INPUT_BUILD_VERSION" \
            --arg release_class "$INPUT_RELEASE_CLASS" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" '
              .releaseId == $release
              and .buildVersion == $build
              and .releaseClass == $release_class
              and .source.commit == $commit
              and .redaction.status == "pass"' \
            "$legacy/stable-1.0-maintenance-candidate.json" >/dev/null
          if [[ "$INPUT_OPERATION" == validate-authorization ]]; then
            prior="build/prior-validated-candidate/component/artifacts/legacy"
            immutable=(
              stable-1.0-maintenance-lineage.json
              stable-1.0-maintenance-candidate.json
              stable-1.0-maintenance-comparison.json
              stable-1.0-maintenance-known-limitations.json
              stable-1.0-maintenance-release-notes.md
              stable-1.0-maintenance-checksums.txt
              stable-1.0-maintenance-provenance.json
              core-info.json
            )
            for name in "${immutable[@]}"; do
              if ! cmp --silent "$prior/$name" "$legacy/$name"; then
                echo "::error::Prepublication validation changed frozen artifact $name."
                exit 1
              fi
            done
            while read -r digest name; do
              if [[ ! "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ \
                    || "sha256:$(sha256sum "$legacy/$name" | awk '{print $1}')" \
                      != "sha256:$digest" ]]; then
                echo "::error::A checksum-bound candidate byte changed before publication."
                exit 1
              fi
            done < "$legacy/stable-1.0-maintenance-checksums.txt"
          fi

      - name: Stage exact redaction-safe candidate
        id: stage
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INPUT_OPERATION: ${{ inputs.operation }}
          CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64 }}
        run: |
          set -euo pipefail
          root="build/stable-maintenance-validation-artifact"
          rm -rf "$root"
          mkdir -p "$root"
          if [[ "$INPUT_OPERATION" == freeze-candidate ]]; then
            mkdir -p "$root/freeze" "$root/packages" "$root/authenticated-inputs"
            cp -R build/stable-maintenance-freeze/. "$root/freeze/"
            cp -R build/stable-maintenance-packages/. "$root/packages/"
            artifact_name="stable-1-0-maintenance-frozen-$INPUT_RELEASE_ID-$INPUT_BUILD_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          elif [[ "$INPUT_OPERATION" == publish ]]; then
            cp -R build/prior-validated-candidate/. "$root/"
            artifact_name="stable-1-0-maintenance-publish-input-$INPUT_RELEASE_ID-$INPUT_BUILD_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          else
            component="build/release-certification/$INPUT_RELEASE_ID/stable-maintenance"
            mkdir -p "$root/component" "$root/packages" "$root/authenticated-inputs"
            cp -R "$component/." "$root/component/"
            cp -R build/stable-maintenance-packages/. "$root/packages/"
            cp build/stable-1.0-maintenance.json "$root/stable-1.0-maintenance.json"
            cp -R build/protected-inputs "$root/protected-inputs"
            artifact_name="stable-1-0-maintenance-prepared-$INPUT_RELEASE_ID-$INPUT_BUILD_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if [[ "$INPUT_OPERATION" == validate-authorization ]]; then
              artifact_name="stable-1-0-maintenance-authorized-$INPUT_RELEASE_ID-$INPUT_BUILD_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            fi
          fi
          stage_authenticated_input() {
            local key="$1"
            local output_name="$2"
            local output_root="${3:-$root/authenticated-inputs}"
            local configured
            configured="$(jq -er --arg key "$key" '.inputs[$key]' \
              build/stable-1.0-maintenance.json)"
            if ! python3 - "$configured" <<'PY'
          import sys
          from pathlib import Path

          root = Path("build/protected-inputs").resolve(strict=True)
          path = Path(sys.argv[1])
          if path.is_absolute() or path.is_symlink() or not path.is_file():
              raise SystemExit(1)
          try:
              path.resolve(strict=True).relative_to(root)
          except (OSError, ValueError):
              raise SystemExit(1) from None
          PY
            then
              echo "::error::Authenticated input $key is missing or escapes the protected-input root."
              exit 1
            fi
            cp "$configured" "$output_root/$output_name"
          }
          if [[ "$INPUT_OPERATION" == freeze-candidate \
                || "$INPUT_OPERATION" == prepare-authorization \
                || "$INPUT_OPERATION" == validate-authorization ]]; then
            train_plaintext="$RUNNER_TEMP/stable-maintenance-train-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            rm -rf "$train_plaintext"
            install -d -m 700 "$train_plaintext"
            trap 'rm -rf "$train_plaintext"' EXIT
            stage_authenticated_input \
              stableBackportReleaseTrainValidation \
              stable-1.0-release-train-validation.json \
              "$train_plaintext"
            stage_authenticated_input \
              stableBackportReleaseTrainAuthorization \
              stable-1.0-release-train-authorization-summary.json \
              "$train_plaintext"
            if [[ "$INPUT_OPERATION" == prepare-authorization \
                  || "$INPUT_OPERATION" == validate-authorization ]]; then
              prior_train="build/prior-stable-backport-release-train/stable-1.0-release-train-validation.json"
              current_train="$train_plaintext/stable-1.0-release-train-validation.json"
              prior_train_authorization="build/prior-stable-backport-release-train/stable-1.0-release-train-authorization-summary.json"
              current_train_authorization="$train_plaintext/stable-1.0-release-train-authorization-summary.json"
              if [[ -L "$prior_train" || ! -f "$prior_train" \
                    || -L "$prior_train_authorization" \
                    || ! -f "$prior_train_authorization" ]] \
                  || ! cmp --silent "$prior_train" "$current_train" \
                  || ! cmp --silent \
                    "$prior_train_authorization" "$current_train_authorization"; then
                echo "::error::Release-train validation or authorization changed across the maintenance freeze/authorization handoff."
                exit 1
              fi
            fi
            train_binding="$RUNNER_TEMP/stable-maintenance-current-train-binding.json"
            jq -nS \
              --arg artifactKind stable-maintenance-release-train-phase \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg workflow "$GITHUB_REPOSITORY/.github/workflows/stable-1.0-maintenance-release.yml@$INPUT_CANDIDATE_COMMIT" \
              --arg workflowCommit "$INPUT_CANDIDATE_COMMIT" \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg operation "$INPUT_OPERATION" \
              --arg releaseId "$INPUT_RELEASE_ID" \
              --arg buildVersion "$INPUT_BUILD_VERSION" \
              --arg releaseClass "$INPUT_RELEASE_CLASS" \
              --arg sourceCommit "$INPUT_CANDIDATE_COMMIT" \
              --arg artifactName "$artifact_name" '
                {
                  artifactKind: $artifactKind,
                  repository: $repository,
                  workflow: $workflow,
                  workflowCommit: $workflowCommit,
                  runId: $runId,
                  runAttempt: $runAttempt,
                  operation: $operation,
                  releaseId: $releaseId,
                  buildVersion: $buildVersion,
                  releaseClass: $releaseClass,
                  sourceCommit: $sourceCommit,
                  artifactName: $artifactName
                }' > "$train_binding"
            python3 \
              tools/release-certification/protected/stable_backport_protected_handoff.py \
              seal \
              --source "$train_plaintext" \
              --out "$root/stable-backport-release-train-handoff" \
              --binding "$train_binding" \
              --key-env CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64
            remove_staged_train_input() {
              local key="$1"
              local configured
              configured="$(jq -er --arg key "$key" '.inputs[$key]' \
                build/stable-1.0-maintenance.json)"
              python3 - "$configured" "$root/protected-inputs" <<'PY'
          import sys
          from pathlib import Path

          source_root = Path("build/protected-inputs").resolve(strict=True)
          configured = Path(sys.argv[1])
          staged_root = Path(sys.argv[2])
          if (
              configured.is_absolute()
              or configured.is_symlink()
              or not configured.is_file()
              or staged_root.is_symlink()
              or not staged_root.is_dir()
          ):
              raise SystemExit("release-train protected input path is unsafe")
          try:
              relative = configured.resolve(strict=True).relative_to(source_root)
              target = staged_root.joinpath(relative)
              target.resolve(strict=True).relative_to(staged_root.resolve(strict=True))
          except (OSError, ValueError):
              raise SystemExit("release-train protected input path escapes staging") from None
          if target.is_symlink() or not target.is_file():
              raise SystemExit("staged release-train authority is missing or unsafe")
          target.unlink()
          PY
            }
            if [[ "$INPUT_OPERATION" == prepare-authorization \
                  || "$INPUT_OPERATION" == validate-authorization ]]; then
              remove_staged_train_input stableBackportReleaseTrainValidation
              remove_staged_train_input stableBackportReleaseTrainAuthorization
            fi
          fi
          if [[ "$INPUT_OPERATION" == prepare-authorization \
                || "$INPUT_OPERATION" == validate-authorization ]]; then
            stage_authenticated_input maintenanceCandidate maintenance-candidate-input.json
            stage_authenticated_input maintenanceCandidateFreeze maintenance-candidate-freeze.json
            stage_authenticated_input stableGaMaintenanceBaseline stable-ga-maintenance-baseline.json
            stage_authenticated_input predecessorBaseline predecessor-maintenance-baseline.json
            stage_authenticated_input maintenanceEvidence maintenance-evidence.json
            if jq -e \
              '.inputs.hotfixFollowUpClosure? | type == "string" and length > 0' \
              build/stable-1.0-maintenance.json >/dev/null; then
              stage_authenticated_input \
                hotfixFollowUpClosure stable-1.0-hotfix-follow-up-closure.json
            fi
          fi
          if [[ "$INPUT_OPERATION" == freeze-candidate \
                || "$INPUT_OPERATION" == prepare-authorization \
                || "$INPUT_OPERATION" == validate-authorization ]]; then
            lifecycle_input_count="$(jq -er '[
              .inputs
              | has("previousStableLifecycleLedger"),
                has("previousStableLifecycleDescriptor"),
                has("stableLifecycleAuthorization"),
                has("stableLifecyclePublicationPlan"),
                has("stableLifecyclePublicationReceipt")
              ] | map(select(.)) | length' build/stable-1.0-maintenance.json)"
            if [[ "$lifecycle_input_count" -ne 0 && "$lifecycle_input_count" -ne 5 ]]; then
              echo "::error::Lifecycle state must remain an exact five-artifact authority chain."
              exit 1
            fi
            if [[ "$lifecycle_input_count" -eq 5 ]]; then
              stage_authenticated_input \
                previousStableLifecycleLedger stable-lifecycle-ledger.json
              stage_authenticated_input \
                previousStableLifecycleDescriptor stable-lifecycle-descriptor.json
              stage_authenticated_input \
                stableLifecycleAuthorization stable-lifecycle-authorization-summary.json
              stage_authenticated_input \
                stableLifecyclePublicationPlan stable-lifecycle-publication-plan.json
              stage_authenticated_input \
                stableLifecyclePublicationReceipt stable-lifecycle-publication-receipt.json
              if [[ "$INPUT_OPERATION" == prepare-authorization \
                    || "$INPUT_OPERATION" == validate-authorization ]]; then
                stage_authenticated_input \
                  stableLifecyclePublicObservationReceipt \
                  stable-lifecycle-public-observation-receipt.json
              fi
            fi
            if [[ "$INPUT_OPERATION" != freeze-candidate ]]; then
              python3 - \
                build/prior-validated-candidate/authenticated-inputs \
                "$root/authenticated-inputs" <<'PY'
          import sys
          from pathlib import Path

          names = {
              "stable-lifecycle-ledger.json",
              "stable-lifecycle-descriptor.json",
              "stable-lifecycle-authorization-summary.json",
              "stable-lifecycle-publication-plan.json",
              "stable-lifecycle-publication-receipt.json",
          }
          prior = Path(sys.argv[1])
          current = Path(sys.argv[2])

          def present(root: Path) -> set[str]:
              if root.is_symlink() or not root.is_dir():
                  raise SystemExit("lifecycle handoff root is missing or unsafe")
              found = set()
              for name in names:
                  path = root / name
                  if path.is_symlink():
                      raise SystemExit("lifecycle handoff contains a symbolic link")
                  if path.exists():
                      if not path.is_file():
                          raise SystemExit("lifecycle handoff entry is not a regular file")
                      found.add(name)
              if found and found != names:
                  raise SystemExit(
                      "lifecycle handoff contains a partial prior/current authority chain"
                  )
              return found

          prior_names = present(prior)
          current_names = present(current)
          if prior_names != current_names:
              raise SystemExit(
                  "lifecycle authority-chain presence changed after the prior attested phase"
              )
          for name in sorted(prior_names):
              if (prior / name).read_bytes() != (current / name).read_bytes():
                  raise SystemExit(
                      "lifecycle state changed after the prior attested phase"
                  )
          PY
            fi
          fi
          if [[ "$INPUT_OPERATION" == prepare-authorization ]]; then
            authorization_component="build/stable-maintenance-authorization/$INPUT_RELEASE_ID/stable-maintenance"
            if [[ ! -d "$authorization_component" ]]; then
              echo "::error::prepare-authorization did not produce its component."
              exit 1
            fi
            mkdir -p "$root/authorization-component"
            cp -R "$authorization_component/." "$root/authorization-component/"
          fi
          if [[ -n "$(find "$root" -type l -print -quit)" \
                || -n "$(find "$root" -mindepth 1 ! -type f ! -type d -print -quit)" ]]; then
            echo "::error::Staged candidate contains a link or special entry."
            exit 1
          fi
          if find "$root" -type f \
              \( -name stable-1.0-release-train-validation.json \
                 -o -name stable-1.0-release-train-authorization-summary.json \) \
              -print -quit | grep -q .; then
            echo "::error::Staged maintenance artifact exposes plaintext release-train authority."
            exit 1
          fi
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload exact validated candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: build/stable-maintenance-validation-artifact/
          if-no-files-found: error
          retention-days: 90

  attest-evidence:
    name: Attest exact Stable maintenance phase output
    if: inputs.operation != 'publish'
    needs:
      - validate-dispatch
      - freeze-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: stable-1.0-maintenance-evidence
    permissions:
      contents: read
      actions: read
      attestations: write
      artifact-metadata: write
      id-token: write

    steps:
      - name: Download exact validated candidate from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.freeze-and-validate.outputs.artifact_name }}
          path: build/stable-maintenance-evidence-attestation
          digest-mismatch: error

      - name: Verify protected attestation subjects
        if: inputs.operation == 'prepare-authorization'
        env:
          LIFECYCLE_AUTHORITY_PRESENT: ${{ needs.freeze-and-validate.outputs.lifecycle_authority_present }}
        run: |
          set -euo pipefail
          root="build/stable-maintenance-evidence-attestation"
          subjects=(
            "$root/component/artifacts/legacy/stable-1.0-maintenance-candidate.json"
            "$root/component/artifacts/legacy/stable-1.0-maintenance-validation.json"
            "$root/authorization-component/artifacts/legacy/stable-1.0-maintenance-authorization-summary.json"
            "$root/authorization-component/artifacts/legacy/stable-1.0-maintenance-publication-plan.json"
            "$root/authorization-component/artifacts/legacy/core-info.json"
          )
          lifecycle_observation="$root/authenticated-inputs/stable-lifecycle-public-observation-receipt.json"
          if [[ "$LIFECYCLE_AUTHORITY_PRESENT" == true ]]; then
            subjects+=("$lifecycle_observation")
          elif [[ -e "$lifecycle_observation" || -L "$lifecycle_observation" ]]; then
            echo "::error::GA-genesis output unexpectedly retained a lifecycle observation."
            exit 1
          fi
          for subject in "${subjects[@]}"; do
            if [[ -L "$subject" || ! -f "$subject" ]]; then
              echo "::error::Protected maintenance attestation subject is missing or unsafe."
              exit 1
            fi
          done
          jq -e '.result.status == "pass" and .redaction.status == "pass"' \
            "$root/component/summary.json" >/dev/null
          jq -e '.result.status == "pass" and .redaction.status == "pass"' \
            "$root/authorization-component/summary.json" >/dev/null

      - name: Attest candidate, authorization, publication targets, and updater descriptor
        if: inputs.operation == 'prepare-authorization'
        id: attest-prepared
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/stable-maintenance-evidence-attestation/component/artifacts/legacy/stable-1.0-maintenance-candidate.json
            build/stable-maintenance-evidence-attestation/component/artifacts/legacy/stable-1.0-maintenance-validation.json
            build/stable-maintenance-evidence-attestation/authorization-component/artifacts/legacy/stable-1.0-maintenance-authorization-summary.json
            build/stable-maintenance-evidence-attestation/authorization-component/artifacts/legacy/stable-1.0-maintenance-publication-plan.json
            build/stable-maintenance-evidence-attestation/authorization-component/artifacts/legacy/core-info.json

      - name: Attest exact candidate freeze record and selected bytes
        if: inputs.operation == 'freeze-candidate'
        id: attest-freeze
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/stable-maintenance-evidence-attestation/freeze/stable-1.0-maintenance-candidate-freeze.json
            build/stable-maintenance-evidence-attestation/freeze/checksums.txt
            build/stable-maintenance-evidence-attestation/freeze/assets/*
            build/stable-maintenance-evidence-attestation/freeze/runtime/*

      - name: Attest authorized candidate, publication plan, and updater descriptor
        if: inputs.operation == 'validate-authorization'
        id: attest-authorized
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/stable-maintenance-evidence-attestation/component/artifacts/legacy/stable-1.0-maintenance-candidate.json
            build/stable-maintenance-evidence-attestation/component/artifacts/legacy/stable-1.0-maintenance-validation.json
            build/stable-maintenance-evidence-attestation/component/artifacts/legacy/stable-1.0-maintenance-authorization-summary.json
            build/stable-maintenance-evidence-attestation/component/artifacts/legacy/stable-1.0-maintenance-publication-plan.json
            build/stable-maintenance-evidence-attestation/component/artifacts/legacy/core-info.json

      - name: Attest retained lifecycle public observation
        if: >-
          (inputs.operation == 'prepare-authorization' ||
          inputs.operation == 'validate-authorization') &&
          needs.freeze-and-validate.outputs.lifecycle_authority_present == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/stable-maintenance-evidence-attestation/authenticated-inputs/stable-lifecycle-public-observation-receipt.json

      - name: Summarize side-effect-free evidence approval
        run: |
          echo "Attested the exact ${{ inputs.operation }} Stable maintenance output." >> "$GITHUB_STEP_SUMMARY"
          echo "No tag, GitHub Release, catalog insert, CoreUpdater insert, announcement, branch creation, or merge occurred." >> "$GITHUB_STEP_SUMMARY"

  protected-publication:
    name: Publish or verify exact authorized maintenance bytes
    if: inputs.operation == 'publish'
    needs:
      - validate-dispatch
      - freeze-and-validate
    concurrency:
      group: stable-1-0-vulnerability-ledger
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: >-
        ${{ inputs.release_class == 'security-hotfix'
            && 'stable-1.0-security-hotfix-publication'
            || 'stable-1.0-maintenance-publication' }}
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      artifact_name: ${{ steps.stage-publication.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload-publication.outputs.artifact-digest }}

    steps:
      - name: Check out exact authorized candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Materialize exact reviewed publication backend
        id: publication-backend
        uses: ./.github/actions/setup-stable-maintenance-publication-backend
        with:
          run-id: ${{ inputs.publication_backend_run_id }}
          artifact-name: ${{ inputs.publication_backend_artifact_name }}
          artifact-digest: ${{ inputs.publication_backend_artifact_digest }}
          source-commit: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_SOURCE_COMMIT }}
          wheel-sha256: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_WHEEL_SHA256 }}
          signer-workflow: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_SIGNER_WORKFLOW }}
          entrypoint: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND }}
          github-token: ${{ github.token }}

      - name: Materialize exact read-only lifecycle provider for publication boundary
        id: publication-lifecycle-backend
        env:
          INPUT_RUN_ID: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_RUN_ID }}
          INPUT_ARTIFACT_NAME: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_ARTIFACT_NAME }}
          INPUT_ARTIFACT_DIGEST: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_ARTIFACT_DIGEST }}
          EXPECTED_SOURCE_COMMIT: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_SOURCE_COMMIT }}
          EXPECTED_WHEEL_DIGEST: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_WHEEL_SHA256 }}
          EXPECTED_SIGNER_WORKFLOW: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_SIGNER_WORKFLOW }}
          EXPECTED_ENTRYPOINT: ${{ vars.CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          canonical_artifact="stable-1.0-support-lifecycle-publication-backend"
          canonical_signer="crypta-network/cryptad/.github/workflows/stable-1.0-support-lifecycle-publication-backend-producer.yml"
          canonical_entrypoint="cryptad_stable_maintenance_backend:lifecycle_factory"
          if [[ "$INPUT_ARTIFACT_NAME" != "$canonical_artifact" \
                || ! "$INPUT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ \
                || ! "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ \
                || ! "$EXPECTED_WHEEL_DIGEST" =~ ^sha256:[0-9a-f]{64}$ \
                || "$EXPECTED_SIGNER_WORKFLOW" != "$canonical_signer" \
                || "$EXPECTED_ENTRYPOINT" != "$canonical_entrypoint" ]]; then
            echo "::error::Publication-boundary lifecycle provider is incomplete or ambiguous."
            exit 1
          fi
          run_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID")"
          jq -e --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$EXPECTED_SOURCE_COMMIT" \
            --arg path "${canonical_signer#crypta-network/cryptad/}" '
              .repository.full_name == $repository and .head_sha == $commit and .path == $path
              and .event == "workflow_dispatch" and .status == "completed"
              and .conclusion == "success"' <<< "$run_json" >/dev/null
          artifacts="$(gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID/artifacts" \
            -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
          jq -e --arg name "$INPUT_ARTIFACT_NAME" --arg digest "$INPUT_ARTIFACT_DIGEST" '
            [.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)]
            | length == 1' <<< "$artifacts" >/dev/null
          root="$RUNNER_TEMP/stable-maintenance-publication-lifecycle-backend"
          download="$root/download"
          site="$root/site-packages"
          rm -rf "$root"
          mkdir -p "$download" "$site"
          gh run download "$INPUT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$INPUT_ARTIFACT_NAME" --dir "$download"
          wheels=()
          while IFS= read -r path; do wheels+=("$path"); done < <(
            find "$download" -type f -name '*.whl' -print | LC_ALL=C sort
          )
          if [[ "${#wheels[@]}" -ne 1 \
                || -n "$(find "$download" -type l -print -quit)" \
                || "$(find "$download" -type f ! -name '*.whl' | wc -l)" -ne 0 ]]; then
            echo "::error::Publication-boundary lifecycle provider is not one safe wheel."
            exit 1
          fi
          wheel="${wheels[0]}"
          if [[ "sha256:$(sha256sum "$wheel" | cut -d' ' -f1)" != "$EXPECTED_WHEEL_DIGEST" ]]; then
            echo "::error::Publication-boundary lifecycle provider differs from review."
            exit 1
          fi
          gh attestation verify "$wheel" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$EXPECTED_SIGNER_WORKFLOW" \
            --source-digest "$EXPECTED_SOURCE_COMMIT" \
            --deny-self-hosted-runners >/dev/null
          python3 -m pip install --no-index --no-deps --no-compile --target "$site" "$wheel" >/dev/null
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "entrypoint=$EXPECTED_ENTRYPOINT" >> "$GITHUB_OUTPUT"

      - name: Download exact revalidated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.freeze-and-validate.outputs.artifact_name }}
          path: build/stable-maintenance-publication
          digest-mismatch: error

      - name: Determine publication-boundary PR-289 governance activation
        id: publication_supply_chain_activation
        run: |
          set -euo pipefail
          active="$(python3 \
            tools/release-certification/protected/stable_supply_chain_activation.py \
            tools/release-certification/stable-1.0-supply-chain-policy.json \
            build/stable-maintenance-publication/authenticated-inputs/maintenance-candidate-freeze.json)"
          if [[ "$active" != true && "$active" != false ]]; then
            echo "::error::Stable supply-chain activation helper returned an invalid decision."
            exit 1
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Determine publication-boundary PR-290 governance activation
        id: publication_dependency_vulnerability_activation
        run: |
          set -euo pipefail
          active="$(python3 \
            tools/release-certification/protected/stable_dependency_vulnerability_activation.py \
            tools/release-certification/stable-1.0-dependency-vulnerability-policy.json \
            build/stable-maintenance-publication/authenticated-inputs/maintenance-candidate-freeze.json)"
          if [[ "$active" != true && "$active" != false ]]; then
            echo "::error::Stable dependency-vulnerability activation returned an invalid decision."
            exit 1
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Reauthenticate exact PR-289 promotion producer before publication
        if: steps.publication_supply_chain_activation.outputs.active == 'true'
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          protected="build/stable-maintenance-publication/protected-inputs/supply-chain"
          summary="$protected/stable-1.0-supply-chain-summary.json"
          provenance="$protected/stable-1.0-supply-chain-summary-provenance.json"
          if [[ -L "$summary" || ! -f "$summary" \
                || -L "$provenance" || ! -f "$provenance" ]]; then
            echo "::error::Authorized candidate lacks its authenticated PR-289 promotion handoff."
            exit 1
          fi
          run_id="$(jq -er .runId "$provenance")"
          run_attempt="$(jq -er .runAttempt "$provenance")"
          artifact_name="$(jq -er .artifactName "$provenance")"
          artifact_digest="$(jq -er .producerArtifactDigest "$provenance")"
          summary_digest="sha256:$(sha256sum "$summary" | awk '{print $1}')"
          jq -e \
            --arg release "$INPUT_RELEASE_ID" \
            --arg build "$INPUT_BUILD_VERSION" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" \
            --arg name "stable-1.0-supply-chain-$INPUT_RELEASE_ID-comparison" \
            --arg digest "$summary_digest" '
              .repository == "crypta-network/cryptad"
              and .workflow
                == ("crypta-network/cryptad/.github/workflows/stable-1.0-supply-chain.yml@" + $commit)
              and .workflowCommit == $commit
              and .operation == "compare-evaluate"
              and .releaseId == $release
              and .buildVersion == $build
              and .sourceCommit == $commit
              and .artifactName == $name
              and .summaryFileName == "stable-1.0-supply-chain-summary.json"
              and .summaryByteDigest == $digest
              and .attestationSubjectDigest == $digest
              and .attestationVerified == true
              and .denySelfHostedRunners == true
              and .authenticationStatus == "pass"
              and .authenticationAlgorithm == "hmac-sha256"
              and (.authenticationTag | test("^sha256:[0-9a-f]{64}$"))' \
            "$provenance" >/dev/null
          run_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" \
            --arg attempt "$run_attempt" '
              .repository.full_name == $repository
              and .head_sha == $commit
              and .path == ".github/workflows/stable-1.0-supply-chain.yml"
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and (.run_attempt | tostring) == $attempt' <<< "$run_json" >/dev/null
          artifacts="$(gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
            -f per_page=100 | jq -s '{artifacts: [.[].artifacts[]]}')"
          jq -e --arg name "$artifact_name" --arg digest "$artifact_digest" '
            [.artifacts[] | select(
              .name == $name and .expired == false and .digest == $digest
            )] | length == 1' <<< "$artifacts" >/dev/null
          gh attestation verify "$summary" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow \
              crypta-network/cryptad/.github/workflows/stable-1.0-supply-chain.yml \
            --source-digest "$INPUT_CANDIDATE_COMMIT" \
            --deny-self-hosted-runners >/dev/null

      - name: Reauthenticate current Stable vulnerability ledger before publication
        env:
          GH_TOKEN: ${{ github.token }}
          CRYPTAD_STABLE_VULNERABILITY_ANCHOR_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_VULNERABILITY_ANCHOR_READ_TOKEN }}
        run: |
          set -euo pipefail
          protected="build/stable-maintenance-publication/protected-inputs"
          binding="$protected/stable-1.0-vulnerability-successor-binding.json"
          provenance="$protected/stable-1.0-vulnerability-summary-provenance.json"
          if [[ -L "$binding" || ! -f "$binding" \
                || -L "$provenance" || ! -f "$provenance" ]]; then
            echo "::error::Authorized maintenance candidate lacks its exact protected vulnerability promotion binding."
            exit 1
          fi
          current_tip_environment="$RUNNER_TEMP/stable-maintenance-publication-vulnerability-tip.env"
          umask 077
          : > "$current_tip_environment"
          genesis_digest="$(jq -er .ledgerDigest \
            tools/release-certification/stable-1.0-vulnerability-ledger-genesis.json)"
          python3 tools/release-certification/protected/stable_vulnerability_actions_tip.py \
            verify-promotion \
            --repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$(jq -er .runId "$binding")" \
            --expected-run-attempt "$(jq -er .runAttempt "$binding")" \
            --expected-artifact-name "$(jq -er .artifactName "$binding")" \
            --expected-artifact-digest "$(jq -er .producerArtifactDigest "$provenance")" \
            --genesis-ledger-digest "$genesis_digest" \
            --binding "$binding" \
            --provenance "$provenance" \
            --environment-file "$current_tip_environment"
          rm -f "$current_tip_environment"

      - name: Open encrypted train authority at the protected publication boundary
        env:
          INPUT_RUN_ID: ${{ inputs.validated_candidate_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.validated_candidate_artifact_name }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
          CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" '
              .repository.full_name == $repository
              and .head_sha == $commit
              and .path == ".github/workflows/stable-1.0-maintenance-release.yml"
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"' <<< "$run_json" >/dev/null
          train_binding="$RUNNER_TEMP/stable-maintenance-publication-train-binding.json"
          jq -nS \
            --arg artifactKind stable-maintenance-release-train-phase \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_REPOSITORY/.github/workflows/stable-1.0-maintenance-release.yml@$INPUT_CANDIDATE_COMMIT" \
            --arg workflowCommit "$INPUT_CANDIDATE_COMMIT" \
            --arg runId "$INPUT_RUN_ID" \
            --arg runAttempt "$(jq -er '.run_attempt | tostring' <<< "$run_json")" \
            --arg operation validate-authorization \
            --arg releaseId "$INPUT_RELEASE_ID" \
            --arg buildVersion "$INPUT_BUILD_VERSION" \
            --arg releaseClass "$INPUT_RELEASE_CLASS" \
            --arg sourceCommit "$INPUT_CANDIDATE_COMMIT" \
            --arg artifactName "$INPUT_ARTIFACT_NAME" '
              {
                artifactKind: $artifactKind,
                repository: $repository,
                workflow: $workflow,
                workflowCommit: $workflowCommit,
                runId: $runId,
                runAttempt: $runAttempt,
                operation: $operation,
                releaseId: $releaseId,
                buildVersion: $buildVersion,
                releaseClass: $releaseClass,
                sourceCommit: $sourceCommit,
                artifactName: $artifactName
              }' > "$train_binding"
          plaintext="$RUNNER_TEMP/stable-maintenance-publication-train"
          rm -rf "$plaintext"
          if find build/stable-maintenance-publication -type f \
              \( -name stable-1.0-release-train-validation.json \
                 -o -name stable-1.0-release-train-authorization-summary.json \) \
              -print -quit | grep -q .; then
            echo "::error::Protected publication input exposes plaintext release-train authority."
            exit 1
          fi
          python3 \
            tools/release-certification/protected/stable_backport_protected_handoff.py \
            open \
            --bundle build/stable-maintenance-publication/stable-backport-release-train-handoff \
            --out "$plaintext" \
            --binding "$train_binding" \
            --key-env CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64
          actual="$(
            find "$plaintext" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
              | LC_ALL=C sort
          )"
          expected="$(
            printf '%s\n' \
              stable-1.0-release-train-authorization-summary.json \
              stable-1.0-release-train-validation.json \
              | LC_ALL=C sort
          )"
          authenticated_inputs="build/stable-maintenance-publication/authenticated-inputs"
          if [[ "$actual" != "$expected" \
                || -n "$(find "$plaintext" -mindepth 1 -type d -print -quit)" \
                || -n "$(find "$plaintext" -type l -print -quit)" \
                || -e "$authenticated_inputs/stable-1.0-release-train-validation.json" \
                || -e "$authenticated_inputs/stable-1.0-release-train-authorization-summary.json" ]]; then
            echo "::error::Protected publication received an invalid or duplicate release-train authority set."
            exit 1
          fi
          cp "$plaintext/stable-1.0-release-train-validation.json" \
            "$authenticated_inputs/stable-1.0-release-train-validation.json"
          cp "$plaintext/stable-1.0-release-train-authorization-summary.json" \
            "$authenticated_inputs/stable-1.0-release-train-authorization-summary.json"
          rm -rf "$plaintext"

      - name: Verify protected leumor GitHub publication identity
        env:
          LEUMOR_GITHUB_TOKEN: ${{ secrets.LEUMOR_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$LEUMOR_GITHUB_TOKEN" ]]; then
            echo "::error::The protected LEUMOR_GITHUB_TOKEN secret is required for publication."
            exit 1
          fi
          if [[ "$(GH_TOKEN="$LEUMOR_GITHUB_TOKEN" gh api user --jq .login)" != "leumor" ]]; then
            echo "::error::Protected GitHub publication identity must be exactly leumor."
            exit 1
          fi

      - name: Verify protected attestations and local exact-byte bindings
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INPUT_POINTER_DIGEST: ${{ inputs.expected_predecessor_pointer_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="build/stable-maintenance-publication"
          legacy="$root/component/artifacts/legacy"
          candidate="$legacy/stable-1.0-maintenance-candidate.json"
          authorization="$legacy/stable-1.0-maintenance-authorization-summary.json"
          plan="$legacy/stable-1.0-maintenance-publication-plan.json"
          checksums="$legacy/stable-1.0-maintenance-checksums.txt"
          for path in "$candidate" "$authorization" "$plan" "$checksums" \
            "$legacy/core-info.json" "$legacy/core-update-publication-plan.json"; do
            if [[ -L "$path" || ! -f "$path" ]]; then
              echo "::error::Authorized publication input is missing or unsafe."
              exit 1
            fi
          done
          signer="crypta-network/cryptad/.github/workflows/stable-1.0-maintenance-release.yml"
          lifecycle_observation="$root/authenticated-inputs/stable-lifecycle-public-observation-receipt.json"
          for subject in "$candidate" "$authorization" "$plan" "$legacy/core-info.json" \
            "$lifecycle_observation"; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --source-digest "$INPUT_CANDIDATE_COMMIT" \
              --deny-self-hosted-runners >/dev/null
          done
          jq -e \
            --arg release "$INPUT_RELEASE_ID" \
            --arg build "$INPUT_BUILD_VERSION" \
            --arg release_class "$INPUT_RELEASE_CLASS" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" '
              .releaseId == $release
              and .buildVersion == $build
              and .releaseClass == $release_class
              and .sourceCommit == $commit
              and .publicationState == "publication-authorized"
              and .sideEffectsPerformed == false
              and .redaction.status == "pass"' "$plan" >/dev/null
          expires_at="$(jq -er '.authorization.expiresAt // .expiresAt' "$authorization")"
          python3 - "$expires_at" <<'PY'
          import datetime as dt
          import sys

          value = sys.argv[1]
          try:
              expiry = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
          except ValueError as exc:
              raise SystemExit("authorization expiry is malformed") from exc
          if expiry <= dt.datetime.now(dt.timezone.utc):
              raise SystemExit("authorization expired before the mutation boundary")
          PY
          if [[ ! "$INPUT_POINTER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Authorized predecessor pointer digest is malformed."
            exit 1
          fi
          if [[ -n "$(find "$root" -type l -print -quit)" \
                || -n "$(find "$root" -mindepth 1 ! -type f ! -type d -print -quit)" ]]; then
            echo "::error::Publication bundle contains a link or special entry."
            exit 1
          fi

      - name: Re-observe exact lifecycle edition immediately before maintenance preflight
        env:
          CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND: ${{ steps.publication-lifecycle-backend.outputs.entrypoint }}
          CRYPTAD_STABLE_LIFECYCLE_PUBLICATION_BACKEND_SITE: ${{ steps.publication-lifecycle-backend.outputs.site }}
          CRYPTAD_STABLE_LIFECYCLE_OBSERVATION_ENVIRONMENT: 'true'
        run: |
          set -euo pipefail
          root="build/stable-maintenance-publication"
          observation="build/stable-1.0-support-lifecycle-publication-boundary-observation-receipt.json"
          python3 tools/release-certification/protected/stable_lifecycle_publication.py \
            --mode observe-authorized-state \
            --authority-chain "$root/protected-inputs/lifecycle" \
            --out build/stable-lifecycle-publication-boundary-observation-summary.json \
            --receipt "$observation" \
            --no-side-effects
          jq -e '
            .operation == "verified-existing"
            and .publicationState == "publication-complete"
            and .verificationStatus == "verified"
            and .conflict == false
            and .redaction.status == "pass"' "$observation" >/dev/null

      - name: Preflight predecessor, authorization, freeze, and public conflicts
        id: preflight
        continue-on-error: true
        env:
          CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND: ${{ steps.publication-backend.outputs.entrypoint }}
          CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_SITE: ${{ steps.publication-backend.outputs.site-directory }}
          PYTHONPATH: ${{ steps.publication-backend.outputs.python-path }}
          INPUT_POINTER_DIGEST: ${{ inputs.expected_predecessor_pointer_digest }}
          GITHUB_TOKEN: ${{ secrets.LEUMOR_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND" ]]; then
            echo "::error::Protected Stable maintenance publication backend was not configured."
            exit 1
          fi
          adapter="tools/release-certification/protected/stable_maintenance_publication.py"
          if [[ ! -f "$adapter" ]]; then
            echo "::error::Protected Stable maintenance publication adapter is not materialized."
            exit 1
          fi
          python3 "$adapter" \
            --mode preflight-only \
            --bundle build/stable-maintenance-publication \
            --no-protected-inputs \
            --expected-predecessor-pointer-digest "$INPUT_POINTER_DIGEST" \
            --check-latest-predecessor \
            --check-authorization-expiry \
            --check-exact-freeze-bytes \
            --check-tag-release-artifact-catalog-and-updater-conflicts \
            --idempotency exact-match-only \
            --conflict-action fail \
            --no-side-effects \
            --out build/stable-maintenance-publication-preflight.json
          jq -e '
            .status == "pass"
            and .sideEffectsPerformed == false
            and .latestPredecessorUnchanged == true
            and .authorizationCurrent == true
            and .freezeBytesExact == true
            and (.publicState == "matching-existing"
                 or .publicState == "resumable-prefix")
            and .redaction.status == "pass"' \
            build/stable-maintenance-publication-preflight.json >/dev/null

      - name: Stage publication preflight evidence
        id: stage-preflight
        if: always()
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          set -euo pipefail
          preflight="build/stable-maintenance-publication-preflight.json"
          if [[ -L "$preflight" ]]; then
            rm -f "$preflight"
          fi
          if [[ ! -f "$preflight" ]]; then
            legacy="build/stable-maintenance-publication/component/artifacts/legacy"
            plan="$legacy/stable-1.0-maintenance-publication-plan.json"
            if [[ -L "$plan" || ! -f "$plan" ]]; then
              echo "::error::Failed preflight cannot bind its audit to the publication plan."
              exit 1
            fi
            jq -n \
              --arg generated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --arg release_id "$INPUT_RELEASE_ID" \
              --arg build "$INPUT_BUILD_VERSION" \
              --arg release_class "$INPUT_RELEASE_CLASS" \
              --arg commit "$INPUT_CANDIDATE_COMMIT" \
              --arg candidate_digest "$(jq -er '.candidateIdentityDigest' "$plan")" \
              --arg outcome "$PREFLIGHT_OUTCOME" '
              {
                schemaVersion: 1,
                kind: "stable-1.0-maintenance-publication-preflight",
                generatedAt: $generated_at,
                releaseId: $release_id,
                buildVersion: $build,
                releaseClass: $release_class,
                sourceCommit: $commit,
                candidateIdentityDigest: $candidate_digest,
                status: "fail",
                sideEffectsPerformed: false,
                latestPredecessorUnchanged: false,
                authorizationCurrent: false,
                freezeBytesExact: false,
                publicState: "unavailable",
                publicStateObservation: {
                  tag: "unavailable",
                  githubRelease: "unavailable",
                  assets: "unavailable",
                  artifactBase: "unavailable",
                  stableCatalog: "unavailable",
                  coreUpdate: "unavailable"
                },
                failureCategory: "preflight-execution-failure",
                workflowOutcome: $outcome,
                redaction: {status: "pass", findingCount: 0, findings: []}
              }' > "$preflight"
          fi
          root="build/stable-maintenance-publication-preflight-audit"
          rm -rf "$root"
          mkdir -p "$root"
          cp "$preflight" "$root/"
          if [[ -f build/stable-1.0-support-lifecycle-publication-boundary-observation-receipt.json ]]; then
            cp build/stable-1.0-support-lifecycle-publication-boundary-observation-receipt.json "$root/"
          fi
          artifact_name="stable-1-0-maintenance-preflight-$INPUT_RELEASE_ID-$INPUT_BUILD_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload publication preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage-preflight.outputs.artifact_name }}
          path: build/stable-maintenance-publication-preflight-audit/
          if-no-files-found: error
          retention-days: 90

      - name: Fail after retaining failed preflight evidence
        if: steps.preflight.outcome != 'success'
        run: |
          echo "::error::Protected publication preflight failed; its side-effect-free audit was retained."
          exit 1

      - name: Recheck vulnerability summary freshness at the mutation boundary
        if: steps.preflight.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          CRYPTAD_STABLE_VULNERABILITY_ANCHOR_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_VULNERABILITY_ANCHOR_READ_TOKEN }}
          CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64 }}
        run: |
          set -euo pipefail
          protected="build/stable-maintenance-publication/protected-inputs"
          binding="$protected/stable-1.0-vulnerability-successor-binding.json"
          provenance="$protected/stable-1.0-vulnerability-summary-provenance.json"
          external_root="$RUNNER_TEMP/stable-maintenance-publication-vulnerability-summary"
          opened="$RUNNER_TEMP/stable-maintenance-publication-vulnerability-opened"
          current_tip_environment="$RUNNER_TEMP/stable-maintenance-publication-vulnerability-current-tip.env"
          cleanup() {
            rm -rf "$external_root" "$opened"
            rm -f "$current_tip_environment"
          }
          trap cleanup EXIT
          cleanup
          umask 077
          : > "$current_tip_environment"
          genesis_digest="$(jq -er .ledgerDigest \
            tools/release-certification/stable-1.0-vulnerability-ledger-genesis.json)"
          python3 tools/release-certification/protected/stable_vulnerability_actions_tip.py \
            verify-promotion \
            --repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$(jq -er .runId "$binding")" \
            --expected-run-attempt "$(jq -er .runAttempt "$binding")" \
            --expected-artifact-name "$(jq -er .artifactName "$binding")" \
            --expected-artifact-digest "$(jq -er .producerArtifactDigest "$provenance")" \
            --genesis-ledger-digest "$genesis_digest" \
            --binding "$binding" \
            --provenance "$provenance" \
            --environment-file "$current_tip_environment"
          set -a
          source "$current_tip_environment"
          set +a
          python3 tools/release-certification/protected/stable_backport_protected_handoff.py open \
            --bundle "$protected/sealed-successor" \
            --out "$opened" \
            --binding "$binding" \
            --key-env CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64
          summary_name=stable-1.0-vulnerability-summary.json
          source_summary="$opened/$summary_name"
          if [[ -L "$source_summary" || ! -f "$source_summary" \
                || "$(stat -c '%h' "$source_summary")" -ne 1 \
                || "$(stat -c '%s' "$source_summary")" -le 0 \
                || "$(stat -c '%s' "$source_summary")" -gt 4194304 ]]; then
            echo "::error::Authorized vulnerability promotion summary is missing, linked, or oversized."
            exit 1
          fi
          install -d -m 700 "$external_root" "$external_root/sealed-successor"
          install -m 600 "$source_summary" "$external_root/$summary_name"
          install -m 600 "$binding" \
            "$external_root/stable-1.0-vulnerability-successor-binding.json"
          install -m 600 "$provenance" \
            "$external_root/stable-1.0-vulnerability-summary-provenance.json"
          install -m 600 \
            "$protected/sealed-successor/stable-1.0-protected-handoff.enc" \
            "$external_root/sealed-successor/stable-1.0-protected-handoff.enc"
          install -m 600 \
            "$protected/sealed-successor/stable-1.0-protected-handoff.json" \
            "$external_root/sealed-successor/stable-1.0-protected-handoff.json"
          export CRYPTAD_STABLE_VULNERABILITY_SUMMARY_ROOT="$external_root"
          PYTHONPATH=tools/release-certification python3 - \
            "$external_root/$summary_name" "$INPUT_RELEASE_ID" "$INPUT_BUILD_VERSION" <<'PY'
          import datetime as dt
          import sys
          from pathlib import Path

          from cryptad_certification.stable_vulnerability_handoff import authenticate_handoff

          summary, errors = authenticate_handoff(
              Path(sys.argv[1]),
              Path.cwd(),
              Path.cwd() / "build",
              dt.datetime.now(dt.timezone.utc),
              sys.argv[2],
              sys.argv[3],
          )
          if errors or summary is None:
              raise SystemExit(
                  "current Stable vulnerability promotion evidence is stale or unauthenticated"
              )
          PY

      - name: Recheck dependency intelligence age and durable tip at mutation boundary
        if: >-
          steps.preflight.outcome == 'success' &&
          steps.publication_dependency_vulnerability_activation.outputs.active == 'true'
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_ANCHOR_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_ANCHOR_READ_TOKEN }}
          CRYPTAD_STABLE_DEPENDENCY_INTELLIGENCE_LINEAGE_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_INTELLIGENCE_LINEAGE_READ_TOKEN }}
          CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_HANDOFF_KEY_BASE64 }}
        run: |
          set -euo pipefail
          root="build/stable-maintenance-publication/protected-inputs/dependency-vulnerability"
          summary="$root/stable-1.0-dependency-vulnerability-promotion-summary.json"
          publication_plan="$root/stable-1.0-dependency-vulnerability-publication-plan.json"
          source_status="$root/stable-1.0-dependency-vulnerability-source-status.json"
          provenance="$root/stable-1.0-dependency-vulnerability-summary-provenance.json"
          test -f "$summary" && test ! -L "$summary"
          test -f "$publication_plan" && test ! -L "$publication_plan"
          test -f "$source_status" && test ! -L "$source_status"
          test -f "$provenance" && test ! -L "$provenance"
          PYTHONPATH=tools/release-certification python3 - \
            "$summary" "$INPUT_RELEASE_ID" "$INPUT_BUILD_VERSION" "$INPUT_CANDIDATE_COMMIT" <<'PY'
          import datetime as dt
          import hashlib
          import json
          import sys
          from pathlib import Path
          from cryptad_certification.stable_dependency_vulnerability_handoff import (
              stable_dependency_vulnerability_evaluation_handoff_errors,
          )
          path = Path(sys.argv[1])
          value = json.loads(path.read_text(encoding="utf-8"))
          digest = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          errors, _ = stable_dependency_vulnerability_evaluation_handoff_errors(
              path, digest, sys.argv[2], sys.argv[3], sys.argv[4]
          )
          valid_until = dt.datetime.fromisoformat(str(value.get("validUntil", "")).replace("Z", "+00:00"))
          if errors or valid_until.tzinfo is None or dt.datetime.now(dt.timezone.utc) >= valid_until:
              raise SystemExit("dependency-vulnerability promotion is stale or unauthenticated")
          PY
          python3 tools/release-certification/protected/stable_dependency_vulnerability_actions_tip.py verify-current \
            --repository "$GITHUB_REPOSITORY" \
            --expected-ledger-digest "$(jq -er .ledgerDigest "$summary")" \
            --expected-ledger-edition "$(jq -er .ledgerEdition "$summary")"
          python3 tools/release-certification/protected/stable_dependency_intelligence_actions_lineage.py verify-current-status \
            --repository "$GITHUB_REPOSITORY" \
            --source-status "$source_status" \
            --publication-plan "$publication_plan" \
            --promotion-summary "$summary"

      - name: Publish or idempotently verify exact bytes
        id: publication
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        env:
          CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND: ${{ steps.publication-backend.outputs.entrypoint }}
          CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_SITE: ${{ steps.publication-backend.outputs.site-directory }}
          PYTHONPATH: ${{ steps.publication-backend.outputs.python-path }}
          CRYPTAD_STABLE_CATALOG_PUBLICATION_INPUT: ${{ secrets.CRYPTAD_STABLE_CATALOG_PUBLICATION_INPUT }}
          CRYPTAD_CORE_UPDATE_PUBLICATION_INPUT: ${{ secrets.CRYPTAD_CORE_UPDATE_PUBLICATION_INPUT }}
          CRYPTAD_STABLE_MAINTENANCE_EXPECTED_SOURCE_BRANCH: ${{ needs.validate-dispatch.outputs.expected_branch }}
          CRYPTAD_STABLE_MAINTENANCE_EXPECTED_SOURCE_COMMIT: ${{ inputs.candidate_commit }}
          CRYPTAD_STABLE_MAINTENANCE_EXPECTED_REPOSITORY: ${{ github.repository }}
          DEPENDENCY_VULNERABILITY_ACTIVE: ${{ steps.publication_dependency_vulnerability_activation.outputs.active }}
          CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_ANCHOR_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_ANCHOR_READ_TOKEN }}
          CRYPTAD_STABLE_DEPENDENCY_INTELLIGENCE_LINEAGE_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_INTELLIGENCE_LINEAGE_READ_TOKEN }}
          INPUT_POINTER_DIGEST: ${{ inputs.expected_predecessor_pointer_digest }}
          GITHUB_TOKEN: ${{ secrets.LEUMOR_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND" ]]; then
            echo "::error::Protected Stable maintenance publication backend was not configured."
            exit 1
          fi
          if [[ -z "$CRYPTAD_STABLE_CATALOG_PUBLICATION_INPUT" ]]; then
            echo "::error::Protected stable catalog publication input was not materialized."
            exit 1
          fi
          if [[ -z "$CRYPTAD_CORE_UPDATE_PUBLICATION_INPUT" ]]; then
            echo "::error::Protected CoreUpdater publication input was not materialized."
            exit 1
          fi
          encoded_branch="${CRYPTAD_STABLE_MAINTENANCE_EXPECTED_SOURCE_BRANCH//\//%2F}"
          current_branch_commit="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded_branch" --jq '.object.sha')"
          if [[ "$current_branch_commit" != "$CRYPTAD_STABLE_MAINTENANCE_EXPECTED_SOURCE_COMMIT" ]]; then
            echo "::error::The remote release/hotfix ref moved before publication."
            exit 1
          fi
          adapter="tools/release-certification/protected/stable_maintenance_publication.py"
          if [[ "$DEPENDENCY_VULNERABILITY_ACTIVE" = true ]]; then
            dependency_root="build/stable-maintenance-publication/protected-inputs/dependency-vulnerability"
            dependency_summary="$dependency_root/stable-1.0-dependency-vulnerability-promotion-summary.json"
            python3 tools/release-certification/protected/stable_dependency_vulnerability_actions_tip.py verify-current \
              --repository "$GITHUB_REPOSITORY" \
              --expected-ledger-digest "$(jq -er .ledgerDigest "$dependency_summary")" \
              --expected-ledger-edition "$(jq -er .ledgerEdition "$dependency_summary")"
            python3 tools/release-certification/protected/stable_dependency_intelligence_actions_lineage.py verify-current-status \
              --repository "$GITHUB_REPOSITORY" \
              --source-status "$dependency_root/stable-1.0-dependency-vulnerability-source-status.json" \
              --publication-plan "$dependency_root/stable-1.0-dependency-vulnerability-publication-plan.json" \
              --promotion-summary "$dependency_summary"
            python3 - "$dependency_summary" <<'PY'
          import datetime as dt
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          valid_until = dt.datetime.fromisoformat(
              str(value.get("validUntil", "")).replace("Z", "+00:00")
          )
          if valid_until.tzinfo is None or dt.datetime.now(dt.timezone.utc) >= valid_until:
              raise SystemExit(
                  "dependency-vulnerability promotion expired before publication mutation"
              )
          PY
          fi
          marker="build/stable-maintenance-publication-side-effect-started"
          # The marker is written only after the complete no-side-effect preflight passed.
          : > "$marker"
          python3 "$adapter" \
            --mode publish-or-verify-exact \
            --bundle build/stable-maintenance-publication \
            --catalog-input-env CRYPTAD_STABLE_CATALOG_PUBLICATION_INPUT \
            --core-update-input-env CRYPTAD_CORE_UPDATE_PUBLICATION_INPUT \
            --expected-predecessor-pointer-digest "$INPUT_POINTER_DIGEST" \
            --expected-source-repository "$GITHUB_REPOSITORY" \
            --expected-source-branch "$CRYPTAD_STABLE_MAINTENANCE_EXPECTED_SOURCE_BRANCH" \
            --expected-source-commit "$CRYPTAD_STABLE_MAINTENANCE_EXPECTED_SOURCE_COMMIT" \
            --github-token-env GITHUB_TOKEN \
            --recheck-remote-source-ref \
            --revalidate-before-each-mutation \
            --idempotency exact-match-only \
            --conflict-action fail \
            --partial-state-action record-only \
            --forbid-overwrite \
            --forbid-delete-recovery \
            --receipt build/stable-1.0-maintenance-publication-receipt.json \
            --core-update-receipt build/core-update-publication-receipt.json

      - name: Record truthful partial state after a failed protected operation
        if: steps.publication.outcome != 'success'
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -euo pipefail
          receipt="build/stable-1.0-maintenance-publication-receipt.json"
          audit="build/stable-1.0-maintenance-publication-failure-audit.json"
          failure_category="pre-publication-verification-failure"
          if [[ -f build/stable-maintenance-publication-side-effect-started ]]; then
            failure_category="side-effecting-publication-failure"
          fi
          if [[ ! -f "$receipt" && ! -f "$audit" ]]; then
            legacy="build/stable-maintenance-publication/component/artifacts/legacy"
            plan="$legacy/stable-1.0-maintenance-publication-plan.json"
            candidate="$legacy/stable-1.0-maintenance-candidate.json"
            if [[ -L "$plan" || ! -f "$plan" || -L "$candidate" || ! -f "$candidate" ]]; then
              echo "::error::Failed publication cannot bind its failure audit to the candidate plan."
              exit 1
            fi
            jq -n \
              --arg generated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --arg release_id "$INPUT_RELEASE_ID" \
              --arg build "$INPUT_BUILD_VERSION" \
              --arg release_class "$INPUT_RELEASE_CLASS" \
              --arg commit "$INPUT_CANDIDATE_COMMIT" \
              --arg candidate_digest "$(jq -er '.candidateIdentityDigest' "$plan")" \
              --arg product_digest "$(jq -er '.productDigest' "$plan")" \
              --arg plan_digest "sha256:$(sha256sum "$plan" | awk '{print $1}')" \
              --arg failure_category "$failure_category" '
              {
                schemaVersion: 1,
                kind: "stable-1.0-maintenance-publication-failure-audit",
                generatedAt: $generated_at,
                releaseId: $release_id,
                buildVersion: $build,
                releaseClass: $release_class,
                sourceCommit: $commit,
                candidateIdentityDigest: $candidate_digest,
                productDigest: $product_digest,
                publicationPlanDigest: $plan_digest,
                publicationState: "unknown-or-partial",
                failureCategory: $failure_category,
                predecessorPointerDigest: null,
                latestCandidateIdentityDigest: null,
                observedPublicState: {
                  tag: "unavailable",
                  githubRelease: "unavailable",
                  assets: "unavailable",
                  artifactBase: "unavailable",
                  stableCatalog: "unavailable",
                  coreUpdate: "unavailable"
                },
                attemptedTargets: (
                  if $failure_category == "side-effecting-publication-failure"
                  then ["artifactBase", "tag", "githubRelease", "assets", "stableCatalog", "coreUpdate"]
                  else []
                  end
                ),
                completedTargets: [],
                sideEffectsMayHaveOccurred: ($failure_category == "side-effecting-publication-failure"),
                finalVerificationStatus: "fail",
                redaction: {status: "pass", findingCount: 0, findings: []}
              }' > "$audit"
          fi

      - name: Validate publication audit artifacts
        env:
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
        run: |
          set -euo pipefail
          receipt="build/stable-1.0-maintenance-publication-receipt.json"
          audit="build/stable-1.0-maintenance-publication-failure-audit.json"
          if [[ "$PUBLICATION_OUTCOME" == success ]]; then
            if [[ -L "$receipt" || ! -f "$receipt" ]]; then
              echo "::error::Successful protected publication omitted its canonical receipt."
              exit 1
            fi
            jq -e '
              .publicationState == "publication-complete"
              and .finalVerificationStatus == "pass"
              and .redaction.status == "pass"
              and .redaction.findingCount == 0' "$receipt" >/dev/null
          elif [[ -f "$audit" && ! -L "$audit" ]]; then
            jq -e '
              .kind == "stable-1.0-maintenance-publication-failure-audit"
              and (.publicationState == "unknown-or-partial"
                   or .publicationState == "publication-partial"
                   or .publicationState == "publication-verification-failed")
              and .finalVerificationStatus == "fail"
              and .redaction.status == "pass"
              and .redaction.findingCount == 0' "$audit" >/dev/null
          else
            echo "::error::Failed protected publication omitted its truthful failure audit."
            exit 1
          fi
          PYTHONPATH=tools/release-certification python3 - "$receipt" "$audit" <<'PY'
          import sys
          from pathlib import Path

          from cryptad_certification.io import read_json
          from cryptad_certification.schema_validation import validate_schema

          receipt = Path(sys.argv[1])
          audit = Path(sys.argv[2])
          if receipt.is_file():
              schemas = (
                  (receipt, "stable-1.0-maintenance-publication-receipt-v1.schema.json"),
                  (
                      receipt.with_name("core-update-publication-receipt.json"),
                      "cryptad-core-update-publication-receipt-v1.schema.json",
                  ),
              )
          else:
              schemas = (
                  (
                      audit,
                      "stable-1.0-maintenance-publication-failure-audit-v1.schema.json",
                  ),
              )
          if any(not path.is_file() or validate_schema(read_json(path), schema) for path, schema in schemas):
              raise SystemExit("publication audit artifact failed its closed schema")
          PY

      - name: Stage publication receipt or partial-state audit record
        id: stage-publication
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          set -euo pipefail
          root="build/stable-maintenance-publication-audit"
          rm -rf "$root"
          mkdir -p "$root"
          if [[ -f build/stable-1.0-maintenance-publication-receipt.json ]]; then
            cp build/stable-1.0-maintenance-publication-receipt.json "$root/"
          fi
          if [[ -f build/stable-1.0-maintenance-publication-failure-audit.json ]]; then
            cp build/stable-1.0-maintenance-publication-failure-audit.json "$root/"
          fi
          if [[ -f build/core-update-publication-receipt.json ]]; then
            cp build/core-update-publication-receipt.json "$root/"
          fi
          cp build/stable-maintenance-publication-preflight.json "$root/"
          cp -R build/stable-maintenance-publication/component "$root/component"
          cp -R build/stable-maintenance-publication/authenticated-inputs "$root/authenticated-inputs"
          cp -R \
            build/stable-maintenance-publication/stable-backport-release-train-handoff \
            "$root/stable-backport-release-train-handoff"
          remove_plaintext_train_authority() {
            local name="$1"
            local path="$root/authenticated-inputs/$name"
            if [[ -L "$path" || ! -f "$path" ]]; then
              echo "::error::Publication audit cannot sanitize a missing or unsafe release-train authority file."
              exit 1
            fi
            rm -- "$path"
          }
          remove_plaintext_train_authority \
            stable-1.0-release-train-validation.json
          remove_plaintext_train_authority \
            stable-1.0-release-train-authorization-summary.json
          artifact_name="stable-1-0-maintenance-publication-$INPUT_RELEASE_ID-$INPUT_BUILD_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload publication audit record
        id: upload-publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage-publication.outputs.artifact_name }}
          path: build/stable-maintenance-publication-audit/
          if-no-files-found: error
          retention-days: 90

      - name: Fail after retaining partial state
        if: steps.publication.outcome != 'success'
        run: |
          echo "::error::Protected publication failed; exact observed partial state was retained without overwrite or deletion."
          exit 1

  independent-verification:
    name: Independently verify exact public bytes
    if: inputs.operation == 'publish'
    needs: protected-publication
    runs-on: ubuntu-latest
    environment: stable-1.0-maintenance-evidence
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      artifact_name: ${{ steps.stage.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}

    steps:
      - name: Check out exact candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Materialize exact reviewed verification backend
        id: publication-backend
        uses: ./.github/actions/setup-stable-maintenance-publication-backend
        with:
          run-id: ${{ inputs.publication_backend_run_id }}
          artifact-name: ${{ inputs.publication_backend_artifact_name }}
          artifact-digest: ${{ inputs.publication_backend_artifact_digest }}
          source-commit: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_SOURCE_COMMIT }}
          wheel-sha256: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_WHEEL_SHA256 }}
          signer-workflow: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_SIGNER_WORKFLOW }}
          entrypoint: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND }}
          github-token: ${{ github.token }}

      - name: Download exact publication audit artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.protected-publication.outputs.artifact_name }}
          path: build/stable-maintenance-independent-verification
          digest-mismatch: error

      - name: Open encrypted train authority for independent verification
        env:
          INPUT_RUN_ID: ${{ inputs.validated_candidate_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.validated_candidate_artifact_name }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
          CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" '
              .repository.full_name == $repository
              and .head_sha == $commit
              and .path == ".github/workflows/stable-1.0-maintenance-release.yml"
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"' <<< "$run_json" >/dev/null
          train_binding="$RUNNER_TEMP/stable-maintenance-verification-train-binding.json"
          jq -nS \
            --arg artifactKind stable-maintenance-release-train-phase \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_REPOSITORY/.github/workflows/stable-1.0-maintenance-release.yml@$INPUT_CANDIDATE_COMMIT" \
            --arg workflowCommit "$INPUT_CANDIDATE_COMMIT" \
            --arg runId "$INPUT_RUN_ID" \
            --arg runAttempt "$(jq -er '.run_attempt | tostring' <<< "$run_json")" \
            --arg operation validate-authorization \
            --arg releaseId "$INPUT_RELEASE_ID" \
            --arg buildVersion "$INPUT_BUILD_VERSION" \
            --arg releaseClass "$INPUT_RELEASE_CLASS" \
            --arg sourceCommit "$INPUT_CANDIDATE_COMMIT" \
            --arg artifactName "$INPUT_ARTIFACT_NAME" '
              {
                artifactKind: $artifactKind,
                repository: $repository,
                workflow: $workflow,
                workflowCommit: $workflowCommit,
                runId: $runId,
                runAttempt: $runAttempt,
                operation: $operation,
                releaseId: $releaseId,
                buildVersion: $buildVersion,
                releaseClass: $releaseClass,
                sourceCommit: $sourceCommit,
                artifactName: $artifactName
              }' > "$train_binding"
          plaintext="$RUNNER_TEMP/stable-maintenance-verification-train"
          rm -rf "$plaintext"
          if find build/stable-maintenance-independent-verification -type f \
              \( -name stable-1.0-release-train-validation.json \
                 -o -name stable-1.0-release-train-authorization-summary.json \) \
              -print -quit | grep -q .; then
            echo "::error::Publication audit exposes plaintext release-train authority."
            exit 1
          fi
          python3 \
            tools/release-certification/protected/stable_backport_protected_handoff.py \
            open \
            --bundle build/stable-maintenance-independent-verification/stable-backport-release-train-handoff \
            --out "$plaintext" \
            --binding "$train_binding" \
            --key-env CRYPTAD_STABLE_BACKPORT_HANDOFF_KEY_BASE64
          actual="$(
            find "$plaintext" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
              | LC_ALL=C sort
          )"
          expected="$(
            printf '%s\n' \
              stable-1.0-release-train-authorization-summary.json \
              stable-1.0-release-train-validation.json \
              | LC_ALL=C sort
          )"
          authenticated_inputs="build/stable-maintenance-independent-verification/authenticated-inputs"
          if [[ "$actual" != "$expected" \
                || -n "$(find "$plaintext" -mindepth 1 -type d -print -quit)" \
                || -n "$(find "$plaintext" -type l -print -quit)" \
                || -e "$authenticated_inputs/stable-1.0-release-train-validation.json" \
                || -e "$authenticated_inputs/stable-1.0-release-train-authorization-summary.json" ]]; then
            echo "::error::Independent verification received an invalid or duplicate release-train authority set."
            exit 1
          fi
          cp "$plaintext/stable-1.0-release-train-validation.json" \
            "$authenticated_inputs/stable-1.0-release-train-validation.json"
          cp "$plaintext/stable-1.0-release-train-authorization-summary.json" \
            "$authenticated_inputs/stable-1.0-release-train-authorization-summary.json"
          rm -rf "$plaintext"

      - name: Fetch and verify public tag, assets, catalog, updater, and package identities
        id: verify-publication
        continue-on-error: true
        env:
          CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND: ${{ steps.publication-backend.outputs.entrypoint }}
          CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_SITE: ${{ steps.publication-backend.outputs.site-directory }}
          PYTHONPATH: ${{ steps.publication-backend.outputs.python-path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND" ]]; then
            echo "::error::Protected Stable maintenance verification backend was not configured."
            exit 1
          fi
          adapter="tools/release-certification/protected/stable_maintenance_publication.py"
          if [[ ! -f "$adapter" ]]; then
            echo "::error::Independent public-state verifier is not materialized."
            exit 1
          fi
          python3 "$adapter" \
            --mode verify-public-state-only \
            --bundle build/stable-maintenance-independent-verification \
            --no-protected-inputs \
            --verify-annotated-tag \
            --verify-github-release-and-assets \
            --verify-artifact-base \
            --verify-stable-catalog-primary-mirrors-and-rollback \
            --verify-core-info-exact-bytes \
            --verify-every-core-info-package-reference \
            --forbid-unexpected-assets \
            --receipt build/stable-1.0-maintenance-publication-receipt.json \
            --core-update-receipt build/core-update-publication-receipt.json \
            --successor-baseline build/stable-1.0-maintenance-successor-baseline.json \
            --history-entry build/stable-1.0-maintenance-history-entry.json
          jq -e '
            .publicationState == "publication-complete"
            and .finalVerificationStatus == "pass"
            and .redaction.status == "pass"' \
            build/stable-1.0-maintenance-publication-receipt.json >/dev/null
          jq -e '
            .publicationState == "publication-complete"
            and .verificationStatus == "pass"
            and .redaction.status == "pass"' \
            build/core-update-publication-receipt.json >/dev/null

      - name: Stage independently verified publication and successor
        id: stage
        if: always()
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_RELEASE_CLASS: ${{ inputs.release_class }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          VERIFICATION_OUTCOME: ${{ steps.verify-publication.outcome }}
        run: |
          set -euo pipefail
          root="build/stable-maintenance-verified-publication"
          rm -rf "$root"
          mkdir -p "$root"
          artifact_name="stable-1-0-maintenance-verified-$INPUT_RELEASE_ID-$INPUT_BUILD_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          legacy="build/stable-maintenance-independent-verification/component/artifacts/legacy"
          plan="$legacy/stable-1.0-maintenance-publication-plan.json"
          if [[ -L "$plan" || ! -f "$plan" ]]; then
            echo "::error::Independent verification cannot bind its audit to the publication plan."
            exit 1
          fi
          jq -n \
            --arg generated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg release_id "$INPUT_RELEASE_ID" \
            --arg build "$INPUT_BUILD_VERSION" \
            --arg release_class "$INPUT_RELEASE_CLASS" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" \
            --arg candidate_digest "$(jq -er '.candidateIdentityDigest' "$plan")" \
            --arg outcome "$VERIFICATION_OUTCOME" '
            {
              schemaVersion: 1,
              kind: "stable-1.0-maintenance-independent-verification-audit",
              generatedAt: $generated_at,
              releaseId: $release_id,
              buildVersion: $build,
              releaseClass: $release_class,
              sourceCommit: $commit,
              candidateIdentityDigest: $candidate_digest,
              verificationStatus: (if $outcome == "success" then "pass" else "fail" end),
              workflowOutcome: $outcome,
              sideEffectsPerformed: false,
              redaction: {status: "pass", findingCount: 0, findings: []}
            }' > "$root/stable-1.0-maintenance-independent-verification-audit.json"
          for path in \
            build/stable-1.0-maintenance-publication-receipt.json \
            build/core-update-publication-receipt.json \
            build/stable-1.0-maintenance-successor-baseline.json \
            build/stable-1.0-maintenance-history-entry.json \
            build/stable-1.0-maintenance-publication-failure-audit.json; do
            if [[ -f "$path" && ! -L "$path" ]]; then
              cp "$path" "$root/"
            fi
          done
          authorization_source="build/stable-maintenance-independent-verification/component/artifacts/legacy/stable-1.0-maintenance-authorization-summary.json"
          if [[ -f "$authorization_source" && ! -L "$authorization_source" ]]; then
            cp "$authorization_source" "$root/"
          elif [[ "$VERIFICATION_OUTCOME" == success ]]; then
            echo "::error::Independent verification input omitted the exact published authorization."
            exit 1
          fi
          if [[ "$VERIFICATION_OUTCOME" == success ]]; then
            for path in \
              "$root/stable-1.0-maintenance-publication-receipt.json" \
              "$root/core-update-publication-receipt.json" \
              "$root/stable-1.0-maintenance-successor-baseline.json" \
              "$root/stable-1.0-maintenance-history-entry.json"; do
              if [[ -L "$path" || ! -f "$path" ]]; then
                echo "::error::Successful independent verification omitted a required record."
                exit 1
              fi
            done
          fi

      - name: Upload independently verified publication
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: build/stable-maintenance-verified-publication/
          if-no-files-found: error
          retention-days: 90

      - name: Fail after retaining independent-verification evidence
        if: steps.verify-publication.outcome != 'success'
        run: |
          echo "::error::Independent public verification failed; its audit evidence was retained."
          exit 1

  activate-latest-baseline:
    name: Atomically activate verified successor baseline
    if: inputs.operation == 'publish'
    needs:
      - freeze-and-validate
      - independent-verification
    concurrency:
      group: stable-1-0-vulnerability-ledger
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: >-
        ${{ inputs.release_class == 'security-hotfix'
            && 'stable-1.0-security-hotfix-publication'
            || 'stable-1.0-maintenance-publication' }}
    permissions:
      contents: read
      actions: read
      attestations: read

    steps:
      - name: Check out exact activation verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Materialize exact reviewed activation backend
        id: publication-backend
        uses: ./.github/actions/setup-stable-maintenance-publication-backend
        with:
          run-id: ${{ inputs.publication_backend_run_id }}
          artifact-name: ${{ inputs.publication_backend_artifact_name }}
          artifact-digest: ${{ inputs.publication_backend_artifact_digest }}
          source-commit: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_SOURCE_COMMIT }}
          wheel-sha256: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_WHEEL_SHA256 }}
          signer-workflow: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_SIGNER_WORKFLOW }}
          entrypoint: ${{ vars.CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND }}
          github-token: ${{ github.token }}

      - name: Download independently verified successor
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.independent-verification.outputs.artifact_name }}
          path: build/stable-maintenance-baseline-activation
          digest-mismatch: error

      - name: Download exact revalidated vulnerability authority
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.freeze-and-validate.outputs.artifact_name }}
          path: build/stable-maintenance-baseline-activation-authority
          digest-mismatch: error

      - name: Determine baseline-activation PR-290 governance activation
        id: baseline_dependency_vulnerability_activation
        run: |
          set -euo pipefail
          active="$(python3 \
            tools/release-certification/protected/stable_dependency_vulnerability_activation.py \
            tools/release-certification/stable-1.0-dependency-vulnerability-policy.json \
            build/stable-maintenance-baseline-activation-authority/authenticated-inputs/maintenance-candidate-freeze.json)"
          if [[ "$active" != true && "$active" != false ]]; then
            echo "::error::Stable dependency-vulnerability activation returned an invalid decision."
            exit 1
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Authenticate final PR-290 publication verification
        id: final_pr290_producer
        if: steps.baseline_dependency_vulnerability_activation.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          PR290_FINAL_RUN_ID: ${{ inputs.protected_inputs_run_id }}
          PR290_FINAL_ARTIFACT_NAME: ${{ inputs.protected_inputs_artifact_name }}
          PR290_FINAL_ARTIFACT_DIGEST: ${{ inputs.protected_inputs_artifact_digest }}
        run: |
          set -euo pipefail
          expected_name="stable-1.0-dependency-vulnerability-$INPUT_RELEASE_ID-publication-verified"
          if [[ ! "$PR290_FINAL_RUN_ID" =~ ^[1-9][0-9]*$ \
                || "$PR290_FINAL_ARTIFACT_NAME" != "$expected_name" \
                || ! "$PR290_FINAL_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Baseline activation waits for exact final PR-290 publication verification."
            exit 2
          fi
          producer="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR290_FINAL_RUN_ID")"
          run_attempt="$(jq -er '.run_attempt | select(type == "number" and . >= 1)' <<< "$producer")"
          jq -e \
            --arg run_id "$PR290_FINAL_RUN_ID" \
            --arg commit "$INPUT_CANDIDATE_COMMIT" '
              (.id | tostring) == $run_id
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and .path == ".github/workflows/stable-1.0-dependency-vulnerability-publication.yml"
              and .head_sha == $commit
              and .head_repository.full_name == "crypta-network/cryptad"' \
            <<< "$producer" >/dev/null
          artifacts="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PR290_FINAL_RUN_ID/artifacts?per_page=100" \
            --jq '[.[].artifacts[] | select(.name == env.PR290_FINAL_ARTIFACT_NAME)]')"
          jq -e \
            --arg name "$PR290_FINAL_ARTIFACT_NAME" \
            --arg digest "$PR290_FINAL_ARTIFACT_DIGEST" '
              length == 1
              and .[0].expired == false
              and .[0].name == $name
              and .[0].digest == $digest' \
            <<< "$artifacts" >/dev/null
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"

      - name: Download final PR-290 publication-verified handoff
        if: steps.baseline_dependency_vulnerability_activation.outputs.active == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.protected_inputs_run_id }}
          name: ${{ inputs.protected_inputs_artifact_name }}
          path: build/stable-maintenance-baseline-activation-final-pr290

      - name: Recheck vulnerability summary at the baseline activation boundary
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          CRYPTAD_STABLE_VULNERABILITY_ANCHOR_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_VULNERABILITY_ANCHOR_READ_TOKEN }}
          CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64 }}
        run: |
          set -euo pipefail
          protected="build/stable-maintenance-baseline-activation-authority/protected-inputs"
          binding="$protected/stable-1.0-vulnerability-successor-binding.json"
          provenance="$protected/stable-1.0-vulnerability-summary-provenance.json"
          external_root="$RUNNER_TEMP/stable-maintenance-activation-vulnerability-summary"
          opened="$RUNNER_TEMP/stable-maintenance-activation-vulnerability-opened"
          current_tip_environment="$RUNNER_TEMP/stable-maintenance-activation-vulnerability-tip.env"
          cleanup() {
            rm -rf "$external_root" "$opened"
            rm -f "$current_tip_environment"
          }
          trap cleanup EXIT
          cleanup
          if [[ -L "$binding" || ! -f "$binding" \
                || -L "$provenance" || ! -f "$provenance" ]]; then
            echo "::error::Baseline activation lacks its exact vulnerability promotion binding."
            exit 1
          fi
          umask 077
          : > "$current_tip_environment"
          genesis_digest="$(jq -er .ledgerDigest \
            tools/release-certification/stable-1.0-vulnerability-ledger-genesis.json)"
          python3 tools/release-certification/protected/stable_vulnerability_actions_tip.py \
            verify-promotion \
            --repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$(jq -er .runId "$binding")" \
            --expected-run-attempt "$(jq -er .runAttempt "$binding")" \
            --expected-artifact-name "$(jq -er .artifactName "$binding")" \
            --expected-artifact-digest "$(jq -er .producerArtifactDigest "$provenance")" \
            --genesis-ledger-digest "$genesis_digest" \
            --binding "$binding" \
            --provenance "$provenance" \
            --environment-file "$current_tip_environment"
          set -a
          source "$current_tip_environment"
          set +a
          python3 tools/release-certification/protected/stable_backport_protected_handoff.py open \
            --bundle "$protected/sealed-successor" \
            --out "$opened" \
            --binding "$binding" \
            --key-env CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64
          summary_name=stable-1.0-vulnerability-summary.json
          source_summary="$opened/$summary_name"
          if [[ -L "$source_summary" || ! -f "$source_summary" \
                || "$(stat -c '%h' "$source_summary")" -ne 1 \
                || "$(stat -c '%s' "$source_summary")" -le 0 \
                || "$(stat -c '%s' "$source_summary")" -gt 4194304 ]]; then
            echo "::error::Baseline activation vulnerability summary is missing, linked, or oversized."
            exit 1
          fi
          install -d -m 700 "$external_root" "$external_root/sealed-successor"
          install -m 600 "$source_summary" "$external_root/$summary_name"
          install -m 600 "$binding" \
            "$external_root/stable-1.0-vulnerability-successor-binding.json"
          install -m 600 "$provenance" \
            "$external_root/stable-1.0-vulnerability-summary-provenance.json"
          install -m 600 \
            "$protected/sealed-successor/stable-1.0-protected-handoff.enc" \
            "$external_root/sealed-successor/stable-1.0-protected-handoff.enc"
          install -m 600 \
            "$protected/sealed-successor/stable-1.0-protected-handoff.json" \
            "$external_root/sealed-successor/stable-1.0-protected-handoff.json"
          export CRYPTAD_STABLE_VULNERABILITY_SUMMARY_ROOT="$external_root"
          PYTHONPATH=tools/release-certification python3 - \
            "$external_root/$summary_name" "$INPUT_RELEASE_ID" "$INPUT_BUILD_VERSION" <<'PY'
          import datetime as dt
          import sys
          from pathlib import Path

          from cryptad_certification.stable_vulnerability_handoff import authenticate_handoff

          summary, errors = authenticate_handoff(
              Path(sys.argv[1]),
              Path.cwd(),
              Path.cwd() / "build",
              dt.datetime.now(dt.timezone.utc),
              sys.argv[2],
              sys.argv[3],
          )
          if errors or summary is None:
              raise SystemExit(
                  "current Stable vulnerability promotion evidence is stale or unauthenticated"
              )
          PY

      - name: Recheck dependency intelligence age and durable tip before baseline activation
        if: steps.baseline_dependency_vulnerability_activation.outputs.active == 'true'
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          PR290_FINAL_RUN_ID: ${{ inputs.protected_inputs_run_id }}
          PR290_FINAL_RUN_ATTEMPT: ${{ steps.final_pr290_producer.outputs.run_attempt }}
          CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_ANCHOR_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_ANCHOR_READ_TOKEN }}
          CRYPTAD_STABLE_DEPENDENCY_INTELLIGENCE_LINEAGE_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_INTELLIGENCE_LINEAGE_READ_TOKEN }}
          CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_HANDOFF_KEY_BASE64 }}
        run: |
          set -euo pipefail
          root="build/stable-maintenance-baseline-activation-final-pr290"
          summary="$root/stable-1.0-dependency-vulnerability-promotion-summary.json"
          source_status="$root/stable-1.0-dependency-vulnerability-source-status.json"
          provenance="$root/stable-1.0-dependency-vulnerability-summary-provenance.json"
          actual="$(find "$root" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            stable-1.0-dependency-vulnerability-promotion-summary.json \
            stable-1.0-dependency-vulnerability-source-status.json \
            stable-1.0-dependency-vulnerability-summary-provenance.json \
            | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test -z "$(find "$root" -mindepth 1 \( -type l -o ! -type f -o -type f -links +1 \) -print -quit)"
          test -f "$summary" && test ! -L "$summary"
          test -f "$source_status" && test ! -L "$source_status"
          test -f "$provenance" && test ! -L "$provenance"
          PYTHONPATH=tools/release-certification python3 - \
            "$summary" "$INPUT_RELEASE_ID" "$INPUT_BUILD_VERSION" "$INPUT_CANDIDATE_COMMIT" \
            "$PR290_FINAL_RUN_ID" "$PR290_FINAL_RUN_ATTEMPT" <<'PY'
          import datetime as dt
          import hashlib
          import json
          import sys
          from pathlib import Path
          from cryptad_certification.stable_dependency_vulnerability_handoff import (
              stable_dependency_vulnerability_handoff_errors,
          )
          path = Path(sys.argv[1])
          value = json.loads(path.read_text(encoding="utf-8"))
          digest = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          errors, handoff = stable_dependency_vulnerability_handoff_errors(
              path, digest, sys.argv[2], sys.argv[3], sys.argv[4]
          )
          if handoff is None or str(handoff.get("runId")) != sys.argv[5]:
              errors.append("final dependency-vulnerability producer run differs from selection")
          if handoff is None or str(handoff.get("runAttempt")) != sys.argv[6]:
              errors.append("final dependency-vulnerability producer attempt differs from selection")
          if value.get("mode") != "verify-publication" or value.get("promotionReady") is not True:
              errors.append("dependency-vulnerability publication is not finally verified")
          valid_until = dt.datetime.fromisoformat(str(value.get("validUntil", "")).replace("Z", "+00:00"))
          if errors or valid_until.tzinfo is None or dt.datetime.now(dt.timezone.utc) >= valid_until:
              raise SystemExit("dependency-vulnerability promotion is stale or unauthenticated")
          PY
          python3 tools/release-certification/protected/stable_dependency_vulnerability_actions_tip.py verify-current \
            --repository "$GITHUB_REPOSITORY" \
            --expected-ledger-digest "$(jq -er .ledgerDigest "$summary")" \
            --expected-ledger-edition "$(jq -er .ledgerEdition "$summary")"
          python3 tools/release-certification/protected/stable_dependency_intelligence_actions_lineage.py verify-current-summary \
            --repository "$GITHUB_REPOSITORY" \
            --source-status "$source_status" \
            --promotion-summary "$summary" \
            --handoff "$provenance"

      - name: Compare-and-swap latest-published pointer
        id: activation
        continue-on-error: true
        env:
          CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND: ${{ steps.publication-backend.outputs.entrypoint }}
          CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND_SITE: ${{ steps.publication-backend.outputs.site-directory }}
          PYTHONPATH: ${{ steps.publication-backend.outputs.python-path }}
          CRYPTAD_STABLE_MAINTENANCE_STATE_INPUT: ${{ secrets.CRYPTAD_STABLE_MAINTENANCE_STATE_INPUT }}
          CRYPTAD_STABLE_MAINTENANCE_EXPECTED_SOURCE_BRANCH: ${{ inputs.release_class == 'security-hotfix' && format('hotfix/{0}', inputs.build_version) || format('release/{0}', inputs.build_version) }}
          CRYPTAD_STABLE_MAINTENANCE_EXPECTED_SOURCE_COMMIT: ${{ inputs.candidate_commit }}
          CRYPTAD_STABLE_MAINTENANCE_EXPECTED_REPOSITORY: ${{ github.repository }}
          DEPENDENCY_VULNERABILITY_ACTIVE: ${{ steps.baseline_dependency_vulnerability_activation.outputs.active }}
          CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_ANCHOR_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_ANCHOR_READ_TOKEN }}
          CRYPTAD_STABLE_DEPENDENCY_INTELLIGENCE_LINEAGE_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_INTELLIGENCE_LINEAGE_READ_TOKEN }}
          CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_HANDOFF_KEY_BASE64: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_HANDOFF_KEY_BASE64 }}
          INPUT_POINTER_DIGEST: ${{ inputs.expected_predecessor_pointer_digest }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$CRYPTAD_STABLE_MAINTENANCE_PUBLICATION_BACKEND" ]]; then
            echo "::error::Protected Stable maintenance activation backend was not configured."
            exit 1
          fi
          if [[ -z "$CRYPTAD_STABLE_MAINTENANCE_STATE_INPUT" ]]; then
            echo "::error::Protected activation input was not materialized."
            exit 1
          fi
          adapter="tools/release-certification/protected/stable_maintenance_publication.py"
          if [[ ! -f "$adapter" ]]; then
            echo "::error::Protected latest-baseline activation adapter is not materialized."
            exit 1
          fi
          baseline="build/stable-maintenance-baseline-activation/stable-1.0-maintenance-successor-baseline.json"
          history="build/stable-maintenance-baseline-activation/stable-1.0-maintenance-history-entry.json"
          receipt="build/stable-maintenance-baseline-activation/stable-1.0-maintenance-publication-receipt.json"
          authorization="build/stable-maintenance-baseline-activation/stable-1.0-maintenance-authorization-summary.json"
          activation_authorization="build/stable-maintenance-baseline-activation/stable-1.0-maintenance-activation-authorization.json"
          for path in "$baseline" "$history" "$receipt" "$authorization"; do
            if [[ -L "$path" || ! -f "$path" ]]; then
              echo "::error::Verified activation input is missing or unsafe."
              exit 1
            fi
          done
          jq -e '.publicationState == "publication-complete" and .finalVerificationStatus == "pass"' \
            "$receipt" >/dev/null
          authorization_digest="sha256:$(sha256sum "$authorization" | awk '{print $1}')"
          if [[ "$authorization_digest" != "$(jq -er '.authorizationDigest' "$receipt")" ]]; then
            echo "::error::Activation authorization differs from the exact published authorization."
            exit 1
          fi
          gh attestation verify "$authorization" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "crypta-network/cryptad/.github/workflows/stable-1.0-maintenance-release.yml" \
            --source-digest "$INPUT_CANDIDATE_COMMIT" \
            --deny-self-hosted-runners >/dev/null
          python3 - \
            "$baseline" \
            "$history" \
            "$receipt" \
            "$authorization" \
            "$activation_authorization" \
            "$INPUT_POINTER_DIGEST" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          (
              baseline_path,
              history_path,
              receipt_path,
              original_authorization_path,
              output_path,
          ) = (Path(value) for value in sys.argv[1:6])
          expected_pointer_digest, run_id, run_attempt = sys.argv[6:9]

          def read_json(path: Path) -> dict[str, object]:
              return json.loads(path.read_text(encoding="utf-8"))

          def digest(path: Path) -> str:
              return "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()

          receipt_value = read_json(receipt_path)
          release_class = receipt_value["releaseClass"]
          protected_environment = (
              "stable-1.0-maintenance-publication"
              if release_class == "maintenance"
              else "stable-1.0-security-hotfix-publication"
          )
          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0)
          expires = now + dt.timedelta(minutes=30)
          timestamp = lambda value: value.isoformat().replace("+00:00", "Z")
          authorization = {
              "schemaVersion": 1,
              "kind": "stable-1.0-maintenance-activation-authorization",
              "generatedAt": timestamp(now),
              "authorizationId": f"activation-{run_id}-{run_attempt}",
              "authority": "github-protected-environment",
              "protectedEnvironment": protected_environment,
              "workflowRepository": os.environ["GITHUB_REPOSITORY"],
              "workflowRunId": run_id,
              "workflowRunAttempt": int(run_attempt),
              "sourceCommit": receipt_value["sourceCommit"],
              "releaseId": receipt_value["releaseId"],
              "buildVersion": receipt_value["buildVersion"],
              "releaseClass": release_class,
              "candidateIdentityDigest": receipt_value["candidateIdentityDigest"],
              "publicationReceiptDigest": digest(receipt_path),
              "successorBaselineDigest": digest(baseline_path),
              "historyDigest": digest(history_path),
              "originalAuthorizationDigest": digest(original_authorization_path),
              "expectedCurrentPointerDigest": expected_pointer_digest,
              "allowedScope": "successor-baseline:activate",
              "authorizedAt": timestamp(now),
              "expiresAt": timestamp(expires),
              "status": "approved",
              "redaction": {"status": "pass", "findingCount": 0, "findings": []},
          }
          if output_path.exists() or output_path.is_symlink():
              raise SystemExit("refusing to replace an activation authorization")
          output_path.write_text(
              json.dumps(authorization, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          output_path.chmod(0o644)
          PY
          encoded_branch="${CRYPTAD_STABLE_MAINTENANCE_EXPECTED_SOURCE_BRANCH//\//%2F}"
          current_branch_commit="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded_branch" --jq '.object.sha')"
          if [[ "$current_branch_commit" != "$CRYPTAD_STABLE_MAINTENANCE_EXPECTED_SOURCE_COMMIT" ]]; then
            echo "::error::The remote release/hotfix ref moved before baseline activation."
            exit 1
          fi
          if [[ "$DEPENDENCY_VULNERABILITY_ACTIVE" = true ]]; then
            dependency_root="build/stable-maintenance-baseline-activation-final-pr290"
            dependency_summary="$dependency_root/stable-1.0-dependency-vulnerability-promotion-summary.json"
            dependency_status="$dependency_root/stable-1.0-dependency-vulnerability-source-status.json"
            dependency_handoff="$dependency_root/stable-1.0-dependency-vulnerability-summary-provenance.json"
            PYTHONPATH=tools/release-certification python3 - \
              "$dependency_summary" "$INPUT_RELEASE_ID" "$INPUT_BUILD_VERSION" \
              "$INPUT_CANDIDATE_COMMIT" <<'PY'
          import datetime as dt
          import hashlib
          import json
          import sys
          from pathlib import Path

          from cryptad_certification.stable_dependency_vulnerability_handoff import (
              stable_dependency_vulnerability_handoff_errors,
          )

          path = Path(sys.argv[1])
          value = json.loads(path.read_text(encoding="utf-8"))
          digest = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          errors, _ = stable_dependency_vulnerability_handoff_errors(
              path, digest, sys.argv[2], sys.argv[3], sys.argv[4]
          )
          if (
              errors
              or value.get("mode") != "verify-publication"
              or value.get("promotionReady") is not True
          ):
              raise SystemExit(
                  "dependency-vulnerability final authority is unauthenticated"
              )
          PY
            python3 tools/release-certification/protected/stable_dependency_vulnerability_actions_tip.py verify-current \
              --repository "$GITHUB_REPOSITORY" \
              --expected-ledger-digest "$(jq -er .ledgerDigest "$dependency_summary")" \
              --expected-ledger-edition "$(jq -er .ledgerEdition "$dependency_summary")"
            python3 tools/release-certification/protected/stable_dependency_intelligence_actions_lineage.py verify-current-summary \
              --repository "$GITHUB_REPOSITORY" \
              --source-status "$dependency_status" \
              --promotion-summary "$dependency_summary" \
              --handoff "$dependency_handoff"
            python3 - "$dependency_summary" <<'PY'
          import datetime as dt
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          try:
              valid_until = dt.datetime.fromisoformat(
                  str(value.get("validUntil", "")).replace("Z", "+00:00")
              )
          except ValueError as error:
              raise SystemExit("dependency-vulnerability final deadline is invalid") from error
          if valid_until.tzinfo is None or dt.datetime.now(dt.timezone.utc) >= valid_until:
              raise SystemExit(
                  "dependency-vulnerability promotion expired before baseline activation"
              )
          PY
          fi
          activation_marker="build/stable-maintenance-baseline-activation-started"
          if [[ -e "$activation_marker" || -L "$activation_marker" ]]; then
            echo "::error::Refusing to replace an existing activation-boundary marker."
            exit 1
          fi
          (umask 022; : > "$activation_marker")
          if [[ -L "$activation_marker" || ! -f "$activation_marker" ]]; then
            echo "::error::The activation-boundary marker is unsafe."
            exit 1
          fi
          python3 "$adapter" \
            --mode activate-latest-baseline \
            --maintenance-state-input-env CRYPTAD_STABLE_MAINTENANCE_STATE_INPUT \
            --expected-current-pointer-digest "$INPUT_POINTER_DIGEST" \
            --expected-source-repository "$GITHUB_REPOSITORY" \
            --expected-source-branch "$CRYPTAD_STABLE_MAINTENANCE_EXPECTED_SOURCE_BRANCH" \
            --expected-source-commit "$CRYPTAD_STABLE_MAINTENANCE_EXPECTED_SOURCE_COMMIT" \
            --github-token-env GITHUB_TOKEN \
            --recheck-remote-source-ref \
            --successor-baseline "$baseline" \
            --history-entry "$history" \
            --publication-receipt "$receipt" \
            --authorization "$authorization" \
            --activation-authorization "$activation_authorization" \
            --check-authorization-expiry \
            --compare-and-swap \
            --forbid-overwrite-on-conflict \
            --verify-after-activation \
            --activation-receipt build/stable-1.0-maintenance-baseline-activation-receipt.json
          jq -e '
            .status == "pass"
            and .pointerUpdate == "activated"
            and .verificationStatus == "pass"
            and .redaction.status == "pass"' \
            build/stable-1.0-maintenance-baseline-activation-receipt.json >/dev/null

      - name: Stage baseline activation outcome
        if: always()
        run: |
          set -euo pipefail
          root="build/stable-maintenance-baseline-activation-audit"
          rm -rf "$root"
          mkdir -p "$root"
          marker="build/stable-maintenance-baseline-activation-started"
          marker_status=absent
          activation_boundary_entered=false
          if [[ -L "$marker" || ( -e "$marker" && ! -f "$marker" ) ]]; then
            marker_status=unsafe
            activation_boundary_entered=true
          elif [[ -f "$marker" ]]; then
            marker_status=present
            activation_boundary_entered=true
            cp "$marker" "$root/"
          fi
          receipt="build/stable-1.0-maintenance-baseline-activation-receipt.json"
          observed_pointer_digest=''
          if [[ ! -L "$receipt" && -f "$receipt" ]]; then
            cp "$receipt" "$root/"
            observed_pointer_digest="$(jq -r '.observedPointerDigest // empty' \
              "$receipt" 2>/dev/null || true)"
            if [[ ! "$observed_pointer_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              observed_pointer_digest=''
            fi
          fi
          activation_authorization="build/stable-maintenance-baseline-activation/stable-1.0-maintenance-activation-authorization.json"
          if [[ ! -L "$activation_authorization" && -f "$activation_authorization" ]]; then
            cp "$activation_authorization" "$root/"
          fi
          jq -n \
            --arg outcome "${{ steps.activation.outcome }}" \
            --arg release_id "${{ inputs.release_id }}" \
            --arg build "${{ inputs.build_version }}" \
            --arg marker_status "$marker_status" \
            --argjson activation_boundary_entered "$activation_boundary_entered" \
            --arg observed_pointer_digest "$observed_pointer_digest" \
            '{kind: "stable-1.0-maintenance-baseline-activation-workflow-audit",
              releaseId: $release_id, buildVersion: $build, stepOutcome: $outcome,
              activationBoundaryMarkerStatus: $marker_status,
              activationBoundaryEntered: $activation_boundary_entered,
              sideEffectsMayHaveOccurred: $activation_boundary_entered,
              observedPointerDigest:
                (if $observed_pointer_digest == "" then null else $observed_pointer_digest end),
              activationReceiptPresent: false, activationAuthorizationPresent: false,
              redaction: {status: "pass", findingCount: 0, findings: []}}' > "$root/workflow-audit.json"
          if [[ -f "$root/stable-1.0-maintenance-baseline-activation-receipt.json" ]]; then
            jq '.activationReceiptPresent = true' "$root/workflow-audit.json" \
              > "$root/workflow-audit.tmp"
            mv "$root/workflow-audit.tmp" "$root/workflow-audit.json"
          fi
          if [[ -f "$root/stable-1.0-maintenance-activation-authorization.json" ]]; then
            jq '.activationAuthorizationPresent = true' "$root/workflow-audit.json" \
              > "$root/workflow-audit.tmp"
            mv "$root/workflow-audit.tmp" "$root/workflow-audit.json"
          fi

      - name: Upload baseline activation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1-0-maintenance-baseline-activation-${{ inputs.release_id }}-${{ inputs.build_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/stable-maintenance-baseline-activation-audit/
          if-no-files-found: error
          retention-days: 90

      - name: Summarize protected boundary
        if: steps.activation.outcome == 'success'
        run: |
          echo "Exact public bytes were independently verified before the successor baseline pointer was activated." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow did not create or merge release/hotfix branches and never squashes, rebases, or back-merges them." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail after retaining activation state
        if: steps.activation.outcome != 'success'
        run: |
          echo "::error::Baseline activation failed or could not be verified; its exact receipt/audit was retained."
          exit 1
