                + (if $interop_smoke == "" then {} else {interopSmoke: $interop_smoke} end)
                + (if $interop_extended == "" then {} else {interopExtended: $interop_extended} end)
                + (if $performance_smoke == "" then {} else {performanceSmoke: $performance_smoke} end)
                + (if $release_history == "" then {} else {releaseHistory: $release_history} end)
                + (if $waiver_file == "" then {} else {waiverFile: $waiver_file} end)
                + (if $stable_readiness == "" then {} else {stableReadiness: $stable_readiness} end)
                + (if $stable_vulnerability == "" then {} else {stableVulnerabilitySummary: $stable_vulnerability} end)
                + (if $stable_supply_chain == "" then {} else {supplyChainPromotionSummary: $stable_supply_chain} end)
                + (if $stable_dependency_vulnerability == "" then {} else {dependencyVulnerabilityPromotionSummary: $stable_dependency_vulnerability} end)),
              policies: ({metadata: {candidateReleaseId: $release_id}}
                + (if $history_label == "" then {} else {historyLabel: $history_label} end)
                + (if $require_vulnerability then {stableVulnerabilityGovernance: "required"} else {} end)
                + (if $require_supply_chain then {stableSupplyChainGovernance: "required"} else {} end)
                + (if $require_dependency_vulnerability then {
                    stableDependencyVulnerabilityGovernance: "required",
                    candidateSourceCommit: env.GITHUB_SHA,
                    candidateSourceRef: ("commit:" + env.GITHUB_SHA)
                  } else {} end)),
              execution: {collectEvidence: true, writeHistory: $write_history},
              commands: {}
            }' > "$manifest"
          if [[ "$CERT_MODE" == "release-candidate" && "$DEPENDENCY_VULNERABILITY_STAGE" == "post-publication" ]]; then
            python3 tools/release-certification/protected/stable_dependency_intelligence_actions_lineage.py verify-current-summary \
              --repository "$GITHUB_REPOSITORY" \
              --source-status "$dependency_root/stable-1.0-dependency-vulnerability-source-status.json" \
              --promotion-summary "$dependency_summary" \
              --handoff "$dependency_root/stable-1.0-dependency-vulnerability-summary-provenance.json"
            certification_clock="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            python3 - "$certification_clock" "$valid_until" <<'PY'
          import datetime as dt
          import sys

          clock = dt.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          valid_until = dt.datetime.fromisoformat(sys.argv[2].replace("Z", "+00:00"))
          if clock.tzinfo is None or valid_until.tzinfo is None or clock >= valid_until:
              raise SystemExit(
                  "dependency-vulnerability promotion evidence expired before final certification"
              )
          PY
          fi
          python3 tools/release-certification/certify.py release-certification --manifest "$manifest"

      - name: Upload release certification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release-certification/
            build/release-certification-history/
            !**/private-insert-uris.json
          if-no-files-found: warn
          retention-days: 30

  certify-release-candidate:
    if: >-
      github.event_name == 'push'
      || github.event.inputs.mode == 'release-candidate'
    concurrency:
      group: stable-1-0-vulnerability-ledger
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: stable-1-0-release-certification
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      CERT_MODE: release-candidate
      RUN_EXTENDED_GATES: ${{ github.event.inputs['extended-gates'] || 'false' }}
      PREVIOUS_SUMMARY_PATH: ${{ github.event.inputs['previous-summary-path'] || '' }}
      REQUIRE_HISTORY: ${{ github.event.inputs['require-history'] || 'false' }}
      WRITE_HISTORY: ${{ github.event.inputs['write-history'] || 'false' }}
      HISTORY_LABEL: ${{ github.event.inputs['history-label'] || '' }}
      WAIVER_FILE_PATH: ${{ github.event.inputs['waiver-file-path'] || '' }}
      STABLE_READINESS_SUMMARY_PATH: ${{ github.event.inputs['stable-readiness-summary-path'] || '' }}
      CANDIDATE_RELEASE_ID: ${{ github.event.inputs['candidate-release-id'] || '' }}
      REQUIRE_STABLE_READINESS: ${{ github.event.inputs['require-stable-readiness'] || 'false' }}
      STABLE_VULNERABILITY_RUN_ID: ${{ github.event.inputs['stable-vulnerability-run-id'] || vars.STABLE_VULNERABILITY_PROMOTION_RUN_ID || '' }}
      STABLE_VULNERABILITY_RUN_ATTEMPT: ${{ github.event.inputs['stable-vulnerability-run-attempt'] || vars.STABLE_VULNERABILITY_PROMOTION_RUN_ATTEMPT || '' }}
      STABLE_VULNERABILITY_ARTIFACT_NAME: ${{ github.event.inputs['stable-vulnerability-artifact-name'] || vars.STABLE_VULNERABILITY_PROMOTION_ARTIFACT_NAME || '' }}
      STABLE_VULNERABILITY_ARTIFACT_DIGEST: ${{ github.event.inputs['stable-vulnerability-artifact-digest'] || vars.STABLE_VULNERABILITY_PROMOTION_ARTIFACT_DIGEST || '' }}
      STABLE_DEPENDENCY_VULNERABILITY_RUN_ID: ${{ github.event.inputs['stable-dependency-vulnerability-run-id'] || vars.STABLE_DEPENDENCY_VULNERABILITY_PROMOTION_RUN_ID || '' }}
      STABLE_DEPENDENCY_VULNERABILITY_RUN_ATTEMPT: ${{ github.event.inputs['stable-dependency-vulnerability-run-attempt'] || vars.STABLE_DEPENDENCY_VULNERABILITY_PROMOTION_RUN_ATTEMPT || '' }}
      STABLE_DEPENDENCY_VULNERABILITY_ARTIFACT_NAME: ${{ github.event.inputs['stable-dependency-vulnerability-artifact-name'] || vars.STABLE_DEPENDENCY_VULNERABILITY_PROMOTION_ARTIFACT_NAME || '' }}
      STABLE_DEPENDENCY_VULNERABILITY_ARTIFACT_DIGEST: ${{ github.event.inputs['stable-dependency-vulnerability-artifact-digest'] || vars.STABLE_DEPENDENCY_VULNERABILITY_PROMOTION_ARTIFACT_DIGEST || '' }}
      STABLE_SUPPLY_CHAIN_RUN_ID: ${{ github.event.inputs['stable-supply-chain-run-id'] || vars.STABLE_SUPPLY_CHAIN_PROMOTION_RUN_ID || '' }}
      STABLE_SUPPLY_CHAIN_RUN_ATTEMPT: ${{ github.event.inputs['stable-supply-chain-run-attempt'] || vars.STABLE_SUPPLY_CHAIN_PROMOTION_RUN_ATTEMPT || '' }}
      STABLE_SUPPLY_CHAIN_ARTIFACT_NAME: ${{ github.event.inputs['stable-supply-chain-artifact-name'] || vars.STABLE_SUPPLY_CHAIN_PROMOTION_ARTIFACT_NAME || '' }}
      STABLE_SUPPLY_CHAIN_ARTIFACT_DIGEST: ${{ github.event.inputs['stable-supply-chain-artifact-digest'] || vars.STABLE_SUPPLY_CHAIN_PROMOTION_ARTIFACT_DIGEST || '' }}
      DEPENDENCY_VULNERABILITY_STAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['dependency-vulnerability-stage'] || 'pre-publication' }}
    steps: *certification-steps
