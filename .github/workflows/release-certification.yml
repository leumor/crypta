              --binding "$binding" \
              --key-env CRYPTAD_STABLE_VULNERABILITY_HANDOFF_KEY_BASE64
            summary_name=stable-1.0-vulnerability-summary.json
            source="$opened/$summary_name"
            if [[ -L "$source" || ! -f "$source" \
                  || "$(stat -c %h "$source")" -ne 1 \
                  || "$(stat -c %s "$source")" -le 0 \
                  || "$(stat -c %s "$source")" -gt 4194304 ]]; then
              echo "::error::Authenticated Stable vulnerability summary is missing, linked, or oversized."
              exit 1
            fi
            install -d -m 700 "$external_root" "$external_root/sealed-successor"
            install -m 600 "$source" "$external_root/$summary_name"
            install -m 600 "$binding" \
              "$external_root/stable-1.0-vulnerability-successor-binding.json"
            install -m 600 "$downloaded/sealed-successor/stable-1.0-protected-handoff.enc" \
              "$external_root/sealed-successor/stable-1.0-protected-handoff.enc"
            install -m 600 "$downloaded/sealed-successor/stable-1.0-protected-handoff.json" \
              "$external_root/sealed-successor/stable-1.0-protected-handoff.json"
            PRODUCER_ARTIFACT_DIGEST="$STABLE_VULNERABILITY_ARTIFACT_DIGEST" \
              VULNERABILITY_HANDOFF_ROOT="$external_root" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["VULNERABILITY_HANDOFF_ROOT"])
          summary = json.loads(
              (root / "stable-1.0-vulnerability-summary.json").read_text(encoding="utf-8")
          )
          binding_raw = (
              root / "stable-1.0-vulnerability-successor-binding.json"
          ).read_bytes()
          summary_raw = (root / "stable-1.0-vulnerability-summary.json").read_bytes()
          digest = lambda raw: "sha256:" + hashlib.sha256(raw).hexdigest()
          provenance = {
              "schemaVersion": 1,
              "kind": "stable-1.0-vulnerability-summary-provenance",
              "producerArtifactDigest": os.environ["PRODUCER_ARTIFACT_DIGEST"],
              "successorBindingFileDigest": digest(binding_raw),
              "summaryFileDigest": digest(summary_raw),
              "summaryDigest": summary["summaryDigest"],
          }
          canonical = json.dumps(
              provenance,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          provenance["provenanceDigest"] = digest(canonical)
          (root / "stable-1.0-vulnerability-summary-provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            current_tip_environment="$RUNNER_TEMP/stable-vulnerability-current-tip.env"
            : > "$current_tip_environment"
            genesis_digest="$(jq -er .ledgerDigest \
              tools/release-certification/stable-1.0-vulnerability-ledger-genesis.json)"
            python3 tools/release-certification/protected/stable_vulnerability_actions_tip.py \
              verify-promotion \
              --repository "$GITHUB_REPOSITORY" \
              --expected-run-id "$STABLE_VULNERABILITY_RUN_ID" \
              --expected-run-attempt "$STABLE_VULNERABILITY_RUN_ATTEMPT" \
              --expected-artifact-name "$STABLE_VULNERABILITY_ARTIFACT_NAME" \
              --expected-artifact-digest "$STABLE_VULNERABILITY_ARTIFACT_DIGEST" \
              --genesis-ledger-digest "$genesis_digest" \
              --binding "$external_root/stable-1.0-vulnerability-successor-binding.json" \
              --provenance "$external_root/stable-1.0-vulnerability-summary-provenance.json" \
              --environment-file "$current_tip_environment"
            set -a
            source "$current_tip_environment"
            set +a
            mapfile -t external_entries < <(find "$external_root" -mindepth 1 -printf '%P\n' | LC_ALL=C sort)
            expected_external=(
              sealed-successor
              sealed-successor/stable-1.0-protected-handoff.enc
              sealed-successor/stable-1.0-protected-handoff.json
              stable-1.0-vulnerability-successor-binding.json
              stable-1.0-vulnerability-summary-provenance.json
              stable-1.0-vulnerability-summary.json
            )
            test "${external_entries[*]}" = "${expected_external[*]}"
            rm -rf "$opened"
            export CRYPTAD_STABLE_VULNERABILITY_SUMMARY_ROOT="$external_root"
            stable_vulnerability="$external_root/$summary_name"
          fi
          require_supply_chain=false
          stable_supply_chain=""
          if [[ "$CERT_MODE" == "release-candidate" && "$DEPENDENCY_VULNERABILITY_STAGE" == "post-publication" ]]; then
            require_supply_chain=true
            downloaded_supply="$RUNNER_TEMP/stable-supply-chain-promotion-input"
            expected_supply_name="stable-1.0-supply-chain-$release_id-comparison"
            if [[ "$STABLE_SUPPLY_CHAIN_ARTIFACT_NAME" != "$expected_supply_name" \
                  || -n "$(find "$downloaded_supply" -type l -print -quit)" \
                  || -n "$(find "$downloaded_supply" -mindepth 1 ! -type f ! -type d -print -quit)" \
                  || -n "$(find "$downloaded_supply" -type f -links +1 -print -quit)" \
                  || "$(find "$downloaded_supply" -type f | wc -l)" -gt 128 \
                  || "$(du -sb "$downloaded_supply" | cut -f1)" -gt 268435456 ]]; then
              echo "::error::Authenticated PR-289 promotion artifact is unsafe or differs from the exact candidate."
              exit 1
            fi
            supply_source="$downloaded_supply/stable-1.0-supply-chain-summary.json"
            supply_manifest="$downloaded_supply/manifest.json"
            for subject in "$supply_source" "$supply_manifest"; do
              if [[ -L "$subject" || ! -f "$subject" \
                    || "$(stat -c %h "$subject")" -ne 1 \
                    || "$(stat -c %s "$subject")" -le 0 \
                    || "$(stat -c %s "$subject")" -gt 4194304 ]]; then
                echo "::error::Authenticated PR-289 promotion artifact lacks a bounded canonical subject."
                exit 1
              fi
              gh attestation verify "$subject" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "crypta-network/cryptad/.github/workflows/stable-1.0-supply-chain.yml" \
                --source-digest "$GITHUB_SHA" \
                --deny-self-hosted-runners >/dev/null
            done
            jq -e \
              --arg release "$release_id" \
              --arg build "$release_version" \
              --arg commit "$GITHUB_SHA" '
                .release.id == $release
                and .release.version == $build
                and .policies.candidateSourceCommit == $commit
                and .policies.candidateSourceRef == ("commit:" + $commit)
                and .requirements.stableSupplyChain == true
                and .commands["stable-supply-chain"].mode == "evaluate-promotion"' \
              "$supply_manifest" >/dev/null
            jq -e \
              --arg release "$release_id" \
              --argjson build "$release_version" \
              --arg commit "$GITHUB_SHA" '
                .kind == "stable-1.0-supply-chain-promotion-summary"
                and .releaseId == $release
                and .buildVersion == $build
                and .sourceCommit == $commit
                and .sourceRef == ("commit:" + $commit)
                and .mode == "evaluate-promotion"
                and .status == "pass"
                and .promotionReady == true
                and .blockers == []
                and .waivers == []
                and .redaction.status == "pass"
                and .redaction.sideEffectsPerformed == false' \
              "$supply_source" >/dev/null
            supply_root="$RUNNER_TEMP/stable-supply-chain-summary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            rm -rf "$supply_root"
            install -d -m 700 "$supply_root"
            stable_supply_chain="$supply_root/stable-1.0-supply-chain-summary.json"
            supply_provenance="$supply_root/stable-1.0-supply-chain-summary-provenance.json"
            install -m 600 "$supply_source" "$stable_supply_chain"
            SUPPLY_CHAIN_SUMMARY="$stable_supply_chain" \
              SUPPLY_CHAIN_PROVENANCE="$supply_provenance" \
              SUPPLY_CHAIN_RELEASE_ID="$release_id" \
              SUPPLY_CHAIN_BUILD_VERSION="$release_version" \
              python3 - <<'PY'
          import base64
          import binascii
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "tools/release-certification")
          from cryptad_certification.engines.release_certification_core import (
              STABLE_SUPPLY_CHAIN_HANDOFF_KEY_ENV,
              stable_supply_chain_handoff_authentication_tag,
          )

          summary = Path(os.environ["SUPPLY_CHAIN_SUMMARY"])
          provenance = Path(os.environ["SUPPLY_CHAIN_PROVENANCE"])
          summary_digest = "sha256:" + hashlib.sha256(summary.read_bytes()).hexdigest()
          handoff = {
              "schemaVersion": 1,
              "kind": "stable-1.0-supply-chain-promotion-handoff",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": (
                  os.environ["GITHUB_REPOSITORY"]
                  + "/.github/workflows/stable-1.0-supply-chain.yml@"
                  + os.environ["GITHUB_SHA"]
              ),
              "workflowCommit": os.environ["GITHUB_SHA"],
              "runId": os.environ["STABLE_SUPPLY_CHAIN_RUN_ID"],
              "runAttempt": os.environ["STABLE_SUPPLY_CHAIN_RUN_ATTEMPT"],
              "operation": "compare-evaluate",
              "releaseId": os.environ["SUPPLY_CHAIN_RELEASE_ID"],
              "buildVersion": os.environ["SUPPLY_CHAIN_BUILD_VERSION"],
              "sourceCommit": os.environ["GITHUB_SHA"],
              "artifactName": os.environ["STABLE_SUPPLY_CHAIN_ARTIFACT_NAME"],
              "producerArtifactDigest": os.environ[
                  "STABLE_SUPPLY_CHAIN_ARTIFACT_DIGEST"
              ],
              "summaryFileName": "stable-1.0-supply-chain-summary.json",
              "summaryByteDigest": summary_digest,
              "attestationSubjectDigest": summary_digest,
              "attestationVerified": True,
              "denySelfHostedRunners": True,
              "authenticationStatus": "pass",
              "authenticationAlgorithm": "hmac-sha256",
              "authenticationTag": "pending",
          }
          encoded = os.environ.get(STABLE_SUPPLY_CHAIN_HANDOFF_KEY_ENV, "")
          try:
              key = base64.b64decode(encoded, validate=True)
          except (ValueError, binascii.Error) as error:
              raise SystemExit("Stable supply-chain handoff key is invalid") from error
          if len(key) != 32 or base64.b64encode(key).decode("ascii") != encoded:
              raise SystemExit("Stable supply-chain handoff key is invalid")
          handoff["authenticationTag"] = (
              stable_supply_chain_handoff_authentication_tag(handoff, key)
          )
          provenance.write_text(
              json.dumps(handoff, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            chmod 0600 "$supply_provenance"
          fi
          require_dependency_vulnerability=false
          stable_dependency_vulnerability=""
          if [[ "$CERT_MODE" == "release-candidate" && "$DEPENDENCY_VULNERABILITY_STAGE" == "post-publication" ]]; then
            require_dependency_vulnerability=true
            dependency_root="$RUNNER_TEMP/stable-dependency-vulnerability-promotion-input"
            mapfile -t dependency_entries < <(find "$dependency_root" -mindepth 1 -printf '%P\n' | LC_ALL=C sort)
            expected_dependency_entries=(
              stable-1.0-dependency-vulnerability-promotion-summary.json
              stable-1.0-dependency-vulnerability-source-status.json
              stable-1.0-dependency-vulnerability-summary-provenance.json
            )
            test "${dependency_entries[*]}" = "${expected_dependency_entries[*]}"
            while IFS= read -r candidate; do
              test ! -L "$candidate"
              test "$(stat -c %h "$candidate")" = 1
              test "$(stat -c %s "$candidate")" -gt 0
              test "$(stat -c %s "$candidate")" -le 4194304
            done < <(find "$dependency_root" -type f -print)
            dependency_summary="$dependency_root/stable-1.0-dependency-vulnerability-promotion-summary.json"
            ledger_digest="$(jq -er '.ledgerDigest | select(test("^sha256:[0-9a-f]{64}$"))' "$dependency_summary")"
            ledger_edition="$(jq -er '.ledgerEdition | select(type == "number" and . >= 1 and floor == .)' "$dependency_summary")"
            valid_until="$(jq -er '.validUntil | select(type == "string")' "$dependency_summary")"
            python3 tools/release-certification/protected/stable_dependency_vulnerability_actions_tip.py verify-current \
              --repository "$GITHUB_REPOSITORY" \
              --expected-ledger-digest "$ledger_digest" \
              --expected-ledger-edition "$ledger_edition"
            export CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_CURRENT_TIP_LEDGER_DIGEST="$ledger_digest"
            export CRYPTAD_STABLE_DEPENDENCY_VULNERABILITY_CURRENT_TIP_LEDGER_EDITION="$ledger_edition"
            stable_dependency_vulnerability="$dependency_summary"
          fi
          interop_smoke=""
          interop_extended=""
          performance_smoke=""
