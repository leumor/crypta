name: Cross-version protected persistent supervisor
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed operation against the environment-selected disposable supervisor.
        type: choice
        required: true
        options: [authorize, start, checkpoint, finish]
permissions: {}
concurrency:
  group: cross-version-protected-supervisor
  cancel-in-progress: false
jobs:
  supervise-cross-version:
    name: supervise-cross-version
    if: github.ref == 'refs/heads/develop' && github.actor == 'leumor' && github.triggering_actor == 'leumor'
    runs-on: [self-hosted, linux, cryptad-cross-version-supervisor]
    environment: cross-version-live-network-soak
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      deployments: read
      attestations: write
      id-token: write
    steps:
      - name: Check exact approved orchestration revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute fixed installed protected control
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$SELECTED_OPERATION" in authorize|start|checkpoint|finish) ;; *) exit 2 ;; esac
          public_root="$(mktemp -d "$RUNNER_TEMP/cross-version-public.XXXXXX")"
          echo "CROSS_VERSION_PUBLIC_ROOT=$public_root" >> "$GITHUB_ENV"
          sudo -n --preserve-env=GH_TOKEN,GITHUB_ACTIONS,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT \
            /usr/bin/python3 -I /opt/cryptad-cross-version/current/tools/release-certification/protected/cross_version_supervisor_authority.py \
            "$SELECTED_OPERATION" > "$public_root/cross-version-supervisor.json"
      - name: Attest exact bounded public observation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.CROSS_VERSION_PUBLIC_ROOT }}/cross-version-supervisor.json
      - name: Upload only exact public observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-version-supervisor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CROSS_VERSION_PUBLIC_ROOT }}/cross-version-supervisor.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14
      - name: Remove only the public temporary file
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          selected = os.environ.get('CROSS_VERSION_PUBLIC_ROOT')
          if selected:
              path = Path(selected)
              if path.is_symlink() or path.parent.resolve() != Path(os.environ['RUNNER_TEMP']).resolve() or not path.name.startswith('cross-version-public.'):
                  raise SystemExit('cross_version_public_cleanup_ownership_mismatch')
              (path / 'cross-version-supervisor.json').unlink(missing_ok=True)
              path.rmdir()
          PY
