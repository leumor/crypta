name: Stable 1.0 Dependency Intelligence Producer
run-name: Stable dependency intelligence ${{ inputs.source_id || 'mandatory-source-refresh' }}

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      source_id:
        description: Exact reviewed source ID from repository policy.
        required: true
        type: choice
        options:
          - osv-public
          - github-public-advisories
          - reviewed-vendor-records
      endpoint:
        description: Exact policy-allowlisted public HTTPS endpoint.
        required: true
        type: string
      source_commit:
        description: Exact protected 40-hex repository commit.
        required: true
        type: string

concurrency:
  group: stable-1-0-vulnerability-ledger
  cancel-in-progress: false

permissions: {}

jobs:
  produce-intelligence:
    name: Produce authenticated bounded public-source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: stable-1.0-dependency-intelligence-producer
    strategy:
      fail-fast: false
      matrix:
        source_id: ${{ fromJSON(github.event_name == 'schedule' && '["github-public-advisories","osv-public"]' || format('["{0}"]', inputs.source_id)) }}
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_ID: ${{ matrix.source_id }}
      ENDPOINT: ${{ matrix.source_id == 'github-public-advisories' && 'https://api.github.com/advisories?per_page=100' || matrix.source_id == 'osv-public' && 'https://api.osv.dev/v1/querybatch' || inputs.endpoint }}
      SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
    steps:
      - name: Check out exact protected producer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate protected source and bounded coordinates
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          expected_workflow="$GITHUB_REPOSITORY/.github/workflows/stable-1.0-dependency-intelligence-producer.yml@$GITHUB_REF"
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/develop|refs/heads/release/*|refs/heads/hotfix/*) ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REPOSITORY" = crypta-network/cryptad
          test "$REF_PROTECTED" = true
          test "$WORKFLOW_REF" = "$expected_workflow"
          test "$WORKFLOW_SHA" = "$SOURCE_COMMIT"
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_ID" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_COMMIT"
          remote_tip="$(git ls-remote --exit-code origin "$GITHUB_REF" | awk 'NR == 1 {print $1}')"
          test -n "$remote_tip"
          git fetch --no-tags origin "$remote_tip"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$remote_tip"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Read exact retention-independent PR-289 OSV inventory anchor
        if: matrix.source_id == 'osv-public'
        id: osv-inventory
        env:
          CRYPTAD_STABLE_DEPENDENCY_OSV_INVENTORY_ANCHOR_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_OSV_INVENTORY_ANCHOR_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/release-certification/protected/stable_dependency_osv_inventory_anchor.py read \
            --repository "$GITHUB_REPOSITORY" \
            --out "$RUNNER_TEMP/osv-inventory-anchor.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download exact PR-289 component inventory bundle for OSV
        if: matrix.source_id == 'osv-public'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.osv-inventory.outputs.run-id }}
          name: ${{ steps.osv-inventory.outputs.artifact-name }}
          path: ${{ runner.temp }}/osv-inventory

      - name: Verify exact retained PR-289 OSV inventory bundle
        if: matrix.source_id == 'osv-public'
        env:
          CRYPTAD_STABLE_DEPENDENCY_OSV_INVENTORY_ANCHOR_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_OSV_INVENTORY_ANCHOR_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/release-certification/protected/stable_dependency_osv_inventory_anchor.py verify \
            --repository "$GITHUB_REPOSITORY" \
            --root "$RUNNER_TEMP/osv-inventory"

      - name: Read exact retention-independent source predecessor
        env:
          CRYPTAD_STABLE_DEPENDENCY_INTELLIGENCE_LINEAGE_READ_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_INTELLIGENCE_LINEAGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/release-certification/protected/stable_dependency_intelligence_actions_lineage.py read \
            --repository "$GITHUB_REPOSITORY" \
            --source-id "$SOURCE_ID" \
            --out "$RUNNER_TEMP/dependency-intelligence-predecessor.json"

      - name: Retrieve and canonicalize one exact reviewed public source
        env:
          ARTIFACT_NAME: stable-1-0-dependency-intelligence-${{ env.SOURCE_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          CRYPTAD_DEPENDENCY_INTELLIGENCE_GITHUB_TOKEN: ${{ matrix.source_id == 'github-public-advisories' && github.token || '' }}
        run: |
          set -euo pipefail
          umask 077
          retrieved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          source_edition="$(jq -er '.anchorSequence + 1' "$RUNNER_TEMP/dependency-intelligence-predecessor.json")"
          previous_snapshot_digest="$(jq -er 'if .initialized then .sourceSnapshotDigest else "" end' "$RUNNER_TEMP/dependency-intelligence-predecessor.json")"
          previous_source_edition="$(jq -er 'if .initialized then (.anchorSequence | tostring) else "" end' "$RUNNER_TEMP/dependency-intelligence-predecessor.json")"
          query_args=()
          if [[ "$SOURCE_ID" = osv-public ]]; then
            test "$ENDPOINT" = https://api.osv.dev/v1/querybatch
            test -z "$(find "$RUNNER_TEMP/osv-inventory" \( -type l -o \( -type f -links +1 \) \) -print -quit)"
            test -z "$(find "$RUNNER_TEMP/osv-inventory" -type f \( -iname '*.zip' -o -iname '*.tar' -o -iname '*.tgz' -o -iname '*.gz' \) -print -quit)"
            test -z "$(find "$RUNNER_TEMP/osv-inventory" -type f -printf '%P\n' | awk '{key=tolower($0); if (seen[key]++) print $0}' | head -n 1)"
            mapfile -t inventory_matches < <(find "$RUNNER_TEMP/osv-inventory" -type f -name stable-1.0-component-inventory.json -print)
            test "${#inventory_matches[@]}" = 1
            query_args=(--osv-component-inventory "${inventory_matches[0]}")
          else
            test ! -e "$RUNNER_TEMP/osv-inventory"
          fi
          python3 tools/release-certification/protected/stable_dependency_intelligence_producer.py \
            --policy tools/release-certification/stable-1.0-dependency-vulnerability-policy.json \
            --source-id "$SOURCE_ID" \
            --endpoint "$ENDPOINT" \
            --retrieved-at "$retrieved_at" \
            --source-edition "$source_edition" \
            --previous-snapshot-digest "$previous_snapshot_digest" \
            --previous-source-edition "$previous_source_edition" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --source-commit "$SOURCE_COMMIT" \
            --source-ref "commit:$SOURCE_COMMIT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            "${query_args[@]}" \
            --out-root "$RUNNER_TEMP/dependency-intelligence"
          actual="$(find "$RUNNER_TEMP/dependency-intelligence" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          expected="$(printf '%s\n' canonical-advisory-records.json producer-manifest.json raw-response.bin stable-1.0-dependency-intelligence-provenance.json stable-1.0-dependency-intelligence-source.json | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test -z "$(find "$RUNNER_TEMP/dependency-intelligence" -mindepth 1 \( -type l -o -type d \) -print -quit)"

      - name: Upload exact protected producer bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1-0-dependency-intelligence-${{ env.SOURCE_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-intelligence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

      - name: Bind exact post-success source-lineage activation proposal
        env:
          SOURCE_ARTIFACT_NAME: stable-1-0-dependency-intelligence-${{ env.SOURCE_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          PROPOSAL_ARTIFACT_NAME: stable-1-0-dependency-intelligence-activation-proposal-${{ env.SOURCE_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          expected_anchor_digest="$(jq -er '.anchorDigest' "$RUNNER_TEMP/dependency-intelligence-predecessor.json")"
          python3 tools/release-certification/protected/stable_dependency_intelligence_actions_lineage.py write-proposal \
            --source-id "$SOURCE_ID" \
            --expected-anchor-digest "$expected_anchor_digest" \
            --predecessor "$RUNNER_TEMP/dependency-intelligence-predecessor.json" \
            --source-record "$RUNNER_TEMP/dependency-intelligence/stable-1.0-dependency-intelligence-source.json" \
            --provenance "$RUNNER_TEMP/dependency-intelligence/stable-1.0-dependency-intelligence-provenance.json" \
            --manifest "$RUNNER_TEMP/dependency-intelligence/producer-manifest.json" \
            --workflow-commit "$SOURCE_COMMIT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-artifact-name "$SOURCE_ARTIFACT_NAME" \
            --source-artifact-digest "$SOURCE_ARTIFACT_DIGEST" \
            --proposal-artifact-name "$PROPOSAL_ARTIFACT_NAME" \
            --out "$RUNNER_TEMP/dependency-intelligence-activation-proposal/stable-1.0-dependency-intelligence-activation-proposal.json"

      - name: Upload exact source-lineage activation proposal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1-0-dependency-intelligence-activation-proposal-${{ env.SOURCE_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-intelligence-activation-proposal
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
