name: Stable 1.0 Dependency Intelligence Activation
run-name: Stable dependency authority finalizer ${{ inputs.activation_request || 'reusable' }}

on:
  workflow_call:
    inputs:
      producer_run_id: {required: true, type: string}
      producer_run_attempt: {required: true, type: string}
      activation_request: {required: false, type: string, default: ''}
      drainer_run_id: {required: false, type: string, default: ''}
      drainer_run_attempt: {required: false, type: string, default: ''}
  workflow_dispatch:
    inputs:
      producer_run_id: {required: true, type: string}
      producer_run_attempt: {required: true, type: string}
      activation_request: {required: true, type: string}
      drainer_run_id: {required: true, type: string}
      drainer_run_attempt: {required: true, type: string}

permissions: {}

jobs:
  activate-completed-source-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: stable-1.0-dependency-intelligence-activation
    permissions:
      actions: read
      contents: read
    steps:
      - name: Authenticate serialized activation-drainer dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_REQUEST: ${{ inputs.activation_request }}
          DRAINER_RUN_ID: ${{ inputs.drainer_run_id }}
          DRAINER_RUN_ATTEMPT: ${{ inputs.drainer_run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_ACTOR" = github-actions[bot]
            [[ "$ACTIVATION_REQUEST" =~ ^[1-9][0-9]*-[1-9][0-9]*-[1-9][0-9]*-[1-9][0-9]*-[1-9][0-9]*$ ]]
            [[ "$DRAINER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$DRAINER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            test "${{ github.workflow_ref }}" = "$GITHUB_REPOSITORY/.github/workflows/stable-1.0-dependency-intelligence-activation.yml@$GITHUB_REF"
            drainer="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$DRAINER_RUN_ID/attempts/$DRAINER_RUN_ATTEMPT")"
            jq -e \
              --argjson run "$DRAINER_RUN_ID" \
              --argjson attempt "$DRAINER_RUN_ATTEMPT" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg commit "$GITHUB_SHA" '
                .id == $run
                and .run_attempt == $attempt
                and .status == "in_progress"
                and .conclusion == null
                and .path == ".github/workflows/stable-1.0-dependency-authority-activation.yml"
                and .head_repository.full_name == $repository
                and .head_branch == "develop"
                and .head_sha == $commit
                and (.event == "schedule" or .event == "workflow_run")
              ' <<<"$drainer" >/dev/null
          else
            test -z "$ACTIVATION_REQUEST$DRAINER_RUN_ID$DRAINER_RUN_ATTEMPT"
            test "${{ github.workflow_ref }}" = "$GITHUB_REPOSITORY/.github/workflows/stable-1.0-dependency-authority-activation.yml@$GITHUB_REF"
          fi

      - name: Check out exact protected source-lineage authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.sha }}', fetch-depth: 1, persist-credentials: false}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.14.7'}

      - name: Authenticate completed-success producer and exact proposal pairs
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = crypta-network/cryptad
          test "$GITHUB_REF" = refs/heads/develop
          test "${{ github.ref_protected }}" = true
          test "${{ github.workflow_sha }}" = "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD^{commit}')" = "$GITHUB_SHA"
          [[ "$PRODUCER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRODUCER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          run="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/attempts/$PRODUCER_RUN_ATTEMPT")"
          producer_commit="$(jq -er '.head_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<<"$run")"
          producer_event="$(jq -er '.event | select(. == "schedule" or . == "workflow_dispatch")' <<<"$run")"
          jq -e \
            --argjson run_id "$PRODUCER_RUN_ID" \
            --argjson attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg repository "$GITHUB_REPOSITORY" '
              .id == $run_id
              and .run_attempt == $attempt
              and .status == "completed"
              and .conclusion == "success"
              and .head_repository.full_name == $repository
              and .path == ".github/workflows/stable-1.0-dependency-intelligence-producer.yml"
            ' <<<"$run" >/dev/null
          producer_branch="$(jq -er '
            .head_branch
            | select(
                type == "string"
                and test("^(main|develop|release/[A-Za-z0-9][A-Za-z0-9._-]{0,127}|hotfix/[A-Za-z0-9][A-Za-z0-9._-]{0,127})$")
              )
          ' <<<"$run")"
          if [[ "$producer_event" == schedule ]]; then
            test "$producer_branch" = develop
          fi
          encoded_branch="$(jq -rn --arg value "$producer_branch" '$value | @uri')"
          protected_branch="$(gh api "/repos/$GITHUB_REPOSITORY/branches/$encoded_branch")"
          producer_tip="$(jq -er \
            --arg branch "$producer_branch" '
              select(.name == $branch and .protected == true)
              | .commit.sha
              | select(type == "string" and test("^[0-9a-f]{40}$"))
            ' <<<"$protected_branch")"
          if [[ "$producer_commit" != "$producer_tip" ]]; then
            comparison="$(gh api "/repos/$GITHUB_REPOSITORY/compare/$producer_commit...$producer_tip")"
            jq -e \
              --arg producer "$producer_commit" '
                .status == "ahead"
                and .base_commit.sha == $producer
                and .merge_base_commit.sha == $producer
              ' <<<"$comparison" >/dev/null
          fi
          artifacts="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/artifacts?per_page=100")"
          artifact_map="$(jq -ce \
            --argjson run_id "$PRODUCER_RUN_ID" \
            --argjson attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg event "$producer_event" '
              [
                .[].artifacts[]
                | select(.workflow_run.id == $run_id)
                | select(
                    .name
                    | endswith("-\($run_id)-\($attempt)")
                  )
              ] as $rows
              | [
                  $rows[]
                  | . as $row
                  | .name
                  | capture(
                      "^stable-1-0-dependency-intelligence-(?<proposal>activation-proposal-)?(?<source>github-public-advisories|osv-public|reviewed-vendor-records)-(?<run>[1-9][0-9]*)-(?<attempt>[1-9][0-9]*)$"
                    )
                  | select((.run | tonumber) == $run_id and (.attempt | tonumber) == $attempt)
                  | {row: $row, source, proposal: (.proposal != null)}
                ] as $recognized
              | select(($recognized | length) == ($rows | length))
              | [$recognized[].source] | unique as $sources
              | select(
                  if $event == "schedule"
                  then $sources == ["github-public-advisories", "osv-public"]
                  else ($sources | length) == 1
                  end
                )
              | reduce $sources[] as $source ({};
                  [$recognized[] | select(.source == $source and .proposal == false)] as $source_rows
                  | [$recognized[] | select(.source == $source and .proposal == true)] as $proposal_rows
                  | if (
                      ($source_rows | length) == 1
                      and ($proposal_rows | length) == 1
                      and $source_rows[0].row.expired == false
                      and $proposal_rows[0].row.expired == false
                      and $source_rows[0].row.workflow_run.id == $run_id
                      and $proposal_rows[0].row.workflow_run.id == $run_id
                      and ($source_rows[0].row.digest | test("^sha256:[0-9a-f]{64}$"))
                      and ($proposal_rows[0].row.digest | test("^sha256:[0-9a-f]{64}$"))
                    )
                    then .[$source] = {
                      sourceName: $source_rows[0].row.name,
                      sourceDigest: $source_rows[0].row.digest,
                      proposalName: $proposal_rows[0].row.name,
                      proposalDigest: $proposal_rows[0].row.digest
                    }
                    else error("invalid source/proposal artifact pair")
                    end
                )
            ' <<<"$artifacts")"
          test -n "$artifact_map"
          {
            printf 'commit=%s\n' "$producer_commit"
            printf 'run-id=%s\n' "$PRODUCER_RUN_ID"
            printf 'run-attempt=%s\n' "$PRODUCER_RUN_ATTEMPT"
            printf 'event=%s\n' "$producer_event"
            printf 'artifact-map=%s\n' "$artifact_map"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact completed-success source and proposal artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.producer.outputs.run-id }}
          pattern: stable-1-0-dependency-intelligence-*-${{ steps.producer.outputs.run-id }}-${{ steps.producer.outputs.run-attempt }}
          path: ${{ runner.temp }}/completed-source-proposals
          merge-multiple: false

      - name: Finalize exact completed-success source lineages
        env:
          PRODUCER_COMMIT: ${{ steps.producer.outputs.commit }}
          PRODUCER_RUN_ID: ${{ steps.producer.outputs.run-id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer.outputs.run-attempt }}
          PRODUCER_EVENT: ${{ steps.producer.outputs.event }}
          ARTIFACT_MAP: ${{ steps.producer.outputs.artifact-map }}
          CRYPTAD_STABLE_DEPENDENCY_INTELLIGENCE_LINEAGE_WRITE_TOKEN: ${{ secrets.CRYPTAD_STABLE_DEPENDENCY_INTELLIGENCE_LINEAGE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/completed-source-proposals"
          test -d "$root" && test ! -L "$root"
          test -z "$(find "$root" \( -type l -o \( -type f -links +1 \) \) -print -quit)"
          test -z "$(find "$root" -type f \( -iname '*.zip' -o -iname '*.tar' -o -iname '*.tgz' -o -iname '*.gz' \) -print -quit)"
          test -z "$(find "$root" -mindepth 1 -printf '%P\n' | awk '{key=tolower($0); if (seen[key]++) print $0}' | head -n 1)"
          mapfile -t source_ids < <(jq -er 'keys[]' <<<"$ARTIFACT_MAP")
          test "${#source_ids[@]}" -ge 1 && test "${#source_ids[@]}" -le 2
          expected_dirs="$(jq -r '.[] | .sourceName, .proposalName' <<<"$ARTIFACT_MAP" | LC_ALL=C sort)"
          actual_dirs="$(find "$root" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort)"
          test "$actual_dirs" = "$expected_dirs"
          for source_id in "${source_ids[@]}"; do
            source_name="$(jq -er --arg source "$source_id" '.[$source].sourceName' <<<"$ARTIFACT_MAP")"
            source_digest="$(jq -er --arg source "$source_id" '.[$source].sourceDigest' <<<"$ARTIFACT_MAP")"
            proposal_name="$(jq -er --arg source "$source_id" '.[$source].proposalName' <<<"$ARTIFACT_MAP")"
            source_root="$root/$source_name"
            proposal_root="$root/$proposal_name"
            proposal="$proposal_root/stable-1.0-dependency-intelligence-activation-proposal.json"
            actual_source="$(find "$source_root" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
            expected_source="$(printf '%s\n' canonical-advisory-records.json producer-manifest.json raw-response.bin stable-1.0-dependency-intelligence-provenance.json stable-1.0-dependency-intelligence-source.json | LC_ALL=C sort)"
            test "$actual_source" = "$expected_source"
            test "$(find "$proposal_root" -mindepth 1 -maxdepth 1 -type f -printf '%f\n')" = "$(basename "$proposal")"
            test -z "$(find "$source_root" "$proposal_root" -mindepth 1 -type d -print -quit)"
            test "$source_digest" = "$(jq -er '.sourceArtifactDigest' "$proposal")"
          done
          artifact_map_path="$RUNNER_TEMP/dependency-intelligence-artifact-map.json"
          umask 077
          printf '%s\n' "$ARTIFACT_MAP" > "$artifact_map_path"
          activated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 tools/release-certification/protected/stable_dependency_intelligence_actions_lineage.py finalize-batch \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-map "$artifact_map_path" \
            --root "$root" \
            --workflow-commit "$PRODUCER_COMMIT" \
            --run-id "$PRODUCER_RUN_ID" \
            --run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --event "$PRODUCER_EVENT" \
            --activated-at "$activated_at"
