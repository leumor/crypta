name: Stable 1.0 Catalog Authority
run-name: >-
  Stable 1.0 catalog authority ${{ inputs.release_id }} build
  ${{ inputs.build_version }} (${{ inputs.operation }})

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Closed catalog-authority operation; only publish-network-primary mutates remote state.
        required: true
        type: choice
        options:
          - prepare-ceremony
          - verify-ceremony
          - prepare-publication
          - publish-network-primary
          - verify-publication
          - verify-rotation-drill
          - rollback-drill
          - closeout
      release_id:
        description: Exact path-safe Stable release identity bound by PR-291 and PR-292.
        required: true
        type: string
      build_version:
        description: Exact positive-integer Stable build.
        required: true
        type: string
      source_commit:
        description: Exact lowercase 40-character protected Stable source commit.
        required: true
        type: string
      authority_manifest_json:
        description: Complete reviewed, non-secret Stable catalog-authority manifest JSON.
        required: true
        type: string
      protected_input_coordinates:
        description: Closed bounded aggregate of exact Actions artifacts and canonical evidence members.
        required: true
        type: string
      network_catalog_source:
        description: Public crypta:USK network-primary catalog source; use an empty value outside publication operations.
        required: false
        default: ''
        type: string

# Catalog governance cannot race RC freeze, GA promotion, or another catalog operation.
concurrency:
  group: stable-1-0-release-${{ inputs.build_version }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate-dispatch:
    name: Validate exact source and protected input coordinates
    if: github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      resolved_coordinates: ${{ steps.coordinates.outputs.resolved_coordinates }}

    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate dispatch identity and closed public inputs
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          AUTHORITY_MANIFEST_JSON: ${{ inputs.authority_manifest_json }}
          PROTECTED_INPUT_COORDINATES: ${{ inputs.protected_input_coordinates }}
          NETWORK_CATALOG_SOURCE: ${{ inputs.network_catalog_source }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          DISPATCH_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "crypta-network/cryptad" \
                || "$GITHUB_EVENT_NAME" != "workflow_dispatch" \
                || ! "$INPUT_RELEASE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ \
                || ! "$INPUT_BUILD_VERSION" =~ ^[1-9][0-9]{0,9}$ \
                || ! "$INPUT_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ \
                || "$GITHUB_REF" != "refs/heads/release/$INPUT_BUILD_VERSION" \
                || "$GITHUB_SHA" != "$INPUT_SOURCE_COMMIT" \
                || "$WORKFLOW_SHA" != "$INPUT_SOURCE_COMMIT" \
                || "$(git rev-parse HEAD)" != "$INPUT_SOURCE_COMMIT" \
                || "$REF_PROTECTED" != "true" \
                || "$DISPATCH_ACTOR" != "leumor" \
                || "$TRIGGERING_ACTOR" != "leumor" ]]; then
            echo "::error::The dispatch is not bound to the exact protected Stable source and operator."
            exit 2
          fi
          case "$INPUT_OPERATION" in
            prepare-ceremony|verify-ceremony|prepare-publication|publish-network-primary|verify-publication|verify-rotation-drill|rollback-drill|closeout) ;;
            *) echo "::error::Unknown catalog-authority operation."; exit 2 ;;
          esac
          if [[ ${#AUTHORITY_MANIFEST_JSON} -gt 65535 ]]; then
            echo "::error::The catalog-authority manifest exceeds its bound."
            exit 2
          fi
          python3 - <<'PY'
          import json
          import os
          import re

          def closed_pairs(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate JSON key")
                  value[key] = item
              return value

          manifest = json.loads(
              os.environ["AUTHORITY_MANIFEST_JSON"], object_pairs_hook=closed_pairs
          )
          if not isinstance(manifest, dict):
              raise SystemExit("authority manifest must be a JSON object")
          release = manifest.get("release", {})
          if (
              release.get("releaseId") != os.environ["INPUT_RELEASE_ID"]
              or str(release.get("buildVersion")) != os.environ["INPUT_BUILD_VERSION"]
              or release.get("sourceCommit") != os.environ["INPUT_SOURCE_COMMIT"]
          ):
              raise SystemExit("authority manifest identity does not match the protected dispatch")
          network_source = os.environ["NETWORK_CATALOG_SOURCE"]
          planned_source = (
              manifest.get("publication", {}).get("networkPrimary", {}).get("publicUri")
          )
          if network_source and network_source != planned_source:
              raise SystemExit("network publication source does not match the reviewed manifest")
          coordinates = json.loads(
              os.environ["PROTECTED_INPUT_COORDINATES"],
              object_pairs_hook=closed_pairs,
          )
          operation = os.environ["INPUT_OPERATION"]
          if (
              not isinstance(coordinates, dict)
              or set(coordinates) != {"schemaVersion", "artifacts"}
              or coordinates.get("schemaVersion") != 1
              or not isinstance(coordinates.get("artifacts"), list)
              or not 1 <= len(coordinates["artifacts"]) <= 16
          ):
              raise SystemExit("operation requires a bounded v1 artifact aggregate")
          common_targets = {
              "stable-1.0-protected-release-execution-summary.json",
              "stable-1.0-independent-reproducibility-summary.json",
              "stable-1.0-release-subject-inventory.json",
              "stable-1.0-primary-subject-bundle.zip",
              "stable-1.0-protected-release-public-observation.json",
          }
          publication_targets = {
              "cryptad-app-catalog.properties",
              "cryptad-app-catalog.signature",
              "stable-1.0-ga-publication-plan.json",
              "stable-1.0-ga-publication-receipt.json",
          }
          rollback_targets = {
              "stable-1.0-rollback-app-catalog.properties",
              "stable-1.0-rollback-app-catalog.signature",
          }
          drill_targets = {
              "stable-1.0-catalog-drill-receipts.json",
          }
          observation_targets = {
              "stable-1.0-live-usk-publication.json",
              "stable-1.0-catalog-mirror-observation.json",
          }
          required_targets = set(common_targets)
          if operation in {
              "prepare-publication",
              "publish-network-primary",
              "verify-publication",
              "closeout",
          }:
              required_targets.update(publication_targets)
          if operation in {"verify-rotation-drill", "rollback-drill", "closeout"}:
              required_targets.update(rollback_targets)
              required_targets.update(drill_targets)
          if operation in {"verify-publication", "closeout"}:
              required_targets.update(observation_targets)
          ceremony_type = manifest.get("ceremony", {}).get("ceremonyType")
          authorization_type = manifest.get("recoveryAuthorization", {}).get(
              "authorizationType"
          )
          if ceremony_type != "genesis":
              required_targets.update(
                  {
                      "stable-1.0-previous-public-key-transparency.json",
                      "stable-1.0-previous-public-key-transparency.signature",
                  }
              )
          if authorization_type == "protected-recovery-quorum":
              required_targets.add(
                  "stable-1.0-protected-recovery-quorum-receipt.json"
              )
          preparation_inputs = {
              "stable-1.0-protected-release-execution-summary.json",
              "stable-1.0-independent-reproducibility-summary.json",
              "stable-1.0-release-subject-inventory.json",
              "stable-1.0-protected-release-public-observation.json",
          }
          catalog_workflow = ".github/workflows/stable-1.0-catalog-authority.yml"
          target_workflows = {
              "stable-1.0-protected-release-execution-summary.json": {
                  ".github/workflows/stable-1.0-protected-release-closeout.yml"
              },
              "stable-1.0-independent-reproducibility-summary.json": {
                  ".github/workflows/stable-1.0-independent-reproducibility.yml"
              },
              "stable-1.0-release-subject-inventory.json": {
                  ".github/workflows/stable-1.0-independent-reproducibility.yml"
              },
              "stable-1.0-primary-subject-bundle.zip": {
                  ".github/workflows/stable-1.0-supply-chain.yml"
              },
              "cryptad-app-catalog.properties": {
                  ".github/workflows/stable-1.0-ga-promotion.yml"
              },
              "cryptad-app-catalog.signature": {
                  ".github/workflows/stable-1.0-ga-promotion.yml"
              },
              "stable-1.0-rollback-app-catalog.properties": {
                  ".github/workflows/stable-1.0-ga-promotion.yml"
              },
              "stable-1.0-rollback-app-catalog.signature": {
                  ".github/workflows/stable-1.0-ga-promotion.yml"
              },
              "stable-1.0-ga-publication-plan.json": {
                  ".github/workflows/stable-1.0-ga-promotion.yml"
              },
              "stable-1.0-ga-publication-receipt.json": {
                  ".github/workflows/stable-1.0-ga-promotion.yml"
              },
              "stable-1.0-protected-release-public-observation.json": {
                  ".github/workflows/stable-1.0-public-observation.yml"
              },
              "stable-1.0-live-usk-publication.json": {
                  ".github/workflows/stable-1.0-catalog-authority.yml"
              },
              "stable-1.0-catalog-mirror-observation.json": {
                  ".github/workflows/stable-1.0-catalog-mirror-observation.yml"
              },
              "stable-1.0-previous-public-key-transparency.json": {
                  ".github/workflows/stable-1.0-catalog-authority.yml"
              },
              "stable-1.0-previous-public-key-transparency.signature": {
                  ".github/workflows/stable-1.0-catalog-authority.yml"
              },
              "stable-1.0-protected-recovery-quorum-receipt.json": {
                  ".github/workflows/stable-1.0-catalog-recovery-quorum.yml"
              },
              "stable-1.0-catalog-drill-receipts.json": {
                  ".github/workflows/stable-1.0-catalog-drill-acceptance.yml"
              },
          }
          if operation != "prepare-ceremony":
              for target in preparation_inputs:
                  target_workflows[target].add(catalog_workflow)
          coordinate_fields = {
              "artifactDigest",
              "artifactName",
              "members",
              "runAttempt",
              "runId",
              "workflowPath",
          }
          member_fields = {"digest", "sourcePath", "targetName"}
          targets = []
          coordinate_identities = set()
          for coordinate in coordinates["artifacts"]:
              if not isinstance(coordinate, dict) or set(coordinate) != coordinate_fields:
                  raise SystemExit("operation artifact coordinate has an invalid closed shape")
              run_id = str(coordinate.get("runId"))
              run_attempt = str(coordinate.get("runAttempt"))
              artifact_name = coordinate.get("artifactName")
              artifact_digest = coordinate.get("artifactDigest")
              if (
                  re.fullmatch(r"[1-9][0-9]{0,19}", run_id) is None
                  or re.fullmatch(r"[1-9][0-9]{0,9}", run_attempt) is None
                  or not isinstance(artifact_name, str)
                  or re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,254}", artifact_name)
                  is None
                  or not isinstance(artifact_digest, str)
                  or re.fullmatch(r"sha256:[0-9a-f]{64}", artifact_digest) is None
              ):
                  raise SystemExit("operation artifact coordinate identity is invalid")
              coordinate_identity = (
                  coordinate.get("workflowPath"),
                  run_id,
                  run_attempt,
                  artifact_name,
                  artifact_digest,
              )
              if coordinate_identity in coordinate_identities:
                  raise SystemExit("operation artifact coordinate is duplicated")
              coordinate_identities.add(coordinate_identity)
              members = coordinate.get("members")
              if not isinstance(members, list) or not 1 <= len(members) <= 16:
                  raise SystemExit("operation artifact member selection is not bounded")
              workflow = coordinate.get("workflowPath")
              coordinate_targets = []
              for member in members:
                  if not isinstance(member, dict) or set(member) != member_fields:
                      raise SystemExit("operation artifact member has an invalid closed shape")
                  source = member.get("sourcePath")
                  target = member.get("targetName")
                  digest = member.get("digest")
                  if (
                      not isinstance(source, str)
                      or not source
                      or len(source) > 1024
                      or "\\" in source
                      or source.startswith("/")
                      or any(part in {"", ".", ".."} for part in source.split("/"))
                      or not isinstance(target, str)
                      or "/" in target
                      or target not in required_targets
                      or workflow not in target_workflows[target]
                      or not isinstance(digest, str)
                      or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None
                  ):
                      raise SystemExit("operation artifact member is unsafe or role-confused")
                  canonical_sources = {
                      item: {catalog_workflow: f"catalog-authority-input/{item}"}
                      for item in preparation_inputs
                  }
                  canonical_sources.update(
                      {
                          "stable-1.0-protected-release-execution-summary.json": {
                              catalog_workflow: "catalog-authority-input/stable-1.0-protected-release-execution-summary.json",
                              ".github/workflows/stable-1.0-protected-release-closeout.yml": "stable-1.0-protected-release-execution-summary.json",
                          },
                          "stable-1.0-independent-reproducibility-summary.json": {
                              catalog_workflow: "catalog-authority-input/stable-1.0-independent-reproducibility-summary.json",
                              ".github/workflows/stable-1.0-independent-reproducibility.yml": "stable-1.0-independent-reproducibility-summary.json",
                          },
                          "stable-1.0-release-subject-inventory.json": {
                              catalog_workflow: "catalog-authority-input/stable-1.0-release-subject-inventory.json",
                              ".github/workflows/stable-1.0-independent-reproducibility.yml": "stable-1.0-release-subject-inventory.json",
                          },
                          "stable-1.0-primary-subject-bundle.zip": {
                              ".github/workflows/stable-1.0-supply-chain.yml": (
                                  "stable-1.0-primary-subject-bundle.zip"
                              )
                          },
                          "stable-1.0-protected-release-public-observation.json": {
                              catalog_workflow: "catalog-authority-input/stable-1.0-protected-release-public-observation.json",
                              ".github/workflows/stable-1.0-public-observation.yml": "stable-1.0-public-observation.json",
                          },
                          "stable-1.0-previous-public-key-transparency.json": {catalog_workflow: "catalog-authority-output/stable-1.0-public-key-transparency.json"},
                          "stable-1.0-previous-public-key-transparency.signature": {catalog_workflow: "catalog-authority-output/stable-1.0-public-key-transparency.signature"},
                          "stable-1.0-protected-recovery-quorum-receipt.json": {".github/workflows/stable-1.0-catalog-recovery-quorum.yml": "stable-1.0-protected-recovery-quorum-receipt.json"},
                          "stable-1.0-catalog-drill-receipts.json": {".github/workflows/stable-1.0-catalog-drill-acceptance.yml": "stable-1.0-catalog-drill-receipts.json"},
                          "stable-1.0-live-usk-publication.json": {catalog_workflow: "stable-1.0-live-usk-publication.json"},
                          "stable-1.0-catalog-mirror-observation.json": {".github/workflows/stable-1.0-catalog-mirror-observation.yml": "stable-1.0-catalog-mirror-observation.json"},
                          "cryptad-app-catalog.properties": {".github/workflows/stable-1.0-ga-promotion.yml": "cryptad-app-catalog.properties"},
                          "cryptad-app-catalog.signature": {".github/workflows/stable-1.0-ga-promotion.yml": "cryptad-app-catalog.signature"},
                          "stable-1.0-ga-publication-plan.json": {".github/workflows/stable-1.0-ga-promotion.yml": "stable-1.0-ga-publication-plan.json"},
                          "stable-1.0-ga-publication-receipt.json": {".github/workflows/stable-1.0-ga-promotion.yml": "stable-1.0-ga-publication-receipt.json"},
                          "stable-1.0-rollback-app-catalog.properties": {".github/workflows/stable-1.0-ga-promotion.yml": "stable-1.0-rollback-app-catalog.properties"},
                          "stable-1.0-rollback-app-catalog.signature": {".github/workflows/stable-1.0-ga-promotion.yml": "stable-1.0-rollback-app-catalog.signature"},
                      }
                  )
                  if source != canonical_sources[target].get(workflow):
                      raise SystemExit("operation artifact member source is not canonical")
                  targets.append(target)
                  coordinate_targets.append(target)
              canonical_names = {}
              preparation_name = (
                  f"stable-1-0-catalog-authority-preparation-{os.environ['INPUT_RELEASE_ID']}-{os.environ['INPUT_BUILD_VERSION']}-{run_id}-{run_attempt}"
              )
              for target in preparation_inputs | {
                  "stable-1.0-previous-public-key-transparency.json",
                  "stable-1.0-previous-public-key-transparency.signature",
              }:
                  canonical_names[target] = {catalog_workflow: {preparation_name}}
              canonical_names["stable-1.0-protected-release-execution-summary.json"][
                  ".github/workflows/stable-1.0-protected-release-closeout.yml"
              ] = {
                  f"stable-1-0-protected-release-closeout-{os.environ['INPUT_RELEASE_ID']}-{os.environ['INPUT_BUILD_VERSION']}-{run_id}-{run_attempt}"
              }
              independent_name = (
                  f"stable-1-0-independent-closeout-{os.environ['INPUT_RELEASE_ID']}-{os.environ['INPUT_BUILD_VERSION']}-{run_id}-{run_attempt}"
              )
              for target in (
                  "stable-1.0-independent-reproducibility-summary.json",
                  "stable-1.0-release-subject-inventory.json",
              ):
                  canonical_names[target][
                      ".github/workflows/stable-1.0-independent-reproducibility.yml"
                  ] = {independent_name}
              canonical_names["stable-1.0-protected-release-public-observation.json"][
                  ".github/workflows/stable-1.0-public-observation.yml"
              ] = {
                  f"stable-1-0-public-observation-{os.environ['INPUT_BUILD_VERSION']}-{run_id}-{run_attempt}"
              }
              canonical_names["stable-1.0-primary-subject-bundle.zip"] = {
                  ".github/workflows/stable-1.0-supply-chain.yml": {
                      "stable-1.0-supply-chain-"
                      f"{os.environ['INPUT_RELEASE_ID']}-"
                      f"independent-primary-subjects-attempt-{run_attempt}"
                  }
              }
              canonical_names["stable-1.0-live-usk-publication.json"] = {
                  catalog_workflow: {
                      f"stable-1-0-catalog-publication-{os.environ['INPUT_RELEASE_ID']}-{os.environ['INPUT_BUILD_VERSION']}-{run_id}-{run_attempt}"
                  }
              }
              canonical_names["stable-1.0-catalog-mirror-observation.json"] = {
                  ".github/workflows/stable-1.0-catalog-mirror-observation.yml": {
                      f"stable-1-0-catalog-mirror-observation-{os.environ['INPUT_BUILD_VERSION']}-{run_id}-{run_attempt}"
                  }
              }
              canonical_names["stable-1.0-protected-recovery-quorum-receipt.json"] = {
                  ".github/workflows/stable-1.0-catalog-recovery-quorum.yml": {
                      f"stable-1-0-catalog-recovery-quorum-{os.environ['INPUT_BUILD_VERSION']}-{run_id}-{run_attempt}"
                  }
              }
              canonical_names["stable-1.0-catalog-drill-receipts.json"] = {
                  ".github/workflows/stable-1.0-catalog-drill-acceptance.yml": {
                      f"stable-1-0-catalog-drill-acceptance-{os.environ['INPUT_BUILD_VERSION']}-{run_id}-{run_attempt}"
                  }
              }
              ga_handoff_name = (
                  f"stable-1-0-ga-catalog-authority-handoff-{os.environ['INPUT_RELEASE_ID']}-{os.environ['INPUT_BUILD_VERSION']}-{run_id}-{run_attempt}"
              )
              for target in (
                  "cryptad-app-catalog.properties",
                  "cryptad-app-catalog.signature",
                  "stable-1.0-ga-publication-plan.json",
                  "stable-1.0-ga-publication-receipt.json",
                  "stable-1.0-rollback-app-catalog.properties",
                  "stable-1.0-rollback-app-catalog.signature",
              ):
                  canonical_names[target] = {
                      ".github/workflows/stable-1.0-ga-promotion.yml": {ga_handoff_name}
                  }
              if any(
                  artifact_name not in canonical_names[target].get(workflow, set())
                  for target in coordinate_targets
              ):
                  raise SystemExit("operation artifact name does not match its producer role")
          if set(targets) != required_targets or len(targets) != len(required_targets):
              raise SystemExit("operation artifact aggregate does not cover the exact evidence set")
          PY
          if [[ "$INPUT_OPERATION" == "publish-network-primary" ]]; then
            if [[ ! "$NETWORK_CATALOG_SOURCE" =~ ^crypta:USK@[^[:space:]]+$ ]]; then
              echo "::error::Network publication requires one public Crypta USK source."
              exit 2
            fi
          elif [[ -n "$NETWORK_CATALOG_SOURCE" && "$INPUT_OPERATION" != "prepare-publication" ]]; then
            echo "::error::Only publication preparation and mutation accept a network source."
            exit 2
          fi
          jq -e '
            .artifacts
            | length >= 1 and length <= 16
            and all(.[].workflowPath; type == "string")
            and all(.[].runId; tostring | test("^[1-9][0-9]{0,19}$"))
            and all(.[].runAttempt; tostring | test("^[1-9][0-9]{0,9}$"))
            and all(.[].artifactName; test("^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$"))
            and all(.[].artifactDigest; test("^sha256:[0-9a-f]{64}$"))' \
            <<< "$PROTECTED_INPUT_COORDINATES" >/dev/null

      - name: Authenticate exact protected input artifact
        id: coordinates
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          PROTECTED_INPUT_COORDINATES: ${{ inputs.protected_input_coordinates }}
        run: |
          set -euo pipefail
          coordinates="$(jq -c '.artifacts' <<< "$PROTECTED_INPUT_COORDINATES")"
          resolved='[]'
          while IFS= read -r coordinate; do
            workflow="$(jq -er .workflowPath <<< "$coordinate")"
            run_id="$(jq -er '.runId | tostring' <<< "$coordinate")"
            run_attempt="$(jq -er '.runAttempt | tostring' <<< "$coordinate")"
            artifact_name="$(jq -er .artifactName <<< "$coordinate")"
            artifact_digest="$(jq -er .artifactDigest <<< "$coordinate")"
            case "$workflow" in
              .github/workflows/stable-1.0-ga-promotion.yml|.github/workflows/stable-1.0-public-observation.yml|.github/workflows/stable-1.0-protected-release-closeout.yml|.github/workflows/stable-1.0-independent-reproducibility.yml|.github/workflows/stable-1.0-supply-chain.yml|.github/workflows/stable-1.0-catalog-authority.yml|.github/workflows/stable-1.0-catalog-mirror-observation.yml|.github/workflows/stable-1.0-catalog-recovery-quorum.yml|.github/workflows/stable-1.0-catalog-drill-acceptance.yml) ;;
              *) echo "::error::Protected input workflow is outside the closed authority set."; exit 2 ;;
            esac
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$run_attempt")"
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg workflow "$workflow" \
              --arg commit "$INPUT_SOURCE_COMMIT" \
              --argjson attempt "$run_attempt" '
                .repository.full_name == $repository
                and .head_repository.full_name == $repository
                and .path == $workflow
                and .head_sha == $commit
                and .event == "workflow_dispatch"
                and .status == "completed"
                and .conclusion == "success"
                and .run_attempt == $attempt
                and .actor.login == "leumor"
                and .triggering_actor.login == "leumor"' <<< "$run" >/dev/null
            artifact_pages="$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
            artifacts="$(jq --arg name "$artifact_name" \
              '[.[].artifacts[] | select(.name == $name)]' <<< "$artifact_pages")"
            jq -e --arg name "$artifact_name" --arg digest "$artifact_digest" '
              length == 1
              and .[0].expired == false
              and .[0].name == $name
              and .[0].digest == $digest' <<< "$artifacts" >/dev/null
            artifact_id="$(jq -er '.[0].id' <<< "$artifacts")"
            artifact_size="$(jq -er '.[0].size_in_bytes' <<< "$artifacts")"
            if [[ ! "$artifact_size" =~ ^[1-9][0-9]{0,9}$ ]] || \
               (( artifact_size > 2147483648 )); then
              echo "::error::Protected input artifact exceeds its closed byte bound."
              exit 2
            fi
            resolved="$(jq -cn \
              --argjson current "$resolved" \
              --argjson coordinate "$coordinate" \
              --argjson artifact_id "$artifact_id" \
              --argjson artifact_size "$artifact_size" \
              '$current + [$coordinate + {artifactId: $artifact_id, artifactSize: $artifact_size}]')"
          done < <(jq -c '.[]' <<< "$coordinates")
          echo "resolved_coordinates=$(jq -cn --argjson artifacts "$resolved" \
            '{schemaVersion: 1, artifacts: $artifacts}')" >> "$GITHUB_OUTPUT"

  assemble-inputs:
    name: Assemble exact authenticated operation inputs
    needs: validate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download each exact authenticated operation artifact in isolation
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_COORDINATES: ${{ needs.validate-dispatch.outputs.resolved_coordinates }}
        run: |
          set -euo pipefail
          mkdir -p build/catalog-authority-archives build/catalog-authority-execution
          chmod 700 build/catalog-authority-archives build/catalog-authority-execution
          printf '%s\n' "$RESOLVED_COORDINATES" \
            > build/catalog-authority-execution/resolved-operation-coordinates.json
          count="$(jq -er '.artifacts | length' \
            build/catalog-authority-execution/resolved-operation-coordinates.json)"
          total_archive_bytes="$(jq -er '[.artifacts[].artifactSize] | add' \
            build/catalog-authority-execution/resolved-operation-coordinates.json)"
          test "$total_archive_bytes" -le 4294967296
          for ((index = 0; index < count; index++)); do
            artifact_id="$(jq -er ".artifacts[$index].artifactId" \
              build/catalog-authority-execution/resolved-operation-coordinates.json)"
            archive="$(printf 'build/catalog-authority-archives/artifact-%02d.zip' "$index")"
            expected_size="$(jq -er ".artifacts[$index].artifactSize" \
              build/catalog-authority-execution/resolved-operation-coordinates.json)"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"
            test ! -L "$archive"
            test "$(stat -c '%h' "$archive")" -eq 1
            test "$(stat -c '%s' "$archive")" -eq "$expected_size"
          done

      - name: Assemble only the exact allowlisted evidence members
        run: |
          set -euo pipefail
          PYTHONPATH=tools/release-certification python3 -m \
            cryptad_certification.engines.stable_1_0_catalog_authority_inputs \
            --coordinates build/catalog-authority-execution/resolved-operation-coordinates.json \
            --archives-root build/catalog-authority-archives \
            --out build/catalog-authority-input
          test -z "$(find build/catalog-authority-input \( -type l -o -type f -links +1 \) -print -quit)"
          test "$(find build/catalog-authority-input -type f | wc -l)" -ge 3
          test "$(find build/catalog-authority-input -type f | wc -l)" -le 17
          find build/catalog-authority-archives -type f -delete

      - name: Upload exact assembled operation handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1-0-catalog-authority-inputs-${{ inputs.release_id }}-${{ inputs.build_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/catalog-authority-input/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

  prepare-authority:
    name: Prepare side-effect-free catalog authority evidence
    if: inputs.operation == 'prepare-ceremony' || inputs.operation == 'prepare-publication'
    needs: [validate-dispatch, assemble-inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stable-1-0-catalog-authority-preparation
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact authenticated authority inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-1-0-catalog-authority-inputs-${{ inputs.release_id }}-${{ inputs.build_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/catalog-authority-input

      - name: Materialize the reviewed public manifest
        env:
          AUTHORITY_MANIFEST_JSON: ${{ inputs.authority_manifest_json }}
        run: |
          set -euo pipefail
          mkdir -p build/catalog-authority-execution build/catalog-authority-output
          chmod 700 build/catalog-authority-execution build/catalog-authority-output
          printf '%s\n' "$AUTHORITY_MANIFEST_JSON" > build/catalog-authority-execution/authority-manifest.json

      - name: Run local preparation without remote mutation
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          test -z "$(find build/catalog-authority-input \( -type l -o -type f -links +1 \) -print -quit)"
          python3 tools/release-certification/certify.py stable-catalog-authority \
            --mode "$INPUT_OPERATION" \
            --authority-manifest build/catalog-authority-execution/authority-manifest.json \
            --evidence-dir build/catalog-authority-input \
            --out-dir build/catalog-authority-output

      - name: Upload bounded preparation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1-0-catalog-authority-preparation-${{ inputs.release_id }}-${{ inputs.build_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/catalog-authority-output/stable-1.0-key-ceremony-summary.json
            build/catalog-authority-output/stable-1.0-public-key-transparency.json
            build/catalog-authority-output/stable-1.0-public-key-transparency.signature
            build/catalog-authority-output/stable-1.0-catalog-publication-plan.json
            build/catalog-authority-output/stable-1.0-catalog-authority-redaction-report.json
            build/catalog-authority-input/stable-1.0-protected-release-execution-summary.json
            build/catalog-authority-input/stable-1.0-independent-reproducibility-summary.json
            build/catalog-authority-input/stable-1.0-release-subject-inventory.json
            build/catalog-authority-input/stable-1.0-protected-release-public-observation.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

  verify-authority:
    name: Verify ceremony or rotation evidence without mutation
    if: inputs.operation == 'verify-ceremony' || inputs.operation == 'verify-rotation-drill' || inputs.operation == 'rollback-drill'
    needs: [validate-dispatch, assemble-inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stable-1-0-catalog-authority-verification
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact authenticated authority inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-1-0-catalog-authority-inputs-${{ inputs.release_id }}-${{ inputs.build_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/catalog-authority-input

      - name: Verify exact supplied evidence locally
        env:
          AUTHORITY_MANIFEST_JSON: ${{ inputs.authority_manifest_json }}
          INPUT_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          test -z "$(find build/catalog-authority-input \( -type l -o -type f -links +1 \) -print -quit)"
          mkdir -p build/catalog-authority-execution build/catalog-authority-output
          printf '%s\n' "$AUTHORITY_MANIFEST_JSON" > build/catalog-authority-execution/authority-manifest.json
          certification_mode="$INPUT_OPERATION"
          if [[ "$INPUT_OPERATION" == "rollback-drill" ]]; then
            certification_mode="verify-rotation-drill"
          fi
          python3 tools/release-certification/certify.py stable-catalog-authority \
            --mode "$certification_mode" \
            --authority-manifest build/catalog-authority-execution/authority-manifest.json \
            --evidence-dir build/catalog-authority-input \
            --out-dir build/catalog-authority-output

      - name: Upload bounded verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1-0-catalog-authority-verification-${{ inputs.release_id }}-${{ inputs.build_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/catalog-authority-output/stable-1.0-key-ceremony-summary.json
            build/catalog-authority-output/stable-1.0-catalog-rotation-drill.json
            build/catalog-authority-output/stable-1.0-catalog-authority-redaction-report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

  publish-network-primary:
    name: Publish exact frozen catalog to the network primary
    if: inputs.operation == 'publish-network-primary'
    needs: [validate-dispatch, assemble-inputs]
    runs-on: [self-hosted, linux, x64, cryptad-stable-catalog-publication]
    timeout-minutes: 45
    environment: stable-1-0-catalog-publication
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25.0.4.1+1'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Gradle properties
        uses: ./.github/actions/setup-gradle-properties

      - name: Download exact authenticated publication inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-1-0-catalog-authority-inputs-${{ inputs.release_id }}-${{ inputs.build_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/catalog-authority-input

      - name: Preflight exact frozen publication subject
        env:
          AUTHORITY_MANIFEST_JSON: ${{ inputs.authority_manifest_json }}
        run: |
          set -euo pipefail
          test -z "$(find build/catalog-authority-input \( -type l -o -type f -links +1 \) -print -quit)"
          test -f build/catalog-authority-input/cryptad-app-catalog.properties
          test -f build/catalog-authority-input/cryptad-app-catalog.signature
          mkdir -p build/catalog-authority-execution build/catalog-authority-output
          chmod 700 build/catalog-authority-execution build/catalog-authority-output
          printf '%s\n' "$AUTHORITY_MANIFEST_JSON" > build/catalog-authority-execution/authority-manifest.json
          python3 tools/release-certification/certify.py stable-catalog-authority \
            --mode prepare-publication \
            --authority-manifest build/catalog-authority-execution/authority-manifest.json \
            --evidence-dir build/catalog-authority-input \
            --out-dir build/catalog-authority-preflight-output
          test -f build/catalog-authority-preflight-output/stable-1.0-catalog-publication-plan.json
          mkdir -p build/catalog-authority-publication-stage
          chmod 700 build/catalog-authority-publication-stage
          install -m 0600 build/catalog-authority-input/cryptad-app-catalog.properties \
            build/catalog-authority-publication-stage/cryptad-app-catalog.properties
          install -m 0600 build/catalog-authority-input/cryptad-app-catalog.signature \
            build/catalog-authority-publication-stage/cryptad-app-catalog.signature
          install -m 0600 build/catalog-authority-preflight-output/stable-1.0-catalog-trusted-keys.properties \
            build/catalog-authority-publication-stage/trusted-catalog-keys.properties
          test "$(find build/catalog-authority-publication-stage -type f | wc -l)" -eq 3

      # This builds the already reviewed publication client, never the Stable candidate or catalog.
      - name: Build the existing publication client
        run: ./gradlew :platform-devtools:installDist

      # The protected runner owns this managed node; the workflow must neither build nor stop it.
      - name: Verify managed localhost daemon readiness and publication contract
        run: |
          set -euo pipefail
          node_base_url=http://127.0.0.1:7654
          ready=false
          for _attempt in {1..30}; do
            if curl --fail --silent --noproxy '*' --connect-timeout 2 --max-time 5 \
                "$node_base_url/api/v1/node/greeting" >/dev/null \
              && curl --fail --silent --noproxy '*' --connect-timeout 2 --max-time 5 \
                "$node_base_url/api/v1/platform/contract" \
                | jq -e '
                    any(.contract.endpoints[];
                      .method == "POST" and .routeTemplate == "/queue/inserts/directory")
                    and any(.contract.endpoints[];
                      .method == "POST" and .routeTemplate == "/content/fetch")
                  ' >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::Managed localhost publication node is unavailable or lacks required Platform API routes."
            exit 1
          fi

      - name: Publish once through the existing localhost Platform API boundary
        id: publish
        env:
          CRYPTAD_STABLE_USK_PRIVATE_INSERT_URI: ${{ secrets.CRYPTAD_STABLE_USK_PRIVATE_INSERT_URI }}
          CRYPTAD_PLATFORM_FORM_PASSWORD: ${{ secrets.CRYPTAD_PLATFORM_FORM_PASSWORD }}
          NETWORK_CATALOG_SOURCE: ${{ inputs.network_catalog_source }}
        run: |
          set -euo pipefail
          publication_result=build/catalog-authority-execution/stable-1.0-live-usk-publication.json
          publication_status=0
          set +e
          platform-devtools/build/install/crypta-app/bin/crypta-app publish-usk \
            --live \
            --catalog-file build/catalog-authority-publication-stage/cryptad-app-catalog.properties \
            --catalog-signature-file build/catalog-authority-publication-stage/cryptad-app-catalog.signature \
            --catalog-source "$NETWORK_CATALOG_SOURCE" \
            --output "$publication_result" \
            --node-base-url http://127.0.0.1:7654 \
            --private-insert-uri-env CRYPTAD_STABLE_USK_PRIVATE_INSERT_URI \
            --form-password-env CRYPTAD_PLATFORM_FORM_PASSWORD \
            --trusted-keys-file build/catalog-authority-publication-stage/trusted-catalog-keys.properties \
            --verify-live-fetch
          publication_status=$?
          set -e
          unset CRYPTAD_STABLE_USK_PRIVATE_INSERT_URI CRYPTAD_PLATFORM_FORM_PASSWORD
          if [[ ! -f "$publication_result" \
                || -L "$publication_result" \
                || "$(stat -c '%h' "$publication_result")" -ne 1 \
                || "$(stat -c '%s' "$publication_result")" -gt 65536 ]]; then
            echo "::error::Live publication did not leave a bounded sanitized mutation result."
            if [[ "$publication_status" -ne 0 ]]; then
              exit "$publication_status"
            fi
            exit 1
          fi
          if [[ "$publication_status" -ne 0 ]] && ! jq -e '
            .schemaVersion == 1
            and .mode == "live"
            and .catalogInsertStatus == "queued"
            and .signatureInsertStatus == "queued"
            and .postPublishVerificationStatus == "failed"
            and .schedulerRefreshVerificationStatus == "not_run"
            and (.warnings | type == "array")
            and (.warnings | index("staging_sidecars_retained_until_live_insert_completion") != null)
            and (.warnings | index("post_publish_fetch_verification_failed") != null)
          ' "$publication_result" >/dev/null; then
            echo "::error::Failed publication did not leave mutation-specific sanitized retry evidence."
            exit "$publication_status"
          fi
          verification_status=0
          set +e
          python3 tools/release-certification/certify.py stable-catalog-authority \
            --mode prepare-publication \
            --authority-manifest build/catalog-authority-execution/authority-manifest.json \
            --evidence-dir build/catalog-authority-input \
            --live-publication-result "$publication_result" \
            --out-dir build/catalog-authority-output
          verification_status=$?
          set -e
          receipt=build/catalog-authority-output/stable-1.0-catalog-publication-receipt.json
          redaction=build/catalog-authority-output/stable-1.0-catalog-authority-redaction-report.json
          test -f "$receipt"
          test -f "$redaction"
          jq -e '.status == "pass" and .findingCount == 0 and .findings == []' \
            "$redaction" >/dev/null
          live_result_digest="sha256:$(sha256sum "$publication_result" | awk '{print $1}')"
          jq -e --arg live_result_digest "$live_result_digest" '
            .livePublicationResultDigest == $live_result_digest
            and .redaction.status == "pass"
            and .redaction.findingCount == 0
            and .redaction.findings == []
            and .operational == false
            and (.publicationState == "partial" or .publicationState == "verified-partial")
          ' "$receipt" >/dev/null
          retention_dir=build/catalog-authority-mutation-retention
          retention_stage=build/catalog-authority-mutation-retention.stage
          test ! -e "$retention_dir"
          test ! -e "$retention_stage"
          mkdir -m 0700 "$retention_stage"
          install -m 0600 "$publication_result" \
            "$retention_stage/stable-1.0-live-usk-publication.json"
          install -m 0600 "$receipt" \
            "$retention_stage/stable-1.0-catalog-publication-receipt.json"
          install -m 0600 "$redaction" \
            "$retention_stage/stable-1.0-catalog-authority-redaction-report.json"
          test "$(find "$retention_stage" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(find "$retention_stage" -mindepth 1 -maxdepth 1 | wc -l)" -eq 3
          mv "$retention_stage" "$retention_dir"
          if [[ "$publication_status" -ne 0 ]]; then
            exit "$publication_status"
          fi
          if [[ "$verification_status" -ne 0 ]]; then
            exit "$verification_status"
          fi

      - name: Upload sanitized mutation evidence even after verification failure
        if: always() && steps.publish.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1-0-catalog-publication-${{ inputs.release_id }}-${{ inputs.build_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/catalog-authority-mutation-retention/stable-1.0-catalog-publication-receipt.json
            build/catalog-authority-mutation-retention/stable-1.0-live-usk-publication.json
            build/catalog-authority-mutation-retention/stable-1.0-catalog-authority-redaction-report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

  observe-publication:
    name: Verify supplied primary and independent-mirror observations
    if: inputs.operation == 'verify-publication'
    needs: [validate-dispatch, assemble-inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stable-1-0-catalog-observation
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact authenticated observation inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-1-0-catalog-authority-inputs-${{ inputs.release_id }}-${{ inputs.build_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/catalog-authority-input

      - name: Verify exact observation receipts without publication authority
        env:
          AUTHORITY_MANIFEST_JSON: ${{ inputs.authority_manifest_json }}
        run: |
          set -euo pipefail
          test -z "$(find build/catalog-authority-input \( -type l -o -type f -links +1 \) -print -quit)"
          mkdir -p build/catalog-authority-execution build/catalog-authority-output
          printf '%s\n' "$AUTHORITY_MANIFEST_JSON" > build/catalog-authority-execution/authority-manifest.json
          python3 tools/release-certification/certify.py stable-catalog-authority \
            --mode verify-publication \
            --authority-manifest build/catalog-authority-execution/authority-manifest.json \
            --evidence-dir build/catalog-authority-input \
            --out-dir build/catalog-authority-output

      - name: Upload bounded observation verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1-0-catalog-observation-${{ inputs.release_id }}-${{ inputs.build_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/catalog-authority-output/stable-1.0-catalog-publication-receipt.json
            build/catalog-authority-output/stable-1.0-catalog-authority-redaction-report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

  closeout:
    name: Close out only authenticated catalog-authority evidence
    if: inputs.operation == 'closeout'
    needs: [validate-dispatch, assemble-inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stable-1-0-catalog-authority-closeout
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact assembled closeout inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-1-0-catalog-authority-inputs-${{ inputs.release_id }}-${{ inputs.build_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/catalog-authority-input

      - name: Recheck the assembled closeout boundary
        run: |
          set -euo pipefail
          test -z "$(find build/catalog-authority-input \( -type l -o -type f -links +1 \) -print -quit)"
          test "$(find build/catalog-authority-input -type f | wc -l)" -ge 12
          test "$(find build/catalog-authority-input -type f | wc -l)" -le 17

      - name: Derive truthful closeout from exact protected receipts
        env:
          AUTHORITY_MANIFEST_JSON: ${{ inputs.authority_manifest_json }}
        run: |
          set -euo pipefail
          mkdir -p build/catalog-authority-execution build/catalog-authority-output
          printf '%s\n' "$AUTHORITY_MANIFEST_JSON" > build/catalog-authority-execution/authority-manifest.json
          python3 tools/release-certification/certify.py stable-catalog-authority \
            --mode closeout \
            --authority-manifest build/catalog-authority-execution/authority-manifest.json \
            --evidence-dir build/catalog-authority-input \
            --out-dir build/catalog-authority-output

      - name: Upload bounded catalog-authority closeout
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1-0-catalog-authority-closeout-${{ inputs.release_id }}-${{ inputs.build_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/catalog-authority-output/stable-1.0-catalog-authority-summary.json
            build/catalog-authority-output/stable-1.0-catalog-authority-report.md
            build/catalog-authority-output/stable-1.0-catalog-authority-redaction-report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

  retain-failure-closeout:
    name: Retain bounded non-operational failure state
    if: >-
      always() &&
      (needs.validate-dispatch.result == 'failure' ||
       needs.assemble-inputs.result == 'failure' ||
       needs.prepare-authority.result == 'failure' ||
       needs.verify-authority.result == 'failure' ||
       needs.publish-network-primary.result == 'failure' ||
       needs.observe-publication.result == 'failure' ||
       needs.closeout.result == 'failure')
    needs:
      - validate-dispatch
      - assemble-inputs
      - prepare-authority
      - verify-authority
      - publish-network-primary
      - observe-publication
      - closeout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Write bounded partial-state audit
        env:
          VALIDATION_RESULT: ${{ needs.validate-dispatch.result }}
          ASSEMBLY_RESULT: ${{ needs.assemble-inputs.result }}
          PREPARATION_RESULT: ${{ needs.prepare-authority.result }}
          VERIFICATION_RESULT: ${{ needs.verify-authority.result }}
          PUBLICATION_RESULT: ${{ needs.publish-network-primary.result }}
          OBSERVATION_RESULT: ${{ needs.observe-publication.result }}
          CLOSEOUT_RESULT: ${{ needs.closeout.result }}
        run: |
          set -euo pipefail
          mkdir -p build/catalog-authority-failure
          jq -n \
            --arg validation "$VALIDATION_RESULT" \
            --arg assembly "$ASSEMBLY_RESULT" \
            --arg preparation "$PREPARATION_RESULT" \
            --arg verification "$VERIFICATION_RESULT" \
            --arg publication "$PUBLICATION_RESULT" \
            --arg observation "$OBSERVATION_RESULT" \
            --arg closeout "$CLOSEOUT_RESULT" '
              {
                kind: "stable-1.0-catalog-authority-partial-state",
                status: "partial",
                operationalComplete: false,
                results: {
                  validation: $validation,
                  assembly: $assembly,
                  preparation: $preparation,
                  verification: $verification,
                  publication: $publication,
                  observation: $observation,
                  closeout: $closeout
                }
              }' > build/catalog-authority-failure/partial-state.json
          test "$(wc -c < build/catalog-authority-failure/partial-state.json)" -le 4096

      - name: Retain bounded partial-state audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-1-0-catalog-authority-partial-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/catalog-authority-failure/partial-state.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
